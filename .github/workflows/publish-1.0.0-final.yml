name: Publish certified C48 SDK 1.0.0

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.0.0-final.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-certified-c48-sdk-1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: "1.0.0"
      VERSION_TEXT: "1.0.0"
      CERTIFIED_SHA: "7b84984930873042d6f43aded35c8b7cc984bc6f"
      CERTIFIED_TREE: "4761c644bfcb1e0fec22b7d14af62aee260e3f56"
      SOURCE_RUN_ID: "35017738138"
      SOURCE_ARTIFACT_ID: "10416970112"
      SOURCE_ARTIFACT_SHA256: "6544b4e8760d399e0ef6236147e0920c10c4fcd3223cb265f1ea0458ec7f74ec"
      SOURCE_ZIP_SHA256: "5071e4db7878afa781c2e367a05f89ea7d08d2f2eaaab5c084521f3b15b430c6"
      GUI_RUN_ID: "35017738122"
      GUI_ARTIFACT_ID: "10416850825"
      GUI_ARTIFACT_SHA256: "19e697881472fe1ff90fe4bcc4ff51dbd43573612a00145dff3db8cce35f38bf"
      VERIFY_RUN_ID: "35017738141"
      SOP_TREE_MANIFEST_SHA256: "317bebf287068e4d0ac9516d86edc2738c8e475870b184ea2c2414cf684cbc4e"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate certified release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION_TEXT"
          test "$(git rev-parse "$CERTIFIED_SHA^{tree}")" = "$CERTIFIED_TREE"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download and validate certified source candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-artifact /tmp/release
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o /tmp/source-artifact.zip
          printf '%s  %s\n' "$SOURCE_ARTIFACT_SHA256" /tmp/source-artifact.zip | sha256sum -c -
          unzip -q /tmp/source-artifact.zip -d /tmp/source-artifact
          candidate="$(find /tmp/source-artifact -maxdepth 1 -type f -name 'zx-ux-c48-sdk-*.zip' -print -quit)"
          test -n "$candidate"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$SOURCE_ZIP_SHA256"
          (cd /tmp/source-artifact && sha256sum -c SHA256SUMS.release)
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('/tmp/source-artifact/RELEASE-CANDIDATE.json').read_text())
          assert p['version'] == os.environ['VERSION_TEXT'], p
          assert p['commit'] == os.environ['CERTIFIED_SHA'], p
          assert p['run_id'] == int(os.environ['SOURCE_RUN_ID']), p
          assert p['archive_sha256'] == os.environ['SOURCE_ZIP_SHA256'], p
          print('SOURCE CANDIDATE IDENTITY PASS')
          PY
          cp "$candidate" /tmp/release/
          cp /tmp/source-artifact/RELEASE-CANDIDATE.json /tmp/release/
          cp /tmp/source-artifact/C48-SPECIFICATION.json /tmp/release/
          cp /tmp/source-artifact/SHA256SUMS.release /tmp/release/
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download and validate aggregate GUI evidence
        shell: bash
        run: |
          set -euo pipefail
          gui="/tmp/release/c48-${VERSION_TEXT}-gui-evidence-${CERTIFIED_SHA}.zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$GUI_ARTIFACT_ID/zip" \
            -o "$gui"
          test "$(sha256sum "$gui" | awk '{print $1}')" = "$GUI_ARTIFACT_SHA256"
          unzip -tq "$gui" >/dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build final release metadata and notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = Path('/tmp/release')
          candidate = next(release.glob('zx-ux-c48-sdk-*.zip'))
          gui = next(release.glob('c48-1.0.0-gui-evidence-*.zip'))
          data = {
              'schema': 1,
              'version': os.environ['VERSION_TEXT'],
              'tag': os.environ['TAG'],
              'certified_commit': os.environ['CERTIFIED_SHA'],
              'certified_tree': os.environ['CERTIFIED_TREE'],
              'source_candidate_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id': int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_archive': candidate.name,
              'source_archive_sha256': hashlib.sha256(candidate.read_bytes()).hexdigest(),
              'gui_acceptance_run_id': int(os.environ['GUI_RUN_ID']),
              'gui_artifact_id': int(os.environ['GUI_ARTIFACT_ID']),
              'gui_evidence_archive': gui.name,
              'gui_evidence_sha256': hashlib.sha256(gui.read_bytes()).hexdigest(),
              'verification_run_id': int(os.environ['VERIFY_RUN_ID']),
              'sop_scan_count': 3,
              'sop_files_per_scan': 1348,
              'sop_bytes_per_scan': 27778108,
              'sop_line_records_per_scan': 419235,
              'sop_tree_manifest_sha256': os.environ['SOP_TREE_MANIFEST_SHA256'],
          }
          (release/'RELEASE-METADATA.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='ascii'
          )
          PY
          (
            cd /tmp/release
            sha256sum \
              zx-ux-c48-sdk-*.zip \
              c48-1.0.0-gui-evidence-*.zip \
              RELEASE-CANDIDATE.json \
              C48-SPECIFICATION.json \
              RELEASE-METADATA.json \
              > SHA256SUMS-1.0.0.txt
          )
          cat > /tmp/release-notes.md <<'EOF'
          # ZX-UX C48 SDK 1.0.0

          First fully certified 1.0.0 release of the portable ZX-UX C48 SDK for Windows, Linux, and macOS.

          **Certified source identity**
          - commit: `7b84984930873042d6f43aded35c8b7cc984bc6f`
          - tree: `4761c644bfcb1e0fec22b7d14af62aee260e3f56`
          - release-candidate source ZIP SHA-256: `5071e4db7878afa781c2e367a05f89ea7d08d2f2eaaab5c084521f3b15b430c6`

          **Certification gates passed**
          - complete C48 SDK verifier: 342 automated tests, six deterministic demos, 14 games;
          - 8/8 permanent verifier matrix rows across Ubuntu, Windows, macOS arm64, and macOS Intel with Python 3.10/3.13;
          - 8/8 host-native Tk GUI acceptance rows plus aggregate GUI evidence;
          - three independent fresh-filesystem release-candidate verifications;
          - virgin extraction verification of the exact materialized release ZIP;
          - three successive fresh byte-level SoP scans, each covering 1,348 files / 27,778,108 bytes / 419,235 line records with zero new defects.

          **Notable final fixes**
          - `ailmzx48` no longer depends on private `ai_m*` host-runtime builtins for model access;
          - generic read-only C48 object I/O is used by the portable runtime path;
          - interactive `ailmzx48` input now explicitly echoes printable input and handles destructive Backspace;
          - GUI text input preserves rapid typeahead with a bounded FIFO;
          - deterministic `.scr` baselines are aligned with the repository's FINAL SANYALnet 4x8 default font and were independently reproduced before refresh.

          The source package includes C48 specification provenance metadata tying the packaged specification to the authoritative upstream ZX-UX project.
          EOF

      - name: Publish tag, release, and certified assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CERTIFIED_SHA" \
            --title "C48 SDK 1.0.0" \
            --notes-file /tmp/release-notes.md \
            /tmp/release/zx-ux-c48-sdk-*.zip \
            /tmp/release/c48-1.0.0-gui-evidence-*.zip \
            /tmp/release/RELEASE-CANDIDATE.json \
            /tmp/release/C48-SPECIFICATION.json \
            /tmp/release/RELEASE-METADATA.json \
            /tmp/release/SHA256SUMS-1.0.0.txt \
            /tmp/release/SHA256SUMS.release
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,name,isDraft,isPrerelease,url
          test -n "$(git ls-remote --tags origin "refs/tags/$TAG")"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove one-shot publisher and restore certified tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-1.0.0-final.yml
          restored_tree="$(git write-tree)"
          test "$restored_tree" = "$CERTIFIED_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove completed 1.0.0 release publisher"
          git push origin HEAD:main
