name: Bootstrap graphics demo reel

"on":
  push:
    branches: [graphics-demos-21]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: graphics-demos-21
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Remove duplicate serial stress from bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/bootstrap_graphics_demos.py')
          s = p.read_text(encoding='utf-8')
          old = '        vd.run_demo(name, stress)\n'
          assert s.count(old) == 1
          s = s.replace(old, '')
          old = '''    run([\n        sys.executable,\n        "-B",\n        "compiler/verify_graphics_demos.py",\n        "--release",\n    ])\n'''
          assert s.count(old) == 1
          s = s.replace(old, '')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Build, render, and verify all 21 demos
        run: python -B .github/bootstrap_graphics_demos.py

      - name: Commit exact verified candidate
        shell: bash
        run: |
          git config user.name "Supratim Sanyal"
          git config user.email "tuklusan@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Build and verify 21 C48 graphics demos"
          git push origin HEAD:graphics-demos-21
