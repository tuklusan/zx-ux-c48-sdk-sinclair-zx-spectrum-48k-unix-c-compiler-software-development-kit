# ============================================================================
# Temporary documentation-thumbnail renderer. Delete after successful capture.
# ============================================================================
name: Render documentation cover thumbnails

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-doc-thumbnails.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out SDK repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install document rendering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils imagemagick \
            fonts-dejavu fonts-liberation

      - name: Fetch authoritative upstream C48 specification read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project.git \
            /tmp/zx-ux-upstream
          test -f "/tmp/zx-ux-upstream/docs/04-C48 Language Specification Rev 0.11.docx"

      - name: Render page-one thumbnails three times
        shell: bash
        run: |
          set -euo pipefail

          render_cover() {
            local doc="$1"
            local stem="$2"
            local outdir="$3"
            local pdfdir
            pdfdir="$(mktemp -d)"
            local profile
            profile="$(mktemp -d)"

            HOME="$profile" libreoffice \
              -env:UserInstallation="file://$profile/lo-profile" \
              --headless --convert-to pdf --outdir "$pdfdir" "$doc" >/tmp/lo.log 2>&1 || {
                cat /tmp/lo.log
                exit 1
              }

            local pdf
            pdf="$(find "$pdfdir" -maxdepth 1 -type f -name '*.pdf' -print -quit)"
            test -s "$pdf"

            mkdir -p "$outdir"
            pdftoppm -f 1 -singlefile -png \
              -scale-to-x 360 -scale-to-y -1 \
              "$pdf" "$outdir/$stem" >/dev/null 2>&1
            test -s "$outdir/$stem.png"
          }

          SDK_DOCS=(
            "docs/ZX-UX C48 SDK User Manual.docx|user-manual"
            "docs/ZX-UX C48 SDK Technical Reference.docx|technical-reference"
            "docs/ZX-UX C48 SDK Adversarial Security Review.docx|adversarial-security-review"
            "/tmp/zx-ux-upstream/docs/04-C48 Language Specification Rev 0.11.docx|c48-language-specification"
          )

          rm -rf /tmp/doc-cover-passes
          for pass in 1 2 3; do
            out="/tmp/doc-cover-passes/pass${pass}"
            mkdir -p "$out"
            for item in "${SDK_DOCS[@]}"; do
              doc="${item%%|*}"
              stem="${item##*|}"
              render_cover "$doc" "$stem" "$out"
            done
          done

      - name: Validate three clean render passes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import zlib

          root = Path('/tmp/doc-cover-passes')
          names = [
              'user-manual.png',
              'technical-reference.png',
              'adversarial-security-review.png',
              'c48-language-specification.png',
          ]

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def png_info(path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: not PNG')
              if data[12:16] != b'IHDR':
                  raise SystemExit(f'{path}: missing IHDR')
              width, height, bit_depth, color_type, comp, filt, interlace = struct.unpack('>IIBBBBB', data[16:29])
              if width != 360 or height < 400:
                  raise SystemExit(f'{path}: unexpected dimensions {width}x{height}')
              if bit_depth != 8 or color_type not in (2, 6):
                  raise SystemExit(f'{path}: unsupported PNG format depth={bit_depth} type={color_type}')

              pos = 8
              compressed = bytearray()
              while pos < len(data):
                  n = struct.unpack('>I', data[pos:pos+4])[0]
                  typ = data[pos+4:pos+8]
                  payload = data[pos+8:pos+8+n]
                  pos += 12 + n
                  if typ == b'IDAT':
                      compressed += payload
                  elif typ == b'IEND':
                      break
              raw = zlib.decompress(bytes(compressed))
              channels = 3 if color_type == 2 else 4
              stride = width * channels
              prev = bytearray(stride)
              values = []
              off = 0
              for _ in range(height):
                  f = raw[off]
                  off += 1
                  row = bytearray(raw[off:off+stride])
                  off += stride
                  recon = bytearray(stride)
                  for i, x in enumerate(row):
                      a = recon[i-channels] if i >= channels else 0
                      b = prev[i]
                      c = prev[i-channels] if i >= channels else 0
                      if f == 0:
                          val = x
                      elif f == 1:
                          val = (x + a) & 255
                      elif f == 2:
                          val = (x + b) & 255
                      elif f == 3:
                          val = (x + ((a + b)//2)) & 255
                      elif f == 4:
                          p = a + b - c
                          pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
                          pr = a if pa <= pb and pa <= pc else (b if pb <= pc else c)
                          val = (x + pr) & 255
                      else:
                          raise SystemExit(f'{path}: bad PNG filter {f}')
                      recon[i] = val
                  prev = recon
                  values.extend(recon[0::channels])
              lo, hi = min(values), max(values)
              if hi - lo < 24:
                  raise SystemExit(f'{path}: cover appears blank/flat ({lo}..{hi})')
              return width, height, lo, hi

          baseline = None
          for pnum in (1, 2, 3):
              pass_dir = root / f'pass{pnum}'
              rows = []
              for name in names:
                  path = pass_dir / name
                  if not path.is_file() or path.stat().st_size < 3000:
                      raise SystemExit(f'{path}: missing or too small')
                  info = png_info(path)
                  rows.append((name, sha(path), path.stat().st_size, info))
              sig = [(n, h, s, i[:2]) for n, h, s, i in rows]
              if baseline is None:
                  baseline = sig
              elif sig != baseline:
                  raise SystemExit(f'pass {pnum}: rendered bytes differ from pass 1')
              print(f'PASS {pnum}: zero defects')
              for n, h, s, i in rows:
                  print(f'  {n}: {s} bytes {i[0]}x{i[1]} tonal={i[2]}..{i[3]} sha256={h}')
          PY

      - name: Stage final thumbnails and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          out="docs/images/doc-thumbs"
          rm -rf "$out"
          mkdir -p "$out"
          cp /tmp/doc-cover-passes/pass3/*.png "$out/"

          montage \
            "$out/c48-language-specification.png" \
            "$out/user-manual.png" \
            "$out/technical-reference.png" \
            "$out/adversarial-security-review.png" \
            -tile 4x1 -geometry 240x+10+10 \
            /tmp/document-cover-contact-sheet.png
          test -s /tmp/document-cover-contact-sheet.png

      - name: Upload cover preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-cover-preview-${{ github.sha }}
          path: |
            docs/images/doc-thumbs/*.png
            /tmp/document-cover-contact-sheet.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Commit generated thumbnails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/doc-thumbs/*.png
          if git diff --cached --quiet; then
            echo "Thumbnails already match repository bytes."
            exit 0
          fi
          git commit -m "docs: add documentation cover thumbnails"
          git push origin HEAD:main
