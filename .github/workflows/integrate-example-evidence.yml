name: Integrate example display evidence

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-example-evidence.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Close recursion runbook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scratch/C48-HANOI-QUEENS-RUNBOOK.runbook")
          text = path.read_text(encoding="utf-8")

          if "Status: CLOSED" not in text:
              anchor = "Date: 2026-09-27\n"
              if anchor not in text:
                  raise SystemExit("runbook date anchor missing")
              text = text.replace(
                  anchor,
                  anchor
                  + "\nStatus: CLOSED\n"
                  + "Phases 1 through 6 completed and accepted.\n"
                  + "Phase 7 remains deferred and separately executable only on request.\n",
                  1,
              )

          start = text.index("11. ACCEPTANCE CHECKLIST")
          deferred = text.index(
              "DEFERRED CONCURRENT ZX-UX - RUN ONLY ON SEPARATE REQUEST",
              start,
          )
          checked = text[start:deferred].replace("  [ ]", "  [x]")
          text = text[:start] + checked + text[deferred:]

          if "13. CLOSURE RECORD" not in text:
              text += (
                  "\n13. CLOSURE RECORD\n\n"
                  "CLOSED: 2026-09-27\n"
                  "Phases 1 through 6 are complete. The tracked sources, compiled "
                  "artifacts, deterministic recursion proofs, frame guards, invariant "
                  "checks, owned-half display proofs, and normal display evidence "
                  "satisfy this runbook.\n\n"
                  "Phase 7 is not closed or implied by this record. It remains a "
                  "future native ZX-UX concurrent proof and requires a separate "
                  "explicit request.\n"
              )

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Execute example suite and render screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images/examples /tmp/example-screens

          run_case() {
            name="$1"
            shift
            python -B compiler/c48run.py               --headless               --time-quota 330               --dump-screen "/tmp/example-screens/${name}.scr"               -- "usr/bin/examples/${name}.c48b" "$@"
          }

          run_case argv "SCREENSHOT-PROOF"
          run_case colors
          run_case graphics
          run_case hanoi --verify
          run_case hello
          run_case maze
          run_case queens8 --verify
          run_case udg

          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("compiler").resolve()))
          from c48.screen import Font4x8, ZXScreen
          from verify_graphics_demos import png_bytes

          names = (
              "argv",
              "colors",
              "graphics",
              "hanoi",
              "hello",
              "maze",
              "queens8",
              "udg",
          )
          font = Font4x8.load(
              Path("compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin")
          )
          out = Path("docs/images/examples")
          for name in names:
              data = Path(f"/tmp/example-screens/{name}.scr").read_bytes()
              if len(data) != 6912:
                  raise SystemExit(f"{name}: invalid screen dump size")
              screen = ZXScreen(font)
              screen.mem[:] = data
              png = png_bytes(screen.render_rgb())
              target = out / f"{name}.png"
              target.write_bytes(png)
              if len(png) < 100:
                  raise SystemExit(f"{name}: empty screenshot")
              print(f"{name}: {len(png)} bytes")
          PY

      - name: Verify repository and staged changes
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/check_license_headers.py
          python -B compiler/verify_recursive_examples.py
          python -B compiler/verify_release.py
          git add scratch/C48-HANOI-QUEENS-RUNBOOK.runbook docs/images/examples
          git diff --cached --check
          git diff --cached --name-only
          python -B compiler/check_project_banned_words.py .

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git commit -m "docs: close recursion runbook and add example evidence"
          git push origin HEAD:main
