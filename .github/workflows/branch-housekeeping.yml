name: One-shot branch housekeeping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-cleanup-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete cleanup branches
        run: |
          set -euo pipefail
          git push origin --delete cleanup/deep-clean-2026-09-14 checkpoint/pre-deep-clean-2026-09-14
