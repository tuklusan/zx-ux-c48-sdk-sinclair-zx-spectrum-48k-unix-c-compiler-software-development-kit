name: Update 1.0.0 language spec link

on:
  push:
    paths:
      - .github/workflows/update-release-language-spec-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify upstream authority, patch candidate, and run SoP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          RELEASE_ID: '389451145'
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/${RELEASE_ID}" > /tmp/release.before.json
          gh api "repos/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project/contents/docs?ref=main" > /tmp/upstream-docs.json

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          release = json.loads(Path('/tmp/release.before.json').read_text())
          body = release['body']
          old_sha = hashlib.sha256(body.encode()).hexdigest()
          if old_sha != 'd9380653f93442ced470b393f811c4b1fb2565cc176e844ac4f372a708010205':
              raise SystemExit(f'release body race/drift: {old_sha}')
          if release['tag_name'] != '1.0.0' or release['target_commitish'] != '41d130e489638dd07ba3305eea41517e0ec3b32f':
              raise SystemExit('release identity drift')
          if release['draft'] or release['prerelease'] or release['name'] != 'C48 SDK 1.0.0':
              raise SystemExit('release metadata drift')

          target_name = '04-C48 Language Specification Rev 0.11.docx'
          target_url = 'https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project/blob/main/docs/04-C48%20Language%20Specification%20Rev%200.11.docx'
          docs = json.loads(Path('/tmp/upstream-docs.json').read_text())
          matches = [x for x in docs if x.get('name') == target_name]
          if len(matches) != 1:
              raise SystemExit(f'upstream authority document count defect: {len(matches)}')
          doc = matches[0]
          if doc.get('html_url') != target_url or doc.get('type') != 'file':
              raise SystemExit('upstream authority document URL/type drift')

          old = '- [C48 language specification pointer](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/blob/1.0.0/docs/ZX-UX%20C48%20Language%20Specification.md) — points to the authoritative native ZX-UX C48 language specification.'
          new = '- [ZX-UX C48 Language Specification Rev 0.11](https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project/blob/main/docs/04-C48%20Language%20Specification%20Rev%200.11.docx) — the authoritative C48 language specification for ZX-UX.'
          if body.count(old) != 1:
              raise SystemExit(f'expected old language-spec bullet exactly once, found {body.count(old)}')
          if target_url in body:
              raise SystemExit('upstream authority URL already present unexpectedly')
          candidate = body.replace(old, new)
          if candidate.count(new) != 1 or old in candidate:
              raise SystemExit('language-spec replacement defect')
          if candidate.replace(new, old) != body:
              raise SystemExit('candidate changed beyond the one intended bullet')
          Path('/tmp/body.new.md').write_text(candidate)
          print('UPSTREAM AUTHORITY LINK CHECK PASS')
          print('candidate sha256=' + hashlib.sha256(candidate.encode()).hexdigest())
          PY

          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          source = Path('/tmp/body.new.md').read_bytes()
          baseline = hashlib.sha256(source).hexdigest()
          for n in (1, 2, 3):
              root = Path(f'/tmp/release-language-spec-sop-{n}')
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir()
              fresh = root / 'release-body.md'
              fresh.write_bytes(source)
              data = fresh.read_bytes()
              walked = 0
              lines = data.splitlines(keepends=True)
              for line_no, line in enumerate(lines, 1):
                  if b'\x00' in line:
                      raise SystemExit(f'pass {n}: NUL at line {line_no}')
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f'pass {n}: byte walk mismatch')
              data.decode('utf-8', errors='strict')
              if data != source or hashlib.sha256(data).hexdigest() != baseline:
                  raise SystemExit(f'pass {n}: fresh-copy/hash mismatch')
              print(f'RELEASE BODY SOP PASS {n}: bytes={len(data)} lines={len(lines)} sha256={baseline}')
          PY

      - name: Patch release body and verify exact read-back
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          RELEASE_ID: '389451145'
        run: |
          set -euo pipefail
          jq -n --rawfile body /tmp/body.new.md '{body:$body}' > /tmp/payload.json
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" --input /tmp/payload.json > /tmp/release.after.json
          gh api "repos/${REPO}/releases/${RELEASE_ID}" > /tmp/release.readback.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = Path('/tmp/body.new.md').read_text()
          before = json.loads(Path('/tmp/release.before.json').read_text())
          after = json.loads(Path('/tmp/release.readback.json').read_text())
          if after['body'] != expected:
              raise SystemExit('release body read-back mismatch')
          for key in ('tag_name', 'target_commitish', 'name', 'draft', 'prerelease'):
              if after[key] != before[key]:
                  raise SystemExit(f'release metadata changed: {key}')
          before_assets = [(a['name'], a.get('digest'), a['size']) for a in before['assets']]
          after_assets = [(a['name'], a.get('digest'), a['size']) for a in after['assets']]
          if after_assets != before_assets:
              raise SystemExit('release assets changed')
          print('POST-PATCH RELEASE READ-BACK PASS')
          print('body sha256=' + hashlib.sha256(expected.encode()).hexdigest())
          PY

      - name: Remove temporary workflow and push cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-release-language-spec-link.yml
          git commit -m "ci: remove release language-spec workflow"
          git push origin HEAD:main
