name: Temporary forensic review gate

"on":
  push:
    branches: [review/forensic-core-hardening-20260916]

permissions:
  contents: read

jobs:
  scan:
    name: Fresh checkout pass ${{ matrix.pass }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    steps:
      - name: Check out fresh repository bytes
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Byte-scan changed source files line by line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('compiler/c48/compiler.py'),
              Path('compiler/c48/format.py'),
              Path('compiler/c48/limits.py'),
              Path('compiler/c48/preprocessor.py'),
              Path('compiler/c48/sound.py'),
              Path('compiler/tests/forensic_review_regression.py'),
          ]
          for path in files:
              with path.open('rb') as stream:
                  for lineno, raw in enumerate(stream, 1):
                      if b'\x00' in raw:
                          raise SystemExit(f'NUL byte: {path}:{lineno}')
                      raw.decode('utf-8')
              print(f'BYTE SCAN PASS: {path}')
          PY

      - name: Run forensic review regressions
        run: python -B compiler/tests/forensic_review_regression.py

      - name: Run complete unit suite
        run: python -B compiler/run_tests.py
