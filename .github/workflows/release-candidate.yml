name: C48 release candidate packaging gate

"on":
  push:
    branches: [main]
    paths:
      # Keep this set aligned with gui-desktop.yml: this workflow requires a
      # successful host-native GUI run for the exact same commit before it can
      # preserve candidate bytes.
      - "VERSION"
      - "compiler/**/*.py"
      - "compiler/**/*.json"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/bin/demos/forest.c48b"
      - "usr/bin/games/fortune.c48b"
      - "usr/bin/games/snake.c48b"
      - "c48run"
      - "c48run.bat"
      - ".github/workflows/graphics-demos.yml"
      - ".github/workflows/gui-desktop.yml"
      - ".github/workflows/release-candidate.yml"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  source-snapshot:
    name: Preserve exact candidate bytes
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Require same-commit host-native GUI gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git lfs fsck
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              f"gui-desktop.yml/runs?head_sha={sha}&per_page=20"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "zx-ux-c48-sdk-release-gate",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for _ in range(360):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              runs = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == sha
              ]
              runs.sort(key=lambda run: int(run.get("run_number", 0)), reverse=True)
              if runs:
                  latest = runs[0]
                  status = str(latest.get("status", ""))
                  conclusion = latest.get("conclusion")
                  run_id = latest.get("id")
                  print(
                      f"GUI gate for {sha[:12]}: run={run_id} "
                      f"status={status} conclusion={conclusion}",
                      flush=True,
                  )
                  if status == "completed":
                      if conclusion == "success":
                          break
                      raise SystemExit(
                          f"same-commit GUI gate failed: run={run_id} "
                          f"conclusion={conclusion}"
                      )
              else:
                  print(
                      f"GUI gate for {sha[:12]} has not appeared yet",
                      flush=True,
                  )
              time.sleep(30)
          else:
              raise SystemExit("timed out waiting for same-commit GUI gate")
          PY

      - name: Build materialized tracked-byte ZIP and metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          safe_version="$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')"
          archive="zx-ux-c48-sdk-${safe_version}-${GITHUB_SHA}.zip"
          prefix="zx-ux-c48-sdk-${safe_version}/"
          python -B compiler/build_release_candidate.py \
            --archive "$archive" --prefix "$prefix" \
            --provenance-out C48-SPECIFICATION.json
          sha256sum "$archive" > SHA256SUMS.release
          VERSION_TEXT="$version" ARCHIVE_NAME="$archive" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE_NAME"])
          spec = json.loads(
              Path("C48-SPECIFICATION.json").read_text(encoding="ascii")
          )
          metadata = {
              "schema": 1,
              "version": os.environ["VERSION_TEXT"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "c48_specification": spec,
          }
          Path("RELEASE-CANDIDATE.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY

      - name: Upload exact candidate source package
        uses: actions/upload-artifact@v4
        with:
          name: c48-release-source-${{ github.sha }}
          path: |
            zx-ux-c48-sdk-*.zip
            RELEASE-CANDIDATE.json
            SHA256SUMS.release
            C48-SPECIFICATION.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  fresh-filesystem-verify:
    name: Fresh filesystem verify ${{ matrix.copy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify frozen bytes
        run: |
          git lfs fsck
          python -B compiler/verify_release.py

  virgin-zip-verify:
    name: Verify virgin ZIP extraction
    needs: [source-snapshot, fresh-filesystem-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download exact candidate source package
        uses: actions/download-artifact@v4
        with:
          name: c48-release-source-${{ github.sha }}
          path: candidate

      - name: Check package digest and verify from virgin extraction
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c SHA256SUMS.release
          archive="$(find . -maxdepth 1 -type f -name 'zx-ux-c48-sdk-*.zip' -printf '%f\n')"
          test -n "$archive"
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          mkdir ../virgin
          unzip -q "$archive" -d ../virgin
          root="$(find ../virgin -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"
          cd "$root"
          C48_REQUIRE_PACKAGED_SPEC=1 python -B compiler/verify_release.py
