name: Finalize queued C48 UI fixes

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-queued-fixes.yml"

permissions:
  contents: write

concurrency:
  group: queued-c48-ui-fixes
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate final manifest
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path(".")
          helper = Path(".github/workflows/apply-queued-fixes.yml")
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if ".git" in rel.parts or path.name == "MANIFEST.sha256":
                  continue
              if rel == helper:
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == ".bat":
                  data = data.replace(b"\r\n", b"\n")
              lines.append(
                  f"{sha256(data).hexdigest()}  {rel.as_posix()}\n"
              )
          Path("MANIFEST.sha256").write_text(
              "".join(lines), encoding="ascii", newline="\n"
          )
          PY
          if grep -q 'apply-queued-fixes.yml' MANIFEST.sha256; then
            echo "temporary helper leaked into final manifest" >&2
            exit 1
          fi
          git config user.name "C48 finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Finalize manifest after queued UI round"
          git push origin HEAD:main
