name: README SEO pass

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-readme-pass.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply SEO pass and certify README
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "3e1997473fc96a7a8d385081b4d1e09c0e426dc3"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          path = Path("README.md")
          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")

          native_url = "https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project"
          release_url = "https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/releases/latest"
          techref = "docs/ZX-UX%20C48%20SDK%20Technical%20Reference.docx"

          replacements = [
              (
                  "# ZX-UX C48 SDK for Windows, Linux and macOS: a portable compiler + runtime for desktop development of C programs for ZX-UX Unix for Sinclair ZX Spectrum 48K",
                  "# ZX-UX C48 SDK — Portable C compiler and runtime for Sinclair ZX Spectrum 48K development",
              ),
              (
                  "![Torus Reactor](docs/images/demos/torus.png)",
                  "![Torus Reactor — C48 graphics demo for Sinclair ZX Spectrum 48K](docs/images/demos/torus.png)",
              ),
              (
                  "![Sprite Storm](docs/images/demos/sprites.png)",
                  "![Sprite Storm — C48 graphics demo for Sinclair ZX Spectrum 48K](docs/images/demos/sprites.png)",
              ),
              (
                  "![Spectrum Plasma](docs/images/demos/plasma.png)",
                  "![Spectrum Plasma — C48 graphics demo for Sinclair ZX Spectrum 48K](docs/images/demos/plasma.png)",
              ),
              (
                  "[![C48 SDK verification](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/actions/workflows/verify.yml/badge.svg)]",
                  "[![ZX-UX C48 SDK verification status](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/actions/workflows/verify.yml/badge.svg)]",
              ),
              (
                  f"**ZX-UX C48 SDK** is not the full [**ZX-UX Unix for the Sinclair ZX Spectrum 48K**]({native_url}). It is a portable C compiler and just enough ZX-UX runtime to let you write and test C48 programs away from the actual ZX-UX environment on a real 48K Spectrum. The SDK runs on Windows, Linux and macOS, on Intel and Arm hosts.",
                  f"**ZX-UX C48 SDK** is a portable, host-side **C compiler, virtual machine and software development kit** for writing and testing C48 programs for **ZX-UX Unix on the Sinclair ZX Spectrum 48K**. It runs on Windows, Linux and macOS, on Intel and Arm hosts, providing the desktop compiler/runtime and Spectrum-facing development services needed away from the original machine. It remains separate from the actual [**ZX-UX Unix for the Sinclair ZX Spectrum 48K**]({native_url}): this SDK is not the native ZX-UX operating system, Z80 compiler, linker, runtime or final native ABI.",
              ),
              (
                  f"Download the SDK and see installation instructions on the [Latest release]({release_url}).",
                  f"Get the [Latest ZX-UX C48 SDK release]({release_url}) for the certified download package and installation instructions.",
              ),
              (
                  "## Graphics showcase — 18 more C48 demos",
                  "## ZX Spectrum 48K graphics showcase — 21 C48 demos",
              ),
              (
                  "These and the three hero images above are rendered from the exact 6912-byte ZX Spectrum screen state produced by the C48 VM. The automated graphics gate runs all 21 demos independently across GitHub-hosted Windows, Linux and macOS runners.",
                  "The three hero images above and 18 demos below are rendered from the exact 6912-byte ZX Spectrum 48K screen state produced by the C48 VM. The automated graphics gate runs all 21 C48 demos independently across GitHub-hosted Windows, Linux and macOS runners.",
              ),
              (
                  "The combined [21-demo contact sheet](docs/images/demos/contact-sheet.png) and the individual demo outputs are covered by automated verification.",
                  "The combined [21-demo ZX Spectrum graphics contact sheet](docs/images/demos/contact-sheet.png) and the individual C48 demo outputs are covered by automated verification.",
              ),
              (
                  "The language authority lives upstream in the native ZX-UX project; the SDK documents describe the portable host compiler/runtime implementation and its deliberate boundaries from native ZX-UX.",
                  "The **C48 SDK document library** covers the portable compiler/runtime, user workflow, technical architecture and security review; the authoritative C48 language definition remains upstream in the native ZX-UX project.",
              ),
              (
                  "## What the SDK provides",
                  "## C48 compiler and runtime features",
              ),
              (
                  "The SDK is a portable host-side development environment for C48 programs intended for ZX-UX. It does **not** claim that its Python compiler/VM is the native ZX-UX Z80 compiler or runtime.",
                  "The SDK is a cross-platform, host-side C development environment for C48 programs intended for ZX-UX on the Sinclair ZX Spectrum 48K. Its Python compiler and VM are portable development tools; they are **not** the native ZX-UX Z80 compiler or runtime.",
              ),
              (
                  "- `c48` / `c48.bat`: command-line C48 compiler.",
                  "- `c48` / `c48.bat`: command-line C48 C compiler for host development.",
              ),
              (
                  "## Relationship to native ZX-UX",
                  "## Relationship to native ZX-UX on Sinclair ZX Spectrum 48K",
              ),
              (
                  "## Runtime notes",
                  "## C48 runtime notes",
              ),
              (
                  "For the exact host/native boundaries, Float5 status, BEEP behavior, and error conventions, use the Technical Reference rather than treating host behavior as a promise about the future native ABI.",
                  f"For exact host/native boundaries, Float5 status, BEEP behavior and error conventions, use the [ZX-UX C48 SDK Technical Reference]({techref}) rather than treating host behavior as a promise about the future native ABI.",
              ),
              (
                  "## Source tree",
                  "## C48 SDK source tree",
              ),
              (
                  "Supratim Sanyal / SANYALnet Labs development notes: <https://supratim-sanyal.blogspot.com/>",
                  "[Supratim Sanyal / SANYALnet Labs development notes](https://supratim-sanyal.blogspot.com/)",
              ),
          ]

          candidate = text
          for old, new in replacements:
              count = candidate.count(old)
              if count != 1:
                  raise SystemExit(f"replacement source count {count}, expected 1: {old[:90]!r}")
              candidate = candidate.replace(old, new, 1)

          # Replacement-only guard: reversing every substitution must reproduce
          # the exact original README bytes.
          reversed_text = candidate
          for old, new in reversed(replacements):
              count = reversed_text.count(new)
              if count != 1:
                  raise SystemExit(f"replacement target count {count}, expected 1: {new[:90]!r}")
              reversed_text = reversed_text.replace(new, old, 1)
          if reversed_text.encode("utf-8") != original:
              raise SystemExit("replacement-only guard failed")

          path.write_bytes(candidate.encode("utf-8"))

          demos = ["torus", "sprites", "plasma", "spriteanim", "raymaze", "goblet", "tunnel", "city", "terrain", "ocean", "mobius", "morph3d", "warp", "galaxy", "orrery", "firework", "kaleido", "moire", "mandel", "julia", "forest"]
          games = ["advent", "arith", "bgammon", "chess", "cribbage", "fish", "fortune", "hangman", "maze", "quiz", "rogue", "snake", "trek", "wump"]
          apps = ["write48", "sheet48", "wire3d"]

          def validate(data: bytes, pass_no: int) -> None:
              walked = 0
              lines = data.splitlines(keepends=True)
              for line_no, line in enumerate(lines, 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at README line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")

              decoded = data.decode("utf-8", errors="strict")
              expected_h1 = "# ZX-UX C48 SDK — Portable C compiler and runtime for Sinclair ZX Spectrum 48K development"
              if decoded.count(expected_h1) != 1:
                  raise SystemExit(f"pass {pass_no}: H1 mismatch")
              if len(expected_h1) > 110:
                  raise SystemExit(f"pass {pass_no}: H1 unexpectedly long")

              required_once = [
                  "portable, host-side **C compiler, virtual machine and software development kit**",
                  "**ZX-UX Unix on the Sinclair ZX Spectrum 48K**",
                  "Windows, Linux and macOS",
                  "this SDK is not the native ZX-UX operating system, Z80 compiler, linker, runtime or final native ABI",
                  "## Download and install",
                  "Latest ZX-UX C48 SDK release",
                  "## ZX Spectrum 48K graphics showcase — 21 C48 demos",
                  "21-demo ZX Spectrum graphics contact sheet",
                  "## Document Library",
                  "**C48 SDK document library**",
                  "## C48 compiler and runtime features",
                  "cross-platform, host-side C development environment",
                  "## Games gallery — 14 C48 games",
                  "## Relationship to native ZX-UX on Sinclair ZX Spectrum 48K",
                  "## Applications gallery — 3 C48 applications",
                  "## C48 runtime notes",
                  "[ZX-UX C48 SDK Technical Reference](docs/ZX-UX%20C48%20SDK%20Technical%20Reference.docx)",
                  "## C48 SDK source tree",
                  "[Supratim Sanyal / SANYALnet Labs development notes](https://supratim-sanyal.blogspot.com/)",
              ]
              for token in required_once:
                  if decoded.count(token) != 1:
                      raise SystemExit(f"pass {pass_no}: required token count != 1: {token}")

              if decoded.count(release_url) != 1:
                  raise SystemExit(f"pass {pass_no}: latest release URL count mismatch")
              if decoded.count(native_url) < 2:
                  raise SystemExit(f"pass {pass_no}: native ZX-UX links unexpectedly missing")

              # Search-friendly hero alt text is descriptive, while gallery captions
              # remain human-first instead of repeating a keyword formula 38 times.
              for alt in (
                  "Torus Reactor — C48 graphics demo for Sinclair ZX Spectrum 48K",
                  "Sprite Storm — C48 graphics demo for Sinclair ZX Spectrum 48K",
                  "Spectrum Plasma — C48 graphics demo for Sinclair ZX Spectrum 48K",
                  "ZX-UX C48 SDK verification status",
              ):
                  if decoded.count(alt) != 1:
                      raise SystemExit(f"pass {pass_no}: hero/badge alt mismatch: {alt}")

              # Structural order remains product intro -> acquisition -> proof -> docs/features -> examples -> native boundary -> runtime.
              order = [
                  expected_h1,
                  "## Download and install",
                  "## ZX Spectrum 48K graphics showcase — 21 C48 demos",
                  "## Document Library",
                  "## C48 compiler and runtime features",
                  "## Games gallery — 14 C48 games",
                  "## Relationship to native ZX-UX on Sinclair ZX Spectrum 48K",
                  "## Applications gallery — 3 C48 applications",
                  "## C48 runtime notes",
                  "## C48 SDK source tree",
                  "## License and author",
              ]
              positions = [decoded.index(x) for x in order]
              if positions != sorted(positions):
                  raise SystemExit(f"pass {pass_no}: section order changed")

              for name in demos:
                  if decoded.count(f'usr/src/demos/{name}.c') != 1:
                      raise SystemExit(f"pass {pass_no}: demo source link mismatch for {name}")
              for name in games:
                  if decoded.count(f'usr/src/games/{name}.c') != 1:
                      raise SystemExit(f"pass {pass_no}: game source link mismatch for {name}")
              for name in apps:
                  if decoded.count(f'usr/src/apps/{name}.c') != 1:
                      raise SystemExit(f"pass {pass_no}: app source link mismatch for {name}")

              # Architecture evidence remains only where it is useful: hero/demo proof.
              g0 = decoded.index("## Games gallery — 14 C48 games")
              r0 = decoded.index("## Relationship to native ZX-UX on Sinclair ZX Spectrum 48K", g0)
              a0 = decoded.index("## Applications gallery — 3 C48 applications", r0)
              rt0 = decoded.index("## C48 runtime notes", a0)
              if "Ubuntu 24.04/x64" in decoded[g0:r0] or "Ubuntu 24.04/x64" in decoded[a0:rt0]:
                  raise SystemExit(f"pass {pass_no}: removed game/app architecture labels returned")
              before_games = decoded[:g0]
              for arch in ("Ubuntu 24.04/x64", "Windows Server 2025/x64", "macOS 26/Arm64"):
                  if arch not in before_games:
                      raise SystemExit(f"pass {pass_no}: demo architecture evidence missing: {arch}")

              # Preserve the prose/image interleaving requested for games and apps.
              gsec = decoded[g0:r0]
              if not (gsec.index("By then **Adventure**") < gsec.index("| ![C48 Adventure]") < gsec.index("The quieter side of that culture")):
                  raise SystemExit(f"pass {pass_no}: games prose/gallery order changed")
              asec = decoded[a0:rt0]
              if not (asec.index("The games above remember the period") < asec.index("| ![WRITE48]") < asec.index("**WRITE48** evokes")):
                  raise SystemExit(f"pass {pass_no}: apps prose/gallery order changed")

              # Guard against crude keyword stuffing: core phrases should remain contextual rather than repeated as a keyword block.
              if "Keywords:" in decoded or "SEO keywords" in decoded.lower():
                  raise SystemExit(f"pass {pass_no}: keyword-list artifact detected")

              print(f"README SEO SOP PASS {pass_no}: {len(data)} bytes, {len(lines)} lines, sha256={hashlib.sha256(data).hexdigest()}")

          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/readme-seo-sop-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY
          git diff --check -- README.md

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-readme-pass.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: improve search discoverability"
          git push origin HEAD:main
