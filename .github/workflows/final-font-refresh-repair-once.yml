name: One-shot FINAL font workflow repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-font-refresh-repair-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace brittle wrapped-help check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/final-font-refresh-once.yml')
          s = p.read_text(encoding='utf-8')
          old = "          python -B compiler/c48run.py --help | grep -F 'default: compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin'\n"
          new = "          grep -Fq 'default=ROOT / \"assets\" / \"SANYALnet-Labs-4x8-font-FINAL.bin\",' compiler/c48run.py\n"
          if s.count(old) != 1:
              raise SystemExit('expected wrapped-help check exactly once')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/final-font-refresh-once.yml
          git commit -m 'ci: harden FINAL font refresh verification'
          git push origin HEAD:main
