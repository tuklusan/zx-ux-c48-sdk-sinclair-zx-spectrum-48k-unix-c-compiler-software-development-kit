name: Phase 3 manual updater

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-docs-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install document and render support
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-docx==1.2.0 pillow==11.3.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          fi

      - name: Apply native tape documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          additions = {
              "docs/ZX-UX C48 SDK User Manual.docx": (
                  "7. Spectrum Display and Keyboard Behavior",
                  [
                      ("Heading 2", "6.7 Native executable tape cross-development"),
                      ("Body Text", "c48b2tap converts one validated C48B1 file into target-native ZX-UX artifacts. C48B1 remains the SDK host representation and is not Z80 machine code. Use c48b2tap --obj program.c48b program.obj for relocatable OBJ1, c48b2tap --mex program.c48b program.mex for a linked MEX1 executable, or c48b2tap --name PROGRAM program.c48b program.tap for a native executable cassette image."),
                      ("Body Text", "TAP output contains an M48O version-1 RAW BIN object targeted to BIN, with the complete MEX1 byte stream as its payload. A tape object name is 1 through 10 portable bytes. If the output basename is not a valid native object name, supply --name explicitly. --stack selects the requested FAST stack within the native 64 through 4096 byte range."),
                      ("Body Text", "The linker enforces two independent native limits. Executable image plus BSS must not exceed 32,768 bytes, and the complete stored MEX1, including relocation records, must also not exceed 32,768 bytes. The release proof includes a deterministic generated source between 29 KiB and 31 KiB whose stored MEX1 is also in that band. This demonstrates host cross-development capacity; it does not enlarge native ZX-UX memory."),
                      ("Body Text", "OBJ1, MEX1, and TAP output is deterministic for identical input, options, and tool version. c48b2tap writes through a temporary peer and publishes the destination only after generation and validation succeed. Malformed C48B1, unsupported target operations, unresolved symbols, invalid object names, path errors, or native size overflow therefore fail without leaving a partial new output."),
                      ("Body Text", "c48b2tap and c48run --multitask serve different purposes. c48b2tap creates target-native single-process artifacts for ZX-UX. c48run --multitask is the cooperative host execution model described in Section 6.6. Shared semantic fixtures compare overlapping behavior, but the SDK does not claim native concurrent execution merely because both facilities exist."),
                  ],
              ),
              "docs/ZX-UX C48 SDK Technical Reference.docx": (
                  "7. Logical Memory, Allocation Lifetime, and Pointer Provenance",
                  [
                      ("Heading 2", "6.6 Native OBJ1/MEX1 code-generation path"),
                      ("Body Text", "The native backend consumes the already validated C48B1 program tree and emits documented Z80 plus OBJ1 symbols and ABS16 relocations. C48_REGCALL uses HL, DE, BC, then right-to-left 16-bit stack words. Float5 arguments are pointers to caller-owned five-byte storage. A Float5-returning function receives a hidden result pointer in HL, shifts user arguments by one slot, writes exactly five result bytes, and returns that pointer."),
                      ("Body Text", "Native integer operations preserve C48 width, signed division, remainder, shifts, pointer scaling, initialization, recursion, and left-to-right argument evaluation. Float5 arithmetic, comparison, integer conversion, truth testing, and public math calls use the pinned ZX-UX floating syscall contract rather than host IEEE arithmetic. Unsupported or unresolved external operations fail closed at link time."),
                      ("Body Text", "The SDK runtime archive has deterministic member ordering and pinned provenance. Exact frozen startup/runtime OBJ1 members are hash-checked where the native tree ships prebuilt objects; other admitted helpers are deterministic target-compatible translations of the pinned assembly contract. Fixed-point archive selection continues until all reachable native symbols resolve or linking fails."),
                  ],
                  "16. Float5 Representation and ROM-Derived Mathematics",
                  [
                      ("Heading 2", "15.6 Native executable formats and cassette proof"),
                      ("Body Text", "c48b2tap --obj emits OBJ1 with validated header/body CRCs, symbol records, BSS size, and strictly ordered ABS16 relocations. --mex links the startup object, generated program object, and required runtime members into MEX1 with startup as the entry. The host linker independently enforces image-plus-BSS <= 32768 and exact stored-MEX1 length <= 32768, including relocation bytes."),
                      ("Body Text", "Default TAP mode wraps the complete MEX1 in a native M48O version-1 RAW BIN object targeted to BIN and then emits standard Spectrum TAP framing. Generated OBJ1 and MEX1 are checked by SDK decoders and pinned native format oracles. The native interoperability workflow bootstraps the exact pinned ZX-UX toolchain, then exercises the real cassette/load/relocation path under the project-local emulator and records deterministic source, OBJ1, MEX1, and TAP identities."),
                      ("Body Text", "The large-program qualification generator is test-owned rather than part of the pinned demo/example/app corpus. It produces the same 29-31 KiB source bytes on every run and forces a similarly sized stored MEX1. Boundary tests cover both independent 32768-byte ceilings and deliberate overflow. These proofs demonstrate cross-development away from native compiler workspace pressure without changing ZX-UX loader or process memory limits."),
                  ],
              ),
              "docs/ZX-UX C48 SDK Adversarial Security Review.docx": (
                  "10. Screen, GUI, Host BREAK, Math, and Sound",
                  [
                      ("Heading 2", "9.4 Native lowering and link fail-closed boundary"),
                      ("Body Text", "c48b2tap treats C48B1 as untrusted structured input even though it was normally produced by the SDK compiler. It reuses the strict schema reader, rejects malformed or oversized representations, and refuses native operations whose target behavior is not implemented. Symbol resolution is fail closed: an external name must resolve through the generated program or the deterministic pinned runtime archive before output publication."),
                      ("Body Text", "Float5 is not silently reinterpreted as a host four-byte float. Native lowering uses five-byte storage and the pinned floating syscall ABI, including hidden result pointers and pointer-valued float arguments. Native-size and call-frame checks reject output that would exceed the admitted target contracts."),
                  ],
                  "11. Application Buffers and Conversation State",
                  [
                      ("Heading 2", "10.6 Native artifact transaction and size controls"),
                      ("Body Text", "OBJ1, MEX1, and TAP destinations are committed only after complete generation and validation through a same-directory temporary file. Input/output aliasing, symlink destinations, invalid suffixes, overwrite policy, native object-name rules, CRC failures, unresolved symbols, invalid relocations, stack-policy violations, image-plus-BSS overflow, and stored-MEX1 overflow all fail before a partial replacement can appear."),
                      ("Body Text", "The native executable envelope is deliberately narrow: M48O version 1, RAW codec, BIN type and BIN target, with exact logical and physical payload equal to the complete MEX1. Independent decoders verify generated structures, while the pinned native toolchain is used for interoperability and execution evidence. This avoids the circular assurance of trusting only the writer that created the bytes."),
                  ],
                  "16. Release and Package Supply Chain",
                  [
                      ("Heading 2", "15.6 Native cross-development release evidence"),
                      ("Body Text", "Phase 3 release evidence pins the native ZX-UX authority commit, runtime member provenance, exported-symbol set, archive order, exact prebuilt-member digests, independent OBJ1/MEX1/TAP validation, deterministic rebuilds, and native load/relocation/execution. The proof set includes recursion, integer arithmetic, globals, strings, text/graphics runtime calls, startup/exit, relocations, and a dedicated 29-31 KiB generated source whose stored MEX1 is also in that band."),
                      ("Body Text", "The native repository is read-only evidence. Normal c48b2tap execution never reaches into a moving native checkout. The interoperability workflow checks out the exact pinned commit and bootstraps that commit's declared project-local runtime before running native proof. The immutable pre-existing C/H corpus under demos, examples, and apps is not changed to manufacture native evidence."),
                  ],
              ),
          }

          for file_name, spec in additions.items():
              doc = Document(file_name)
              doc.core_properties.author = "SANYALnet Labs"
              doc.core_properties.last_modified_by = "SANYALnet Labs"
              pairs = list(zip(spec[0::2], spec[1::2]))
              for heading, paragraphs in pairs:
                  if any(p.text == paragraphs[0][1] for p in doc.paragraphs):
                      raise SystemExit(f"{file_name}: section already present")
                  anchors = [
                      p for p in doc.paragraphs
                      if p.text == heading and p.style.name == "Heading 1"
                  ]
                  if len(anchors) != 1:
                      raise SystemExit(f"{file_name}: anchor mismatch: {heading}")
                  anchor = anchors[0]
                  for style, body in paragraphs:
                      anchor.insert_paragraph_before(body, style=style)
              doc.save(file_name)
          PY

      - name: Render every manual page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pdf qa/pages
          for doc in             "docs/ZX-UX C48 SDK User Manual.docx"             "docs/ZX-UX C48 SDK Technical Reference.docx"             "docs/ZX-UX C48 SDK Adversarial Security Review.docx"
          do
            base="$(basename "$doc" .docx)"
            libreoffice --headless --convert-to pdf --outdir qa/pdf "$doc" >/tmp/lo.txt 2>&1 || { cat /tmp/lo.txt; exit 1; }
            pdf="qa/pdf/$base.pdf"
            test -s "$pdf"
            mkdir -p "qa/pages/$base"
            pdftoppm -png -r 120 "$pdf" "qa/pages/$base/page" >/dev/null 2>&1
            test "$(find "qa/pages/$base" -type f -name 'page-*.png' | wc -l)" -gt 0
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          for folder in sorted(Path("qa/pages").iterdir()):
              pages = sorted(folder.glob("page-*.png"))
              thumbs = []
              for page in pages:
                  image = Image.open(page).convert("RGB")
                  image.thumbnail((320, 430))
                  thumbs.append((page.name, image.copy()))
              cols = 4
              cell_w, cell_h = 340, 470
              rows = (len(thumbs) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * cell_w, rows * cell_h), "white")
              draw = ImageDraw.Draw(sheet)
              for index, (name, image) in enumerate(thumbs):
                  x = (index % cols) * cell_w + 10
                  y = (index // cols) * cell_h + 25
                  sheet.paste(image, (x, y))
                  draw.text((x, 5 + (index // cols) * cell_h), name, fill="black")
              sheet.save(Path("qa") / f"{folder.name}-contact-sheet.png")
          PY

      - name: Structural manual checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          required = {
              "docs/ZX-UX C48 SDK User Manual.docx": [
                  "6.7 Native executable tape cross-development",
                  "c48b2tap --obj program.c48b program.obj",
                  "32,768 bytes",
              ],
              "docs/ZX-UX C48 SDK Technical Reference.docx": [
                  "6.6 Native OBJ1/MEX1 code-generation path",
                  "15.6 Native executable formats and cassette proof",
                  "Float5",
              ],
              "docs/ZX-UX C48 SDK Adversarial Security Review.docx": [
                  "9.4 Native lowering and link fail-closed boundary",
                  "10.6 Native artifact transaction and size controls",
                  "15.6 Native cross-development release evidence",
              ],
          }
          for path, markers in required.items():
              doc = Document(path)
              text = "\n".join(p.text for p in doc.paragraphs)
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f"{path}: missing {marker}")
              if doc.core_properties.author != "SANYALnet Labs":
                  raise SystemExit(f"{path}: author metadata drift")
          PY
          git diff --quiet -- usr/src/demos usr/src/examples usr/src/apps

      - name: Commit exact documentation bytes and retire updater
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase3-docs-once.yml
          git diff --quiet -- usr/src/demos usr/src/examples usr/src/apps
          git config user.name "SANYALnet Labs Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add             "docs/ZX-UX C48 SDK Adversarial Security Review.docx"             "docs/ZX-UX C48 SDK Technical Reference.docx"             "docs/ZX-UX C48 SDK User Manual.docx"             .github/workflows/phase3-docs-once.yml
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n'             '.github/workflows/phase3-docs-once.yml'             'docs/ZX-UX C48 SDK Adversarial Security Review.docx'             'docs/ZX-UX C48 SDK Technical Reference.docx'             'docs/ZX-UX C48 SDK User Manual.docx' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          python -B compiler/check_license_headers.py
          git commit -m "Document native executable tape cross-development"
          git push origin HEAD:main

      - name: Preserve rendered manual evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-manual-qa-${{ github.run_id }}
          path: qa/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
