name: One-shot ailmzx48 review pass 1 correction

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-ailmzx48-pass1.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current and parent commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true

      - name: Recover and run reviewed patch script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          rel = '.github/workflows/review-ailmzx48-pass1.yml'
          old = subprocess.check_output(
              ['git', 'show', f'HEAD^:{rel}'], text=True
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Remove workflow"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          lines = old[start:end].splitlines()
          out = []
          for line in lines:
              if line.startswith('          '):
                  line = line[10:]
              out.append(line)
          script = '\n'.join(out) + '\n'
          Path('/tmp/review-pass1.py').write_text(script, encoding='utf-8')
          compile(script, '/tmp/review-pass1.py', 'exec')
          PY
          python /tmp/review-pass1.py

      - name: Remove helper workflow and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/review-ailmzx48-pass1.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.').resolve()
          manifest = root / 'MANIFEST.sha256'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              digest = hashlib.sha256(data).hexdigest()
              lines.append(f'{digest}  {rel.as_posix()}\n')
          manifest.write_text(''.join(lines), encoding='ascii', newline='\n')
          PY

      - name: Run full SDK verifier
        run: python -B compiler/verify_release.py

      - name: Commit corrected design to main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct ailmzx48 detailed design review findings"
          git push origin HEAD:main
