          once(
              'MODEL_FORMAT\nLATENCY\nMEMORY\nHARNESS',
              'MODEL_FORMAT\nLATENCY\nMEMORY\nCONTEXT_LITERAL_LOSS\nL2_EVICTION\nEVAL_LEAKAGE\nHARNESS'
