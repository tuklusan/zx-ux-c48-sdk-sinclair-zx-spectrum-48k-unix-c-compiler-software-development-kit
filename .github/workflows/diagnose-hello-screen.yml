name: Diagnose deterministic screen baselines

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-hello-screen.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render every deterministic demo twice
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          exp = json.loads((root / 'compiler/release_expectations.json').read_text())['demos']
          for name, cfg in exp.items():
              hashes = []
              for attempt in (1, 2):
                  with tempfile.TemporaryDirectory(prefix=f'demo-{name}-{attempt}-') as td:
                      d = Path(td)
                      rebuilt = d / f'{name}.c48b'
                      cp = subprocess.run([
                          sys.executable, '-B', str(root / 'compiler/c48.py'),
                          str(root / f'usr/src/examples/{name}.c'), '-o', str(rebuilt),
                      ], cwd=root, check=False, capture_output=True, text=True)
                      if cp.returncode:
                          raise SystemExit(f'{name}: rebuild failed: {cp.stderr}')
                      screen = d / f'{name}.scr'
                      rp = subprocess.run([
                          sys.executable, '-B', str(root / 'compiler/c48run.py'),
                          '--headless', '--time-quota', '15',
                          '--dump-screen', screen.name, rebuilt.name, *cfg['args'],
                      ], cwd=d, check=False, capture_output=True, text=True)
                      if rp.returncode:
                          raise SystemExit(f'{name}: run failed: {rp.stderr}')
                      data = screen.read_bytes()
                      hashes.append(hashlib.sha256(data).hexdigest())
                      if len(data) != 6912:
                          raise SystemExit(f'{name}: bad screen size {len(data)}')
              print(
                  f'{name}: expected={cfg["screen_sha256"]} '
                  f'actual1={hashes[0]} actual2={hashes[1]} '
                  f'stable={hashes[0] == hashes[1]} '
                  f'match={hashes[0] == cfg["screen_sha256"]}'
              )
          PY
