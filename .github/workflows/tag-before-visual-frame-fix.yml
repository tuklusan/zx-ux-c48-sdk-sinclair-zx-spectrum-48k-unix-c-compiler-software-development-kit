name: Freeze pre visual-frame-fix head

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-before-visual-frame-fix.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRE_FIX_SHA: "447881d3ffe24457ccd9bb885503e0fa7d39fd2f"
      PRE_FIX_TAG: "BEFORE-VISUAL-FRAME-DROP-FIX"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact tagging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag exact pre-fix head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRE_FIX_SHA"
          if git rev-parse "refs/tags/$PRE_FIX_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$PRE_FIX_TAG")" = "$PRE_FIX_SHA"
          else
            git tag "$PRE_FIX_TAG" "$PRE_FIX_SHA"
            git push origin "refs/tags/$PRE_FIX_TAG"
          fi
          test "$(git rev-list -n 1 "$PRE_FIX_TAG")" = "$PRE_FIX_SHA"

      - name: Remove one-shot tag workflow and restore manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tag-before-visual-frame-fix.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          rows = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              rows.append((rel.as_posix(), hashlib.sha256(data).hexdigest()))
          rows.sort()
          Path('MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in rows),
              encoding='ascii', newline='\n')
          PY
          git config user.name "C48 freeze builder"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --check
          git commit -m "Freeze pre visual-frame-fix head"
          git push origin HEAD:main
