name: ailmzx48 SoP defect repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: ailmzx48-sop-defect-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repair stale Revision 0.26 upstream note
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          design = Path('usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md')
          status = Path('usr/src/ailmzx48/evaluation/DESIGN-COMPLIANCE-STATUS.json')
          cert = Path('usr/src/ailmzx48/evaluation/DESIGN-REVIEW-CERTIFICATE.md')
          old = '\n'.join([
              'The SDK profile is not a substitute for native certification.  As of this',
              'revision the read-only upstream ZX-UX repository main identity checked for the',
              'native dependency is `cb8e4ea0b68df693e5d4133fc906ed46234427b6`; its latest',
              'inspected durable certification item is Phase-1 `P1.25`.  That upstream state',
              'does not yet provide the native C48/OBJ1/MEX1 build, allocator/stack/Fuse, and',
              'physical-cassette execution path required by Sections 18, 19 and 22.  Those',
              'native-only obligations therefore remain explicitly `BLOCKED_EXTERNAL`; they',
              'are neither silently waived nor counted as SDK zero-gap evidence.',
              '',
          ])
          new = '\n'.join([
              'The SDK profile is not a substitute for native certification.  As of this',
              'revision the read-only upstream ZX-UX repository main identity checked for the',
              'native dependency is `8c8f918743897b352513b0545ff77487682c088f`.  Its latest',
              'inspected durable certification item is Phase-1 `P1.26`, which certifies source',
              'commit `cb8e4ea0b68df693e5d4133fc906ed46234427b6`.  That upstream state still',
              'does not provide the native C48/OBJ1/MEX1 build, allocator/stack/Fuse, and',
              'physical-cassette execution path required by Sections 18, 19 and 22.  Those',
              'native-only obligations therefore remain explicitly `BLOCKED_EXTERNAL`; they',
              'are neither silently waived nor counted as SDK zero-gap evidence.',
              '',
          ])
          text = design.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('stale Revision 0.26 note anchor not unique')
          design.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          data = design.read_bytes()
          design_sha = hashlib.sha256(data).hexdigest()
          blob_sha = hashlib.sha1(
              b'blob ' + str(len(data)).encode('ascii') + b'\0' + data
          ).hexdigest()

          s = json.loads(status.read_text(encoding='utf-8'))
          s['design_sha256'] = design_sha
          s['design_git_blob_sha1'] = blob_sha
          status.write_text(
              json.dumps(s, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )

          c = cert.read_text(encoding='utf-8')
          lines = []
          for line in c.splitlines():
              if line.startswith('- detailed-design Git blob:'):
                  line = f'- detailed-design Git blob: `{blob_sha}`'
              elif line.startswith('- detailed-design SHA-256:'):
                  line = f'- detailed-design SHA-256: `{design_sha}`'
              lines.append(line)
          cert.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary repair workflow
        run: rm .github/workflows/ailmzx48-sop-snapshot.yml

      - name: Revalidate ailmzx48 and repository
        shell: bash
        run: |
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit repaired checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ailmzx48: repair stale Revision 0.26 authority note"
          git push origin HEAD:main
