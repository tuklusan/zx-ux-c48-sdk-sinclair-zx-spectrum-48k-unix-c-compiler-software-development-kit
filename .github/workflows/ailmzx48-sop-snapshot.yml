name: ailmzx48 SoP factual provenance repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: ailmzx48-sop-provenance-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repair factual corpus provenance
        run: >-
          python -B usr/src/ailmzx48/tooling/sop_provenance_repair.py patch

      - name: Rebuild model and reference tests
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 9112
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('usr/src/ailmzx48/evaluation/a48m-reference-report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['logical_length'] == 8432, r
          assert r['record_count'] == 69, r
          assert r['max_record_bytes'] == 192, r
          assert r['max_read_request'] == 64, r
          PY
          python -B compiler/c48.py usr/src/ailmzx48/ailmzx48.c \
            -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Requalify repaired model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ailmzx48-sop-qual
          mkdir -p /tmp/ailmzx48-sop-qual
          rsync -a --exclude=.git ./ /tmp/ailmzx48-sop-qual/
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import subprocess
          import sys

          live = Path.cwd()
          temp = Path('/tmp/ailmzx48-sop-qual')
          base = live / 'usr/src/ailmzx48/evaluation/sdk-conformance'
          diag = json.loads((base / 'final-c' / 'request.json').read_text(encoding='utf-8'))
          diag['iteration'] = 9190
          diag['prompts'] = [
              'what does spectrum basic run do to variables before program execution'
          ]
          diag['expected_keywords'] = ['clears']
          diag['final_expected_keyword'] = 'clears'
          diag['min_keyword_ratio'] = 1.0
          diag['min_semantic_uses'] = 1
          diag['purpose'] = 'Routing preflight for corrected Spectrum BASIC RUN fact.'
          diag_path = temp / 'sop-routing-preflight.json'
          diag_path.write_text(
              json.dumps(diag, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )
          subprocess.run(
              [sys.executable, '-B',
               str(temp / 'usr/src/ailmzx48/tooling/run_iteration.py'),
               '--request', str(diag_path), '--max-seconds', '1200'],
              cwd=temp, check=True,
          )
          subprocess.run(
              [sys.executable, '-B',
               str(temp / 'usr/src/ailmzx48/evaluation/check_iteration_score.py'),
               '--request', str(diag_path)],
              cwd=temp, check=True,
          )
          scenarios = [
              ('literal-context', 9109),
              ('final-a', 9110),
              ('final-b', 9111),
              ('final-c', 9112),
          ]
          for name, iteration in scenarios:
              req = json.loads((base / name / 'request.json').read_text(encoding='utf-8'))
              req['iteration'] = iteration
              req['purpose'] = (
                  str(req.get('purpose', ''))
                  + ' SoP requalification after factual-provenance and corpus repair.'
              )
              if name == 'final-b':
                  i = req['prompts'].index(
                      'what sales milestone did spectrum game the hobbit adventure reach'
                  )
                  if req['expected_keywords'][i] != 'million':
                      raise SystemExit('final-b Hobbit expectation anchor changed')
                  req['expected_keywords'][i] = '500000'
              if name == 'final-c':
                  old_prompt = 'in what order does spectrum basic list program lines'
                  i = req['prompts'].index(old_prompt)
                  if req['expected_keywords'][i] != 'ascending':
                      raise SystemExit('final-c BASIC expectation anchor changed')
                  req['prompts'][i] = (
                      'what does spectrum basic run do to variables before program execution'
                  )
                  req['expected_keywords'][i] = 'clears'
              request = temp / f'sop-{name}.json'
              request.write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/tooling/run_iteration.py'),
                   '--request', str(request), '--max-seconds', '1200'],
                  cwd=temp, check=True,
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/evaluation/check_iteration_score.py'),
                   '--request', str(request)],
                  cwd=temp, check=True,
              )
              src = temp / 'usr/src/ailmzx48/conversations' / f'iter-{iteration:04d}'
              dst = base / name
              for member in (
                  'conversation.md', 'run.json', 'score.json', 'transcript.json'
              ):
                  shutil.copy2(src / member, dst / member)
              (dst / 'request.json').write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
          pairs = [
              ('usr/bin/ailmzx48/ailmzx48.c48b', 'C48B1'),
              ('usr/src/ailmzx48/model/cold-seed.bin', 'cold A48M'),
              ('usr/src/ailmzx48/model/current-model.json', 'hot model'),
              ('usr/src/ailmzx48/aimod.h', 'resident model header'),
          ]
          for rel, label in pairs:
              if (live / rel).read_bytes() != (temp / rel).read_bytes():
                  raise SystemExit(f'isolated requalification rebuilt different {label}')
          PY

      - name: Finalize model identities
        run: >-
          python -B usr/src/ailmzx48/tooling/sop_provenance_repair.py finalize

      - name: Remove temporary SoP instrumentation
        shell: bash
        run: |
          rm .github/workflows/ailmzx48-sop-snapshot.yml
          rm usr/src/ailmzx48/tooling/sop_provenance_repair.py

      - name: Run hard release gates
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 1
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 2
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 3
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push factual provenance repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ailmzx48: qualify factual provenance and corrected model"
          git push origin HEAD:main
