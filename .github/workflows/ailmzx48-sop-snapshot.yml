name: ailmzx48 SoP transactional repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: ailmzx48-sop-transaction-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply post-context literal publication repair
        run: >-
          python -B usr/src/ailmzx48/tooling/sop_transaction_repair.py patch

      - name: Reference tests and C48 compilation
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py
          python -B compiler/c48.py usr/src/ailmzx48/ailmzx48.c \
            -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Requalify literal context and final A B C
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ailmzx48-sop-qual
          mkdir -p /tmp/ailmzx48-sop-qual
          rsync -a --exclude=.git ./ /tmp/ailmzx48-sop-qual/
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import subprocess
          import sys

          live = Path.cwd()
          temp = Path('/tmp/ailmzx48-sop-qual')
          base = live / 'usr/src/ailmzx48/evaluation/sdk-conformance'
          scenarios = [
              ('literal-context', 9105),
              ('final-a', 9106),
              ('final-b', 9107),
              ('final-c', 9108),
          ]
          for name, iteration in scenarios:
              req = json.loads((base / name / 'request.json').read_text(encoding='utf-8'))
              req['iteration'] = iteration
              req['purpose'] = (
                  str(req.get('purpose', ''))
                  + ' SoP requalification after transactional literal-publication repair.'
              )
              request = temp / f'sop-{name}.json'
              request.write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/tooling/run_iteration.py'),
                   '--request', str(request), '--max-seconds', '1200'],
                  cwd=temp, check=True,
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/evaluation/check_iteration_score.py'),
                   '--request', str(request)],
                  cwd=temp, check=True,
              )
              src = temp / 'usr/src/ailmzx48/conversations' / f'iter-{iteration:04d}'
              dst = base / name
              for member in ('conversation.md', 'run.json', 'score.json', 'transcript.json'):
                  shutil.copy2(src / member, dst / member)
              (dst / 'request.json').write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
          live_bin = live / 'usr/bin/ailmzx48/ailmzx48.c48b'
          temp_bin = temp / 'usr/bin/ailmzx48/ailmzx48.c48b'
          if live_bin.read_bytes() != temp_bin.read_bytes():
              raise SystemExit('isolated requalification rebuilt different C48B bytes')
          PY

      - name: Finalize evidence identities
        run: >-
          python -B usr/src/ailmzx48/tooling/sop_transaction_repair.py finalize

      - name: Remove temporary SoP instrumentation
        shell: bash
        run: |
          rm .github/workflows/ailmzx48-sop-snapshot.yml
          rm usr/src/ailmzx48/tooling/sop_transaction_repair.py

      - name: Regenerate manifest and run hard release gates
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 1
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 2
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 3
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push transactional repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ailmzx48: make literal publication transactional"
          git push origin HEAD:main
