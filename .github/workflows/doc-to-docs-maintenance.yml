name: doc to docs maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/doc-to-docs-maintenance.yml"

permissions:
  contents: write

concurrency:
  group: doc-to-docs-maintenance-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Normalize active SoP instrumentation headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          header = '''# ============================================================================
          # Copyright (c) 2026 Supratim Sanyal of SANYALnet Labs.
          # Proprietary rights reserved except as expressly licensed herein.
          #
          # ZX-UX C48 SDK
          # This file is governed by the SANYALnet Labs Non-Commercial License in the
          # root LICENSE file. Non-Commercial use permitted; Commercial Use and use
          # for AI/ML model training are prohibited unless separately authorized.
          #
          # Attribution is required: "Based on original work by Supratim Sanyal of
          # SANYALnet Labs." See LICENSE for full terms, warranty disclaimer, termination,
          # patent, trademark, and governing-law provisions.
          # ============================================================================
          '''
          header = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in header.splitlines()
          ) + '\n'
          workflows = [
              '.github/workflows/ailmzx48-sop-anchor-repair.yml',
              '.github/workflows/ailmzx48-sop-bridge-probe.yml',
              '.github/workflows/ailmzx48-sop-bridge-snapshot.yml',
          ]
          helpers = [
              'usr/src/ailmzx48/tooling/sop_anchor_doc_repair.py',
              'usr/src/ailmzx48/tooling/sop_anchor_repair.py',
          ]
          for rel in workflows:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              at = text.find('name:')
              if at < 0:
                  raise SystemExit(f'workflow name marker missing: {rel}')
              path.write_text(
                  header + text[at:], encoding='utf-8', newline='\n')
              print('HEADER_NORMALIZED', rel)
          for rel in helpers:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              shebang = '#!/usr/bin/env python3\n'
              if not text.startswith(shebang):
                  raise SystemExit(f'python shebang mismatch: {rel}')
              rest = text[len(shebang):]
              if 'Copyright (c) 2026 Supratim Sanyal' in rest[:1200]:
                  print('HEADER_ALREADY_PRESENT', rel)
                  continue
              path.write_text(
                  shebang + header + '\n' + rest,
                  encoding='utf-8', newline='\n')
              print('HEADER_NORMALIZED', rel)
          PY

      - name: Rewrite repository-owned doc paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          workflow = '.github/workflows/doc-to-docs-maintenance.yml'
          changed = []
          before = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith('.git/'):
                  continue
              if rel == 'MANIFEST.sha256' or rel == workflow:
                  continue
              if rel.startswith('docs/reference/'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'doc/' in text or '"doc"' in text or "'doc'" in text:
                  for no, line in enumerate(text.splitlines(), 1):
                      if 'doc/' in line or '"doc"' in line or "'doc'" in line:
                          before.append(f'{rel}:{no}:{line}')
              new = text.replace('doc/', 'docs/')
              if rel == 'compiler/verify_graphics_demos.py':
                  new = new.replace(
                      'SDK / "doc" / "images" / "demos"',
                      'SDK / "docs" / "images" / "demos"')
              if new != text:
                  path.write_text(new, encoding='utf-8', newline='\n')
                  changed.append(rel)
          print('DOCS_RENAME_MATCHES_BEGIN')
          for line in before:
              print(line)
          print('DOCS_RENAME_MATCHES_END')
          print('DOCS_RENAME_CHANGED', len(changed))
          for rel in changed:
              print('DOCS_RENAME_FILE', rel)
          residual = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith('.git/') or rel.startswith('docs/reference/'):
                  continue
              if rel == 'MANIFEST.sha256' or rel == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for no, line in enumerate(text.splitlines(), 1):
                  if 'doc/' in line:
                      residual.append(f'{rel}:{no}:{line}')
                  if rel == 'compiler/verify_graphics_demos.py' and 'SDK / "doc"' in line:
                      residual.append(f'{rel}:{no}:{line}')
          if residual:
              print('RESIDUAL_OLD_DOC_PATHS')
              print('\n'.join(residual))
              raise SystemExit(1)
          PY

      - name: Refresh ailm design identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          a = Path('usr/src/ailmzx48')
          design = a / 'AILMZX48-DETAILED-DESIGN.md'
          raw = design.read_bytes()
          design_sha = hashlib.sha256(raw).hexdigest()
          framed = b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw
          design_blob = hashlib.sha1(framed).hexdigest()

          status_path = a / 'evaluation/DESIGN-COMPLIANCE-STATUS.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['design_sha256'] = design_sha
          status['design_git_blob_sha1'] = design_blob
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n')

          cert_path = a / 'evaluation/DESIGN-REVIEW-CERTIFICATE.md'
          cert = cert_path.read_text(encoding='utf-8')
          blob_prefix = '- detailed-design Git blob: `'
          sha_prefix = '- detailed-design SHA-256: `'
          out = []
          blob_hits = 0
          sha_hits = 0
          for line in cert.splitlines():
              if line.startswith(blob_prefix):
                  line = f'{blob_prefix}{design_blob}`'
                  blob_hits += 1
              elif line.startswith(sha_prefix):
                  line = f'{sha_prefix}{design_sha}`'
                  sha_hits += 1
              out.append(line)
          if blob_hits != 1 or sha_hits != 1:
              raise SystemExit(
                  f'certificate identity anchors mismatch: blob={blob_hits} sha={sha_hits}')
          cert_path.write_text(
              '\n'.join(out) + '\n', encoding='utf-8', newline='\n')
          print('DESIGN_SHA256', design_sha)
          print('DESIGN_GIT_BLOB_SHA1', design_blob)
          PY

      - name: Remove temporary workflow and regenerate manifest
        shell: bash
        run: |
          rm .github/workflows/doc-to-docs-maintenance.yml
          python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Run hard release gates
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check
          if grep -q '  doc/' MANIFEST.sha256; then
            echo 'stale doc path remains in MANIFEST.sha256' >&2
            exit 1
          fi
          if ! grep -q '  docs/' MANIFEST.sha256; then
            echo 'docs paths missing from MANIFEST.sha256' >&2
            exit 1
          fi
          test ! -e doc
          test -d docs

      - name: Commit and push completed rename maintenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete doc to docs directory rename [skip ci]"
          git push origin HEAD:main
