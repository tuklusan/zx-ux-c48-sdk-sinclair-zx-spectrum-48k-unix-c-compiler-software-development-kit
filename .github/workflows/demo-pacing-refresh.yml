name: Demo pacing refresh

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-pacing-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply pacing policy to demo sources
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import re

          root = Path("usr/src/demos")
          helper = root / "demoapi.h"
          text = helper.read_text(encoding="ascii")
          proto = "int sleep(unsigned int ticks);\n"
          if text.count(proto) != 1:
              raise SystemExit("demoapi sleep prototype preimage mismatch")
          text = text.replace(
              proto,
              proto + "int beep(float duration, float pitch);\n",
          )
          marker = '''int d_px(int x, int z)\n'''
          scene_helper = '''void d_scene_break(void)\n{\n    int rc;\n    rc = beep(0.25, 0.0);\n    if (rc != 0) return;\n    rc = beep(0.25, 4.0);\n    if (rc != 0) return;\n    rc = beep(0.25, 7.0);\n    if (rc != 0) return;\n    rc = beep(0.25, 12.0);\n    if (rc != 0) return;\n    rc = beep(0.25, 9.0);\n    if (rc != 0) return;\n    rc = beep(0.25, 7.0);\n    if (rc != 0) return;\n    rc = beep(0.25, 4.0);\n    if (rc != 0) return;\n    beep(0.25, 0.0);\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("demoapi helper insertion preimage mismatch")
          text = text.replace(marker, scene_helper + marker)
          helper.write_text(text, encoding="ascii", newline="\n")

          scene_names = {
              "goblet", "terrain", "ocean", "torus",
              "mobius", "morph3d", "mandel", "julia",
          }
          continuous_names = {
              "tunnel", "city", "warp", "galaxy", "orrery",
              "firework", "sprites", "plasma", "kaleido",
              "moire", "forest", "raymaze",
          }
          all_names = scene_names | continuous_names | {"spriteanim"}
          found = {p.stem for p in root.glob("*.c")}
          if found != all_names:
              raise SystemExit(
                  "demo member set changed: " +
                  repr(sorted(found ^ all_names))
              )

          frame_re = re.compile(
              r"n = d_frames\(argc, argv, [0-9]+\);"
          )
          loop_old = "        scene(f);\n        yield();\n"
          loop_new = (
              "        scene(f);\n"
              "        if (f + 1 < n) d_scene_break();\n"
              "        yield();\n"
          )
          for name in sorted(scene_names | continuous_names):
              path = root / f"{name}.c"
              src = path.read_text(encoding="ascii")
              hits = frame_re.findall(src)
              if len(hits) != 1:
                  raise SystemExit(f"{name}: d_frames preimage mismatch")
              default = 48 if name in scene_names else 240
              src = frame_re.sub(
                  f"n = d_frames(argc, argv, {default});",
                  src,
                  count=1,
              )
              if name in scene_names:
                  if src.count(loop_old) != 1:
                      raise SystemExit(f"{name}: scene loop mismatch")
                  src = src.replace(loop_old, loop_new)
              path.write_text(src, encoding="ascii", newline="\n")

          bad = []
          for path in sorted(root.glob("*.[ch]")):
              for number, line in enumerate(
                  path.read_text(encoding="ascii").splitlines(), 1
              ):
                  if len(line) > 64:
                      bad.append(f"{path}:{number}:{len(line)}")
          if bad:
              raise SystemExit("64-column violations: " + ", ".join(bad))
          PY

      - name: Regenerate deterministic graphics corpus
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          import struct
          import sys
          import zlib

          sys.path.insert(0, "compiler")
          import verify_graphics_demos as v

          def png_rgb(width, height, rgb):
              raw = bytearray()
              stride = width * 3
              for y in range(height):
                  raw.append(0)
                  raw.extend(rgb[y * stride:(y + 1) * stride])
              def chunk(kind, data):
                  body = kind + data
                  return (struct.pack(">I", len(data)) + body +
                          struct.pack(">I", zlib.crc32(body) & 0xffffffff))
              head = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)
              return (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", head) +
                      chunk(b"IDAT", zlib.compress(bytes(raw), 9)) +
                      chunk(b"IEND", b""))

          expect = v.load_expect()
          expect["helper_sha256"] = v.sha(v.SRC / "demoapi.h")
          frames = []
          for name, exp in expect["demos"].items():
              data = v.compile_bytes(name)
              (v.BIN / f"{name}.c48b").write_bytes(data)
              first = v.run_demo(name, 1)
              screen = v.run_demo(name, int(exp["frames"]))
              rgb = screen.render_rgb()
              png = v.png_bytes(rgb)
              (v.IMG / f"{name}.png").write_bytes(png)
              lit, attrs = v.screen_metrics(screen)
              exp["source_sha256"] = v.sha(v.SRC / f"{name}.c")
              exp["binary_sha256"] = v.sha_bytes(data)
              exp["first_screen_sha256"] = v.sha_bytes(first.bytes())
              exp["screen_sha256"] = v.sha_bytes(screen.bytes())
              exp["png_sha256"] = v.sha_bytes(png)
              exp["lit_pixels"] = lit
              exp["attribute_values"] = attrs
              frames.append(rgb)
          v.EXPECT_PATH.write_text(
              json.dumps(expect, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )

          cols, rows = 4, 6
          width, height = cols * 256, rows * 192
          sheet = bytearray(width * height * 3)
          for index, rgb in enumerate(frames):
              ox = (index % cols) * 256
              oy = (index // cols) * 192
              for y in range(192):
                  src = y * 256 * 3
                  dst = ((oy + y) * width + ox) * 3
                  sheet[dst:dst + 256 * 3] = rgb[src:src + 256 * 3]
          (v.IMG / "contact-sheet.png").write_bytes(
              png_rgb(width, height, bytes(sheet))
          )
          PY
          python -B compiler/verify_graphics_demos.py --static

      - name: Remove temporary workflow and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/demo-pacing-refresh.yml
          python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete pacing refresh
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/verify_graphics_demos.py --release
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune graphics demo pacing and scene breaks"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent demo change conflicts with pacing refresh" >&2
              exit 1
            fi
            python -B usr/src/ailmzx48/tooling/update_manifest.py
            git add MANIFEST.sha256
            git commit --amend --no-edit
            python -B compiler/verify_graphics_demos.py --release
            python -B compiler/verify_release.py
            git diff --check
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during push attempt $attempt" >&2
            sleep 2
          done
          echo "Could not fast-forward main after five races" >&2
          exit 1
