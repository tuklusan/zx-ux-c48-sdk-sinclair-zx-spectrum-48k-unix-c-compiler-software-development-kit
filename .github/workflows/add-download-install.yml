name: Add README download and install link

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-download-install.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Insert section and certify README
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "fc2c2132f1767939ae198bfa76c3424f6638606f"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          path = Path("README.md")
          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")

          anchor = "\n## Graphics showcase — 18 more C48 demos\n"
          block = (
              "\n## Download and install\n\n"
              "Download the SDK and see installation instructions on the [Latest release](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/releases/latest).\n"
          )

          if text.count(anchor) != 1:
              raise SystemExit(f"graphics showcase anchor count is {text.count(anchor)}, expected 1")
          if "## Download and install" in text:
              raise SystemExit("Download and install section already exists")

          candidate = text.replace(anchor, block + anchor, 1)
          candidate_bytes = candidate.encode("utf-8")

          # Insertion-only guard: removing the exact new block must reproduce the original bytes.
          if candidate.count(block) != 1:
              raise SystemExit("inserted block multiplicity mismatch")
          if candidate.replace(block, "", 1).encode("utf-8") != original:
              raise SystemExit("insertion-only guard failed")

          path.write_bytes(candidate_bytes)

          def validate(data: bytes, pass_no: int) -> None:
              walked = 0
              for line_no, line in enumerate(data.splitlines(keepends=True), 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at README line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")

              decoded = data.decode("utf-8", errors="strict")
              dh = decoded.index("## Download and install")
              gh = decoded.index("## Graphics showcase — 18 more C48 demos")
              if dh >= gh:
                  raise SystemExit(f"pass {pass_no}: download section is not before graphics showcase")
              if decoded.count("## Download and install") != 1:
                  raise SystemExit(f"pass {pass_no}: download heading count mismatch")
              sentence = "Download the SDK and see installation instructions on the [Latest release](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/releases/latest)."
              if decoded.count(sentence) != 1:
                  raise SystemExit(f"pass {pass_no}: download sentence mismatch")
              if decoded.count("releases/latest") != 1:
                  raise SystemExit(f"pass {pass_no}: latest-release link count mismatch")

              print(f"README SOP PASS {pass_no}: {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}")

          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/readme-download-sop-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY
          git diff --check -- README.md

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-download-install.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: add latest release download link"
          git push origin HEAD:main
