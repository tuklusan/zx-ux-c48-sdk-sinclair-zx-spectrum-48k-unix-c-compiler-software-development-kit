name: ailmzx48 SoP measured-authority clearance snapshot

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-final-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out frozen repaired tree
        uses: actions/checkout@v4
        with:
          ref: 42d1b1b85b98db322521b7fc9fd9d91253b20359
          lfs: true
          fetch-depth: 1

      - name: Freeze full release-gate support tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = \
            "42d1b1b85b98db322521b7fc9fd9d91253b20359"
          tar --exclude='./.git' -czf /tmp/SOP-GATE-TREE.tar.gz .
          sha256sum /tmp/SOP-GATE-TREE.tar.gz > \
            /tmp/SOP-GATE-TREE-SHA256.txt

      - name: Build immutable SoP surface manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > SOP-SOURCE-COMMIT.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib
          roots = [
              Path('LICENSE'), Path('MANIFEST.sha256'), Path('compiler'),
              Path('usr/bin/ailmzx48'), Path('usr/src/ailmzx48'),
              Path('.github/workflows/ailmzx48-maintenance.yml'),
              Path('.github/workflows/ailmzx48-training.yml'),
              Path('.github/workflows/verify.yml'),
          ]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(p for p in root.rglob('*') if p.is_file())
              else:
                  raise SystemExit('missing SoP surface root: ' + str(root))
          files = sorted(set(files), key=lambda p: p.as_posix())
          rows = []
          total = 0
          surface = hashlib.sha256()
          for path in files:
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              rel = path.as_posix()
              rows.append(f'{digest}  {len(data)}  {rel}')
              total += len(data)
              surface.update(rel.encode('utf-8'))
              surface.update(b'\0')
              surface.update(str(len(data)).encode('ascii'))
              surface.update(b'\0')
              surface.update(bytes.fromhex(digest))
          Path('SOP-SURFACE-SHA256.txt').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          Path('SOP-SURFACE-FINGERPRINT.txt').write_text(
              'source_commit=42d1b1b85b98db322521b7fc9fd9d91253b20359\n'
              f'file_count={len(files)}\n'
              f'total_bytes={total}\n'
              f'surface_sha256={surface.hexdigest()}\n',
              encoding='utf-8', newline='\n')
          print('file_count', len(files))
          print('total_bytes', total)
          print('surface_sha256', surface.hexdigest())
          PY
          cp /tmp/SOP-GATE-TREE.tar.gz .
          cp /tmp/SOP-GATE-TREE-SHA256.txt .

      - name: Upload immutable clearance surface
        uses: actions/upload-artifact@v4
        with:
          name: ailmzx48-sop-final-42d1b1b85b98db322521b7fc9fd9d91253b20359
          retention-days: 7
          if-no-files-found: error
          path: |
            SOP-SOURCE-COMMIT.txt
            SOP-SURFACE-SHA256.txt
            SOP-SURFACE-FINGERPRINT.txt
            SOP-GATE-TREE.tar.gz
            SOP-GATE-TREE-SHA256.txt
            LICENSE
            MANIFEST.sha256
            compiler
            usr/bin/ailmzx48
            usr/src/ailmzx48
            .github/workflows/ailmzx48-maintenance.yml
            .github/workflows/ailmzx48-training.yml
            .github/workflows/verify.yml
