name: One-shot ailmzx48 operator host correction

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-operator-hostfix.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Confirm exact ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4bf158e3780901953be47eeb0aa894445a3786df"
          test "$(git rev-parse HEAD^^)" = "7f1c53fb936767d94322ed9725fdb21a3fb91310"

      - name: Correct host/native build distinction
        shell: bash
        run: |
          set -euo pipefail
          python .github/ailmzx48-operator-hostfix.py

      - name: Remove temporary helpers and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/ailmzx48-operator-hostfix.py
          git rm .github/workflows/ailmzx48-operator-hostfix.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.').resolve()
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {rel.as_posix()}\n')
          (root / 'MANIFEST.sha256').write_text(
              ''.join(lines), encoding='ascii', newline='\n'
          )
          PY

      - name: Verify complete corrected repository
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push corrected design
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clarify ailmzx48 host and native build outputs"
          git push origin HEAD:main
