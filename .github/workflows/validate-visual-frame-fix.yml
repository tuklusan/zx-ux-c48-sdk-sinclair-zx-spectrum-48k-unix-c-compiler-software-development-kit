name: Validate visual frame-drop fix

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-visual-frame-fix.yml"

permissions:
  actions: write
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FIX_SHA: "278d13b6da2a29d55b6f8c3e8783d9646a572d51"
      FIX_TAG: "VISUAL-FRAME-FIX-VALIDATION"
    steps:
      - name: Check out dispatcher commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag exact verified fix tree
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "$FIX_TAG" "$FIX_SHA"
          git push --force origin "refs/tags/$FIX_TAG"
          test "$(git rev-list -n 1 "$FIX_TAG")" = "$FIX_SHA"

      - name: Dispatch canonical validation matrices
        shell: bash
        run: |
          set -euo pipefail
          for workflow in verify.yml graphics-demos.yml gui-desktop.yml; do
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="$FIX_TAG"
          done

      - name: Wait for exact-SHA validation runs
        shell: bash
        run: |
          set -euo pipefail
          workflows=(verify.yml graphics-demos.yml gui-desktop.yml)
          declare -A run_ids
          for attempt in $(seq 1 60); do
            ready=1
            for workflow in "${workflows[@]}"; do
              if [[ -n "${run_ids[$workflow]:-}" ]]; then
                continue
              fi
              id="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&per_page=20" \
                --jq ".workflow_runs[] | select(.head_sha == \"$FIX_SHA\") | .id" \
                | head -n 1)"
              if [[ -n "$id" ]]; then
                run_ids[$workflow]="$id"
                echo "$workflow run $id"
              else
                ready=0
              fi
            done
            [[ "$ready" -eq 1 ]] && break
            sleep 5
          done
          for workflow in "${workflows[@]}"; do
            [[ -n "${run_ids[$workflow]:-}" ]] || {
              echo "No exact-SHA run found for $workflow" >&2
              exit 1
            }
          done
          for attempt in $(seq 1 180); do
            pending=0
            failed=0
            for workflow in "${workflows[@]}"; do
              id="${run_ids[$workflow]}"
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id" --jq .status)"
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id" --jq '.conclusion // ""')"
              echo "$workflow $id status=$status conclusion=$conclusion"
              if [[ "$status" != "completed" ]]; then
                pending=1
              elif [[ "$conclusion" != "success" ]]; then
                failed=1
              fi
            done
            [[ "$failed" -eq 0 ]] || exit 1
            [[ "$pending" -eq 1 ]] || exit 0
            sleep 10
          done
          echo "Timed out waiting for canonical validation" >&2
          exit 1

      - name: Remove temporary validation tag and dispatcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git push origin ":refs/tags/$FIX_TAG" || true
          if [[ "${{ job.status }}" != "success" ]]; then
            exit 0
          fi
          git rm .github/workflows/validate-visual-frame-fix.yml
          git diff --exit-code "$FIX_SHA" -- .
          git config user.name "C48 visual-frame validator"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete visual frame fix validation"
          git push origin HEAD:main
