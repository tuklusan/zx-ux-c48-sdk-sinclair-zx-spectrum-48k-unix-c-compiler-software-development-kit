name: Finalize canonical manifest

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-manifest.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild target-state manifest from disk
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path(".")
          exclude = {
              "MANIFEST.sha256",
              ".github/workflows/finalize-manifest.yml",
          }
          rows = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              rel_text = rel.as_posix()
              if ".git" in rel.parts or rel_text in exclude:
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == ".bat":
                  data = data.replace(b"\r\n", b"\n")
              rows.append((rel_text, hashlib.sha256(data).hexdigest()))
          rows.sort()
          Path("MANIFEST.sha256").write_text(
              "".join(f"{digest}  {rel}\n" for rel, digest in rows),
              encoding="ascii",
              newline="\n",
          )
          print(f"TARGET MANIFEST ENTRIES: {len(rows)}")
          PY

      - name: Commit canonical manifest
        shell: bash
        run: |
          git config user.name "C48 manifest finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --check
          git commit -m "Refresh canonical manifest"
          git push origin HEAD:main
