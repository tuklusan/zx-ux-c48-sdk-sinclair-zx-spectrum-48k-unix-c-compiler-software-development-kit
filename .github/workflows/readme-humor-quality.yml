name: README prose and humor quality pass

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-humor-quality.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply restrained humor and audit prose
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "997ed6675b4b34d3a3950f432e3c1bb58f88655e"
          python -B - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib
          import re
          import shutil

          path = Path("README.md")
          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")
          native_url = "https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project"

          replacements = [
              (
                  f"**ZX-UX C48 SDK** is a portable, host-side **C compiler, virtual machine and software development kit** for writing and testing C48 programs for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native_url}). It runs on Windows, Linux and macOS, on Intel and Arm hosts, providing the desktop toolchain and Spectrum-facing services needed away from the original machine. It remains separate from native ZX-UX: this SDK is not the operating system, native Z80 compiler, linker, runtime or final ABI.",
                  f"**ZX-UX C48 SDK** is a portable, host-side **C compiler, virtual machine and software development kit** for writing and testing C48 programs for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native_url}). It runs on Windows, Linux and macOS, on Intel and Arm hosts, providing the desktop toolchain and Spectrum-facing services needed away from the original machine. This saves the 48K Spectrum from having to impersonate a modern workstation (a role for which it was never interviewed). The SDK remains separate from native ZX-UX: it is not the operating system, native Z80 compiler, linker, runtime or final ABI.",
              ),
              (
                  "The three hero images above and 18 demos below are rendered from the C48 VM's exact ZX Spectrum 48K bitmap/attribute screen state. Automated graphics verification renders every demo independently on GitHub-hosted Windows, Linux and macOS runners.",
                  "The three hero images above and 18 demos below are rendered from the C48 VM's exact ZX Spectrum 48K bitmap/attribute screen state—a remarkably small place in which to keep this much visual ambition. Automated graphics verification renders every demo independently on GitHub-hosted Windows, Linux and macOS runners.",
              ),
              (
                  "These documents cover portable compiler/runtime usage, technical architecture and security; the authoritative C48 language definition remains upstream in the native ZX-UX project.",
                  "These documents cover portable compiler/runtime usage, technical architecture and security, because even a 48K universe eventually develops paperwork. The authoritative C48 language definition remains upstream in the native ZX-UX project.",
              ),
              (
                  "`C48B1` is an SDK-only host executable representation. It is not Z80 machine code, ZX-UX `OBJ1`, or ZX-UX `MEX1`.",
                  "`C48B1` is an SDK-only host executable representation. It is not Z80 machine code, ZX-UX `OBJ1`, or ZX-UX `MEX1`—a distinction of the sort that seems pedantic right up until the moment it saves an afternoon.",
              ),
              (
                  "These games form a small cultural time capsule of what “computer games” meant around 1982—not replicas of any one historical library, but a compact cross-section of ideas and stories moving through mainframes, school labs, clubs and homes.",
                  "These games form a small cultural time capsule of what “computer games” meant around 1982—not replicas of any one historical library, but a compact cross-section of ideas and stories moving through mainframes, school labs, clubs and homes. It is nostalgia with source code attached, which is generally the more useful kind.",
              ),
              (
                  f"[ZX-UX]({native_url}) is the actual Unix-like operating and development environment for the original unexpanded 48K Sinclair ZX Spectrum. Its native compiler, linker, ABI, ROM bridge, persistence and process facilities are separate from this host SDK, whose role is C48 development and testing on modern computers.",
                  f"[ZX-UX]({native_url}) is the actual Unix-like operating and development environment for the original unexpanded 48K Sinclair ZX Spectrum. Its native compiler, linker, ABI, ROM bridge, persistence and process facilities are separate from this host SDK, whose role is C48 development and testing on modern computers. The distinction is deliberate; the machine is already constrained enough without making the terminology do two jobs as well.",
              ),
              (
                  "The games above capture the exploratory, playful side of early computing; these applications tell the other half of the story—the point at which personal computers were expected to be useful. Word processing and spreadsheets symbolized the shift from hobby machine to everyday work tool, while interactive graphics turned the screen into a place to design and manipulate rather than merely print results. By the early 1990s, writing, personal finance and visual experimentation were established parts of serious home computing.",
                  "The games above capture the exploratory, playful side of early computing; these applications tell the other half of the story—the point at which personal computers were expected to earn their keep. Word processing and spreadsheets symbolized the shift from hobby machine to everyday work tool, while interactive graphics turned the screen into a place to design and manipulate rather than merely print results. By the early 1990s, writing, personal finance and visual experimentation were established parts of serious home computing; the machine had, in effect, acquired a desk job.",
              ),
              (
                  "The runtime defaults to the SANYALnet Labs final 4x8 font:",
                  "The runtime defaults to the SANYALnet Labs final 4x8 font, where every pixel has a job and none has time for decorative flourishes:",
              ),
          ]

          candidate = text
          for old, new in replacements:
              count = candidate.count(old)
              if count != 1:
                  raise SystemExit(f"replacement source count {count}, expected 1: {old[:100]!r}")
              candidate = candidate.replace(old, new, 1)

          # Exact reversal guard: no changes outside the enumerated prose edits.
          reversed_text = candidate
          for old, new in reversed(replacements):
              if reversed_text.count(new) != 1:
                  raise SystemExit(f"replacement target not unique: {new[:100]!r}")
              reversed_text = reversed_text.replace(new, old, 1)
          if reversed_text.encode("utf-8") != original:
              raise SystemExit("replacement-only guard failed")

          path.write_bytes(candidate.encode("utf-8"))

          # Restraint guard: exactly the intended eight humorous turns, no accidental
          # repetition of any one device.
          humor_anchors = [
              "a role for which it was never interviewed",
              "a remarkably small place in which to keep this much visual ambition",
              "even a 48K universe eventually develops paperwork",
              "seems pedantic right up until the moment it saves an afternoon",
              "nostalgia with source code attached",
              "without making the terminology do two jobs as well",
              "the machine had, in effect, acquired a desk job",
              "every pixel has a job and none has time for decorative flourishes",
          ]
          for anchor in humor_anchors:
              if candidate.count(anchor) != 1:
                  raise SystemExit(f"humor restraint anchor mismatch: {anchor}")

          # Build visible prose for quality checks. Exclude license comment, fenced
          # code, Markdown image/source tables and headings; retain document-table
          # descriptions because those are reader-facing prose.
          visible = re.sub(r"<!--.*?-->", " ", candidate, flags=re.S)
          visible = re.sub(r"```.*?```", " ", visible, flags=re.S)
          visible = "\n".join(
              line for line in visible.splitlines()
              if not line.lstrip().startswith("|") and not line.startswith("#")
          )
          visible = re.sub(r"<[^>]+>", " ", visible)
          visible = re.sub(r"!\[([^\]]*)\]\([^)]+\)", r"\1", visible)
          visible = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", visible)
          visible = visible.replace("**", "").replace("`", "")
          visible = re.sub(r"\s+", " ", visible).strip()

          if re.search(r"\b([A-Za-z]+)\s+\1\b", visible, flags=re.I):
              raise SystemExit("doubled prose word detected")
          if "  " in visible:
              raise SystemExit("double prose space detected")

          tokens = re.findall(r"[A-Za-z0-9]+(?:[-+][A-Za-z0-9]+)*", visible.lower())
          grams = Counter(tuple(tokens[i:i+8]) for i in range(max(0, len(tokens)-7)))
          repeated8 = [(g, c) for g, c in grams.items() if c > 1]
          if repeated8:
              for g, c in repeated8[:20]:
                  print("REPEATED 8-GRAM", c, " ".join(g))
              raise SystemExit("repeated 8-word prose phrase detected")

          sentences = [s.strip() for s in re.split(r"(?<=[.!?])\s+", visible) if len(s.split()) >= 8]
          for idx, sentence in enumerate(sentences, 1):
              wc = len(sentence.split())
              if wc > 85:
                  raise SystemExit(f"sentence {idx} too long ({wc} words): {sentence}")

          overlaps = []
          for i in range(len(sentences)):
              a = set(re.findall(r"[a-z0-9]+", sentences[i].lower()))
              for j in range(i+1, len(sentences)):
                  b = set(re.findall(r"[a-z0-9]+", sentences[j].lower()))
                  union = a | b
                  score = len(a & b) / len(union) if union else 0.0
                  if score >= 0.35:
                      overlaps.append((score, i, j, sentences[i], sentences[j]))
          if overlaps:
              for score, i, j, a, b in sorted(overlaps, reverse=True)[:20]:
                  print(f"SEMANTIC-OVERLAP {score:.3f} S{i+1}/S{j+1}: {a} || {b}")
              raise SystemExit("sentence-level semantic repetition threshold exceeded")

          # Detect repeated three-word sentence openings, a common cadence defect.
          openings = Counter()
          for sentence in sentences:
              words = re.findall(r"[A-Za-z0-9]+", sentence.lower())
              if len(words) >= 3:
                  openings[tuple(words[:3])] += 1
          bad_openings = [(o, c) for o, c in openings.items() if c > 1]
          if bad_openings:
              for o, c in bad_openings:
                  print("REPEATED SENTENCE OPENING", c, " ".join(o))
              raise SystemExit("repeated three-word sentence opening detected")

          print(f"PROSE QUALITY: {len(sentences)} substantive sentences; no repeated 8-grams, no semantic pair >= 0.35, no sentence >85 words, no repeated 3-word openings")

          demos = ["torus", "sprites", "plasma", "spriteanim", "raymaze", "goblet", "tunnel", "city", "terrain", "ocean", "mobius", "morph3d", "warp", "galaxy", "orrery", "firework", "kaleido", "moire", "mandel", "julia", "forest"]
          games = ["advent", "arith", "bgammon", "chess", "cribbage", "fish", "fortune", "hangman", "maze", "quiz", "rogue", "snake", "trek", "wump"]
          apps = ["write48", "sheet48", "wire3d"]

          def validate(data: bytes, pass_no: int) -> None:
              lines = data.splitlines(keepends=True)
              walked = 0
              for line_no, line in enumerate(lines, 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")
              decoded = data.decode("utf-8", errors="strict")

              headings = [
                  "# ZX-UX C48 SDK — Portable C compiler and runtime for Sinclair ZX Spectrum 48K development",
                  "## Download and install",
                  "## ZX Spectrum 48K graphics showcase — 21 C48 demos",
                  "## Document Library",
                  "## C48 compiler and runtime features",
                  "## Games gallery — 14 C48 games",
                  "## Relationship to native ZX-UX",
                  "## Applications gallery — 3 C48 applications",
                  "## Runtime notes",
                  "## Source tree",
                  "## License and author",
              ]
              pos = []
              for h in headings:
                  if decoded.count(h) != 1:
                      raise SystemExit(f"pass {pass_no}: heading mismatch {h}")
                  pos.append(decoded.index(h))
              if pos != sorted(pos):
                  raise SystemExit(f"pass {pass_no}: section order changed")

              linked_first = f"for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native_url})."
              if decoded.count(linked_first) != 1 or decoded.count("**ZX-UX Unix on the Sinclair ZX Spectrum 48K**") != 1:
                  raise SystemExit(f"pass {pass_no}: native project first-link invariant failed")

              for name in demos:
                  if decoded.count(f"usr/src/demos/{name}.c") != 1:
                      raise SystemExit(f"pass {pass_no}: demo source mismatch {name}")
              for name in games:
                  if decoded.count(f"usr/src/games/{name}.c") != 1:
                      raise SystemExit(f"pass {pass_no}: game source mismatch {name}")
              for name in apps:
                  if decoded.count(f"usr/src/apps/{name}.c") != 1:
                      raise SystemExit(f"pass {pass_no}: app source mismatch {name}")

              g0 = decoded.index("## Games gallery — 14 C48 games")
              r0 = decoded.index("## Relationship to native ZX-UX", g0)
              a0 = decoded.index("## Applications gallery — 3 C48 applications", r0)
              rt0 = decoded.index("## Runtime notes", a0)
              gsec = decoded[g0:r0]
              asec = decoded[a0:rt0]
              if not (gsec.index("By then **Adventure**") < gsec.index("| ![C48 Adventure]") < gsec.index("The quieter side of that culture")):
                  raise SystemExit(f"pass {pass_no}: games prose/gallery order changed")
              if not (asec.index("The games above capture") < asec.index("| ![WRITE48]") < asec.index("**WRITE48** evokes")):
                  raise SystemExit(f"pass {pass_no}: apps prose/gallery order changed")
              if "Ubuntu 24.04/x64" in gsec or "Ubuntu 24.04/x64" in asec:
                  raise SystemExit(f"pass {pass_no}: game/app architecture labels returned")
              for arch in ("Ubuntu 24.04/x64", "Windows Server 2025/x64", "macOS 26/Arm64"):
                  if arch not in decoded[:g0]:
                      raise SystemExit(f"pass {pass_no}: demo architecture evidence missing {arch}")

              # First textual mention of each game remains bold in the games prose/table flow.
              game_display = ["Adventure", "Hunt the Wumpus", "Star Trek", "Rogue", "Chess", "Backgammon", "Cribbage", "Go Fish", "Hangman", "Maze", "Quiz", "Arithmetic", "Fortune", "Snake"]
              for game in game_display:
                  plain = decoded.find(game, g0, r0)
                  bold = decoded.find(f"**{game}**", g0, r0)
                  if plain < 0 or bold < 0 or plain != bold + 2:
                      raise SystemExit(f"pass {pass_no}: first game occurrence not bold: {game}")

              for anchor in humor_anchors:
                  if decoded.count(anchor) != 1:
                      raise SystemExit(f"pass {pass_no}: humor anchor drift: {anchor}")

              print(f"README SOP PASS {pass_no}: {len(data)} bytes, {len(lines)} lines, sha256={hashlib.sha256(data).hexdigest()}")

          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/readme-humor-quality-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY
          git diff --check -- README.md

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/readme-humor-quality.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: add restrained dry humor"
          git push origin HEAD:main
