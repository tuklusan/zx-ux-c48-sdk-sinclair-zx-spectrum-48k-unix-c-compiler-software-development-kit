name: Apply 1.0.2 version

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-102-version.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Apply version
        shell: python
        run: |
          from pathlib import Path
          import json

          replacements = {
              "VERSION": [("1.0.1\n", "1.0.2\n")],
              "compiler/c48/__init__.py": [('__version__ = "1.0.1"', '__version__ = "1.0.2"')],
              "compiler/c48.py": [('SDK_VERSION = "1.0.1"', 'SDK_VERSION = "1.0.2"')],
              "compiler/c48run.py": [('SDK_VERSION = "1.0.1"', 'SDK_VERSION = "1.0.2"')],
              "compiler/verify_gui_desktop.py": [('c48run 1.0.1', 'c48run 1.0.2')],
              "compiler/GUI-SMOKE-TESTS.md": [('1.0.1', '1.0.2')],
              "compiler/tests/test_c48srctap.py": [('c48srctap 1.0.1', 'c48srctap 1.0.2')],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit("version marker missing: " + name)
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          exp_path = Path("compiler/release_expectations.json")
          exp = json.loads(exp_path.read_text(encoding="ascii"))
          if exp.get("version") != "1.0.1" or exp.get("test_count") != 371:
              raise SystemExit("unexpected release expectations")
          exp["version"] = "1.0.2"
          exp_path.write_text(
              json.dumps(exp, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )

      - name: Verify source tree
        run: python -B compiler/verify_release.py

      - name: Commit version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git add VERSION compiler
          git diff --cached --check
          git commit -m "Set release version 1.0.2"
          git push origin main
