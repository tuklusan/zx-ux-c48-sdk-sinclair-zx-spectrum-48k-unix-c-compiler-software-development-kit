name: Finalize GUI screenshot refresh

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-gui-screenshots.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh-gui-screenshots-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "35112503533"
      SOURCE_SHA: "41d130e489638dd07ba3305eea41517e0ec3b32f"
      SOURCE_DIR: "/tmp/gui-source"
      EXPECTED_JSON: "/tmp/gui-expected.json"

    steps:
      - name: Check out current main with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Download exact certified GUI release evidence
        uses: actions/download-artifact@v4
        with:
          name: gui-release-evidence-${{ env.SOURCE_SHA }}
          path: ${{ env.SOURCE_DIR }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate checked-in PNGs against RC5 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["SOURCE_DIR"])
          source_sha = os.environ["SOURCE_SHA"]
          expected_json = Path(os.environ["EXPECTED_JSON"])

          sums = root / "SHA256SUMS"
          manifest = root / "RELEASE-GUI-EVIDENCE.json"
          for line in sums.read_text(encoding="ascii").splitlines():
              digest, rel = line.split("  ", 1)
              path = root / rel
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"GUI finalize: evidence checksum mismatch: {rel}")

          metadata = json.loads(manifest.read_text(encoding="ascii"))
          if metadata.get("commit") != source_sha:
              raise SystemExit("GUI finalize: evidence commit mismatch")

          runners = (
              "ubuntu-latest",
              "windows-latest",
              "macos-latest",
              "macos-15-intel",
          )
          pythons = ("3.10", "3.13")
          names = (
              "forest-canvas.png",
              "forest-desktop.png",
              "fortune-canvas.png",
              "fortune-desktop.png",
              "snake-canvas.png",
              "snake-desktop.png",
              "visual-progression-canvas.png",
              "visual-progression-desktop.png",
          )
          expected = {}
          for runner in runners:
              for py in pythons:
                  source = root / f"gui-desktop-{runner}-py{py}-{source_sha}"
                  target = Path("screenshots/gui-desktop") / runner / f"python-{py}"
                  if sorted(p.name for p in source.glob("*.png")) != sorted(names):
                      raise SystemExit(f"GUI finalize: source PNG set drift: {source}")
                  if sorted(p.name for p in target.glob("*.png")) != sorted(names):
                      raise SystemExit(f"GUI finalize: target PNG set drift: {target}")
                  for name in names:
                      rel = (target / name).as_posix()
                      digest = hashlib.sha256((source / name).read_bytes()).hexdigest()
                      if hashlib.sha256(Path(rel).read_bytes()).hexdigest() != digest:
                          raise SystemExit(f"GUI finalize: checked-in byte mismatch: {rel}")
                      expected[rel] = digest
          if len(expected) != 64:
              raise SystemExit(f"GUI finalize: expected 64 PNGs, got {len(expected)}")
          expected_json.write_text(
              json.dumps(expected, indent=2, sort_keys=True) + "\n",
              encoding="ascii",
              newline="\n",
          )
          print("GUI finalize: all 64 retained PNGs match certified RC5 evidence")
          PY

      - name: Remove temporary refresh workflow and push final head
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-gui-screenshots.yml
          git diff --cached --check
          python -B compiler/verify_release.py
          git commit -m "Remove temporary GUI screenshot refresh workflow"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Three successive SoP scans from final remote head
        shell: bash
        env:
          TARGET_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            scan="/tmp/final-sop-${pass}"
            rm -rf "$scan"
            GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$scan"
            git -C "$scan" lfs pull
            test "$(git -C "$scan" rev-parse HEAD)" = "$TARGET_SHA"
            EXPECTED_JSON="$EXPECTED_JSON" SCAN_DIR="$scan" PASS="$pass" python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["SCAN_DIR"])
          expected = json.loads(Path(os.environ["EXPECTED_JSON"]).read_text(encoding="ascii"))
          actual = sorted(
              p.relative_to(root).as_posix()
              for p in (root / "screenshots/gui-desktop").glob("*/python-*/*.png")
          )
          if actual != sorted(expected):
              raise SystemExit(f"Final SoP pass {os.environ['PASS']}: PNG file set mismatch")
          for rel, digest in expected.items():
              if hashlib.sha256((root / rel).read_bytes()).hexdigest() != digest:
                  raise SystemExit(
                      f"Final SoP pass {os.environ['PASS']}: byte mismatch: {rel}"
                  )
          print(f"Final SoP pass {os.environ['PASS']}: 64 PNGs byte-exact")
          PY
            (cd "$scan" && python -B compiler/verify_release.py)
            test -z "$(git -C "$scan" status --porcelain)"
          done
