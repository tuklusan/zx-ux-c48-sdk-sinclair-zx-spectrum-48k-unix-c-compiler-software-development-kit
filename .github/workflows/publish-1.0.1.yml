name: Publish certified 1.0.1 release

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.0.1.yml"

permissions:
  contents: write
  actions: write

env:
  TARGET_SHA: d4b91f67aa6f052180b64d324411f405334fde1b
  TARGET_TREE: 2dbf6413d1f692244d0a5dc9efad9afb32b0b64a
  TEMP_TAG: _release-1-0-1-target
  RC_TAG: 1.0.1-RC1
  FINAL_TAG: 1.0.1
  OLD_TAG: 1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Prepare exact target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${TARGET_SHA}" --jq .content | base64 -d | tr -d '\r\n')"
          test "${version}" = "${FINAL_TAG}"
          tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq .tree.sha)"
          test "${tree}" = "${TARGET_TREE}"

          gh run cancel 36343131519 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || true

          if gh release view "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          else
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RC_TAG}" >/dev/null 2>&1 || true
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}" >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"             -f ref="refs/tags/${TEMP_TAG}" -f sha="${TARGET_SHA}" >/dev/null

      - name: Dispatch exact-target recertification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/release-recertify.yml/dispatches"             -f ref="${TEMP_TAG}" >/dev/null

      - name: Wait for exact-target recertification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "release-recertify.yml/runs"
              f"?head_sha={target}&event=workflow_dispatch&per_page=20"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "zx-ux-c48-release-publisher",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.monotonic() + 5 * 60 * 60
          while time.monotonic() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              runs = [
                  item for item in data.get("workflow_runs", [])
                  if item.get("head_sha") == target
                  and item.get("event") == "workflow_dispatch"
              ]
              runs.sort(
                  key=lambda item: int(item.get("run_number", 0)),
                  reverse=True,
              )
              if runs:
                  run = runs[0]
                  print(
                      f"run={run['id']} status={run.get('status')} "
                      f"conclusion={run.get('conclusion')}",
                      flush=True,
                  )
                  if run.get("status") == "completed":
                      if run.get("conclusion") != "success":
                          raise SystemExit(
                              "exact-target recertification did not pass"
                          )
                      Path("recertify-run.txt").write_text(
                          f"{run['id']}\n",
                          encoding="ascii",
                      )
                      break
              time.sleep(20)
          else:
              raise SystemExit("timed out waiting for recertification")
          PY

      - name: Download certified prerelease bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}" --jq .object.sha)"
          test "${resolved}" = "${TARGET_SHA}"
          MAIN_RC="zx-ux-c48-sdk-${RC_TAG}-${TARGET_SHA}.zip"
          GUI_RC="c48-${RC_TAG}-gui-evidence-${TARGET_SHA}.zip"
          mkdir -p rc
          gh release download "${RC_TAG}" --repo "${GITHUB_REPOSITORY}"             --pattern "${MAIN_RC}"             --pattern "${GUI_RC}"             --pattern "RC1-RELEASE-METADATA.json"             --pattern "SHA256SUMS-${RC_TAG}.txt"             --dir rc
          test -s "rc/${MAIN_RC}"
          test -s "rc/${GUI_RC}"
          test -s "rc/RC1-RELEASE-METADATA.json"
          test -s "rc/SHA256SUMS-${RC_TAG}.txt"

      - name: Prepare final assets
        shell: bash
        run: |
          set -euo pipefail
          MAIN_RC="zx-ux-c48-sdk-${RC_TAG}-${TARGET_SHA}.zip"
          GUI_RC="c48-${RC_TAG}-gui-evidence-${TARGET_SHA}.zip"
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${TARGET_SHA}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${TARGET_SHA}.zip"
          cp "rc/${MAIN_RC}" "${MAIN_FINAL}"
          cp "rc/${GUI_RC}" "${GUI_FINAL}"
          MAIN_FINAL="${MAIN_FINAL}" GUI_FINAL="${GUI_FINAL}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          data = {
              "schema": 5,
              "release": os.environ["FINAL_TAG"],
              "release_commit": os.environ["TARGET_SHA"],
              "release_tree": os.environ["TARGET_TREE"],
              "recertification_run": int(
                  Path("recertify-run.txt").read_text(
                      encoding="ascii"
                  ).strip()
              ),
              "application_count": 4,
              "demo_count": 24,
              "change": (
                  "Add GP82 Grand Prix 1982 grouped-bar and pie-chart "
                  "application with certified image evidence."
              ),
              "assets": {
                  os.environ["MAIN_FINAL"]: sha(os.environ["MAIN_FINAL"]),
                  os.environ["GUI_FINAL"]: sha(os.environ["GUI_FINAL"]),
              },
          }
          Path("RELEASE-METADATA-1.0.1.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY
          META="RELEASE-METADATA-1.0.1.json"
          SUMS="SHA256SUMS-1.0.1.txt"
          {
            sha256sum "${MAIN_FINAL}"
            sha256sum "${GUI_FINAL}"
            sha256sum "${META}"
          } > "${SUMS}"
          run_id="$(cat recertify-run.txt)"
          cat > release-notes.md <<EOF
          # C48 SDK 1.0.1

          This certified release adds **GP82 — Grand Prix 1982** to the
          applications corpus. GP82 renders grouped wins, podiums and poles
          beside a 16-race constructor-win pie chart, with checked-in visual
          evidence under `docs/images/apps`.

          The applications gallery now contains four certified programs.
          The README and project documentation were swept for consistency,
          and the tracked scratch workspace was cleared before release.

          Exact release commit: `${TARGET_SHA}`
          Exact release tree: `${TARGET_TREE}`
          Recertification run: `${run_id}`

          Certification includes the full SDK matrix, numerical sound proof,
          host-native desktop acceptance, graphics reel, recursive-demo proof,
          release packaging, fresh-filesystem verification and virgin-package
          verification.

          Main package: `${MAIN_FINAL}`

          Requires Python 3.10 or newer.
          EOF

      - name: Publish final 1.0.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${TARGET_SHA}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${TARGET_SHA}.zip"
          META="RELEASE-METADATA-1.0.1.json"
          SUMS="SHA256SUMS-1.0.1.txt"

          if gh release view "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FINAL_TAG}" --jq .object.sha)"
            test "${resolved}" = "${TARGET_SHA}"
          else
            gh release create "${FINAL_TAG}"               --repo "${GITHUB_REPOSITORY}"               --target "${TARGET_SHA}"               --title "C48 SDK 1.0.1"               --notes-file release-notes.md               --latest
          fi

          gh release upload "${FINAL_TAG}"             "${MAIN_FINAL}" "${GUI_FINAL}" "${META}" "${SUMS}"             --repo "${GITHUB_REPOSITORY}" --clobber

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" --jq .id)"
          body="$(cat release-notes.md)"
          gh api --method PATCH             "repos/${GITHUB_REPOSITORY}/releases/${release_id}"             -f tag_name="${FINAL_TAG}"             -f target_commitish="${TARGET_SHA}"             -f name="C48 SDK 1.0.1"             -f body="${body}"             -F draft=false -F prerelease=false -f make_latest=true >/dev/null

      - name: Verify final release and replace 1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${TARGET_SHA}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${TARGET_SHA}.zip"
          META="RELEASE-METADATA-1.0.1.json"
          SUMS="SHA256SUMS-1.0.1.txt"

          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FINAL_TAG}" --jq .object.sha)"
          test "${resolved}" = "${TARGET_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" > published.json
          MAIN_FINAL="${MAIN_FINAL}" GUI_FINAL="${GUI_FINAL}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          release = json.loads(
              Path("published.json").read_text(encoding="utf-8")
          )
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("final release state is not normal")
          if release.get("tag_name") != os.environ["FINAL_TAG"]:
              raise SystemExit("final release tag mismatch")
          if release.get("target_commitish") != os.environ["TARGET_SHA"]:
              raise SystemExit("final release target mismatch")
          expected = {
              os.environ["MAIN_FINAL"]: sha(os.environ["MAIN_FINAL"]),
              os.environ["GUI_FINAL"]: sha(os.environ["GUI_FINAL"]),
              "RELEASE-METADATA-1.0.1.json": sha(
                  "RELEASE-METADATA-1.0.1.json"
              ),
              "SHA256SUMS-1.0.1.txt": sha("SHA256SUMS-1.0.1.txt"),
          }
          actual = {}
          for asset in release.get("assets", []):
              digest = str(asset.get("digest") or "")
              if digest.startswith("sha256:"):
                  actual[str(asset["name"])] = digest.split(":", 1)[1]
          if actual != expected:
              raise SystemExit(
                  f"final asset set or digest mismatch: {actual}"
              )
          print("FINAL 1.0.1 RELEASE VERIFY PASS")
          PY

          if gh release view "${OLD_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${OLD_TAG}"               --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          else
            gh api --method DELETE               "repos/${GITHUB_REPOSITORY}/git/refs/tags/${OLD_TAG}"               >/dev/null 2>&1 || true
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${OLD_TAG}" >/dev/null 2>&1; then
            echo "superseded release still exists" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${OLD_TAG}" >/dev/null 2>&1; then
            echo "superseded tag still exists" >&2
            exit 1
          fi

          gh release delete "${RC_TAG}"             --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          gh api --method DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}"             >/dev/null 2>&1 || true
