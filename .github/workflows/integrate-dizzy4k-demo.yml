name: Integrate Dizzy 4K demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-dizzy4k-demo.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build certified non-plasma capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("usr/src/demos/dizzy4k.c")
          text = path.read_text(encoding="utf-8")
          old = '''    caption("FOR YOU", "DIZZY");
              for (f = 0; f < n; f++) yield();
          }
          '''
          new = '''    caption("FOR YOU", "DIZZY");
              for (f = 0; f < n; f++) yield();
              hero_frame(n);
              yield();
          }
          '''
          if old not in text:
              raise SystemExit("hero-scene patch anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

          python -B compiler/c48.py usr/src/demos/dizzy4k.c
          python -B compiler/c48run.py --headless --time-quota 45             --dump-screen /tmp/dizzy4k-first.scr usr/bin/demos/dizzy4k.c48b 1
          python -B compiler/c48run.py --headless --time-quota 45             --dump-screen /tmp/dizzy4k-main.scr usr/bin/demos/dizzy4k.c48b 2

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          sys.path.insert(0, str(Path("compiler").resolve()))
          from c48.screen import Font4x8, ZXScreen
          from verify_graphics_demos import png_bytes, screen_metrics

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          font = Font4x8.load(Path("compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin"))
          first_data = Path("/tmp/dizzy4k-first.scr").read_bytes()
          main_data = Path("/tmp/dizzy4k-main.scr").read_bytes()
          if len(first_data) != 6912 or len(main_data) != 6912:
              raise SystemExit("screen dump size mismatch")

          screen = ZXScreen(font)
          screen.mem[:] = main_data
          png = png_bytes(screen.render_rgb())
          image = Path("docs/images/demos/dizzy4k.png")
          image.write_bytes(png)
          lit, attrs = screen_metrics(screen)

          expect_path = Path("compiler/graphics_demo_expectations.json")
          expect = json.loads(expect_path.read_text(encoding="ascii"))
          expect["demos"]["dizzy4k"] = {
              "title": "Dizzy 4K (C48 Port)",
              "runner": "ubuntu-latest",
              "architecture": "x64",
              "frames": 2,
              "stress_frames": 6,
              "source_sha256": sha("usr/src/demos/dizzy4k.c"),
              "binary_sha256": sha("usr/bin/demos/dizzy4k.c48b"),
              "first_screen_sha256": hashlib.sha256(first_data).hexdigest(),
              "screen_sha256": hashlib.sha256(main_data).hexdigest(),
              "png_sha256": hashlib.sha256(png).hexdigest(),
              "lit_pixels": lit,
              "attribute_values": attrs,
          }
          expect_path.write_text(
              json.dumps(expect, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )
          print(json.dumps(expect["demos"]["dizzy4k"], indent=2))
          PY

      - name: Refresh graphics corpus and README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old!r}")
              if count is None:
                  text = text.replace(old, new)
              else:
                  text = text.replace(old, new, count)
              p.write_text(text, encoding="utf-8", newline="\n")

          replace_required(
              "compiler/verify_graphics_demos.py",
              '!= 21:',
              '!= 22:',
          )
          replace_required(
              "compiler/verify_graphics_demos.py",
              'exactly 21',
              'exactly 22',
          )
          replace_required(
              "compiler/verify_graphics_demos.py",
              '21 demos',
              '22 demos',
          )
          replace_required(
              "compiler/verify_release.py",
              'GRAPHICS DEMO VERIFY PASS: 21 demos',
              'GRAPHICS DEMO VERIFY PASS: 22 demos',
          )

          g = Path(".github/workflows/graphics-demos.yml")
          text = g.read_text(encoding="utf-8")
          pairs = [
              ("fan out into 21 runners", "fan out into 22 runners"),
              ("max-parallel: 21", "max-parallel: 22"),
              ('          - {demo: raymaze, os: macos-latest}\n',
               '          - {demo: raymaze, os: macos-latest}\n'
               '          - {demo: dizzy4k, os: ubuntu-latest}\n'),
              ('expected = {".c48b": 21, ".scr": 21, ".png": 21, ".json": 21}',
               'expected = {".c48b": 22, ".scr": 22, ".png": 22, ".json": 22}'),
              ('"demo_count": 21', '"demo_count": 22'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f"missing graphics workflow anchor: {old!r}")
              text = text.replace(old, new, 1)
          g.write_text(text, encoding="utf-8", newline="\n")

          r = Path(".github/workflows/release-recertify.yml")
          text = r.read_text(encoding="utf-8")
          old = "21-demo graphics gate"
          if old not in text:
              raise SystemExit("release recertification count anchor missing")
          r.write_text(
              text.replace(old, "22-demo graphics gate", 1),
              encoding="utf-8",
              newline="\n",
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pairs = [
              ("## ZX Spectrum 48K graphics showcase — 21 C48 demos",
               "## ZX Spectrum 48K graphics showcase — 22 C48 demos"),
              ("The three hero images above and 18 demos below",
               "The three hero images above and 19 demos below"),
              ("A [combined contact sheet of all 21 ZX Spectrum graphics demos]",
               "A [combined contact sheet of all 22 ZX Spectrum graphics demos]"),
              ("usr/src/demos/                21 graphics demos",
               "usr/src/demos/                22 graphics demos"),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f"missing README anchor: {old!r}")
              text = text.replace(old, new, 1)

          anchor = '| <sub>Ubuntu 24.04/x64 · <a href="usr/src/demos/mandel.c">mandel.c</a></sub> | <sub>Windows Server 2025/x64 · <a href="usr/src/demos/julia.c">julia.c</a></sub> | <sub>macOS 26/Arm64 · <a href="usr/src/demos/forest.c">forest.c</a></sub> |'
          addition = anchor + '\n' +               '| ![Dizzy 4K C48 port hero phase](docs/images/demos/dizzy4k.png)<br>**Dizzy 4K (C48 Port)** |  |  |\n' +               '| <sub>Ubuntu 24.04/x64 · <a href="usr/src/demos/dizzy4k.c">dizzy4k.c</a></sub> |  |  |'
          if anchor not in text:
              raise SystemExit("README demo-table anchor missing")
          text = text.replace(anchor, addition, 1)
          readme.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Refresh demo contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image, ImageDraw, ImageFont

          root = Path("docs/images/demos")
          expect = json.loads(
              Path("compiler/graphics_demo_expectations.json").read_text(encoding="ascii")
          )
          names = list(expect["demos"])
          cols = 3
          cell_w = 384
          shot_h = 288
          label_h = 34
          rows = (len(names) + cols - 1) // cols
          sheet = Image.new("RGB", (cols * cell_w, rows * (shot_h + label_h)), (0, 0, 0))
          draw = ImageDraw.Draw(sheet)
          try:
              font = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 18
              )
          except OSError:
              font = ImageFont.load_default()

          for index, name in enumerate(names):
              shot = Image.open(root / f"{name}.png").convert("RGB")
              shot = shot.resize((cell_w, shot_h), Image.Resampling.NEAREST)
              x = (index % cols) * cell_w
              y = (index // cols) * (shot_h + label_h)
              sheet.paste(shot, (x, y))
              title = expect["demos"][name]["title"]
              draw.text((x + 8, y + shot_h + 7), title, fill=(255, 255, 255), font=font)

          sheet.save(root / "contact-sheet.png", optimize=True)
          PY

      - name: Verify corpus and stage exact release delta
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/verify_graphics_demos.py --static
          python -B compiler/check_license_headers.py
          rm .github/workflows/integrate-dizzy4k-demo.yml
          git add             usr/src/demos/dizzy4k.c             usr/bin/demos/dizzy4k.c48b             docs/images/demos/dizzy4k.png             docs/images/demos/contact-sheet.png             compiler/graphics_demo_expectations.json             compiler/verify_graphics_demos.py             compiler/verify_release.py             .github/workflows/graphics-demos.yml             .github/workflows/release-recertify.yml             README.md             .github/workflows/integrate-dizzy4k-demo.yml
          python -B compiler/check_project_banned_words.py
          git diff --cached --check
          git diff --cached --name-only

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git commit -m "feat: certify Dizzy 4K demo"
          git push origin HEAD:main
