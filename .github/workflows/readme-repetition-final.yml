name: README repetition audit final

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-repetition-final.yml"

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Final repetition correction and SoP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "3b0ba74626b6604a646ffc981fd8a68d6ec2e6ce"
          python -B - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib
          import re
          import shutil

          path = Path("README.md")
          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")
          old = "For detailed Float5 and BEEP behavior, error conventions and host/native boundaries, see the [ZX-UX C48 SDK Technical Reference](docs/ZX-UX%20C48%20SDK%20Technical%20Reference.docx)."
          new = "For BEEP details and error conventions beyond this summary, see the [ZX-UX C48 SDK Technical Reference](docs/ZX-UX%20C48%20SDK%20Technical%20Reference.docx)."
          if text.count(old) != 1 or new in text:
              raise SystemExit("final correction source/target mismatch")
          candidate = text.replace(old, new, 1)
          if candidate.replace(new, old, 1).encode("utf-8") != original:
              raise SystemExit("single-replacement guard failed")
          path.write_bytes(candidate.encode("utf-8"))

          # Re-run the visible-prose duplication checks after the final correction.
          visible = re.sub(r"<!--.*?-->", " ", candidate, flags=re.S)
          visible = re.sub(r"```.*?```", " ", visible, flags=re.S)
          visible = "\n".join(line for line in visible.splitlines() if not line.lstrip().startswith("|") and not line.startswith("#"))
          visible = re.sub(r"<[^>]+>", " ", visible)
          visible = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", visible)
          visible = visible.replace("**", "").replace("`", "")
          tokens = re.findall(r"[A-Za-z0-9]+(?:[-+][A-Za-z0-9]+)*", visible.lower())
          grams = Counter(tuple(tokens[i:i+8]) for i in range(max(0, len(tokens)-7)))
          repeated8 = [(g, c) for g, c in grams.items() if c > 1]
          if repeated8:
              for g, c in repeated8[:20]:
                  print("REPEATED 8-GRAM", c, " ".join(g))
              raise SystemExit("repeated 8-word prose phrase detected")

          prose = re.sub(r"\s+", " ", visible).strip()
          sentences = [s.strip() for s in re.split(r"(?<=[.!?])\s+", prose) if len(s.split()) >= 9]
          overlaps = []
          for i in range(len(sentences)):
              a = set(re.findall(r"[a-z0-9]+", sentences[i].lower()))
              for j in range(i+1, len(sentences)):
                  b = set(re.findall(r"[a-z0-9]+", sentences[j].lower()))
                  u = a | b
                  score = len(a & b) / len(u) if u else 0.0
                  if score >= 0.35:
                      overlaps.append((score, i, j, sentences[i], sentences[j]))
          if overlaps:
              for score, i, j, a, b in sorted(overlaps, reverse=True)[:20]:
                  print(f"SEMANTIC-OVERLAP {score:.3f} S{i+1}/S{j+1}: {a} || {b}")
              raise SystemExit("sentence-level semantic repetition threshold exceeded")
          print("VISIBLE PROSE REPETITION AUDIT: no repeated 8-grams and no sentence pair >= 0.35 Jaccard overlap")

          native_url = "https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project"
          def validate(data: bytes, pass_no: int) -> None:
              lines = data.splitlines(keepends=True)
              walked = 0
              for line_no, line in enumerate(lines, 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")
              decoded = data.decode("utf-8", errors="strict")
              linked_first = f"for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native_url})."
              if decoded.count(linked_first) != 1:
                  raise SystemExit(f"pass {pass_no}: first native-project occurrence/link mismatch")
              if decoded.count("**ZX-UX Unix on the Sinclair ZX Spectrum 48K**") != 1:
                  raise SystemExit(f"pass {pass_no}: duplicated long native-project phrase")
              if decoded.count(new) != 1 or old in decoded:
                  raise SystemExit(f"pass {pass_no}: final runtime pointer mismatch")

              headings = [
                  "# ZX-UX C48 SDK — Portable C compiler and runtime for Sinclair ZX Spectrum 48K development",
                  "## Download and install",
                  "## ZX Spectrum 48K graphics showcase — 21 C48 demos",
                  "## Document Library",
                  "## C48 compiler and runtime features",
                  "## Games gallery — 14 C48 games",
                  "## Relationship to native ZX-UX",
                  "## Applications gallery — 3 C48 applications",
                  "## Runtime notes",
                  "## Source tree",
                  "## License and author",
              ]
              positions = []
              for h in headings:
                  if decoded.count(h) != 1:
                      raise SystemExit(f"pass {pass_no}: heading count mismatch: {h}")
                  positions.append(decoded.index(h))
              if positions != sorted(positions):
                  raise SystemExit(f"pass {pass_no}: section order changed")

              g0 = decoded.index("## Games gallery — 14 C48 games")
              r0 = decoded.index("## Relationship to native ZX-UX", g0)
              a0 = decoded.index("## Applications gallery — 3 C48 applications", r0)
              rt0 = decoded.index("## Runtime notes", a0)
              gsec = decoded[g0:r0]
              asec = decoded[a0:rt0]
              if not (gsec.index("By then **Adventure**") < gsec.index("| ![C48 Adventure]") < gsec.index("The quieter side of that culture")):
                  raise SystemExit(f"pass {pass_no}: games prose/gallery order changed")
              if not (asec.index("The games above capture") < asec.index("| ![WRITE48]") < asec.index("**WRITE48** evokes")):
                  raise SystemExit(f"pass {pass_no}: apps prose/gallery order changed")
              if "Ubuntu 24.04/x64" in gsec or "Ubuntu 24.04/x64" in asec:
                  raise SystemExit(f"pass {pass_no}: game/app architecture labels returned")
              for arch in ("Ubuntu 24.04/x64", "Windows Server 2025/x64", "macOS 26/Arm64"):
                  if arch not in decoded[:g0]:
                      raise SystemExit(f"pass {pass_no}: demo architecture evidence missing: {arch}")

              print(f"README FINAL SOP PASS {pass_no}: {len(data)} bytes, {len(lines)} lines, sha256={hashlib.sha256(data).hexdigest()}")

          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/readme-repetition-final-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY
          git diff --check -- README.md

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/readme-repetition-final.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: finish repetition audit"
          git push origin HEAD:main
