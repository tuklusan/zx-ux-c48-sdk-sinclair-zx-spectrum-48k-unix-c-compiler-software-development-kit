name: Land Batch-5A graphics fixes v2

"on":
  push:
    branches: [main]
    paths:
      - ".github/land_batch5a_v2.py"
      - ".github/land_batch5a_fast.py"
      - ".github/workflows/land-batch5a-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    name: ${{ matrix.demo }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        include:
          - {demo: goblet, os: ubuntu-latest}
          - {demo: tunnel, os: windows-latest}
          - {demo: city, os: ubuntu-latest}
          - {demo: terrain, os: windows-latest}
          - {demo: ocean, os: macos-latest}
          - {demo: torus, os: ubuntu-latest}
          - {demo: mobius, os: windows-latest}
          - {demo: morph3d, os: macos-latest}
          - {demo: warp, os: ubuntu-latest}
          - {demo: galaxy, os: windows-latest}
          - {demo: orrery, os: macos-latest}
          - {demo: firework, os: ubuntu-latest}
          - {demo: sprites, os: windows-latest}
          - {demo: spriteanim, os: ubuntu-latest}
          - {demo: plasma, os: macos-latest}
          - {demo: kaleido, os: ubuntu-latest}
          - {demo: moire, os: windows-latest}
          - {demo: mandel, os: ubuntu-latest}
          - {demo: julia, os: windows-latest}
          - {demo: forest, os: macos-latest}
          - {demo: raymaze, os: macos-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out fresh main with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and replay assigned patched demo
        run: >-
          python -B .github/land_batch5a_fast.py
          evidence "${{ matrix.demo }}" "${{ matrix.os }}" runner-evidence

      - name: Upload certified patched demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: batch5a-${{ matrix.demo }}-${{ matrix.os }}-${{ github.sha }}
          path: runner-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  certify-and-land:
    name: Aggregate, certify, and land
    needs: evidence
    if: ${{ needs.evidence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out fresh main with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download all certified patched demo evidence
        uses: actions/download-artifact@v4
        with:
          pattern: batch5a-*-${{ github.sha }}
          path: batch5a-evidence
          merge-multiple: true

      - name: Aggregate, verify, SoP-certify, and land Batch-5A
        run: python -B .github/land_batch5a_fast.py land batch5a-evidence
