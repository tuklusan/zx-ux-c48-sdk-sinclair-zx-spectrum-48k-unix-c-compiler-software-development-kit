name: One-shot FINAL font refresh

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-font-refresh-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and verify pre-font tag
        shell: bash
        run: |
          set -euo pipefail
          tag=BEFORE-SANYALNET-FINAL-FONT
          base=1a7c30c60d745108db61ffc7b0426d5b56a0aa80
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n1 "$tag")" = "$base"
          else
            git tag "$tag" "$base"
            git push origin "refs/tags/$tag"
          fi
          test "$(git rev-list -n1 "$tag")" = "$base"

      - name: Validate FINAL template and packed resource
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          text_path = Path('compiler/assets/SANYALnet-Labs-4x8-font-FINAL.txt')
          bin_path = Path('compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin')
          lines = text_path.read_text(encoding='utf-8').splitlines()
          glyphs = {}
          i = 0
          while i < len(lines):
              m = re.fullmatch(r'U\+([0-9A-F]{4})\s+(.+)', lines[i])
              if not m:
                  i += 1
                  continue
              cp = int(m.group(1), 16)
              rows = lines[i+1:i+9]
              if len(rows) != 8 or any(len(r) != 4 or set(r) - {'.', '#'} for r in rows):
                  raise SystemExit(f'invalid 4x8 glyph U+{cp:04X}')
              if cp in glyphs:
                  raise SystemExit(f'duplicate glyph U+{cp:04X}')
              glyphs[cp] = rows
              i += 9
          if sorted(glyphs) != list(range(0x20, 0x7F)):
              raise SystemExit('FINAL template must define U+0020..U+007E exactly once')
          glyph_7f = ['.##.','#...','#.##','#.#.','#.##','#...','#..#','.##.']
          def nib(row):
              return int(row.replace('.', '0').replace('#', '1'), 2)
          packed = bytearray(b'F4X8' + bytes((1, 0x20, 96, 0)))
          for cp in range(0x20, 0x80):
              rows = glyphs[cp] if cp < 0x7F else glyph_7f
              for n in range(0, 8, 2):
                  packed.append((nib(rows[n]) << 4) | nib(rows[n+1]))
          actual = bin_path.read_bytes()
          if actual != bytes(packed):
              raise SystemExit('FINAL bin is not the exact mechanical packing of FINAL.txt')
          if len(actual) != 392:
              raise SystemExit(f'unexpected FINAL bin size: {len(actual)}')
          print('FINAL_TXT_SHA256=' + hashlib.sha256(text_path.read_bytes()).hexdigest())
          print('FINAL_BIN_SHA256=' + hashlib.sha256(actual).hexdigest())
          PY

      - name: Switch VM default and font documentation to FINAL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('compiler/c48run.py')
          s = p.read_text(encoding='utf-8')
          old = 'default=ROOT / "assets" / "font4x8-tasword.bin",'
          new = 'default=ROOT / "assets" / "SANYALnet-Labs-4x8-font-FINAL.bin",'
          if s.count(old) != 1:
              raise SystemExit('unexpected c48run default-font source shape')
          s = s.replace(old, new)
          old_help = '(default: compiler/assets/font4x8-tasword.bin)'
          new_help = '(default: compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin)'
          if s.count(old_help) != 1:
              raise SystemExit('unexpected c48run default-font help shape')
          p.write_text(s.replace(old_help, new_help), encoding='utf-8')

          p = Path('compiler/README-font.txt')
          s = p.read_text(encoding='utf-8')
          old = ('Runtime-selectable F4X8 assets:\n'
                 '  compiler/assets/font4x8-tasword.bin   default runtime font\n'
                 '  compiler/assets/font4x8-zxux.bin      alternate selectable font slot')
          new = ('Runtime-selectable F4X8 assets:\n'
                 '  compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin  default runtime font\n'
                 '  compiler/assets/font4x8-tasword.bin                 selectable Tasword font\n'
                 '  compiler/assets/font4x8-zxux.bin                    alternate selectable font slot')
          if s.count(old) != 1:
              raise SystemExit('unexpected README-font runtime-assets source shape')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          compile(Path('compiler/c48run.py').read_text(encoding='utf-8'), 'compiler/c48run.py', 'exec')
          PY
          python -B compiler/c48run.py --help | grep -F 'default: compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin'

      - name: Build argv specimen
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/c48.py usr/src/examples/argv.c -o usr/bin/argv.c48b

      - name: Render argv with every runtime font
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-font-refresh
          mkdir -p final-font-refresh/ppm docs/images/font-tests
          program="$PWD/usr/bin/argv.c48b"
          count=0
          for font in compiler/assets/*.bin; do
            test "$(stat -c %s "$font")" -eq 392
            base="$(basename "$font" .bin)"
            python -B compiler/c48run.py \
              --headless \
              --font "$font" \
              --frame-ppm "final-font-refresh/ppm/$base.ppm" \
              "$program" \
              "$(basename "$font")"
            count=$((count+1))
          done
          test "$count" -eq 9

      - name: Write fresh 640x480 PNG screenshots
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/images/font-tests/*.png
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib

          def read_ppm(path):
              data = path.read_bytes()
              if not data.startswith(b'P6\n'):
                  raise SystemExit(f'not P6 PPM: {path}')
              header, pixels = data.split(b'\n255\n', 1)
              lines = header.splitlines()
              w, h = map(int, lines[1].split())
              if (w, h) != (320, 240) or len(pixels) != w*h*3:
                  raise SystemExit(f'bad frame: {path} {w}x{h} bytes={len(pixels)}')
              return w, h, pixels

          def nearest2(rgb, w, h):
              rows = []
              for y in range(h):
                  src = rgb[y*w*3:(y+1)*w*3]
                  row = b''.join(src[x:x+3] * 2 for x in range(0, len(src), 3))
                  rows.extend((row, row))
              return w*2, h*2, b''.join(rows)

          def chunk(kind, payload):
              return (struct.pack('>I', len(payload)) + kind + payload +
                      struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff))

          def png(width, height, rgb):
              stride = width * 3
              raw = b''.join(b'\x00' + rgb[y*stride:(y+1)*stride] for y in range(height))
              return (b'\x89PNG\r\n\x1a\n' +
                      chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) +
                      chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b''))

          ppms = sorted(Path('final-font-refresh/ppm').glob('*.ppm'))
          if len(ppms) != 9:
              raise SystemExit(f'expected 9 PPMs, got {len(ppms)}')
          outdir = Path('docs/images/font-tests')
          for src in ppms:
              w, h, rgb = read_ppm(src)
              w, h, rgb = nearest2(rgb, w, h)
              data = png(w, h, rgb)
              dest = outdir / (src.stem + '.png')
              dest.write_bytes(data)
              if data[:8] != b'\x89PNG\r\n\x1a\n' or (w, h) != (640, 480):
                  raise SystemExit(f'bad PNG output: {dest}')
              print(dest, len(data), hashlib.sha256(data).hexdigest())
          PY

      - name: Validate screenshot set and LFS staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f usr/bin/argv.c48b
          mapfile -t fonts < <(find compiler/assets -maxdepth 1 -type f -name '*.bin' -printf '%f\n' | sed 's/\.bin$//' | sort)
          mapfile -t shots < <(find docs/images/font-tests -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sed 's/\.png$//' | sort)
          test "${#fonts[@]}" -eq 9
          test "${#shots[@]}" -eq 9
          test "$(printf '%s\n' "${fonts[@]}")" = "$(printf '%s\n' "${shots[@]}")"
          for shot in docs/images/font-tests/*.png; do
            test "$(git check-attr filter -- "$shot" | awk '{print $3}')" = lfs
          done
          git add -- compiler/c48run.py compiler/README-font.txt docs/images/font-tests
          for shot in docs/images/font-tests/*.png; do
            git show ":$shot" | grep -q '^version https://git-lfs.github.com/spec/v1$'
          done
          git diff --cached --check

      - name: Commit and push default plus screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git commit -m 'font: default to FINAL and refresh font screenshots'
          git push origin HEAD:main
