name: Build Dizzy 4K

on:
  push:
    branches: [main]
    paths:
      - "usr/src/demos/dizzy4k.c"
      - ".github/workflows/build-dizzy4k.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -B compiler/c48.py usr/src/demos/dizzy4k.c
      - name: Run full cycle
        run: |
          python3 -B compiler/c48run.py --headless --dump-screen dizzy4k.scr usr/bin/demos/dizzy4k.c48b 2
          sha256sum usr/src/demos/dizzy4k.c usr/bin/demos/dizzy4k.c48b dizzy4k.scr > dizzy4k.sha256
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: dizzy4k-build
          path: |
            usr/bin/demos/dizzy4k.c48b
            dizzy4k.scr
            dizzy4k.sha256
