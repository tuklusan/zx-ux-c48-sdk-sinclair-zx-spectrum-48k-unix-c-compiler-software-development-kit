name: Finalize Dizzy 4K

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dizzy4k.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and prove full cycle
        run: |
          python3 -B compiler/c48.py usr/src/demos/dizzy4k.c
          python3 -B compiler/c48run.py --headless --dump-screen dizzy4k.scr usr/bin/demos/dizzy4k.c48b 2
          test "$(wc -c < dizzy4k.scr)" -eq 6912
      - name: Project checks
        run: |
          python3 -B compiler/check_license_headers.py
      - name: Commit binary and remove temporary workflow
        run: |
          rm .github/workflows/build-dizzy4k.yml
          git add usr/bin/demos/dizzy4k.c48b .github/workflows/build-dizzy4k.yml
          python3 -B compiler/check_project_banned_words.py
          git diff --cached --name-only
          git diff --cached --check
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git commit -m "feat: add Dizzy 4K demo binary"
          git push origin HEAD:main
