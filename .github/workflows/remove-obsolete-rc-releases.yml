name: Remove obsolete RC releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-obsolete-rc-releases.yml"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove RC2 through RC5 releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          final_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/1.0.0" --jq .object.sha)"
          test "${final_sha}" = "76cd18d0db82f987a675bd1ccf78ff25103a3612"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/1.0.0" --jq             'select(.draft == false and .prerelease == false and .tag_name == "1.0.0") | .id'             | grep -q .

          for tag in 1.0.0-RC2 1.0.0-RC3 1.0.0-RC4 1.0.0-RC5; do
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            else
              gh api --method DELETE                 "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"                 >/dev/null 2>&1 || true
            fi
          done

          for tag in 1.0.0-RC2 1.0.0-RC3 1.0.0-RC4 1.0.0-RC5; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "release still exists: ${tag}" >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "tag still exists: ${tag}" >&2
              exit 1
            fi
          done

          final_sha_after="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/1.0.0" --jq .object.sha)"
          test "${final_sha_after}" = "${final_sha}"
          echo "RC2-RC5 releases and tags removed; 1.0.0 unchanged."
