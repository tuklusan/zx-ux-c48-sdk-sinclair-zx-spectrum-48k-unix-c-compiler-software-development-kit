name: Diagnose Batch-5A projection blocker

"on":
  push:
    branches: [main]
    paths:
      - ".github/diag_batch5a.py"
      - ".github/workflows/diag-batch5a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -B .github/diag_batch5a.py
