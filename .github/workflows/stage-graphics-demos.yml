name: Finalize 21 graphics demos

"on":
  push:
    branches: [graphics-demos-21]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize 21 graphics demos bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: graphics-demos-21
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Remove one-shot staging workflow
        shell: bash
        run: rm .github/workflows/stage-graphics-demos.yml

      - name: Regenerate canonical manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.').resolve()
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              digest = hashlib.sha256(data).hexdigest()
              rows.append(f"{digest}  {rel.as_posix()}")
          (root / 'MANIFEST.sha256').write_text(
              '\n'.join(rows) + '\n', encoding='ascii'
          )
          PY

      - name: Prove obsolete staging residue is gone
        shell: bash
        run: |
          if grep -RInE \
            'graphics-bootstrap-|34559581492|stage_graphics_demos\.py|stage-graphics-demos\.yml' \
            . --exclude-dir=.git; then
            echo 'Obsolete graphics staging residue remains.' >&2
            exit 1
          fi

      - name: Run full release verifier
        run: python -B compiler/verify_release.py

      - name: Check diff hygiene
        run: git diff --check

      - name: Commit clean 21-demo milestone
        shell: bash
        run: |
          git config user.name "Supratim Sanyal"
          git config user.email "tuklusan@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Finalize 21 graphics demos"
          git push origin HEAD:graphics-demos-21
