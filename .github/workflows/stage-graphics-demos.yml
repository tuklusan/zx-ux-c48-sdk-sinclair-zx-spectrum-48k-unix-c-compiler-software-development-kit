name: Stage graphics demo artifacts

"on":
  push:
    branches: [graphics-demos-21]

permissions:
  actions: read
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'Stage 21 graphics artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: graphics-demos-21
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download verified 21-runner artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: graphics-bootstrap-*
          path: ${{ runner.temp }}/graphics-generated
          github-token: ${{ github.token }}
          run-id: 34559581492

      - name: Assemble verified candidate
        run: python -B .github/stage_graphics_demos.py

      - name: Verify static graphics corpus
        run: python -B compiler/verify_graphics_demos.py --static

      - name: Check diff hygiene
        run: git diff --check

      - name: Create before-demos tag if absent
        shell: bash
        run: |
          if ! git ls-remote --exit-code --tags origin refs/tags/before-demos >/dev/null 2>&1; then
            git config user.name "Supratim Sanyal"
            git config user.email "tuklusan@users.noreply.github.com"
            git tag -a before-demos 69ffac7894c39f6ae31a580d9198d4f1f9115c6f -m "before demos"
            git push origin refs/tags/before-demos
          fi

      - name: Commit assembled candidate
        shell: bash
        run: |
          git config user.name "Supratim Sanyal"
          git config user.email "tuklusan@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Assemble verified 21-demo graphics candidate"
          git push origin HEAD:graphics-demos-21
