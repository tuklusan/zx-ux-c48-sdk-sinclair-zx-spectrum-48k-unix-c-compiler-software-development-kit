name: C48 native format interoperability

"on":
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "README.md"
      - "docs/*.docx"
      - ".gitattributes"
      - "compiler/**/*.py"
      - "compiler/**/*.json"
      - "compiler/**/*.md"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/**/*.c"
      - "usr/src/**/*.h"
      - "usr/bin/**/*.c48b"
      - "usr/bin/**/*.src.tap"
      - "c48"
      - "c48.bat"
      - "c48run"
      - "c48run.bat"
      - "c48srctap"
      - "c48srctap.bat"
      - "c48b2tap"
      - "c48b2tap.bat"
      - ".github/workflows/verify.yml"
      - ".github/workflows/multitask.yml"
      - ".github/workflows/native-interop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SDK candidate
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check out pinned native reference
        uses: actions/checkout@v4
        with:
          repository: tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project
          ref: 69348ee366c48b436aa0d07237ae2e7473e55327
          path: native-ref
          persist-credentials: false

      - name: Set up pinned bootstrap Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install pinned native runtime prerequisites
        working-directory: native-ref
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("tools/manifest/toolchain.lock.json").read_text())
          for package in data["bootstrap"]["native_build_prerequisites"]:
              print(package)
          PY
          )
          test "${#packages[@]}" -gt 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Bootstrap and certify pinned native runtime
        working-directory: native-ref
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/bootstrap-environment.py
          tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Run independent native format oracles
        run: python -B compiler/verify_native_interop.py --native-root native-ref

      - name: Run pinned native tape execution proof
        run: python -B compiler/verify_native_execution.py --native-root native-ref
