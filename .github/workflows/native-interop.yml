name: C48 native format interoperability

"on":
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "README.md"
      - "docs/*.docx"
      - ".gitattributes"
      - "compiler/**/*.py"
      - "compiler/**/*.json"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/**/*.c"
      - "usr/src/**/*.h"
      - "usr/bin/**/*.c48b"
      - "usr/bin/**/*.src.tap"
      - "c48"
      - "c48.bat"
      - "c48run"
      - "c48run.bat"
      - "c48srctap"
      - "c48srctap.bat"
      - "c48b2tap"
      - "c48b2tap.bat"
      - ".github/workflows/verify.yml"
      - ".github/workflows/multitask.yml"
      - ".github/workflows/native-interop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SDK candidate
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check out pinned native reference
        uses: actions/checkout@v4
        with:
          repository: tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project
          ref: 69348ee366c48b436aa0d07237ae2e7473e55327
          path: native-ref
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run independent native format oracles
        run: python -B compiler/verify_native_interop.py --native-root native-ref

      - name: Run pinned native tape execution proof
        run: python -B compiler/verify_native_execution.py --native-root native-ref
