name: Add ailmzx48 to 1.0.0 release notes

on:
  push:
    paths:
      - .github/workflows/add-ailmzx48-release-note.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify fact, patch candidate, and run SoP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          RELEASE_ID: '389451145'
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/${RELEASE_ID}" > /tmp/release.before.json
          gh api "repos/${REPO}/contents/usr/src/ailmzx48?ref=1.0.0" > /tmp/ailm-dir.json
          gh api "repos/${REPO}/contents/usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md?ref=1.0.0" > /tmp/ailm-design.json
          gh api "repos/${REPO}/contents/usr/src/ailmzx48/ailmzx48.c?ref=1.0.0" > /tmp/ailm-source.json

          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          release = json.loads(Path('/tmp/release.before.json').read_text())
          body = release['body']
          old_sha = hashlib.sha256(body.encode()).hexdigest()
          if old_sha != 'ab0e126a9e7f888cdb4086d7d600f85c5e1fbe8341a054ebca6bd5b8cb518838':
              raise SystemExit(f'release body race/drift: {old_sha}')
          if release['tag_name'] != '1.0.0' or release['target_commitish'] != '41d130e489638dd07ba3305eea41517e0ec3b32f':
              raise SystemExit('release identity drift')
          if release['draft'] or release['prerelease'] or release['name'] != 'C48 SDK 1.0.0':
              raise SystemExit('release metadata drift')

          entries = {x['name'] for x in json.loads(Path('/tmp/ailm-dir.json').read_text())}
          if 'ailmzx48.c' not in entries or 'AILMZX48-DETAILED-DESIGN.md' not in entries:
              raise SystemExit('ailmzx48 release source/design missing')

          def decoded(path):
              obj = json.loads(Path(path).read_text())
              return base64.b64decode(obj['content']).decode('utf-8')

          design = decoded('/tmp/ailm-design.json')
          source = decoded('/tmp/ailm-source.json')
          required_design = [
              '`ailmzx48` is a small English conversational language model for ZX-UX.',
              'It is written in C48',
              'The shipped model is trained specifically around the Sinclair ZX Spectrum:',
              'its games, history, hardware and software architecture, culture, folklore, personalities, and related subjects.',
              'Runtime inference is local to the Spectrum/ZX-UX program.',
          ]
          for phrase in required_design:
              if phrase not in design:
                  raise SystemExit(f'ailmzx48 design fact missing: {phrase}')
          if 'int main(' not in source and 'main(' not in source:
              raise SystemExit('ailmzx48 C source lacks main entry point')

          old = '- A substantial C48 source corpus: **21 graphics demos**, **14 games**, **3 applications**, examples, sound demos, and adversarial security fixtures.'
          new = '- A substantial C48 source corpus: **21 graphics demos**, **14 games**, **3 applications**, examples, sound demos, adversarial security fixtures, and **ailmzx48**, a small C48 conversational language model specialized in the Sinclair ZX Spectrum—its games, history, hardware, software architecture, culture, folklore, and personalities.'
          if body.count(old) != 1:
              raise SystemExit(f'expected source-corpus bullet exactly once, found {body.count(old)}')
          if 'ailmzx48' in body:
              raise SystemExit('ailmzx48 already present in release body unexpectedly')
          candidate = body.replace(old, new)
          Path('/tmp/body.new.md').write_text(candidate)

          # Guard this as a one-sentence feature addition only.
          if candidate.count(new) != 1 or old in candidate:
              raise SystemExit('candidate source-corpus replacement defect')
          for phrase in ['promotion workflow', 'initial promotion attempt', 'workflow: `351', 'zero-defect passes']:
              if phrase.lower() in candidate.lower():
                  raise SystemExit(f'internal development history leaked: {phrase}')
          print('AILMZX48 FACT CHECK PASS')
          print('candidate sha256=' + hashlib.sha256(candidate.encode()).hexdigest())
          PY

          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          source = Path('/tmp/body.new.md').read_bytes()
          baseline = hashlib.sha256(source).hexdigest()
          for n in (1,2,3):
              root = Path(f'/tmp/release-ailm-sop-{n}')
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir()
              fresh = root / 'release-body.md'
              fresh.write_bytes(source)
              data = fresh.read_bytes()
              walked = 0
              lines = data.splitlines(keepends=True)
              for line_no, line in enumerate(lines, 1):
                  if b'\x00' in line:
                      raise SystemExit(f'pass {n}: NUL at line {line_no}')
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f'pass {n}: byte walk mismatch')
              data.decode('utf-8', errors='strict')
              if data != source or hashlib.sha256(data).hexdigest() != baseline:
                  raise SystemExit(f'pass {n}: fresh-copy/hash mismatch')
              print(f'RELEASE BODY SOP PASS {n}: bytes={len(data)} lines={len(lines)} sha256={baseline}')
          PY

      - name: Patch release body and verify read-back
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          RELEASE_ID: '389451145'
        run: |
          set -euo pipefail
          jq -n --rawfile body /tmp/body.new.md '{body:$body}' > /tmp/payload.json
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" --input /tmp/payload.json > /tmp/release.after.json
          gh api "repos/${REPO}/releases/${RELEASE_ID}" > /tmp/release.readback.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = Path('/tmp/body.new.md').read_text()
          before = json.loads(Path('/tmp/release.before.json').read_text())
          after = json.loads(Path('/tmp/release.readback.json').read_text())
          if after['body'] != expected:
              raise SystemExit('release body read-back mismatch')
          for key in ('tag_name','target_commitish','name','draft','prerelease'):
              if after[key] != before[key]:
                  raise SystemExit(f'release metadata changed: {key}')
          before_assets = [(a['name'], a.get('digest'), a['size']) for a in before['assets']]
          after_assets = [(a['name'], a.get('digest'), a['size']) for a in after['assets']]
          if after_assets != before_assets:
              raise SystemExit('release assets changed')
          print('POST-PATCH RELEASE READ-BACK PASS')
          print('body sha256=' + hashlib.sha256(expected.encode()).hexdigest())
          PY

      - name: Remove temporary workflow and push cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-ailmzx48-release-note.yml
          git commit -m "ci: remove ailmzx48 release-note workflow"
          git push origin HEAD:main
