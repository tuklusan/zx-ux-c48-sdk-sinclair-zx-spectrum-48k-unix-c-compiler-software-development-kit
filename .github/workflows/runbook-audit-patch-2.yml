name: Runbook audit patch two

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/runbook-audit-patch-2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply second audited runbook corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scratch/C48-MULTITASK-NATIVE-TAPE-RELEASE-RUNBOOK.runbook")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "6. Root `README.md` is header-exempt: remove its existing project source-header boilerplate and leave it headerless; do not insert the canonical header there. Root `LICENSE` is also header-exempt and must never receive a source header, although a separate policy-content correction may edit its license prose when required by the project-wide content gate while preserving intended legal restrictions. Do not inject source headers into Microsoft Office files. Do not modify imported reference bytes, generated evidence, or any pinned C/H corpus file.\n7. Verify no governed file contains two project headers or remnants of the old header block.",
                  "6. Root `README.md` is header-exempt: remove its existing project source-header boilerplate and leave it headerless; do not insert the canonical header there. Root `LICENSE` is also header-exempt and must never receive a source header, although a separate policy-content correction may edit its license prose when required by the project-wide content gate while preserving intended legal restrictions. Do not inject source headers into Microsoft Office files. Do not modify imported reference bytes, generated evidence, or any pinned C/H corpus file merely for header normalization.\n7. The imported/reference byte-preservation rule is only a license-header normalization exemption. If a higher project-content/security gate rejects an imported artifact, do not edit the upstream bytes in place; remove the tracked artifact or replace it with a permissible clean reference after reviewing provenance and all dependent tests/documentation, then rerun the full affected gate.\n8. Verify no governed file contains two project headers or remnants of the old header block."
              ),
              (
                  "8. Verify the new canonical header occurs exactly once in each governed file.\n9. Build a dependency map",
                  "9. Verify the new canonical header occurs exactly once in each governed file.\n10. Build a dependency map"
              ),
              (
                  "10. For every regenerated source tape, decode it independently",
                  "11. For every regenerated source tape, decode it independently"
              ),
              (
                  "A process switch occurs only at an explicitly frozen scheduling boundary such as `yield`, a blocking service, termination, or cancellation.",
                  "A process switch occurs only at an explicitly frozen scheduling boundary such as `yield`, a blocking service, termination, or cancellation. Scheduler determinism means that the same ordered program actions plus the same tick/input event stream produce the same schedule and observable result; live wall-clock and human-input timing are external events and are not falsely claimed to be inherently repeatable."
              ),
              (
                  "6. In multitask mode, `--heap` applies independently to each process; `--max-steps` is a session-wide deterministic semantic-step ceiling; `--time-quota` is a session-wide wall-clock ceiling; `ticks()` uses one shared session tick source; screen/frame dumps capture the final shared screen. Preserve existing single-program meanings outside multitask mode.",
                  "6. In multitask mode, `--heap` applies independently to each process; `--max-steps` is a session-wide deterministic semantic-step ceiling; `--time-quota` is a session-wide wall-clock ceiling; `ticks()` uses one shared session tick source; screen/frame dumps capture the final shared screen. The scheduler must accept an injected deterministic tick/input source for proof tests while production GUI/live-input mode uses the documented live event sources. Preserve existing single-program meanings outside multitask mode."
              ),
              (
                  "8. Run the same deterministic headless multitask proof repeatedly and require identical status, event trace, and final screen bytes when the inputs/options are identical.",
                  "8. Run the same deterministic headless multitask proof repeatedly with an explicitly injected synthetic tick/input event stream and require identical status, event trace, and final screen bytes when the programs, options, and event stream are identical. Separately test live event integration without claiming wall-clock timing itself is deterministic."
              ),
              (
                  "5. Add `--version`, `--about`, `--help`, deterministic error text, and nonzero failure behavior consistent with existing SDK tools.\n6. Update release-required-file checks",
                  "5. Add `--version`, `--about`, `--help`, deterministic error text, and nonzero failure behavior consistent with existing SDK tools.\n6. Before coding the writer, freeze and test the complete file contract: exactly one validated `.c48b` input; the mode-specific output form/suffix; input-output alias rejection; existing-output/overwrite policy; regular-file/symlink handling; and deterministic diagnostics for every invalid combination.\n7. All OBJ1, MEX1, and TAP modes must write transactionally to a temporary peer and publish the requested output only after generation plus independent validation succeeds; every failure path must leave no new or partially replaced output.\n8. Update release-required-file checks"
              ),
              (
                  "7. Update the Phase-1 license-header classifier so the suffixless `c48b2tap` launcher is governed",
                  "9. Update the Phase-1 license-header classifier so the suffixless `c48b2tap` launcher is governed"
              ),
              (
                  "8. Apply the canonical Phase-1 license header to all new governed files.",
                  "10. Apply the canonical Phase-1 license header to all new governed files."
              ),
              (
                  "5. Validate every generated OBJ1 with an independent SDK-side decoder and also with the pinned read-only native format oracle for every proof artifact for which that oracle exists; inability to run an available native oracle is a proof failure, not a reason to skip it.\n6. Require byte-for-byte deterministic rebuilds.",
                  "5. Validate every generated OBJ1 with an independent SDK-side decoder and also with the pinned read-only native format oracle for every proof artifact for which that oracle exists; inability to run an available native oracle is a proof failure, not a reason to skip it.\n6. Feed representative generated OBJ1 files directly to the pinned native linker and require successful native consumption/linking; this proves interoperability rather than merely proving that two decoders accept the header. Compare the resulting native-linker executable behavior with the host-linker result without requiring byte identity when legal layout/code-generation choices differ.\n7. Require byte-for-byte deterministic rebuilds."
              ),
              (
                  "- independent decoders validate every proof artifact;\n- native loader/execution proof passes;",
                  "- independent decoders validate every proof artifact;\n- representative generated OBJ1 artifacts are accepted and linked by the pinned native linker;\n- native loader/execution proof passes;"
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected runbook text missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "scratch/C48-MULTITASK-NATIVE-TAPE-RELEASE-RUNBOOK.runbook"
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git add scratch/C48-MULTITASK-NATIVE-TAPE-RELEASE-RUNBOOK.runbook
          git diff --cached --check
          git commit -m "Tighten runbook execution contracts"
          git push origin main
