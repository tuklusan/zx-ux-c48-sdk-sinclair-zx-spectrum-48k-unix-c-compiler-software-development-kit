name: ailmzx48 SoP current-design authority repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-design-authority-repair.yml"

permissions:
  contents: write

concurrency:
  group: ailmzx48-sop-design-authority-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repair stale current design authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          a = Path('usr/src/ailmzx48')
          design = a / 'AILMZX48-DETAILED-DESIGN.md'
          text = design.read_text(encoding='utf-8')
          replacements = [
              (
                  'SDK profile makes no blind-generalization claim.  Fresh architecture\n'
                  'requalification uses literal/context iteration 9117, final A/B/C iterations\n'
                  '9118/9119/9120, and the dedicated hash-collision/unknown-routing iteration\n'
                  '9121.',
                  'SDK profile makes no blind-generalization claim.  Revision-0.27\n'
                  'architecture requalification used literal/context iteration 9117, final A/B/C\n'
                  'iterations 9118/9119/9120, and the dedicated hash-collision/unknown-routing\n'
                  'iteration 9121. Revision-0.29 bridge-repair evidence supersedes those runtime\n'
                  'identities for the current SDK profile as recorded in Section 23.'
              ),
              (
                  'Revision 0.27 closes the SDK-side design questions that are now fixed by',
                  'Revision 0.29 closes the SDK-side design questions that are now fixed by'
              ),
              (
                  '- A48M v2 is 8,458 logical bytes with 69 records, a 192-byte maximum record,\n'
                  '  a 64-byte maximum read request, and cold-model SHA-256\n'
                  '  `3dda3f6633cd8731e158970bf0658cd9126496e9d7c30ff14ab4cbcae25611ea`;',
                  '- A48M v2 is 8,566 logical bytes with 69 records, a 192-byte maximum record,\n'
                  '  a 64-byte maximum read request, and cold-model SHA-256\n'
                  '  `a0b87573f6e380bf33ba4f4803e9abd917f64c958793717da6d6130dc5fa1096`;'
              ),
              (
                  '- retained post-architecture-repair literal/context iteration 9117 is 70/70\n'
                  '  with real compaction, L2 occupancy, semantic retrieval, stale-reference\n'
                  '  invalidation, trigram use, cooperative scan yields, and newest-name recall;\n'
                  '- retained post-architecture-repair final A/B/C iterations 9118/9119/9120 are\n'
                  '  each 12/12 clean-exit, zero-unexpected-literal-loss runs against one source,\n'
                  '  one rebuilt C48B1 binary, and one provenance-qualified cold-model identity;\n'
                  '- retained architecture-routing iteration 9121 proves learned trigram wording,\n'
                  '  bounded cold-scan yields, generic topic-0 fallback, and rejection of `ah` as\n'
                  '  a deliberate hash collision with admitted trigger `jetpac`;',
                  '- retained learned-bridge iteration 9131 is 2/2 with two learned bridge uses,\n'
                  '  two real trigram uses, semantic retrieval on both turns, bounded cold-scan\n'
                  '  yields, clean exit, and zero literal-reference losses;\n'
                  '- retained architecture-routing iteration 9132 proves learned bridge/trigram\n'
                  '  wording, bounded cold-scan yields, generic topic-0 fallback, and rejection of\n'
                  '  `ah` as a deliberate hash collision with admitted trigger `jetpac`;\n'
                  '- retained post-learned-bridge literal/context iteration 9133 is 70/70 with real\n'
                  '  compaction, L2 occupancy, semantic retrieval, stale-reference invalidation,\n'
                  '  bridge/trigram use, cooperative scan yields, and newest-name recall;\n'
                  '- retained post-learned-bridge final A/B/C iterations 9134/9135/9136 are each\n'
                  '  12/12 clean-exit, zero-unexpected-literal-loss runs against one source, one\n'
                  '  rebuilt C48B1 binary, and one provenance-qualified cold-model identity;'
              ),
              (
                  '- factual A48M anchors cover selected predicate spans rather than complete\n'
                  '  stored sentences; normal cold answers generate learned lead wording before\n'
                  '  copying the selected factual span unchanged;',
                  '- factual A48M anchors retain every critical admitted-fact token while leaving\n'
                  '  exactly one safe non-trigger gap outside the copied spans; a 68-row\n'
                  '  corpus-derived hot bridge table predicts that gap from bounded topic/context,\n'
                  '  the runtime verifies the predicted hot-vocabulary spelling against the cold\n'
                  '  gap, emits the hot token, and never copies the cold gap bytes into the answer;'
              ),
              ('measured 8,458-byte A48M envelope;',
               'measured 8,566-byte A48M envelope;'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('design patch anchor mismatch: ' + old[:90])
              text = text.replace(old, new, 1)
          design.write_text(text, encoding='utf-8', newline='\n')

          checker = a / 'evaluation/check_design_compliance.py'
          check = checker.read_text(encoding='utf-8')
          anchor = (
              '    require("BLOCKED_EXTERNAL" in design, '
              '"native blocker not explicit in design")\n'
          )
          insert = '''    require("BLOCKED_EXTERNAL" in design, "native blocker not explicit in design")\n    require("Revision 0.29 closes the SDK-side design questions" in design,\n            "current resolved-parameter revision is stale")\n    require("Revision 0.27 closes the SDK-side design questions" not in design,\n            "stale Revision-0.27 current-parameter marker remains")\n    require("A48M v2 is 8,566 logical bytes" in design and\n            "a0b87573f6e380bf33ba4f4803e9abd917f64c958793717da6d6130dc5fa1096" in design,\n            "current design A48M identity is stale")\n    require("retained learned-bridge iteration 9131" in design and\n            "architecture-routing iteration 9132" in design and\n            "literal/context iteration 9133" in design and\n            "final A/B/C iterations 9134/9135/9136" in design,\n            "current retained-evidence identities are stale")\n'''
          if check.count(anchor) != 1:
              raise SystemExit('compliance checker patch anchor mismatch')
          checker.write_text(
              check.replace(anchor, insert, 1),
              encoding='utf-8', newline='\n'
          )

          data = design.read_bytes()
          design_sha = hashlib.sha256(data).hexdigest()
          design_blob = hashlib.sha1(
              b'blob ' + str(len(data)).encode('ascii') + b'\0' + data
          ).hexdigest()
          if design_sha != '1a4d2ffc1635019be6d88e534891ee5105d1313a5e5eb91cdc0571b1d0e763d4':
              raise SystemExit('unexpected design SHA after repair: ' + design_sha)
          if design_blob != 'c47aab8a7f005f61aea462e2a1c9a6b2d3506504':
              raise SystemExit('unexpected design blob after repair: ' + design_blob)

          status_path = a / 'evaluation/DESIGN-COMPLIANCE-STATUS.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['design_sha256'] = design_sha
          status['design_git_blob_sha1'] = design_blob
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )

          cert_path = a / 'evaluation/DESIGN-REVIEW-CERTIFICATE.md'
          cert = cert_path.read_text(encoding='utf-8')
          cert = re.sub(
              r'- detailed-design Git blob: `[0-9a-f]{40}`',
              f'- detailed-design Git blob: `{design_blob}`', cert
          )
          cert = re.sub(
              r'- detailed-design SHA-256: `[0-9a-f]{64}`',
              f'- detailed-design SHA-256: `{design_sha}`', cert
          )
          cert_path.write_text(cert, encoding='utf-8', newline='\n')
          PY

      - name: Rebuild and run ailmzx48 reference gates
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py
          python -B compiler/c48.py usr/src/ailmzx48/ailmzx48.c \
            -o /tmp/ailmzx48.c48b
          cmp /tmp/ailmzx48.c48b usr/bin/ailmzx48/ailmzx48.c48b

      - name: Remove temporary SoP instrumentation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ailmzx48-sop-final-snapshot.yml
          rm .github/workflows/ailmzx48-sop-design-authority-repair.yml

      - name: Run hard release gates
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 1
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 2
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 3
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push current-design repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "ailmzx48: repair stale current design authority"
          git push origin HEAD:main
