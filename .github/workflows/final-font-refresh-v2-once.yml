name: One-shot FINAL font refresh v2

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-font-refresh-v2-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify tag and FINAL resource
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git rev-list -n1 BEFORE-SANYALNET-FINAL-FONT)" = "1a7c30c60d745108db61ffc7b0426d5b56a0aa80"
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          t = Path('compiler/assets/SANYALnet-Labs-4x8-font-FINAL.txt')
          b = Path('compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin')
          lines = t.read_text(encoding='utf-8').splitlines()
          glyphs = {}
          i = 0
          while i < len(lines):
              m = re.fullmatch(r'U\+([0-9A-F]{4})\s+(.+)', lines[i])
              if not m:
                  i += 1
                  continue
              cp = int(m.group(1), 16)
              rows = lines[i+1:i+9]
              if len(rows) != 8 or any(len(r) != 4 or set(r) - {'.', '#'} for r in rows):
                  raise SystemExit(f'invalid glyph U+{cp:04X}')
              if cp in glyphs:
                  raise SystemExit(f'duplicate glyph U+{cp:04X}')
              glyphs[cp] = rows
              i += 9
          if sorted(glyphs) != list(range(0x20, 0x7F)):
              raise SystemExit('template codepoint set mismatch')
          rows7f = ['.##.','#...','#.##','#.#.','#.##','#...','#..#','.##.']
          def nib(r): return int(r.replace('.', '0').replace('#', '1'), 2)
          expected = bytearray(b'F4X8' + bytes((1, 0x20, 96, 0)))
          for cp in range(0x20, 0x80):
              rows = glyphs[cp] if cp < 0x7F else rows7f
              for n in range(0, 8, 2):
                  expected.append((nib(rows[n]) << 4) | nib(rows[n+1]))
          actual = b.read_bytes()
          if actual != bytes(expected) or len(actual) != 392:
              raise SystemExit('FINAL packed resource mismatch')
          print('FINAL_TXT_SHA256=' + hashlib.sha256(t.read_bytes()).hexdigest())
          print('FINAL_BIN_SHA256=' + hashlib.sha256(actual).hexdigest())
          PY

      - name: Switch VM default and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('compiler/c48run.py')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('default=ROOT / "assets" / "font4x8-tasword.bin",',
               'default=ROOT / "assets" / "SANYALnet-Labs-4x8-font-FINAL.bin",'),
              ('(default: compiler/assets/font4x8-tasword.bin)',
               '(default: compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin)'),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected c48run source shape: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          compile(s, str(p), 'exec')

          p = Path('compiler/README-font.txt')
          s = p.read_text(encoding='utf-8')
          old = ('Runtime-selectable F4X8 assets:\n'
                 '  compiler/assets/font4x8-tasword.bin   default runtime font\n'
                 '  compiler/assets/font4x8-zxux.bin      alternate selectable font slot')
          new = ('Runtime-selectable F4X8 assets:\n'
                 '  compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin  default runtime font\n'
                 '  compiler/assets/font4x8-tasword.bin                 selectable Tasword font\n'
                 '  compiler/assets/font4x8-zxux.bin                    alternate selectable font slot')
          if s.count(old) != 1:
              raise SystemExit('unexpected README-font source shape')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          grep -Fq 'default=ROOT / "assets" / "SANYALnet-Labs-4x8-font-FINAL.bin",' compiler/c48run.py
          grep -Fq '(default: compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin)' compiler/c48run.py

      - name: Build and render argv with every font
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/c48.py usr/src/examples/argv.c -o usr/bin/argv.c48b
          rm -rf final-font-refresh
          mkdir -p final-font-refresh/ppm docs/images/font-tests
          program="$PWD/usr/bin/argv.c48b"
          count=0
          for font in compiler/assets/*.bin; do
            test "$(stat -c %s "$font")" -eq 392
            base="$(basename "$font" .bin)"
            python -B compiler/c48run.py --headless --font "$font" \
              --frame-ppm "final-font-refresh/ppm/$base.ppm" \
              "$program" "$(basename "$font")"
            count=$((count+1))
          done
          test "$count" -eq 9

      - name: Convert frames to repository PNG convention
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/images/font-tests/*.png
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib
          def read_ppm(path):
              data = path.read_bytes()
              head, rgb = data.split(b'\n255\n', 1)
              if not head.startswith(b'P6\n'):
                  raise SystemExit(f'bad PPM {path}')
              w, h = map(int, head.splitlines()[1].split())
              if (w, h) != (320, 240) or len(rgb) != w*h*3:
                  raise SystemExit(f'bad PPM geometry {path}')
              return w, h, rgb
          def scale2(rgb, w, h):
              rows=[]
              for y in range(h):
                  src=rgb[y*w*3:(y+1)*w*3]
                  row=b''.join(src[x:x+3]*2 for x in range(0,len(src),3))
                  rows.extend((row,row))
              return w*2,h*2,b''.join(rows)
          def chunk(kind,payload):
              return struct.pack('>I',len(payload))+kind+payload+struct.pack('>I',zlib.crc32(kind+payload)&0xffffffff)
          def encode(w,h,rgb):
              stride=w*3
              raw=b''.join(b'\x00'+rgb[y*stride:(y+1)*stride] for y in range(h))
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          ppms=sorted(Path('final-font-refresh/ppm').glob('*.ppm'))
          if len(ppms)!=9: raise SystemExit(f'expected 9 PPMs, got {len(ppms)}')
          out=Path('docs/images/font-tests')
          for src in ppms:
              w,h,rgb=read_ppm(src); w,h,rgb=scale2(rgb,w,h)
              data=encode(w,h,rgb)
              if (w,h)!=(640,480): raise SystemExit('scale failure')
              dest=out/(src.stem+'.png'); dest.write_bytes(data)
              print(dest, len(data), hashlib.sha256(data).hexdigest())
          PY

      - name: Validate, stage, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f usr/bin/argv.c48b
          mapfile -t fonts < <(find compiler/assets -maxdepth 1 -type f -name '*.bin' -printf '%f\n' | sed 's/\.bin$//' | sort)
          mapfile -t shots < <(find docs/images/font-tests -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sed 's/\.png$//' | sort)
          test "${#fonts[@]}" -eq 9
          test "${#shots[@]}" -eq 9
          test "$(printf '%s\n' "${fonts[@]}")" = "$(printf '%s\n' "${shots[@]}")"
          for shot in docs/images/font-tests/*.png; do
            test "$(git check-attr filter -- "$shot" | awk '{print $3}')" = lfs
          done
          git add -- compiler/c48run.py compiler/README-font.txt docs/images/font-tests
          for shot in docs/images/font-tests/*.png; do
            git show ":$shot" | grep -q '^version https://git-lfs.github.com/spec/v1$'
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git commit -m 'font: default to FINAL and refresh font screenshots'
          git push origin HEAD:main
