# Temporary one-shot certification harness. It removes itself after success.
name: Self-contained three-pass SoP certification

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/sop-certify-v3.yml"

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out certification control commit
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 2
          lfs: true

      - name: Guard target tree and install scanner
        shell: bash
        run: |
          set -euo pipefail
          target_tree=26d185f23403a4998d5d5fd4e14dce110c48aeac
          test "$(git -C control rev-parse 'HEAD^^{tree}')" = "$target_tree"
          test "$(git -C control diff --name-only HEAD^ HEAD)" = ".github/workflows/sop-certify-v3.yml"
          cat > "${RUNNER_TEMP}/sop_scan.py" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          scan_number = sys.argv[3]
          expected = "866a36deca57b01ff9b57ebc470d30fed50b5bdc"
          head = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
          ).strip()
          if head != expected:
              raise SystemExit(f"wrong scan commit: {head}")
          if subprocess.check_output(
              ["git", "-C", str(root), "status", "--porcelain"]
          ):
              raise SystemExit("fresh checkout is dirty before scan")

          names = [p for p in subprocess.check_output(
              ["git", "-C", str(root), "ls-files", "-z"]
          ).split(b"\0") if p]
          manifest = []
          files = lines = byte_count = 0
          conflict_markers = []
          stale_legends = []
          width_faults = []
          required_new = {
              b"usr/src/apps/write48.c": (
                  b"FIND CAPS+1 CANCEL> ",
              ),
              b"usr/src/games/chess.c": (
                  b"DELETE edits; q quits at empty prompt.",
                  b"Use e2e4; DELETE edits.",
              ),
          }
          required_seen = {
              key: [False] * len(values) for key, values in required_new.items()
          }

          for name_b in names:
              rel = os.fsdecode(name_b)
              path = root / rel
              data = (
                  os.fsencode(os.readlink(path))
                  if path.is_symlink()
                  else path.read_bytes()
              )
              rebuilt = bytearray()
              file_lines = 0
              for lineno, line in enumerate(data.splitlines(keepends=True), 1):
                  rebuilt.extend(line)
                  file_lines += 1
                  stripped = line.rstrip(b"\r\n")
                  if stripped.startswith((b"<<<<<<< ", b">>>>>>> ")):
                      conflict_markers.append(f"{rel}:{lineno}")
                  if b"FIND CAPS+7 CANCEL" in line or b"Backspace edits" in line:
                      stale_legends.append(f"{rel}:{lineno}")
                  if rel.startswith("usr/src/") and rel.endswith((".c", ".h")):
                      if len(stripped) > 64:
                          width_faults.append(f"{rel}:{lineno}:{len(stripped)}")
              if bytes(rebuilt) != data:
                  raise SystemExit(f"byte reconstruction mismatch: {rel}")
              if name_b in required_new:
                  for index, needle in enumerate(required_new[name_b]):
                      if needle in data:
                          required_seen[name_b][index] = True
              digest = hashlib.sha256(data).hexdigest()
              manifest.append(
                  f"{name_b.hex()}\t{len(data)}\t{file_lines}\t{digest}\n"
              )
              files += 1
              lines += file_lines
              byte_count += len(data)

          if conflict_markers:
              raise SystemExit("merge marker(s): " + ", ".join(conflict_markers))
          if stale_legends:
              raise SystemExit("stale legend(s): " + ", ".join(stale_legends))
          if width_faults:
              raise SystemExit("64-column fault(s): " + ", ".join(width_faults))
          missing = []
          for key, states in required_seen.items():
              for index, seen in enumerate(states):
                  if not seen:
                      missing.append(
                          f"{os.fsdecode(key)}:{required_new[key][index]!r}"
                      )
          if missing:
              raise SystemExit("corrected legend missing: " + ", ".join(missing))
          for temp_name in (
              ".github/workflows/fix-key-legends.yml",
              ".github/workflows/sop-certify.yml",
              ".github/workflows/sop-certify-v2.yml",
              ".github/workflows/sop-certify-v3.yml",
          ):
              if (root / temp_name).exists():
                  raise SystemExit(f"temporary workflow leaked into target: {temp_name}")

          payload = "".join(manifest).encode("ascii")
          manifest_path.write_bytes(payload)
          summary = (
              f"files={files} lines={lines} bytes={byte_count} "
              f"manifest_sha256={hashlib.sha256(payload).hexdigest()}"
          )
          print(f"SOP SCAN {scan_number} BYTE PASS: {summary}", flush=True)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run three fresh-copy scans and full verifiers
        shell: bash
        env:
          TARGET: 866a36deca57b01ff9b57ebc470d30fed50b5bdc
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          for n in 1 2 3; do
            dir="scan${n}"
            git clone --quiet --no-checkout "$remote" "$dir"
            git -C "$dir" fetch --quiet --depth=1 origin "$TARGET"
            git -C "$dir" checkout --quiet --detach "$TARGET"
            git -C "$dir" lfs pull
            python -B "${RUNNER_TEMP}/sop_scan.py" \
              "$dir" "${RUNNER_TEMP}/scan${n}.manifest" "$n"
            (cd "$dir" && python -B compiler/verify_release.py)
            test -z "$(git -C "$dir" status --porcelain)"
          done

      - name: Prove three successive scans are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          cmp "${RUNNER_TEMP}/scan1.manifest" "${RUNNER_TEMP}/scan2.manifest"
          cmp "${RUNNER_TEMP}/scan2.manifest" "${RUNNER_TEMP}/scan3.manifest"
          sha256sum "${RUNNER_TEMP}/scan1.manifest"
          echo "SOP CERTIFICATION PASS: 3 successive fresh byte scans; zero new defects"

      - name: Remove one-shot harness and restore certified tree exactly
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          certified_tree=26d185f23403a4998d5d5fd4e14dce110c48aeac
          git rm .github/workflows/sop-certify-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove self-contained SoP certification harness"
          test "$(git rev-parse 'HEAD^{tree}')" = "$certified_tree"
          git push origin HEAD:main
