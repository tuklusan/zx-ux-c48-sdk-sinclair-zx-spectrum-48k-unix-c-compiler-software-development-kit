name: Finalize 1.0.2 source tree

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-102.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Apply version and cleanup
        shell: python
        run: |
          from pathlib import Path
          import json

          replacements = {
              "VERSION": [("1.0.1\n", "1.0.2\n")],
              "compiler/c48/__init__.py": [('__version__ = "1.0.1"', '__version__ = "1.0.2"')],
              "compiler/c48.py": [('SDK_VERSION = "1.0.1"', 'SDK_VERSION = "1.0.2"')],
              "compiler/c48run.py": [('SDK_VERSION = "1.0.1"', 'SDK_VERSION = "1.0.2"')],
              "compiler/verify_gui_desktop.py": [('c48run 1.0.1', 'c48run 1.0.2')],
              "compiler/GUI-SMOKE-TESTS.md": [('1.0.1', '1.0.2')],
              "compiler/tests/test_c48srctap.py": [('c48srctap 1.0.1', 'c48srctap 1.0.2')],
              ".github/workflows/release-recertify.yml": [('RELEASE_TAG: 1.0.1-RC1', 'RELEASE_TAG: 1.0.2-RC1')],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit("version marker missing: " + name + " :: " + old)
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          exp_path = Path("compiler/release_expectations.json")
          exp = json.loads(exp_path.read_text(encoding="ascii"))
          if exp.get("version") != "1.0.1":
              raise SystemExit("unexpected release expectation version")
          if exp.get("test_count") != 371:
              raise SystemExit("unexpected test count")
          exp["version"] = "1.0.2"
          exp_path.write_text(
              json.dumps(exp, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )

          for name in (
              ".github/workflows/doc-preview.yml",
              ".github/workflows/doc-source-tape-sweep.yml",
              ".github/workflows/finalize-102.yml",
          ):
              Path(name).unlink(missing_ok=True)

      - name: Verify source tree
        run: python -B compiler/verify_release.py

      - name: Commit release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git add -A
          git diff --cached --check
          python - <<'PY'
          import re
          import subprocess

          raw = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          )
          names = [p for p in raw.decode("utf-8").split("\0") if p]
          added = subprocess.check_output(
              ["git", "diff", "--cached", "--unified=0", "--no-color"],
              text=True,
          )
          added = "\n".join(
              line[1:] for line in added.splitlines()
              if line.startswith("+") and not line.startswith("+++")
          )
          data = ("\n".join(names) + "\n" + added).encode("utf-8").lower()
          terms = tuple(
              bytes.fromhex(item)
              for item in (
                  "636c61756465",
                  "636f646578",
                  "6f70656e6169",
                  "63686174677074",
                  "6172746966696369616c20696e74656c6c6967656e6365",
              )
          )
          if any(term in data for term in terms):
              raise SystemExit("forbidden project term in staged additions")
          if re.search(rb"(^|[^a-z0-9_])ai([^a-z0-9_]|$)", data):
              raise SystemExit("forbidden whole-word term in staged additions")
          PY
          git commit -m "Prepare certified 1.0.2 source"
          git push origin main
