name: Package formal SDK ZIP once

on:
  push:
    paths:
      - '.github/workflows/package-formal-zip-once.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove one-shot workflow from product tree
        shell: bash
        run: |
          set -euo pipefail
          product_sha="$(git rev-parse HEAD^)"
          echo "PRODUCT_SHA=$product_sha" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/package-formal-zip-once.yml
          git commit -m 'ci: remove one-shot formal ZIP packager'
      - name: Build and verify formal ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="zx-ux-c48-sdk-${version}-formal-${PRODUCT_SHA}.zip"
          prefix="zx-ux-c48-sdk-${version}/"
          python -B compiler/build_release_candidate.py --archive "$archive" --prefix "$prefix"
          unzip -Z1 "$archive" > zip-names.txt
          test "$(grep -Ec '^zx-ux-c48-sdk-[^/]+/docs/04-C48 Language Specification Rev [0-9]+(\.[0-9]+)*\.docx$' "$names" 2>/dev/null || grep -Ec '^zx-ux-c48-sdk-[^/]+/docs/04-C48 Language Specification Rev [0-9]+(\.[0-9]+)*\.docx$' zip-names.txt)" -eq 1
          ! grep -Fq '/docs/ZX-UX C48 Language Specification.md' zip-names.txt
          rm -rf virgin
          mkdir virgin
          unzip -q "$archive" -d virgin
          root="$(find virgin -mindepth 1 -maxdepth 1 -type d -print -quit)"
          C48_REQUIRE_PACKAGED_SPEC=1 python -B "$root/compiler/verify_release.py"
          sha256sum "$archive" > FORMAL-ZIP-SHA256.txt
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          rm -f C48-SPECIFICATION.json zip-names.txt
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload formal ZIP
        uses: actions/upload-artifact@v4
        with:
          name: formal-sdk-${{ env.PRODUCT_SHA }}
          path: |
            ${{ env.ARCHIVE }}
            FORMAL-ZIP-SHA256.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Restore main product tree
        shell: bash
        run: git push origin HEAD:main
