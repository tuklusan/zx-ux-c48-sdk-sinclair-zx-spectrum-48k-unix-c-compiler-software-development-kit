name: C48 graphics demo reel

"on":
  push:
    branches: [main, graphics-demos-21]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: ${{ matrix.demo }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        include:
          - {demo: goblet, os: ubuntu-latest}
          - {demo: tunnel, os: windows-latest}
          - {demo: city, os: ubuntu-latest}
          - {demo: terrain, os: windows-latest}
          - {demo: ocean, os: macos-latest}
          - {demo: torus, os: ubuntu-latest}
          - {demo: mobius, os: windows-latest}
          - {demo: morph3d, os: macos-latest}
          - {demo: warp, os: ubuntu-latest}
          - {demo: galaxy, os: windows-latest}
          - {demo: orrery, os: macos-latest}
          - {demo: firework, os: ubuntu-latest}
          - {demo: sprites, os: windows-latest}
          - {demo: plasma, os: macos-latest}
          - {demo: kaleido, os: ubuntu-latest}
          - {demo: moire, os: windows-latest}
          - {demo: mandel, os: ubuntu-latest}
          - {demo: julia, os: windows-latest}
          - {demo: forest, os: macos-latest}
          - {demo: raymaze, os: macos-latest}
          - {demo: showcase, os: macos-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify assigned graphics demo
        run: >-
          python -B compiler/verify_graphics_demos.py
          --demo "${{ matrix.demo }}"
          --runner "${{ matrix.os }}"
          --evidence-dir runner-evidence

      - name: Upload runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: graphics-${{ matrix.demo }}-${{ matrix.os }}
          path: runner-evidence/
          if-no-files-found: error
