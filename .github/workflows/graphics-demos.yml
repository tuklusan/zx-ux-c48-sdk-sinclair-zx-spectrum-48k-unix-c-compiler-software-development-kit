name: C48 graphics demo reel

"on":
  push:
    branches: [main]
    paths:
      # Only files that can change compiler/demo execution belong here.
      # Documentation and image-only edits must not fan out into 21 runners.
      - "VERSION"
      - "compiler/**/*.py"
      - "compiler/**/*.json"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/demos/**/*.c"
      - "usr/src/demos/**/*.h"
      - "usr/bin/demos/**/*.c48b"
      - "usr/src/c48host.h"
      - "c48"
      - "c48.bat"
      - "c48run"
      - "c48run.bat"
      - ".github/workflows/graphics-demos.yml"
  pull_request:
    paths:
      - "VERSION"
      - "compiler/**/*.py"
      - "compiler/**/*.json"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/demos/**/*.c"
      - "usr/src/demos/**/*.h"
      - "usr/bin/demos/**/*.c48b"
      - "usr/src/c48host.h"
      - "c48"
      - "c48.bat"
      - "c48run"
      - "c48run.bat"
      - ".github/workflows/graphics-demos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demo:
    name: ${{ matrix.demo }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        include:
          - {demo: goblet, os: ubuntu-latest}
          - {demo: tunnel, os: windows-latest}
          - {demo: city, os: ubuntu-latest}
          - {demo: terrain, os: windows-latest}
          - {demo: ocean, os: macos-latest}
          - {demo: torus, os: ubuntu-latest}
          - {demo: mobius, os: windows-latest}
          - {demo: morph3d, os: macos-latest}
          - {demo: warp, os: ubuntu-latest}
          - {demo: galaxy, os: windows-latest}
          - {demo: orrery, os: macos-latest}
          - {demo: firework, os: ubuntu-latest}
          - {demo: sprites, os: windows-latest}
          - {demo: spriteanim, os: ubuntu-latest}
          - {demo: plasma, os: macos-latest}
          - {demo: kaleido, os: ubuntu-latest}
          - {demo: moire, os: windows-latest}
          - {demo: mandel, os: ubuntu-latest}
          - {demo: julia, os: windows-latest}
          - {demo: forest, os: macos-latest}
          - {demo: raymaze, os: macos-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify assigned graphics demo
        run: >-
          python -B compiler/verify_graphics_demos.py
          --demo "${{ matrix.demo }}"
          --runner "${{ matrix.os }}"
          --evidence-dir runner-evidence

      - name: Upload runner build and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: graphics-${{ matrix.demo }}-${{ matrix.os }}-${{ github.sha }}
          path: runner-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  release-evidence:
    name: Aggregate graphics release evidence
    needs: demo
    if: ${{ needs.demo.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all runner evidence
        uses: actions/download-artifact@v4
        with:
          pattern: graphics-*-${{ github.sha }}
          path: graphics-release-evidence
          merge-multiple: true

      - name: Build evidence manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path("graphics-release-evidence")
          expected = {".c48b": 21, ".scr": 21, ".png": 21, ".json": 21}
          for suffix, count in expected.items():
              actual = len(list(root.glob(f"*{suffix}")))
              if actual != count:
                  raise SystemExit(
                      f"release evidence {suffix}: expected {count}, found {actual}"
                  )
          metadata = {
              "schema": 1,
              "commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "demo_count": 21,
              "per_demo_files": ["c48b", "scr", "png", "json"],
          }
          (root / "RELEASE-EVIDENCE.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="ascii",
              newline="\n",
          )
          members = sorted(
              p for p in root.iterdir()
              if p.is_file() and p.name != "SHA256SUMS"
          )
          (root / "SHA256SUMS").write_text(
              "".join(
                  f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
                  for p in members
              ),
              encoding="ascii",
              newline="\n",
          )
          PY

      - name: Upload combined release evidence
        uses: actions/upload-artifact@v4
        with:
          name: graphics-release-evidence-${{ github.sha }}
          path: graphics-release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
