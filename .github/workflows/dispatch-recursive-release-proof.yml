name: Dispatch recursive release proof

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-recursive-release-proof.yml"

permissions:
  contents: write
  actions: write

env:
  TARGET_SHA: 6f964408a67bff074f2f4ef5785f6aaaee9e3373
  TEMP_TAG: _recursive-release-proof-target

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dispatch exact-target recursive proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}"             >/dev/null 2>&1 || true
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/git/refs"             -f ref="refs/tags/${TEMP_TAG}"             -f sha="${TARGET_SHA}" >/dev/null
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/recursive-examples.yml/dispatches"             -f ref="${TEMP_TAG}" >/dev/null

      - name: Require exact-target success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              f"recursive-examples.yml/runs?head_sha={target}"
              "&event=workflow_dispatch&per_page=20"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "zx-ux-c48-recursive-release-proof",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.monotonic() + 50 * 60
          while time.monotonic() < deadline:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              runs = [
                  item for item in data.get("workflow_runs", [])
                  if item.get("head_sha") == target
                  and item.get("event") == "workflow_dispatch"
              ]
              runs.sort(
                  key=lambda item: int(item.get("run_number", 0)),
                  reverse=True,
              )
              if runs:
                  run = runs[0]
                  status = str(run.get("status", ""))
                  conclusion = run.get("conclusion")
                  print(
                      f"recursive proof run={run['id']} "
                      f"status={status} conclusion={conclusion}",
                      flush=True,
                  )
                  if status == "completed":
                      if conclusion != "success":
                          raise SystemExit(
                              f"recursive proof failed: {conclusion}"
                          )
                      break
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for recursive proof")
          PY

      - name: Remove temporary tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}"             >/dev/null 2>&1 || true
