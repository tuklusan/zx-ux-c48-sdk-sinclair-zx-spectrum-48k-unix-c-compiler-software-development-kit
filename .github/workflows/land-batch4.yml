name: Land Batch-4 review fixes

"on":
  push:
    branches: [main]
    paths:
      - ".github/land_batch4.py"
      - ".github/workflows/land-batch4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.13"]
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Apply Batch-4 patch and run complete verifier
        run: python -B .github/land_batch4.py verify

  land:
    name: certify and land
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out fresh main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply, SoP-certify, commit, and push
        run: python -B .github/land_batch4.py land
