name: Publish demo relocation full release

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-demo-relocation-1.0.0.yml"

permissions:
  contents: write
  actions: write

env:
  TARGET_SHA: 783da8e47ede152e8734ceb41f4a27f16781bfdb
  TEMP_TAG: _demo-relocation-release-target
  RC_TAG: 1.0.0-RC5
  FINAL_TAG: 1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Dispatch exact-target recertification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}" >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TEMP_TAG}" -f sha="${TARGET_SHA}" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release-recertify.yml/dispatches" -f ref="${TEMP_TAG}" >/dev/null

      - name: Wait for exact-target recertification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/release-recertify.yml/runs?head_sha={target}&event=workflow_dispatch&per_page=20"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "zx-ux-c48-release-finalizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.monotonic() + 5 * 60 * 60
          while time.monotonic() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              runs = [
                  x for x in data.get("workflow_runs", [])
                  if x.get("head_sha") == target and x.get("event") == "workflow_dispatch"
              ]
              runs.sort(key=lambda x: int(x.get("run_number", 0)), reverse=True)
              if runs:
                  run = runs[0]
                  print(f"recertification run={run['id']} status={run.get('status')} conclusion={run.get('conclusion')}", flush=True)
                  if run.get("status") == "completed":
                      if run.get("conclusion") != "success":
                          raise SystemExit(f"recertification failed: {run.get('conclusion')}")
                      Path("recertify-run.txt").write_text(f"{run['id']}\n", encoding="ascii")
                      break
              time.sleep(20)
          else:
              raise SystemExit("timed out waiting for recertification")
          PY

      - name: Download certified prerelease bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}" --jq .object.sha)"
          test "${resolved}" = "${TARGET_SHA}"
          MAIN_RC="zx-ux-c48-sdk-${RC_TAG}-${TARGET_SHA}.zip"
          GUI_RC="c48-${RC_TAG}-gui-evidence-${TARGET_SHA}.zip"
          mkdir -p rc
          gh release download "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${MAIN_RC}" --pattern "${GUI_RC}" --pattern "RC5-RELEASE-METADATA.json" --pattern "SHA256SUMS-${RC_TAG}.txt" --dir rc
          test -s "rc/${MAIN_RC}"
          test -s "rc/${GUI_RC}"

      - name: Prepare final assets
        shell: bash
        run: |
          set -euo pipefail
          MAIN_RC="zx-ux-c48-sdk-${RC_TAG}-${TARGET_SHA}.zip"
          GUI_RC="c48-${RC_TAG}-gui-evidence-${TARGET_SHA}.zip"
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${TARGET_SHA}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${TARGET_SHA}.zip"
          cp "rc/${MAIN_RC}" "${MAIN_FINAL}"
          cp "rc/${GUI_RC}" "${GUI_FINAL}"
          MAIN_FINAL="${MAIN_FINAL}" GUI_FINAL="${GUI_FINAL}" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          data = {
              "schema": 4,
              "release": os.environ["FINAL_TAG"],
              "release_commit": os.environ["TARGET_SHA"],
              "recertification_run": int(Path("recertify-run.txt").read_text(encoding="ascii").strip()),
              "demo_count": 24,
              "frame_demo_count": 22,
              "recursive_demo_count": 2,
              "change": "Relocate Hanoi and 8-Queens into the demos corpus.",
              "assets": {
                  os.environ["MAIN_FINAL"]: sha(os.environ["MAIN_FINAL"]),
                  os.environ["GUI_FINAL"]: sha(os.environ["GUI_FINAL"]),
              },
          }
          Path("RELEASE-METADATA-1.0.0.json").write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="ascii", newline="\n")
          PY
          META="RELEASE-METADATA-1.0.0.json"
          SUMS="SHA256SUMS-1.0.0.txt"
          {
            sha256sum "${MAIN_FINAL}"
            sha256sum "${GUI_FINAL}"
            sha256sum "${META}"
          } > "${SUMS}"
          cat > release-notes.md <<EOF
          # C48 SDK 1.0.0

          This refreshed full **1.0.0** release classifies Towers of Hanoi and
          8-Queens as demos and moves their source, compiled programs, and
          screenshots into the demos corpus.

          The release was rebuilt and recertified from exact commit
          `${TARGET_SHA}` through the complete verification, sound, desktop,
          graphics, recursive-demo, package, and virgin-package gates.

          **Main package:** `${MAIN_FINAL}`

          Requires Python 3.10 or newer.
          EOF

      - name: Publish refreshed final release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${TARGET_SHA}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${TARGET_SHA}.zip"
          META="RELEASE-METADATA-1.0.0.json"
          SUMS="SHA256SUMS-1.0.0.txt"
          gh release upload "${FINAL_TAG}" "${MAIN_FINAL}" "${GUI_FINAL}" "${META}" "${SUMS}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${FINAL_TAG}" -f sha="${TARGET_SHA}" -F force=true >/dev/null
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" --jq .id)"
          body="$(cat release-notes.md)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f tag_name="${FINAL_TAG}" -f target_commitish="${TARGET_SHA}" -f name="C48 SDK 1.0.0" -f body="${body}" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --paginate --jq '.[] | [.id,.name] | @tsv' > assets.tsv
          while IFS=$'\t' read -r id name; do
            case "${name}" in
              "${MAIN_FINAL}"|"${GUI_FINAL}"|"${META}"|"${SUMS}") ;;
              *) gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" ;;
            esac
          done < assets.tsv

      - name: Verify final publication and cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FINAL_TAG}" --jq .object.sha)"
          test "${resolved}" = "${TARGET_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" > published.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path("published.json").read_text(encoding="utf-8"))
          if r.get("draft") or r.get("prerelease"):
              raise SystemExit("final release is not normally published")
          if r.get("target_commitish") != os.environ["TARGET_SHA"]:
              raise SystemExit("final release target mismatch")
          expected = {
              f"zx-ux-c48-sdk-{os.environ['FINAL_TAG']}-{os.environ['TARGET_SHA']}.zip",
              f"c48-{os.environ['FINAL_TAG']}-gui-evidence-{os.environ['TARGET_SHA']}.zip",
              "RELEASE-METADATA-1.0.0.json",
              "SHA256SUMS-1.0.0.txt",
          }
          actual = {x["name"] for x in r.get("assets", [])}
          if actual != expected:
              raise SystemExit(f"release asset set mismatch: {sorted(actual)}")
          print("FINAL RELEASE VERIFY PASS")
          PY
          gh release delete "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}" >/dev/null 2>&1 || true
