name: ailmzx48 iteration 50 diagnostic

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-iter50-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test context reference
        run: python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test A48M reference
        run: python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Prepare ephemeral diagnostic request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("usr/src/ailmzx48/training/requests/iter-0050.json")
          req = json.loads(src.read_text(encoding="utf-8"))
          req.pop("final_expected_keyword", None)
          Path("/tmp/iter-0050-diagnostic.json").write_text(
              json.dumps(req, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Replay iteration without early final-keyword abort
        run: python -B usr/src/ailmzx48/tooling/run_iteration.py --request /tmp/iter-0050-diagnostic.json --max-seconds 1200

      - name: Print terminal context diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("usr/src/ailmzx48/conversations/iter-0050/transcript.json")
          if not p.exists():
              print(json.dumps({"transcript": "missing"}))
              raise SystemExit(0)
          t = json.loads(p.read_text(encoding="utf-8"))
          turns = t.get("turns", [])
          def total(key):
              return sum(int(x.get("diag", {}).get(key, 0)) for x in turns)
          def maximum(key):
              return max((int(x.get("diag", {}).get(key, 0)) for x in turns), default=0)
          out = {
              "turn_count": len(turns),
              "final_turn": turns[-1] if turns else None,
              "last_six": turns[-6:],
              "final_diag": t.get("final_diag"),
              "context_compactions": total("ai_compact"),
              "semantic_uses": total("ai_semuse"),
              "max_l0bytes": maximum("ai_l0bytes"),
              "max_l1count": maximum("ai_l1count"),
              "max_l2count": maximum("ai_l2count"),
              "max_lmcount": maximum("ai_lmcount"),
              "literal_losses": total("ai_litloss"),
          }
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
