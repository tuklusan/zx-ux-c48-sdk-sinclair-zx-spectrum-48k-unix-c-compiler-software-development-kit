name: Apply RC1 freeze

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-rc1-freeze.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply audited freeze and verify before push
        shell: bash
        run: python -B tools/rc1_freeze.py
