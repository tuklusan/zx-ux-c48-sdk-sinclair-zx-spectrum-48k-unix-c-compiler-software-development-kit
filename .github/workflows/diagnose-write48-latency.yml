name: Diagnose write48 latency

on:
  push:
    paths:
      - '.github/workflows/diagnose-write48-latency.yml'
      - '.github/diag_write48_fast.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Benchmark incremental typing candidate
        run: python -B .github/diag_write48_fast.py
