name: Diagnose write48 latency

on:
  push:
    paths:
      - '.github/workflows/diagnose-write48-latency.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Benchmark current and optimized variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, time, shutil

          root = Path.cwd()
          src = root / 'usr/src/apps/write48.c'
          original = src.read_text(encoding='utf-8')
          payloads = {
              '1char': b'ia\x1bq',
              '10char': b'iabcdefghij\x1bq',
              '40char': b'iabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN\x1bq',
          }

          def compile_to(name):
              out = root / f'usr/bin/apps/{name}.c48b'
              cp = subprocess.run(['python','-B','compiler/c48.py',str(src),'-o',str(out)], text=True, capture_output=True)
              if cp.returncode:
                  print(cp.stdout); print(cp.stderr); raise SystemExit(cp.returncode)
              return out

          def bench(label, binary):
              print(f'=== {label} ===')
              for pname, data in payloads.items():
                  samples=[]
                  for _ in range(3):
                      t0=time.perf_counter()
                      cp=subprocess.run(['python','-B','compiler/c48run.py','--headless',str(binary)], input=data, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=60)
                      dt=time.perf_counter()-t0
                      if cp.returncode:
                          print(cp.stderr.decode(errors='replace')); raise SystemExit(cp.returncode)
                      samples.append(dt)
                  print(pname, ' '.join(f'{x:.4f}' for x in samples), 'best', f'{min(samples):.4f}')

          current = compile_to('write48-current-diag')
          bench('current', current)

          text = original.replace(
              "    i = wr_len;\n    while (i > wr_cur) {\n        wr_doc[i] = wr_doc[i - 1];\n        i--;\n    }\n    wr_doc[wr_cur] = (char)c;\n",
              "    i = wr_len - wr_cur;\n    if (i > 0)\n        memmove(wr_doc + wr_cur + 1, wr_doc + wr_cur, (unsigned int)i);\n    wr_doc[wr_cur] = (char)c;\n",
          ).replace(
              "    i = pos;\n    while (i < wr_len) {\n        wr_doc[i] = wr_doc[i + 1];\n        i++;\n    }\n    wr_len--;\n",
              "    i = wr_len - pos;\n    memmove(wr_doc + pos, wr_doc + pos + 1, (unsigned int)i);\n    wr_len--;\n",
          )
          if text == original:
              raise SystemExit('memmove transformation did not apply')
          src.write_text(text, encoding='utf-8', newline='\n')
          memmove_bin = compile_to('write48-memmove-diag')
          bench('memmove', memmove_bin)

          text2 = text.replace('#include "appapi.h"\n', '#include "appapi.h"\nvoid *memset(void *d, int c, unsigned int n);\n')
          text2 = text2.replace(
              "    int i;\n    for (i = 0; i < 1140; i++) {\n        wr_next[i] = ' ';\n        wr_ninv[i] = 0;\n    }\n",
              "    memset(wr_next, ' ', 1140u);\n    memset(wr_ninv, 0, 1140u);\n",
          )
          if text2 == text:
              raise SystemExit('memset transformation did not apply')
          src.write_text(text2, encoding='utf-8', newline='\n')
          memset_bin = compile_to('write48-memmove-memset-diag')
          bench('memmove+memset', memset_bin)

          # Renderer cost, independent of Tk.
          from compiler.c48.gui import render_snapshot_frame_rgb
          from compiler.c48.screen import ZXScreen
          screen=ZXScreen(); snap=screen.bytes()
          n=200
          t0=time.perf_counter()
          for _ in range(n):
              render_snapshot_frame_rgb(snap, 0, False)
          dt=time.perf_counter()-t0
          print('renderer_ms_per_frame', f'{dt*1000/n:.3f}')
          PY
