name: Diagnose write48 latency

on:
  push:
    paths:
      - '.github/workflows/diagnose-write48-latency.yml'
      - '.github/diag_write48_fast.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Benchmark incremental typing candidate
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's/wr_draw_fast_row/wr_frow/g' \
            -e 's/wr_fast_insert_char/wr_fins/g' \
            -e 's/wr_fast_backspace/wr_fbs/g' \
            .github/diag_write48_fast.py
          python -B .github/diag_write48_fast.py
