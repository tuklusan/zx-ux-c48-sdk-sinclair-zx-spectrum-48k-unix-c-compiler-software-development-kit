name: SoP three fresh-disk scans

"on":
  push:
    branches:
      - dev/deferred-wrap

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        scan_id: [1, 2, 3]
    name: fresh-disk-scan-${{ matrix.scan_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove scan-only workflow from disk copy
        shell: bash
        run: rm .github/workflows/sop-scan-once.yml

      - name: Verify fresh disk copy
        shell: bash
        run: python -B compiler/verify_release.py

      - name: Emit changed files line by line
        shell: bash
        run: |
          set -euo pipefail
          files=(
            compiler/c48/screen.py
            compiler/tests/test_deferred_wrap.py
            compiler/release_expectations.json
            doc/CONFORMANCE.md
            doc/HOST-DIVERGENCES.md
            doc/RELEASE-NOTES.md
            MANIFEST.sha256
          )
          for f in "${files[@]}"; do
            echo "===== BEGIN ${f} ====="
            sha256sum "$f"
            nl -ba "$f"
            echo "===== END ${f} ====="
          done
