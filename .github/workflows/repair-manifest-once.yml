name: One-shot manifest repair

"on":
  push:
    branches:
      - dev/deferred-wrap

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Regenerate manifest and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/repair-manifest-once.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {rel.as_posix()}")
          Path('MANIFEST.sha256').write_text('\n'.join(rows) + '\n', encoding='ascii')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Regenerate manifest after deferred-wrap regression expansion"
          git push origin HEAD:dev/deferred-wrap
