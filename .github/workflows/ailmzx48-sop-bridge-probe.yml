name: ailmzx48 SoP learned bridge probe

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-bridge-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Measure learned bridge coverage
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json /tmp/bridge-model.json \
            --out-h /tmp/bridge-aimod.h \
            --iteration 9128
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          words_re = re.compile(r"[a-z0-9]+")
          gap_words = (
              "a", "an", "the", "and", "in", "on", "at",
              "for", "with", "by", "of", "from", "to", "style",
          )
          corpus = json.loads(Path(
              "usr/src/ailmzx48/training/seed_corpus.json"
          ).read_text())
          model = json.loads(Path("/tmp/bridge-model.json").read_text())
          vocab = model["vocab"]
          ids = {word: index for index, word in enumerate(vocab)}
          topics = {name: index for index, name in enumerate(model["topics"])}
          vcnt = len(vocab)
          n1 = model["next_primary"]
          n2 = model["next_secondary"]
          tri = {
              (row["first"], row["second"]): (
                  row["next_primary"], row["next_secondary"]
              )
              for row in model["trigram_contexts"]
          }
          rows = []
          internal = 0
          primary_exact = 0
          either_exact = 0
          no_hot_context = 0
          for index, record in enumerate(corpus["records"]):
              if record.get("kind") != "fact-user":
                  continue
              words = words_re.findall(record["text"].lower())
              triggers = {
                  str(word).lower() for word in record.get("triggers", [])
              }
              gap = -1
              for filler in gap_words:
                  for at, word in enumerate(words):
                      if word != filler or word in triggers:
                          continue
                      if at == len(words) - 1:
                          continue
                      if at == 0 and filler not in ("a", "an", "the"):
                          continue
                      gap = at
                      break
                  if gap >= 0:
                      break
              if gap < 0:
                  raise SystemExit(f"record {index} has no candidate gap")
              if gap == 0:
                  rows.append({
                      "record": index,
                      "gap": gap,
                      "word": words[gap],
                      "mode": "leading-gap-covered-by-lead",
                  })
                  continue
              internal += 1
              cur = ids.get(words[gap - 1], 0)
              prev = ids.get(words[gap - 2], 0) if gap > 1 else 0
              first = 0
              second = 0
              if prev and cur and (prev, cur) in tri:
                  first, second = tri[(prev, cur)]
              if first == 0 and cur:
                  base = topics[record["topic"]] * vcnt
                  first = n1[base + cur]
                  second = n2[base + cur]
              if cur == 0:
                  no_hot_context += 1
              p1 = vocab[first] if 0 < first < vcnt else None
              p2 = vocab[second] if 0 < second < vcnt else None
              if p1 == words[gap]:
                  primary_exact += 1
              if words[gap] in (p1, p2):
                  either_exact += 1
              rows.append({
                  "record": index,
                  "topic": record["topic"],
                  "gap": gap,
                  "word": words[gap],
                  "prev2": words[gap - 2] if gap > 1 else None,
                  "prev1": words[gap - 1],
                  "primary": p1,
                  "secondary": p2,
                  "next_anchor": words[gap + 1],
              })
          report = {
              "fact_records": len(rows),
              "internal_gaps": internal,
              "primary_exact": primary_exact,
              "primary_or_secondary_exact": either_exact,
              "no_hot_preceding_context": no_hot_context,
              "mismatches": [
                  row for row in rows
                  if row.get("mode") is None and
                  row["word"] not in (row["primary"], row["secondary"])
              ],
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          raise SystemExit(
              "diagnostic-only learned bridge probe complete; "
              "candidate intentionally not qualified"
          )
          PY
