name: ailmzx48 SoP learned bridge probe

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-bridge-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Search all learned-compatible filler gaps
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json /tmp/bridge-model.json \
            --out-h /tmp/bridge-aimod.h \
            --iteration 9128
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          words_re = re.compile(r"[a-z0-9]+")
          gap_words = {
              "a", "an", "the", "and", "in", "on", "at",
              "for", "with", "by", "of", "from", "to", "style",
          }
          corpus = json.loads(Path(
              "usr/src/ailmzx48/training/seed_corpus.json"
          ).read_text())
          model = json.loads(Path("/tmp/bridge-model.json").read_text())
          vocab = model["vocab"]
          ids = {word: index for index, word in enumerate(vocab)}
          topics = {name: index for index, name in enumerate(model["topics"])}
          vcnt = len(vocab)
          n1 = model["next_primary"]
          n2 = model["next_secondary"]
          tri = {
              (row["first"], row["second"]): (
                  row["next_primary"], row["next_secondary"]
              )
              for row in model["trigram_contexts"]
          }

          def learned(record, words, at):
              if at == 0:
                  return ("LEAD", None)
              cur = ids.get(words[at - 1], 0)
              prev = ids.get(words[at - 2], 0) if at > 1 else 0
              first = second = 0
              if prev and cur and (prev, cur) in tri:
                  first, second = tri[(prev, cur)]
              if first == 0 and cur:
                  base = topics[record["topic"]] * vcnt
                  first = n1[base + cur]
                  second = n2[base + cur]
              p1 = vocab[first] if 0 < first < vcnt else None
              p2 = vocab[second] if 0 < second < vcnt else None
              return p1, p2

          rows = []
          viable = 0
          primary_viable = 0
          lead_viable = 0
          for index, record in enumerate(corpus["records"]):
              if record.get("kind") != "fact-user":
                  continue
              words = words_re.findall(record["text"].lower())
              triggers = {
                  str(word).lower() for word in record.get("triggers", [])
              }
              candidates = []
              for at, word in enumerate(words):
                  if word not in gap_words or word in triggers:
                      continue
                  if at == len(words) - 1:
                      continue
                  if at == 0 and word not in ("a", "an", "the"):
                      continue
                  p1, p2 = learned(record, words, at)
                  exact = (
                      at == 0 or word == p1 or word == p2
                  )
                  candidates.append({
                      "gap": at,
                      "word": word,
                      "primary": p1,
                      "secondary": p2,
                      "exact": exact,
                      "prev2": words[at - 2] if at > 1 else None,
                      "prev1": words[at - 1] if at > 0 else None,
                      "next_anchor": words[at + 1],
                  })
              exacts = [candidate for candidate in candidates if candidate["exact"]]
              if exacts:
                  viable += 1
                  if exacts[0]["gap"] == 0:
                      lead_viable += 1
                  elif exacts[0]["word"] == exacts[0]["primary"]:
                      primary_viable += 1
              rows.append({
                  "record": index,
                  "topic": record["topic"],
                  "text": record["text"],
                  "viable": exacts,
                  "candidates": candidates,
              })
          report = {
              "fact_records": len(rows),
              "records_with_learned_compatible_gap": viable,
              "records_without_learned_compatible_gap": len(rows) - viable,
              "first_viable_is_leading": lead_viable,
              "first_viable_is_primary": primary_viable,
              "uncovered_records": [
                  row for row in rows if not row["viable"]
              ],
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          raise SystemExit(
              "diagnostic-only all-gap bridge probe complete; "
              "candidate intentionally not qualified"
          )
          PY
