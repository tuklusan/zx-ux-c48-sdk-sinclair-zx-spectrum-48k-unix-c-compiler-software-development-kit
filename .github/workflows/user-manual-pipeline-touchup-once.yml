name: User Manual pipeline touch-up

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/user-manual-pipeline-touchup-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-docx==1.2.0 pillow==11.3.0
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          fi

      - name: Add explicit native cross-development pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.oxml import OxmlElement
          from docx.text.paragraph import Paragraph

          path = Path("docs/ZX-UX C48 SDK User Manual.docx")
          doc = Document(path)
          heading = "6.7 Native executable tape cross-development"
          anchors = [p for p in doc.paragraphs if p.text == heading]
          if len(anchors) != 1:
              raise SystemExit(f"heading count is {len(anchors)}")

          pipeline = (
              "The end-to-end host cross-development pipeline is: C source -> c48 -> "
              "validated C48B1 -> c48b2tap -> native ZX-UX artifacts. c48 produces the "
              "validated C48B1 host representation; c48b2tap then emits relocatable native "
              "Z80 OBJ1, linked native ZX-UX MEX1 executable images, or Spectrum .tap images "
              "containing the complete MEX1 as an M48O version-1 RAW BIN object suitable for "
              "loading into ZX-UX."
          )
          if any(p.text == pipeline for p in doc.paragraphs):
              raise SystemExit("pipeline paragraph already present")

          anchor = anchors[0]
          node = OxmlElement("w:p")
          anchor._p.addnext(node)
          para = Paragraph(node, anchor._parent)
          para.style = "Body Text"
          para.add_run(pipeline)

          doc.core_properties.author = "SANYALnet Labs"
          doc.core_properties.last_modified_by = "SANYALnet Labs"
          doc.save(path)
          PY

      - name: Check manual structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from docx import Document
          path = "docs/ZX-UX C48 SDK User Manual.docx"
          doc = Document(path)
          text = "\n".join(p.text for p in doc.paragraphs)
          markers = [
              "6.7 Native executable tape cross-development",
              "C source -> c48 -> validated C48B1 -> c48b2tap -> native ZX-UX artifacts",
              "relocatable native Z80 OBJ1",
              "linked native ZX-UX MEX1 executable images",
              "M48O version-1 RAW BIN object suitable for loading into ZX-UX",
          ]
          for marker in markers:
              if marker not in text:
                  raise SystemExit(f"missing marker: {marker}")
          if text.count("C source -> c48 -> validated C48B1 -> c48b2tap -> native ZX-UX artifacts") != 1:
              raise SystemExit("pipeline marker is not unique")
          if doc.core_properties.author != "SANYALnet Labs":
              raise SystemExit("author metadata drift")
          PY
          git diff --quiet -- usr/src/demos usr/src/examples usr/src/apps

      - name: Render every User Manual page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pdf qa/pages
          libreoffice --headless --convert-to pdf --outdir qa/pdf "docs/ZX-UX C48 SDK User Manual.docx" >/tmp/lo.txt 2>&1 || { cat /tmp/lo.txt; exit 1; }
          pdf="qa/pdf/ZX-UX C48 SDK User Manual.pdf"
          test -s "$pdf"
          pdftoppm -png -r 150 "$pdf" "qa/pages/page" >/dev/null 2>&1
          test "$(find qa/pages -type f -name 'page-*.png' | wc -l)" -gt 0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          pages = sorted(Path("qa/pages").glob("page-*.png"))
          thumbs = []
          for page in pages:
              image = Image.open(page).convert("RGB")
              image.thumbnail((360, 480))
              thumbs.append((page.name, image.copy()))
          cols = 4
          cell_w, cell_h = 380, 525
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new("RGB", (cols * cell_w, rows * cell_h), "white")
          draw = ImageDraw.Draw(sheet)
          for index, (name, image) in enumerate(thumbs):
              x = (index % cols) * cell_w + 10
              y = (index // cols) * cell_h + 30
              sheet.paste(image, (x, y))
              draw.text((x, y - 22), name, fill="black")
          sheet.save("qa/user-manual-contact-sheet.png")
          PY

      - name: Commit manual and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/user-manual-pipeline-touchup-once.yml
          git diff --quiet -- usr/src/demos usr/src/examples usr/src/apps
          git config user.name "SANYALnet Labs Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "docs/ZX-UX C48 SDK User Manual.docx" .github/workflows/user-manual-pipeline-touchup-once.yml
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/user-manual-pipeline-touchup-once.yml' 'docs/ZX-UX C48 SDK User Manual.docx' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          mv qa "$RUNNER_TEMP/user-manual-pipeline-qa"
          python -B compiler/check_license_headers.py
          git commit -m "Clarify User Manual native pipeline"
          git push origin HEAD:main
          mv "$RUNNER_TEMP/user-manual-pipeline-qa" qa

      - name: Preserve rendered manual evidence
        uses: actions/upload-artifact@v4
        with:
          name: user-manual-pipeline-touchup-${{ github.run_id }}
          path: qa/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
