      - name: Prove three successive scans are identical
        shell: bash
        run: |
          set -euo pipefail
          cmp "${RUNNER_TEMP}/scan1.manifest" "${RUNNER_TEMP}/scan2.manifest"
          cmp "${RUNNER_TEMP}/scan2.manifest" "${RUNNER_TEMP}/scan3.manifest"
          cmp "${RUNNER_TEMP}/scan1.summary" "${RUNNER_TEMP}/scan2.summary"
          cmp "${RUNNER_TEMP}/scan2.summary" "${RUNNER_TEMP}/scan3.summary"
          cat "${RUNNER_TEMP}/scan1.summary"
          echo "SOP CERTIFICATION PASS: 3 successive fresh byte scans; zero new defects"

      - name: Remove one-shot harness and restore certified tree exactly
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          certified_tree=26d185f23403a4998d5d5fd4e14dce110c48aeac
          git rm .github/workflows/sop-certify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove one-shot SoP certification harness"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_tree" = "$certified_tree"
          git push origin HEAD:main
