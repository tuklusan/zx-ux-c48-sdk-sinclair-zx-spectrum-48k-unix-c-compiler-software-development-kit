# Temporary one-shot certification harness. It removes itself after success.
name: One-shot three-pass SoP certification

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/sop-certify.yml"

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out certification control commit
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 2
          lfs: true

      - name: Guard exact certification target
        shell: bash
        run: |
          set -euo pipefail
          target=866a36deca57b01ff9b57ebc470d30fed50b5bdc
          target_tree=26d185f23403a4998d5d5fd4e14dce110c48aeac
          test "$(git -C control rev-parse HEAD^)" = "$target"
          test "$(git -C control rev-parse "$target^{tree}")" = "$target_tree"
          actual="$(git -C control diff --name-only "$target" HEAD)"
          test "$actual" = ".github/workflows/sop-certify.yml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fresh checkout 1
        uses: actions/checkout@v4
        with:
          ref: 866a36deca57b01ff9b57ebc470d30fed50b5bdc
          path: scan1
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Fresh-byte scan 1
        shell: bash
        env:
          SCAN_DIR: scan1
          MANIFEST: ${{ runner.temp }}/scan1.manifest
          SUMMARY: ${{ runner.temp }}/scan1.summary
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["SCAN_DIR"])
          expected = "866a36deca57b01ff9b57ebc470d30fed50b5bdc"
          head = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
          ).strip()
          if head != expected:
              raise SystemExit(f"wrong scan commit: {head}")
          if subprocess.check_output(
              ["git", "-C", str(root), "status", "--porcelain"]
          ):
              raise SystemExit("fresh checkout is dirty before scan")

          raw = subprocess.check_output(
              ["git", "-C", str(root), "ls-files", "-z"]
          )
          names = [p for p in raw.split(b"\0") if p]
          manifest = []
          files = lines = byte_count = 0
          conflict_markers = []
          stale_legends = []
          width_faults = []
          required_new = {
              b"usr/src/apps/write48.c": b"FIND CAPS+1 CANCEL> ",
              b"usr/src/games/chess.c": b"DELETE edits; q quits at empty prompt.",
          }
          required_seen = {key: False for key in required_new}

          for name_b in names:
              rel = os.fsdecode(name_b)
              path = root / rel
              if path.is_symlink():
                  data = os.fsencode(os.readlink(path))
              else:
                  data = path.read_bytes()
              rebuilt = bytearray()
              file_lines = 0
              for lineno, line in enumerate(data.splitlines(keepends=True), 1):
                  rebuilt.extend(line)
                  file_lines += 1
                  stripped = line.rstrip(b"\r\n")
                  if stripped.startswith((b"<<<<<<< ", b"=======", b">>>>>>> ")):
                      conflict_markers.append(f"{rel}:{lineno}")
                  if b"FIND CAPS+7 CANCEL" in line or b"Backspace edits" in line:
                      stale_legends.append(f"{rel}:{lineno}")
                  if rel.startswith("usr/src/") and rel.endswith((".c", ".h")):
                      if len(stripped) > 64:
                          width_faults.append(f"{rel}:{lineno}:{len(stripped)}")
              if not data:
                  rebuilt = bytearray()
              if bytes(rebuilt) != data:
                  raise SystemExit(f"byte reconstruction mismatch: {rel}")
              if name_b in required_new and required_new[name_b] in data:
                  required_seen[name_b] = True
              digest = hashlib.sha256(data).hexdigest()
              manifest.append(
                  f"{name_b.hex()}\t{len(data)}\t{file_lines}\t{digest}\n"
              )
              files += 1
              lines += file_lines
              byte_count += len(data)

          if conflict_markers:
              raise SystemExit("merge marker(s): " + ", ".join(conflict_markers))
          if stale_legends:
              raise SystemExit("stale legend(s): " + ", ".join(stale_legends))
          if width_faults:
              raise SystemExit("64-column fault(s): " + ", ".join(width_faults))
          missing = [os.fsdecode(k) for k, seen in required_seen.items() if not seen]
          if missing:
              raise SystemExit("required corrected legend missing: " + ", ".join(missing))
          if (root / ".github/workflows/fix-key-legends.yml").exists():
              raise SystemExit("temporary key-legend repair workflow leaked into target")
          if (root / ".github/workflows/sop-certify.yml").exists():
              raise SystemExit("certification workflow leaked into target")

          text = "".join(manifest).encode("ascii")
          Path(os.environ["MANIFEST"]).write_bytes(text)
          summary = (
              f"files={files} lines={lines} bytes={byte_count} "
              f"manifest_sha256={hashlib.sha256(text).hexdigest()}"
          )
          Path(os.environ["SUMMARY"]).write_text(summary + "\n", encoding="ascii")
          print("SOP SCAN 1 BYTE PASS: " + summary)
          PY
          (cd scan1 && python -B compiler/verify_release.py)
          test -z "$(git -C scan1 status --porcelain)"

      - name: Fresh checkout 2
