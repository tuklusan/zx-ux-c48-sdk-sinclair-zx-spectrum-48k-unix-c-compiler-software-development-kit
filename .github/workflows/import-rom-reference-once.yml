name: Prepare final ROM/reference manifest once

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-rom-reference-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare manifest for permanent workflow state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          root = Path(".")
          base = "10fbd630a621e38f3ea16d58ffda28ee3b83f170"
          helper = ".github/workflows/import-rom-reference-once.yml"
          permanent = {
              ".github/workflows/verify.yml",
              ".github/workflows/graphics-demos.yml",
          }
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if ".git" in path.relative_to(root).parts:
                  continue
              if path.name == "MANIFEST.sha256" or rel == helper:
                  continue
              if rel in permanent:
                  data = subprocess.check_output(["git", "show", f"{base}:{rel}"])
              else:
                  data = path.read_bytes()
              if path.suffix.lower() == ".bat":
                  data = data.replace(b"\r\n", b"\n")
              lines.append(f"{sha256(data).hexdigest()}  {rel}\n")
          Path("MANIFEST.sha256").write_text(
              "".join(lines), encoding="ascii", newline="\n"
          )
          PY

          git config user.name "C48 reference finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "Prepare final manifest for ROM/reference import"
          test -z "$(git status --porcelain)"
          git push origin HEAD:main
