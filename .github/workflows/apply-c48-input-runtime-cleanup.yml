          ).hexdigest()
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="ascii")

          design = Path("usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md")
          text = design.read_text(encoding="utf-8")
          anchor = "### 5.5 Scheduler/process behavior\n"
          note = '''### 5.4A Runtime model-object name and SDK mapping

          The runtime cold-model basename is frozen as `ailm.dat`.  On native
          ZX-UX it is a DAT object opened through the ordinary C48 object API
          with a relative path, so normal process working-directory semantics
          apply.  The SDK packages the same logical model bytes beside the
          C48B1 artifact and its host runner resolves this bounded read-only
          packaged-object subset there.  This SDK placement is a convenience
          mapping only; it does not create a target `/usr` namespace or an
          AI-specific runtime ABI.  `ailmzx48` now obtains model bytes through
          `open`/`read`/`seek` and no shipped execution path requires private
          `ai_mstat`/`ai_mseek`/`ai_mread` host builtins.

          Interactive line editing is likewise application-visible behavior:
          accepted printable bytes are echoed, Enter emits LF, and destructive
          backspace is `BS`, space, `BS`.  The SDK GUI preserves bounded
          typeahead between adjacent `getchar()` calls rather than discarding
          characters during framebuffer-presentation gaps.

          '''.replace("          ", "")
          if text.count(anchor) != 1:
              raise SystemExit("design insertion marker mismatch")
          design.write_text(text.replace(anchor, note + anchor), encoding="utf-8", newline="\n")

          Path("usr/bin/ailmzx48/ailm.dat").write_bytes(
              Path("usr/src/ailmzx48/model/cold-seed.bin").read_bytes()
          )
          PY

      - name: Compile updated ailmzx48 artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Run focused input and runtime tests
        shell: bash
        run: |
          python -B -m unittest \
            compiler.tests.test_gui_framebuffer.GuiFramebufferRegressions.test_typeahead_fifo_preserves_rapid_text \
            compiler.tests.test_release_regressions.ReleaseRuntimeRegressions.test_rommath_read_only_object_io \
            compiler.tests.test_release_regressions.ReleaseRuntimeRegressions.test_ailmzx48_normal_runner_prompt_and_line_editing
          git diff --check

      - name: Requalify retained ailmzx48 scenarios
        shell: bash
        run: |
          set -euo pipefail
          for name in learned-bridge architecture-routing literal-context final-a final-b final-c; do
            req="usr/src/ailmzx48/evaluation/sdk-conformance/$name/request.json"
            iter=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["iteration"])' "$req")
            tag=$(printf 'iter-%04d' "$iter")
            rm -rf "usr/src/ailmzx48/conversations/$tag"
            rm -f "usr/src/ailmzx48/model/iterations/$tag.json"
            python -B usr/src/ailmzx48/tooling/run_iteration.py \
              --request "$req" --max-seconds 1200
            python -B usr/src/ailmzx48/evaluation/check_iteration_score.py \
              --request "$req"
            cp "usr/src/ailmzx48/conversations/$tag/run.json" \
              "usr/src/ailmzx48/evaluation/sdk-conformance/$name/run.json"
            cp "usr/src/ailmzx48/conversations/$tag/score.json" \
              "usr/src/ailmzx48/evaluation/sdk-conformance/$name/score.json"
          done
          python -B usr/src/ailmzx48/evaluation/check_exit_criteria.py \
            --write-status usr/src/ailmzx48/training/goal-status.json

      - name: Run complete release verifier
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Remove one-shot workflow and commit checkpoint
        shell: bash
        run: |
          git rm .github/workflows/apply-c48-input-runtime-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix C48 text input and ailmzx48 model I/O"
          git push origin HEAD:main
