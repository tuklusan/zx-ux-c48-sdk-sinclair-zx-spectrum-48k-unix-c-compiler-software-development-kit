          p = Path("compiler/check_license_headers.py")
          text = p.read_text(encoding="utf-8")
          old = '".json", ".bin", ".png", ".c48b", ".docx", ".zip", ".rom"'
          new = '".json", ".bin", ".dat", ".png", ".c48b", ".docx", ".zip", ".rom"'
          if text.count(old) != 1:
