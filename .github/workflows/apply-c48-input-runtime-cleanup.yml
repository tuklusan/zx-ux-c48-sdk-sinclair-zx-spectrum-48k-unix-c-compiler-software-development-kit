          text = text.replace(
              '''    run([sys.executable, "-B", str(COMP / "c48.py"),
                   str(SRC), "-o", str(BIN)], remaining)
          '''.replace("          ", ""),
              '''    run([sys.executable, "-B", str(COMP / "c48.py"),
                   str(SRC), "-o", str(BIN)], remaining)
              (BIN.parent / "ailm.dat").write_bytes(COLD.read_bytes())
          '''.replace("          ", ""),
