                      "if(read(h,b,3)!=3)return 2;"
                      "if(b[0]!=10||b[1]!=20||b[2]!=30)return 3;"
                      "if(seek(h,1)!=0)return 4;"
                      "if(read(h,b,4)!=3)return 5;"
                      "if(b[0]!=20||b[1]!=30||b[2]!=40)return 6;"
                      "if(close(h)!=0)return 7;"
