name: Apply C48 input runtime cleanup

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-c48-input-runtime-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: apply-c48-input-runtime-cleanup-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply exact source transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          p = Path("compiler/c48/romvm.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '"""C48 host VM profile with the Sinclair 48K ROM math path enabled."""',
              '"""C48 host VM profile with Sinclair ROM math and read-only object I/O."""',
          )
          text = text.replace(
              "from __future__ import annotations\n\nfrom . import rommath",
              "from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom . import rommath",
          )
          text = text.replace(
              "from .typesys import FLOAT\n",
              "from .typesys import FLOAT, INT\n",
          )
          marker = '''class RomMathVM(C48VM):
              """C48VM that uses the ROM-derived transcendental implementation."""

          '''.replace("          ", "")
          insert = '''class RomMathVM(C48VM):
              """C48VM with ROM math and target-shaped read-only object I/O."""

              _OBJECT_CHARS = frozenset(
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-."
              )

              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self._object_handles: dict[int, list[object]] = {}
                  self.builtins["open"] = self._b_open
                  self.builtins["close"] = self._b_close
                  self.builtins["read"] = self._b_read
                  self.builtins["seek"] = self._b_seek

              def _object_root(self) -> Path:
                  return Path(self.argv[0]).resolve().parent

              def _object_path(self, raw: bytes) -> Path | None:
                  try:
                      name = raw.decode("ascii")
                  except UnicodeDecodeError:
                      return None
                  if not 1 <= len(name) <= 10 or name in {".", ".."}:
                      return None
                  if any(ch not in self._OBJECT_CHARS for ch in name):
                      return None
                  root = self._object_root()
                  path = (root / name).resolve()
                  if path.parent != root:
                      return None
                  return path

              def _b_open(self, args):
                  if len(args) != 2 or self._int_math(args[1]) != 1:
                      return Value(INT, -1)
                  raw = self._read_cstr(self._as_pointer(args[0]))
                  path = self._object_path(raw)
                  if path is None:
                      return Value(INT, -1)
                  try:
                      if not path.is_file():
                          return Value(INT, -1)
                      data = path.read_bytes()
                  except OSError:
                      return Value(INT, -1)
                  if len(data) > 65535:
                      return Value(INT, -1)
                  for handle in range(3, 16):
                      if handle not in self._object_handles:
                          self._object_handles[handle] = [data, 0]
                          return Value(INT, handle)
                  return Value(INT, -1)

              def _b_close(self, args):
                  if len(args) != 1:
                      return Value(INT, -1)
                  handle = self._int_math(args[0])
                  if handle not in self._object_handles:
                      return Value(INT, -1)
                  del self._object_handles[handle]
                  return Value(INT, 0)

              def _b_read(self, args):
                  if len(args) != 3:
                      return Value(INT, -1)
                  handle = self._int_math(args[0])
                  state = self._object_handles.get(handle)
                  if state is None:
                      return Value(INT, -1)
                  count = self._to_unsigned(args[2])
                  if count == 0:
                      return Value(INT, 0)
                  data = state[0]
                  pos = state[1]
                  assert isinstance(data, bytes) and isinstance(pos, int)
                  take = min(count, len(data) - pos)
                  if take <= 0:
                      return Value(INT, 0)
                  ptr = self._as_pointer(args[1])
                  self.mem.require_range(ptr, take, write=True)
                  self.mem.write_bytes(ptr.address, data[pos:pos + take])
                  state[1] = pos + take
                  return Value(INT, take)

              def _b_seek(self, args):
                  if len(args) != 2:
                      return Value(INT, -1)
                  handle = self._int_math(args[0])
                  state = self._object_handles.get(handle)
                  if state is None:
                      return Value(INT, -1)
                  pos = self._to_unsigned(args[1])
                  data = state[0]
                  assert isinstance(data, bytes)
                  if pos > len(data):
                      return Value(INT, -1)
                  state[1] = pos
                  return Value(INT, 0)

          '''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit("romvm class marker mismatch")
          p.write_text(text.replace(marker, insert), encoding="utf-8", newline="\n")

          p = Path("compiler/c48/gui.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "from __future__ import annotations\n\nimport hashlib",
              "from __future__ import annotations\n\nfrom collections import deque\n\nimport hashlib",
          )
          old = '''    def __post_init__(self) -> None:
              # Keyboard input is a rendezvous, not a typeahead FIFO. A normal key
              # event is accepted only while the VM is blocked in getchar().
              self._key_cond = threading.Condition()
              self._key_waiting = False
              self._key_byte: int | None = None
          '''.replace("          ", "")
          new = '''    def __post_init__(self) -> None:
              # Console bytes use a bounded FIFO so normal typeahead survives the
              # presentation gap between adjacent getchar() calls.
              self._key_cond = threading.Condition()
              self._key_waiting = False
              self._key_queue = deque()
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("gui init marker mismatch")
          text = text.replace(old, new)
          old = '''    def input_char(self) -> int:
              with self._key_cond:
                  self._key_waiting = True
                  self._key_byte = None
                  self._probe("input_waiting")
                  while self._key_byte is None and not self._stop:
                      self._key_cond.wait()
                  value = -1 if self._key_byte is None else self._key_byte
                  self._key_waiting = False
                  self._key_byte = None
                  self._probe("input_return", value=value)
                  return value

              def _offer_key(self, value: int) -> bool:
                  """Offer one key to a currently waiting getchar()."""
                  with self._key_cond:
                      if not self._key_waiting or self._key_byte is not None:
                          return False
                      self._key_byte = int(value) & 0xFF
                      self._probe("key_accepted", value=self._key_byte)
                      self._key_cond.notify()
                      return True

              def _waiting_for_key(self) -> bool:
                  with self._key_cond:
                      return self._key_waiting and self._key_byte is None
          '''.replace("          ", "")
          new = '''    def input_char(self) -> int:
              with self._key_cond:
                  self._key_waiting = True
                  self._probe("input_waiting", queued=len(self._key_queue))
                  while not self._key_queue and not self._stop:
                      self._key_cond.wait()
                  value = -1 if not self._key_queue else self._key_queue.popleft()
                  self._key_waiting = False
                  self._probe(
                      "input_return", value=value, queued=len(self._key_queue)
                  )
                  return value

              def _offer_key(self, value: int) -> bool:
                  """Queue one console byte, preserving bounded typeahead."""
                  with self._key_cond:
                      if self._stop or len(self._key_queue) >= 256:
                          return False
                      byte = int(value) & 0xFF
                      self._key_queue.append(byte)
                      self._probe(
                          "key_accepted", value=byte, queued=len(self._key_queue)
                      )
                      self._key_cond.notify()
                      return True

              def _waiting_for_key(self) -> bool:
                  with self._key_cond:
                      return self._key_waiting and not self._key_queue
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("gui input marker mismatch")
          p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          p = Path("usr/src/ailmzx48/aimatch.h")
          text = p.read_text(encoding="ascii")
          marker = "int ai_readfull(unsigned char *p, unsigned int n)\n"
          bridge = '''int open(char *path, int flags);
          int close(int h);
          int read(int h, unsigned char *p, unsigned int n);
          int seek(int h, unsigned int pos);
          int ai_mfd;

          int ai_mopen(void)
          {
              if (ai_mfd >= 3) close(ai_mfd);
              ai_mfd = open("ailm.dat", 1);
              if (ai_mfd < 0) {
                  ai_mfd = 0;
                  return -1;
              }
              return 0;
          }

          unsigned int ai_mstat(void)
          {
              unsigned int total;
              unsigned int ask;
              int got;
              if (ai_mopen() != 0) return 0;
              total = 0;
              while (1) {
                  if (total == 65535) {
                      got = read(ai_mfd, ai_mstage, 1);
                      if (got != 0) {
                          close(ai_mfd);
                          ai_mfd = 0;
                          return 0;
                      }
                      break;
                  }
                  ask = 65535 - total;
                  if (ask > 64) ask = 64;
                  got = read(ai_mfd, ai_mstage, ask);
                  if (got < 0 || (unsigned int)got > ask) {
                      close(ai_mfd);
                      ai_mfd = 0;
                      return 0;
                  }
                  if (got == 0) break;
                  total = total + (unsigned int)got;
              }
              if (seek(ai_mfd, 0) != 0) {
                  close(ai_mfd);
                  ai_mfd = 0;
                  return 0;
              }
              return total;
          }

          int ai_mseek(unsigned int pos)
          {
              if (ai_mfd < 3) return -1;
              return seek(ai_mfd, pos);
          }

          int ai_mread(unsigned char *p, unsigned int n)
          {
              if (ai_mfd < 3) return -1;
              return read(ai_mfd, p, n);
          }

          '''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit("aimatch marker mismatch")
          p.write_text(text.replace(marker, bridge + marker), encoding="ascii", newline="\n")

          old = '''int ai_readline(void)
          {
              unsigned int n;
              int c;
              int bad;
              n = 0;
              bad = 0;
              while (1) {
                  c = getchar();
                  if (c < 0) return -1;
                  if (ai_drop_lf) {
                      ai_drop_lf = 0;
                      if (c == 10) continue;
                  }
                  if (c == 13) {
                      ai_drop_lf = 1;
                      break;
                  }
                  if (c == 10) break;
                  if (c < 32 || c > 126) bad = 1;
                  if (n < 191 && !bad) {
                      ai_in[n] = c;
                      n = n + 1;
                  } else {
                      bad = 1;
                  }
              }
              ai_in[n] = 0;
              if (bad) return -2;
              return (int)n;
          }
          '''.replace("          ", "")
          new = '''int ai_readline(void)
          {
              unsigned int n;
              int c;
              int bad;
              n = 0;
              bad = 0;
              while (1) {
                  c = getchar();
                  if (c < 0) return -1;
                  if (ai_drop_lf) {
                      ai_drop_lf = 0;
                      if (c == 10) continue;
                  }
                  if (c == 13) {
                      ai_drop_lf = 1;
                      putchar(10);
                      break;
                  }
                  if (c == 10) {
                      putchar(10);
                      break;
                  }
                  if (c == 8 || c == 127) {
                      if (n != 0 && !bad) {
                          n = n - 1;
                          putchar(8);
                          putchar(' ');
                          putchar(8);
                      }
                      continue;
                  }
                  if (c < 32 || c > 126) {
                      bad = 1;
                      continue;
                  }
                  if (n < 191 && !bad) {
                      ai_in[n] = c;
                      n = n + 1;
                      putchar(c);
                  } else {
                      bad = 1;
                  }
              }
              ai_in[n] = 0;
              if (bad) return -2;
              return (int)n;
          }
          '''.replace("          ", "")
          replace_once("usr/src/ailmzx48/ailmzx48.c", old, new)

          p = Path("usr/src/ailmzx48/tooling/run_iteration.py")
          text = p.read_text(encoding="utf-8")
          old = '''class ModelVM(RomMathVM):
              def __init__(self, *args, model_data, **kwargs):
                  self.model_data = model_data
                  self.model_pos = 0
                  self.model_calls = 0
                  self.model_bytes = 0
                  self.model_seeks = 0
                  self.model_max_request = 0
                  self.model_pattern = (1, 7, 3, 64, 2, 11)
                  super().__init__(*args, **kwargs)
                  self.builtins["ai_mstat"] = self._b_ai_mstat
                  self.builtins["ai_mseek"] = self._b_ai_mseek
                  self.builtins["ai_mread"] = self._b_ai_mread

              def _b_ai_mstat(self, args):
                  return Value(UINT, len(self.model_data))

              def _b_ai_mseek(self, args):
                  offset = self._to_unsigned(args[0])
                  if offset > len(self.model_data):
                      return Value(INT, -1)
                  self.model_pos = offset
                  self.model_seeks += 1
                  return Value(INT, 0)

              def _b_ai_mread(self, args):
                  ptr = self._as_pointer(args[0])
                  count = self._to_unsigned(args[1])
                  if count > 64:
                      return Value(INT, -1)
                  if count > self.model_max_request:
                      self.model_max_request = count
                  if count == 0 or self.model_pos >= len(self.model_data):
                      return Value(INT, 0)
                  cap = self.model_pattern[
                      self.model_calls % len(self.model_pattern)
                  ]
                  self.model_calls += 1
                  take = min(
                      count, cap, len(self.model_data) - self.model_pos
                  )
                  if take:
                      self.mem.require_range(ptr, take, write=True)
                      data = self.model_data[
                          self.model_pos:self.model_pos + take
                      ]
                      self.mem.write_bytes(ptr.address, data)
                      self.model_pos += take
                      self.model_bytes += take
                  return Value(INT, take)
          '''.replace("          ", "")
          new = '''class ModelVM(RomMathVM):
              def __init__(self, *args, **kwargs):
                  self.model_calls = 0
                  self.model_bytes = 0
                  self.model_seeks = 0
                  self.model_max_request = 0
                  self.model_pattern = (1, 7, 3, 64, 2, 11)
                  super().__init__(*args, **kwargs)

              def _b_read(self, args):
                  count = self._to_unsigned(args[2])
                  if count > self.model_max_request:
                      self.model_max_request = count
                  cap = self.model_pattern[
                      self.model_calls % len(self.model_pattern)
                  ]
                  self.model_calls += 1
                  limited = list(args)
                  limited[2] = Value(UINT, min(count, cap))
                  result = super()._b_read(limited)
                  got = int(result.data)
                  if got > 0:
                      self.model_bytes += got
                  return result

              def _b_seek(self, args):
                  result = super()._b_seek(args)
                  if int(result.data) == 0:
                      self.model_seeks += 1
                  return result
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("run_iteration ModelVM marker mismatch")
          text = text.replace(old, new)
          text = text.replace(
              "from c48.typesys import INT, UINT\n",
              "from c48.typesys import UINT\n",
          )
          text = text.replace(
              '''def derived_reply(text: str) -> str:
              if text.endswith("> "):
                  text = text[:-2]
              return text.strip()
          '''.replace("          ", ""),
              '''def derived_reply(text: str, prompt: str) -> str:
              if text.endswith("> "):
                  text = text[:-2]
              text = text.strip()
              prefix = prompt + "\\n"
              if text.startswith(prefix):
                  text = text[len(prefix):]
              return text.strip()
          '''.replace("          ", ""),
