name: Certify applications gallery

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/certify-app-gallery.yml"

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build, capture and certify applications
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import struct
          import sys
          import zlib

          root = Path.cwd()
          sys.path.insert(0, str(root / "compiler"))
          from c48.compiler import compile_file
          from c48.format import encode, read
          from c48.screen import Font4x8, ZXScreen
          from c48.romvm import RomMathVM
          from verify_graphics_demos import png_bytes

          apps = ["write48", "sheet48", "wire3d"]
          src = root / "usr" / "src" / "apps"
          bin_dir = root / "usr" / "bin" / "apps"
          passes_root = root / "app-gallery-passes"
          final_dir = root / "docs" / "images" / "apps"
          font = Font4x8.load(root / "compiler" / "assets" / "SANYALnet-Labs-4x8-font-FINAL.bin")

          def generic_png(width, height, rgb):
              def chunk(kind, data):
                  body = kind + data
                  return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xffffffff)
              raw = bytearray()
              stride = width * 3
              for y in range(height):
                  off = y * stride
                  raw.extend(b"\0" + rgb[off:off + stride])
              head = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", head) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          # Prove each frozen application is the deterministic build of its checked-in C source.
          for name in apps:
              rebuilt = encode(compile_file(src / f"{name}.c"))
              frozen = (bin_dir / f"{name}.c48b").read_bytes()
              if rebuilt != frozen:
                  raise SystemExit(f"{name}: frozen C48B1 does not match deterministic source build")

          def no_input():
              raise RuntimeError("application requested input before verify-mode exit")

          def capture_pass(pass_no):
              out = passes_root / f"pass{pass_no}"
              out.mkdir(parents=True, exist_ok=True)
              frames = []
              manifest = []
              for name in apps:
                  program_path = bin_dir / f"{name}.c48b"
                  program = read(program_path)
                  screen = ZXScreen(font)
                  vm = RomMathVM(
                      program,
                      screen,
                      argv=[str(program_path), "verify"],
                      input_provider=no_input,
                      tick_provider=lambda: 0x1234,
                      max_steps=3_000_000,
                  )
                  rc = vm.run()
                  if rc not in (None, 0):
                      raise SystemExit(f"{name}: verify-mode return code {rc}")
                  lit = sum(v.bit_count() for v in screen.mem[:6144])
                  if lit < 100:
                      raise SystemExit(f"{name}: capture visual-content floor failed ({lit} lit pixels)")
                  rgb = screen.render_rgb()
                  frames.append(rgb)
                  png = png_bytes(rgb)
                  path = out / f"{name}.png"
                  path.write_bytes(png)
                  manifest.append((name, hashlib.sha256(png).hexdigest(), len(png), lit))

              cols, rows, gap = 3, 1, 8
              cell_w, cell_h = 256, 192
              width = cols * cell_w + (cols - 1) * gap
              height = rows * cell_h
              canvas = bytearray([32] * (width * height * 3))
              for idx, rgb in enumerate(frames):
                  ox = idx * (cell_w + gap)
                  for y in range(cell_h):
                      so = y * cell_w * 3
                      do = (y * width + ox) * 3
                      canvas[do:do + cell_w * 3] = rgb[so:so + cell_w * 3]
              contact = generic_png(width, height, canvas)
              (out / "contact-sheet.png").write_bytes(contact)
              manifest.append(("contact-sheet", hashlib.sha256(contact).hexdigest(), len(contact), -1))
              return manifest

          manifests = [capture_pass(i) for i in (1, 2, 3)]
          if not (manifests[0] == manifests[1] == manifests[2]):
              raise SystemExit("application gallery render passes are not byte-identical")

          expected = {f"{name}.png" for name in apps} | {"contact-sheet.png"}
          pass3 = passes_root / "pass3"
          actual = {p.name for p in pass3.glob("*.png")}
          if actual != expected:
              raise SystemExit(f"application gallery member mismatch: {sorted(actual)}")

          if final_dir.exists():
              shutil.rmtree(final_dir)
          final_dir.mkdir(parents=True)
          for path in sorted(pass3.glob("*.png")):
              shutil.copy2(path, final_dir / path.name)

          print("APPLICATION GALLERY CERTIFICATION: 3 byte-identical passes, 3 applications")
          for row in manifests[2]:
              print(f"  {row[0]}: {row[2]} bytes sha256={row[1]} lit={row[3]}")
          PY

      - name: Add README applications section and run full README SoP
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          anchor = "\n## Runtime notes\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"Runtime notes anchor count is {text.count(anchor)}, expected 1")
          if "## Applications gallery — 3 C48 applications" in text:
              raise SystemExit("applications gallery already present")

          block = (
              "\n## Applications gallery — 3 C48 applications\n\n"
              "The games above remember the period when a computer was something to explore, program and play with; these applications remember the other half of the same story—the moment personal computers were expected to be useful. Word processing and spreadsheets became symbols of the shift from hobby machine to everyday work tool, while interactive graphics turned the screen into a place to design and manipulate things rather than merely print results. By the early 1990s, that mixture of writing, personal finance and visual experimentation had become part of the culture of serious home computing.\n\n"
              "**WRITE48** evokes the word processors that turned a keyboard-and-screen micro into a practical writing desk; **SHEET48** recalls the spreadsheet tradition that helped establish personal computers as tools for planning, modelling and finance; and **WIRE3D** nods to the much older lineage of interactive computer graphics and CAD, compressed here into a tiny wireframe modeler. They are not replicas of particular historical products. Like the games, they are deliberately legible C48 programs: compact enough to read, but substantial enough to exercise editing, formulas, screen handling, geometry and interaction under severe constraints.\n\n"
              "| ![WRITE48](docs/images/apps/write48.png)<br>**WRITE48 — Resume Editor** | ![SHEET48](docs/images/apps/sheet48.png)<br>**SHEET48 — Home Brokerage** | ![WIRE3D](docs/images/apps/wire3d.png)<br>**WIRE3D — Imperial Cruiser** |\n"
              "|---|---|---|\n"
              "| <sub>Ubuntu 24.04/x64 · <a href=\"usr/src/apps/write48.c\">write48.c</a></sub> | <sub>Ubuntu 24.04/x64 · <a href=\"usr/src/apps/sheet48.c\">sheet48.c</a></sub> | <sub>Ubuntu 24.04/x64 · <a href=\"usr/src/apps/wire3d.c\">wire3d.c</a></sub> |\n\n"
              "The combined [3-application contact sheet](docs/images/apps/contact-sheet.png) is generated from the same certified captures.\n"
          )

          candidate = text.replace(anchor, block + anchor, 1)
          path.write_text(candidate, encoding="utf-8", newline="\n")

          def validate(data: bytes, pass_no: int):
              walked = 0
              for line_no, line in enumerate(data.splitlines(keepends=True), 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at README line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")
              decoded = data.decode("utf-8", errors="strict")
              if decoded.count("## Applications gallery — 3 C48 applications") != 1:
                  raise SystemExit(f"pass {pass_no}: applications heading mismatch")
              if decoded.index("## Applications gallery — 3 C48 applications") > decoded.index("## Runtime notes"):
                  raise SystemExit(f"pass {pass_no}: applications section placement wrong")
              if decoded.count("## Games gallery — 14 C48 games") != 1:
                  raise SystemExit(f"pass {pass_no}: games gallery heading mismatch")
              if decoded.count("## Relationship to native ZX-UX") != 1:
                  raise SystemExit(f"pass {pass_no}: relationship heading mismatch")
              for name in ("write48", "sheet48", "wire3d"):
                  if decoded.count(f"docs/images/apps/{name}.png") != 1:
                      raise SystemExit(f"pass {pass_no}: image reference mismatch for {name}")
                  if decoded.count(f"usr/src/apps/{name}.c") != 1:
                      raise SystemExit(f"pass {pass_no}: source reference mismatch for {name}")
              if decoded.count("docs/images/apps/contact-sheet.png") != 1:
                  raise SystemExit(f"pass {pass_no}: contact sheet reference mismatch")
              for title in ("**WRITE48**", "**SHEET48**", "**WIRE3D**"):
                  if decoded.count(title) < 1:
                      raise SystemExit(f"pass {pass_no}: missing bold application name {title}")
              print(f"README SOP PASS {pass_no}: {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}")

          for pass_no in (1, 2, 3):
              fresh_root = Path(f"/tmp/readme-apps-sop-{pass_no}")
              shutil.rmtree(fresh_root, ignore_errors=True)
              fresh_root.mkdir(parents=True)
              fresh = fresh_root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY

          git diff --check -- README.md

      - name: Upload certified application gallery preview
        uses: actions/upload-artifact@v4
        with:
          name: app-gallery-certified-${{ github.sha }}
          path: docs/images/apps/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Commit gallery, README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/certify-app-gallery.yml
          git add README.md docs/images/apps/*.png
          git diff --cached --check
          git commit -m "README: add applications history gallery"
          git push origin HEAD:main
