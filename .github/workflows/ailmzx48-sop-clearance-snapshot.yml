name: ailmzx48 SoP cold scan integrity repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-clearance-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: ailmzx48-sop-cold-integrity-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Patch per-scan integrity and identity checks
        run: >-
          python -B usr/src/ailmzx48/tooling/sop_integrity_repair.py patch

      - name: Rebuild identities reference tests and C48 binary
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 9116
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('usr/src/ailmzx48/evaluation/a48m-reference-report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['logical_length'] == 8432, r
          assert r['record_count'] == 69, r
          assert r['max_record_bytes'] == 192, r
          assert r['max_read_request'] == 64, r
          assert Path('usr/src/ailmzx48/aicold.h').is_file()
          PY
          python -B compiler/c48.py usr/src/ailmzx48/ailmzx48.c \
            -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Requalify cold integrity repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ailmzx48-sop-integrity
          mkdir -p /tmp/ailmzx48-sop-integrity
          rsync -a --exclude=.git ./ /tmp/ailmzx48-sop-integrity/
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import subprocess
          import sys

          live = Path.cwd()
          temp = Path('/tmp/ailmzx48-sop-integrity')
          base = live / 'usr/src/ailmzx48/evaluation/sdk-conformance'
          scenarios = [
              ('literal-context', 9113),
              ('final-a', 9114),
              ('final-b', 9115),
              ('final-c', 9116),
          ]
          for name, iteration in scenarios:
              req = json.loads((base / name / 'request.json').read_text(encoding='utf-8'))
              req['iteration'] = iteration
              req['purpose'] = (
                  str(req.get('purpose', ''))
                  + ' SoP requalification after per-scan A48M integrity and identity repair.'
              )
              request = temp / f'sop-{name}.json'
              request.write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/tooling/run_iteration.py'),
                   '--request', str(request), '--max-seconds', '1200'],
                  cwd=temp, check=True,
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/evaluation/check_iteration_score.py'),
                   '--request', str(request)],
                  cwd=temp, check=True,
              )
              src = temp / 'usr/src/ailmzx48/conversations' / f'iter-{iteration:04d}'
              dst = base / name
              for member in (
                  'conversation.md', 'run.json', 'score.json', 'transcript.json'
              ):
                  shutil.copy2(src / member, dst / member)
              (dst / 'request.json').write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
          for rel, label in [
              ('usr/bin/ailmzx48/ailmzx48.c48b', 'C48B1'),
              ('usr/src/ailmzx48/model/cold-seed.bin', 'cold A48M'),
              ('usr/src/ailmzx48/model/current-model.json', 'hot model'),
              ('usr/src/ailmzx48/aimod.h', 'resident model header'),
              ('usr/src/ailmzx48/aicold.h', 'cold identity header'),
          ]:
              if (live / rel).read_bytes() != (temp / rel).read_bytes():
                  raise SystemExit(f'isolated requalification rebuilt different {label}')
          PY

      - name: Finalize evidence identities
        run: >-
          python -B usr/src/ailmzx48/tooling/sop_integrity_repair.py finalize

      - name: Remove temporary SoP instrumentation
        shell: bash
        run: |
          rm .github/workflows/ailmzx48-sop-clearance-snapshot.yml
          rm usr/src/ailmzx48/tooling/sop_integrity_repair.py

      - name: Run hard release gates
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 1
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 2
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 3
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push cold integrity repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ailmzx48: enforce cold integrity on every scan"
          git push origin HEAD:main
