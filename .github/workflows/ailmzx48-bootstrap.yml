name: One-shot ailmzx48 implementation bootstrap

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact main tree
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Confirm certified design ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor             ddc10507076f2dda4fe119d3af0e7fa2cbe1fd0b HEAD

      - name: Materialize implementation slice
        shell: bash
        env:
          BOOTSTRAP_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(os.environ["BOOTSTRAP_B64"]))
          path = Path(".github/ailmzx48_bootstrap_runtime.py")
          path.write_bytes(data)
          PY
          python -B .github/ailmzx48_bootstrap_runtime.py

      - name: Run starter training iteration 1
        run: >-
          python -B usr/src/ailmzx48/tooling/run_iteration.py
          --request usr/src/ailmzx48/training/requests/iter-0001.json
          --max-seconds 600

      - name: Remove one-shot bootstrap helpers
        shell: bash
        run: |
          rm -f .github/ailmzx48_bootstrap_runtime.py
          rm -f .github/workflows/ailmzx48-bootstrap.yml

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify implementation slice
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check
          cat usr/src/ailmzx48/conversations/iter-0001/score.json

      - name: Commit and push implementation plus iteration evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m             "Start ailmzx48 implementation and retain iteration 1"
          git push origin HEAD:main
