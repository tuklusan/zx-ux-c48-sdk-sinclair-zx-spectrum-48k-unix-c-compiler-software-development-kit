name: Simplify 1.0.0 release notes v2

on:
  push:
    paths:
      - .github/workflows/rewrite-release-notes-1.0.0-v2.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fact check, prose audit, cross-document sanity, and SoP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          RELEASE_ID: '389451145'
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/${RELEASE_ID}" > /tmp/release.before.json
          gh api "repos/${REPO}/git/ref/tags/1.0.0" > /tmp/tag.json
          gh api "repos/${REPO}/git/commits/41d130e489638dd07ba3305eea41517e0ec3b32f" > /tmp/commit.json
          gh api "repos/${REPO}/contents/VERSION?ref=1.0.0" > /tmp/version.json
          gh api "repos/${REPO}/contents/usr/src/games?ref=1.0.0" > /tmp/games.json
          gh api "repos/${REPO}/contents/usr/src/apps?ref=1.0.0" > /tmp/apps.json
          gh api "repos/${REPO}/contents/usr/src/demos?ref=1.0.0" > /tmp/demos.json
          gh api "repos/${REPO}/contents/docs?ref=1.0.0" > /tmp/docs.json
          gh api "repos/${REPO}/contents/compiler/c48run.py?ref=1.0.0" > /tmp/c48run.json

          cat > /tmp/body.new.md <<'EOF'
          # C48 SDK 1.0.0

          This first stable release of the **ZX-UX C48 SDK** is a portable host-side C48 compiler and runtime for developing C programs for **ZX-UX on the Sinclair ZX Spectrum 48K** from modern Windows, Linux, and macOS systems. It is a development SDK, not the native ZX-UX operating system or native Z80 compiler/runtime.

          ## What's included

          - `c48` / `c48.bat`: the C48 command-line compiler, with preprocessing, parsing, semantic/type checks, diagnostics, and deterministic output.
          - `c48run` / `c48run.bat`: the C48B1 host runtime and 16-bit virtual machine.
          - A C48 data model with 16-bit `int`, 16-bit pointers, unsigned plain `char`, a 64 KiB logical address space, and five-byte Spectrum-style `float` storage.
          - An exact 6912-byte ZX Spectrum screen model with 256x192 graphics, bitmap/attribute color, UDGs, and 64x24 software text using packed 4x8 fonts.
          - Interactive Tk display and deterministic headless execution for development, testing, screen dumps, and automated verification.
          - A substantial C48 source corpus: **21 graphics demos**, **14 games**, **3 applications**, examples, sound demos, and adversarial security fixtures.

          The SDK uses deterministic **C48B1** host executables for portable development. C48B1 is not Z80 machine code, ZX-UX `OBJ1`, or ZX-UX `MEX1`.

          ## Install from the release ZIP

          Requires **Python 3.10 or newer**. Download this asset from the release:

          `zx-ux-c48-sdk-1.0.0-RC5-41d130e489638dd07ba3305eea41517e0ec3b32f.zip`

          The `RC5` text in the filename is intentional; this is the final **1.0.0** package. Extract it and open a terminal in the extracted SDK directory.

          Windows Command Prompt:

          ```bat
          c48 --version
          c48 usr\src\examples\hello.c
          c48run usr\bin\examples\hello.c48b
          ```

          Linux/macOS:

          ```sh
          ./c48 --version
          ./c48 usr/src/examples/hello.c
          ./c48run usr/bin/examples/hello.c48b
          ```

          Tkinter is required only for the graphical display window. The compiler and non-audio headless runtime need no third-party Python packages; audible BEEP playback can use the optional `playsound3==3.3.2` adapter.

          For download integrity, the Assets section also includes `SHA256SUMS-1.0.0-RC5.txt`.

          ## Install from GitHub

          Clone the repository and check out the `1.0.0` tag so later changes to `main` do not alter your SDK copy:

          ```sh
          git clone https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit.git
          cd zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          git checkout 1.0.0
          ```

          Then use `c48` / `c48run` on Windows or `./c48` / `./c48run` on Linux and macOS as shown above.

          ## Documentation

          For complete usage and implementation details, see the release documentation:

          - [ZX-UX C48 SDK User Manual](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/blob/1.0.0/docs/ZX-UX%20C48%20SDK%20User%20Manual.docx) — command-line workflow and day-to-day SDK use.
          - [ZX-UX C48 SDK Technical Reference](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/blob/1.0.0/docs/ZX-UX%20C48%20SDK%20Technical%20Reference.docx) — compiler/runtime architecture, C48B1, graphics, Float5, verification, and host/native boundaries.
          - [ZX-UX C48 SDK Adversarial Security Review](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/blob/1.0.0/docs/ZX-UX%20C48%20SDK%20Adversarial%20Security%20Review.docx) — hostile-input and memory-boundary assessment.
          - [C48 language specification pointer](https://github.com/tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit/blob/1.0.0/docs/ZX-UX%20C48%20Language%20Specification.md) — points to the authoritative native ZX-UX C48 language specification.
          EOF
          sed -i 's/^          //' /tmp/body.new.md

          python - <<'PY'
          import base64, hashlib, itertools, json, re
          from pathlib import Path

          r = json.loads(Path('/tmp/release.before.json').read_text())
          body = r['body']
          old_digest = hashlib.sha256(body.encode()).hexdigest()
          if old_digest != '11a3839d83757b7af002f48cb837f0450dadba8ed9922b42a3bbd8869152e958':
              raise SystemExit(f'live release body race/drift: {old_digest}')
          if r['tag_name'] != '1.0.0' or r['target_commitish'] != '41d130e489638dd07ba3305eea41517e0ec3b32f':
              raise SystemExit('release identity drift')
          if r['draft'] or r['prerelease'] or r['name'] != 'C48 SDK 1.0.0':
              raise SystemExit('release metadata drift')

          expected_assets = {
              'zx-ux-c48-sdk-1.0.0-RC5-41d130e489638dd07ba3305eea41517e0ec3b32f.zip': 'sha256:c1367dc18e1a442c2b9230e2c19c1fda0f545977ed191b73f4adafe75fb4ea9b',
              'c48-1.0.0-RC5-gui-evidence-41d130e489638dd07ba3305eea41517e0ec3b32f.zip': 'sha256:b16d871474823a81b5baad9a7fea219b6ff544bae670f149e9e39b3c117283cf',
              'RC5-RELEASE-METADATA.json': 'sha256:641f62a977b77ca525e3dce1a6530d734468184493783507a89b2bf598e7528d',
              'SHA256SUMS-1.0.0-RC5.txt': 'sha256:d56de780c6c46c96d763e6a0914a0f2bc37ba205ee8ab064e09f0b28a1ab80d5',
          }
          if {a['name']: a.get('digest') for a in r['assets']} != expected_assets:
              raise SystemExit('release asset set/digest drift')

          tag = json.loads(Path('/tmp/tag.json').read_text())
          commit = json.loads(Path('/tmp/commit.json').read_text())
          if tag['object']['sha'] != '41d130e489638dd07ba3305eea41517e0ec3b32f':
              raise SystemExit('1.0.0 tag drift')
          if commit['tree']['sha'] != '953c2385096b41cd7b63e4abaca52441174e49a6':
              raise SystemExit('certified tree drift')

          def decoded(path):
              obj = json.loads(Path(path).read_text())
              return base64.b64decode(obj['content']).decode('utf-8')

          if decoded('/tmp/version.json').strip() != '1.0.0':
              raise SystemExit('VERSION drift')

          games = [x['name'] for x in json.loads(Path('/tmp/games.json').read_text()) if x['name'].endswith('.c')]
          apps = [x['name'] for x in json.loads(Path('/tmp/apps.json').read_text()) if x['name'].endswith('.c')]
          demos = [x['name'] for x in json.loads(Path('/tmp/demos.json').read_text()) if x['name'].endswith('.c')]
          if len(games) != 14 or len(apps) != 3 or len(demos) != 21:
              raise SystemExit(f'corpus count drift: demos={len(demos)} games={len(games)} apps={len(apps)}')

          docs = {x['name'] for x in json.loads(Path('/tmp/docs.json').read_text())}
          needed_docs = {
              'ZX-UX C48 SDK User Manual.docx',
              'ZX-UX C48 SDK Technical Reference.docx',
              'ZX-UX C48 SDK Adversarial Security Review.docx',
              'ZX-UX C48 Language Specification.md',
          }
          if not needed_docs <= docs:
              raise SystemExit(f'missing release documentation: {sorted(needed_docs-docs)}')

          c48run = decoded('/tmp/c48run.json')
          for fact in [
              'SDK_VERSION = "1.0.0"',
              'default=ROOT / "assets" / "SANYALnet-Labs-4x8-font-FINAL.bin"',
              'ap.add_argument("--headless"',
              'ap.add_argument("--dump-screen"',
          ]:
              if fact not in c48run:
                  raise SystemExit(f'runtime fact missing: {fact}')

          candidate = Path('/tmp/body.new.md').read_text()
          forbidden = ['promotion workflow', 'initial promotion attempt', 'zero-defect passes', 'workflow: `351', 'certified commit', 'certified tree']
          for phrase in forbidden:
              if phrase.lower() in candidate.lower():
                  raise SystemExit(f'internal-history phrase leaked into release notes: {phrase}')
          required = [
              '## What\'s included', '## Install from the release ZIP', '## Install from GitHub', '## Documentation',
              '**21 graphics demos**', '**14 games**', '**3 applications**',
              'Python 3.10 or newer', 'playsound3==3.3.2', 'SHA256SUMS-1.0.0-RC5.txt',
              'ZX-UX C48 SDK User Manual', 'ZX-UX C48 SDK Technical Reference',
              'ZX-UX C48 SDK Adversarial Security Review', 'C48 language specification pointer',
          ]
          for phrase in required:
              if candidate.count(phrase) != 1:
                  raise SystemExit(f'required release-note phrase count defect: {phrase!r}')

          prose = re.sub(r'```.*?```', ' ', candidate, flags=re.S)
          prose = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', prose)
          prose = re.sub(r'`([^`]+)`', r'\1', prose)
          prose = re.sub(r'^[#*-]+\s*', '', prose, flags=re.M)
          sentences = [s.strip() for s in re.split(r'(?<=[.!?])\s+', prose) if len(s.split()) >= 5]
          def toks(s): return re.findall(r'[a-z0-9]+(?:-[a-z0-9]+)*', s.lower())
          seen = {}
          for si, sentence in enumerate(sentences):
              t = toks(sentence)
              for i in range(len(t)-7):
                  g = tuple(t[i:i+8])
                  if g in seen:
                      raise SystemExit(f'repeated 8-word prose sequence: {g}')
                  seen[g] = (si, i)
          for i, j in itertools.combinations(range(len(sentences)), 2):
              a, b = set(toks(sentences[i])), set(toks(sentences[j]))
              if a and b and len(a & b) / len(a | b) >= 0.35:
                  raise SystemExit(f'semantic repetition >=0.35: {sentences[i]!r} || {sentences[j]!r}')
          print('FACT/TAG/DOCUMENT/PROSE AUDIT PASS')
          print('tag=1.0.0 commit=41d130e tree=953c238 demos=21 games=14 apps=3 docs=4')
          PY

          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text(encoding='utf-8')
          for phrase in [
              'portable, host-side **C compiler, virtual machine and software development kit**',
              'not the operating system, native Z80 compiler, linker, runtime or final ABI',
              '## ZX Spectrum 48K graphics showcase — 21 C48 demos',
              '## Games gallery — 14 C48 games',
              '## Applications gallery — 3 C48 applications',
              'ZX-UX C48 SDK User Manual', 'ZX-UX C48 SDK Technical Reference',
              'ZX-UX C48 SDK Adversarial Security Review',
          ]:
              if phrase not in readme:
                  raise SystemExit(f'current README cross-document invariant missing: {phrase}')
          print('CURRENT README CROSS-DOCUMENT SANITY PASS')
          PY

          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          source = Path('/tmp/body.new.md').read_bytes()
          expected_sha = 'ab0e126a9e7f888cdb4086d7d600f85c5e1fbe8341a054ebca6bd5b8cb518838'
          if hashlib.sha256(source).hexdigest() != expected_sha:
              raise SystemExit(f'candidate body unexpected SHA-256: {hashlib.sha256(source).hexdigest()}')
          for n in (1,2,3):
              root = Path(f'/tmp/release-body-sop-{n}')
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir()
              fresh = root / 'release-body.md'
              fresh.write_bytes(source)
              data = fresh.read_bytes()
              walked = 0
              lines = data.splitlines(keepends=True)
              for line_no, line in enumerate(lines, 1):
                  if b'\x00' in line:
                      raise SystemExit(f'pass {n}: NUL at line {line_no}')
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f'pass {n}: byte walk mismatch')
              data.decode('utf-8', errors='strict')
              if data != source:
                  raise SystemExit(f'pass {n}: fresh-copy mismatch')
              print(f'RELEASE BODY SOP PASS {n}: bytes={len(data)} lines={len(lines)} sha256={hashlib.sha256(data).hexdigest()}')
          PY

      - name: Patch release body and verify exact read-back
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: tuklusan/zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          RELEASE_ID: '389451145'
        run: |
          set -euo pipefail
          jq -n --rawfile body /tmp/body.new.md '{body:$body}' > /tmp/payload.json
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" --input /tmp/payload.json > /tmp/release.after.json
          gh api "repos/${REPO}/releases/${RELEASE_ID}" > /tmp/release.readback.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = Path('/tmp/body.new.md').read_text()
          r = json.loads(Path('/tmp/release.readback.json').read_text())
          if r['body'] != expected:
              raise SystemExit('release body read-back mismatch')
          if r['tag_name'] != '1.0.0' or r['target_commitish'] != '41d130e489638dd07ba3305eea41517e0ec3b32f':
              raise SystemExit('release identity changed during body patch')
          if r['draft'] or r['prerelease'] or r['name'] != 'C48 SDK 1.0.0':
              raise SystemExit('release metadata changed during body patch')
          expected_assets = {
              'zx-ux-c48-sdk-1.0.0-RC5-41d130e489638dd07ba3305eea41517e0ec3b32f.zip': 'sha256:c1367dc18e1a442c2b9230e2c19c1fda0f545977ed191b73f4adafe75fb4ea9b',
              'c48-1.0.0-RC5-gui-evidence-41d130e489638dd07ba3305eea41517e0ec3b32f.zip': 'sha256:b16d871474823a81b5baad9a7fea219b6ff544bae670f149e9e39b3c117283cf',
              'RC5-RELEASE-METADATA.json': 'sha256:641f62a977b77ca525e3dce1a6530d734468184493783507a89b2bf598e7528d',
              'SHA256SUMS-1.0.0-RC5.txt': 'sha256:d56de780c6c46c96d763e6a0914a0f2bc37ba205ee8ab064e09f0b28a1ab80d5',
          }
          if {a['name']: a.get('digest') for a in r['assets']} != expected_assets:
              raise SystemExit('assets changed during release body patch')
          print('POST-PATCH RELEASE READ-BACK PASS')
          print('body sha256=' + hashlib.sha256(expected.encode()).hexdigest())
          PY

      - name: Remove temporary workflows and push cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rewrite-release-notes-1.0.0.yml .github/workflows/rewrite-release-notes-1.0.0-v2.yml
          git commit -m "ci: remove release-notes rewrite workflows"
          git push origin HEAD:main
