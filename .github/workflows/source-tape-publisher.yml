name: Source tape publisher
# Policy-ready publisher.

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-tape-publisher.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Normalize source headers and refresh hashes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          manifest = json.loads(
              (root / "compiler/source_tape_manifest.json").read_text(
                  encoding="ascii"
              )
          )
          header = (
              "// ============================================================\n"
              "// Copyright (c) 2026 SANYALnet Labs.\n"
              "// Proprietary rights reserved except as licensed in LICENSE.\n"
              "//\n"
              "// ZX-UX C48 SDK - SANYALnet Labs Non-Commercial License.\n"
              "// Non-commercial use permitted; Commercial Use and model\n"
              "// training prohibited unless separately authorized.\n"
              "//\n"
              "// Attribution required: SANYALnet Labs.\n"
              "// See root LICENSE for full terms.\n"
              "// ============================================================\n"
          )
          paths = {
              source["path"]
              for tape in manifest["tapes"]
              for source in tape["sources"]
          }
          for rel in sorted(paths):
              path = root / rel
              text = path.read_text(encoding="ascii")
              lines = text.splitlines(keepends=True)
              if (
                  len(lines) < 2
                  or not lines[0].startswith("// ===")
                  or not lines[1].startswith(
                      "// Copyright (c) 2026 Supratim Sanyal of SANYALnet Labs."
                  )
              ):
                  continue
              end = None
              for index in range(1, min(len(lines), 20)):
                  if lines[index].startswith("// ==="):
                      end = index
                      break
              if end is None:
                  raise SystemExit("compact header terminator missing: " + rel)
              path.write_text(
                  header + "".join(lines[end + 1:]),
                  encoding="ascii",
                  newline="\n",
              )

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          release_path = root / "compiler/release_expectations.json"
          release = json.loads(release_path.read_text(encoding="ascii"))
          release["example_header_sha256"] = digest(
              root / "usr/src/examples/exapi.h"
          )
          release["security_header_sha256"] = digest(
              root / "usr/src/security/secapi.h"
          )
          release["sound_header_sha256"] = digest(
              root / "usr/src/sound/sndapi.h"
          )
          release["game_header_sha256"] = digest(
              root / "usr/src/games/gameapi.h"
          )
          for name in release["demos"]:
              release["demos"][name]["source_sha256"] = digest(
                  root / ("usr/src/examples/" + name + ".c")
              )
          for name in release["games"]:
              release["games"][name]["source_sha256"] = digest(
                  root / ("usr/src/games/" + name + ".c")
              )
          release["sound"]["tune_source_sha256"] = digest(
              root / "usr/src/sound/tune.c"
          )
          release_path.write_text(
              json.dumps(release, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )

          app_path = root / "compiler/app_expectations.json"
          app = json.loads(app_path.read_text(encoding="ascii"))
          app["helper_sha256"] = digest(root / "usr/src/apps/appapi.h")
          for name in app["apps"]:
              app["apps"][name]["source_sha256"] = digest(
                  root / ("usr/src/apps/" + name + ".c")
              )
          app_path.write_text(
              json.dumps(app, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )

          gfx_path = root / "compiler/graphics_demo_expectations.json"
          gfx = json.loads(gfx_path.read_text(encoding="ascii"))
          gfx["helper_sha256"] = digest(root / "usr/src/demos/demoapi.h")
          for name in gfx["demos"]:
              gfx["demos"][name]["source_sha256"] = digest(
                  root / ("usr/src/demos/" + name + ".c")
              )
          gfx_path.write_text(
              json.dumps(gfx, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )

      - name: Generate source tapes
        run: python -B compiler/refresh_source_tapes.py

      - name: Verify repository
        run: python -B compiler/verify_release.py

      - name: Commit generated corpus
        shell: bash
        run: |
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git add usr/src compiler/*expectations.json usr/bin
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add locked ZX-UX source tapes"
          git push origin main
