name: README prose and humor quality pass v4

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-humor-quality-v4.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply restrained humor and certify prose
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "997ed6675b4b34d3a3950f432e3c1bb58f88655e"
          python -B - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib, re, shutil

          p=Path("README.md")
          original=p.read_bytes()
          text=original.decode("utf-8",errors="strict")
          native="https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project"

          repl=[
            (f"**ZX-UX C48 SDK** is a portable, host-side **C compiler, virtual machine and software development kit** for writing and testing C48 programs for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native}). It runs on Windows, Linux and macOS, on Intel and Arm hosts, providing the desktop toolchain and Spectrum-facing services needed away from the original machine. It remains separate from native ZX-UX: this SDK is not the operating system, native Z80 compiler, linker, runtime or final ABI.",
             f"**ZX-UX C48 SDK** is a portable, host-side **C compiler, virtual machine and software development kit** for writing and testing C48 programs for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native}). It runs on Windows, Linux and macOS, on Intel and Arm hosts, providing the desktop toolchain and Spectrum-facing services needed away from the original machine. This saves the 48K Spectrum from having to impersonate a modern workstation (a role for which it was never interviewed). The SDK remains separate from native ZX-UX: it is not the operating system, native Z80 compiler, linker, runtime or final ABI."),
            ("The three hero images above and 18 demos below are rendered from the C48 VM's exact ZX Spectrum 48K bitmap/attribute screen state. Automated graphics verification renders every demo independently on GitHub-hosted Windows, Linux and macOS runners.",
             "The three hero images above and 18 demos below are rendered from the C48 VM's exact ZX Spectrum 48K bitmap/attribute screen state—a remarkably small place in which to keep this much visual ambition. Automated graphics verification renders every demo independently on GitHub-hosted Windows, Linux and macOS runners."),
            ("These documents cover portable compiler/runtime usage, technical architecture and security; the authoritative C48 language definition remains upstream in the native ZX-UX project.",
             "These documents cover portable compiler/runtime usage, technical architecture and security, because even a 48K universe eventually develops paperwork."),
            ("`C48B1` is an SDK-only host executable representation. It is not Z80 machine code, ZX-UX `OBJ1`, or ZX-UX `MEX1`.",
             "`C48B1` is an SDK-only host executable representation. It is not Z80 machine code, ZX-UX `OBJ1`, or ZX-UX `MEX1`—a distinction of the sort that seems pedantic right up until the moment it saves an afternoon."),
            ("These games form a small cultural time capsule of what “computer games” meant around 1982—not replicas of any one historical library, but a compact cross-section of ideas and stories moving through mainframes, school labs, clubs and homes.",
             "These games form a small cultural time capsule of what “computer games” meant around 1982—not replicas of any one historical library, but a compact cross-section of ideas and stories moving through mainframes, school labs, clubs and homes. It is nostalgia with source code attached, which is generally the more useful kind."),
            (f"[ZX-UX]({native}) is the actual Unix-like operating and development environment for the original unexpanded 48K Sinclair ZX Spectrum. Its native compiler, linker, ABI, ROM bridge, persistence and process facilities are separate from this host SDK, whose role is C48 development and testing on modern computers.",
             f"[ZX-UX]({native}) is the actual Unix-like operating and development environment for the original unexpanded 48K Sinclair ZX Spectrum. Its native compiler, linker, ABI, ROM bridge, persistence and process facilities are separate from this host SDK, whose role is C48 development and testing on modern computers. The distinction is deliberate; the machine is already constrained enough without making the terminology do two jobs as well."),
            ("The games above capture the exploratory, playful side of early computing; these applications tell the other half of the story—the point at which personal computers were expected to be useful. Word processing and spreadsheets symbolized the shift from hobby machine to everyday work tool, while interactive graphics turned the screen into a place to design and manipulate rather than merely print results. By the early 1990s, writing, personal finance and visual experimentation were established parts of serious home computing.",
             "The games above capture the exploratory, playful side of early computing; these applications tell the other half of the story—the point at which personal computers were expected to earn their keep. Word processing and spreadsheets symbolized the shift from hobby machine to everyday work tool, while interactive graphics turned the screen into a place to design and manipulate rather than merely print results. By the early 1990s, writing, personal finance and visual experimentation were established parts of serious home computing; the machine had, in effect, acquired a desk job."),
            ("The runtime defaults to the SANYALnet Labs final 4x8 font:",
             "The runtime defaults to the SANYALnet Labs final 4x8 font, where every pixel has a job and none has time for decorative flourishes:"),
          ]

          candidate=text
          for old,new in repl:
              if candidate.count(old)!=1: raise SystemExit(f"replacement source mismatch: {old[:100]!r}")
              candidate=candidate.replace(old,new,1)
          reverse=candidate
          for old,new in reversed(repl):
              if reverse.count(new)!=1: raise SystemExit(f"replacement target mismatch: {new[:100]!r}")
              reverse=reverse.replace(new,old,1)
          if reverse.encode()!=original: raise SystemExit("replacement-only guard failed")
          p.write_bytes(candidate.encode())

          anchors=[
            "a role for which it was never interviewed",
            "a remarkably small place in which to keep this much visual ambition",
            "even a 48K universe eventually develops paperwork",
            "seems pedantic right up until the moment it saves an afternoon",
            "nostalgia with source code attached",
            "without making the terminology do two jobs as well",
            "the machine had, in effect, acquired a desk job",
            "every pixel has a job and none has time for decorative flourishes",
          ]
          if any(candidate.count(x)!=1 for x in anchors): raise SystemExit("humor density/anchor guard failed")

          def prose(md,drop_html_tables=False):
              s=re.sub(r"<!--.*?-->"," ",md,flags=re.S)
              s=re.sub(r"```.*?```"," ",s,flags=re.S)
              if drop_html_tables: s=re.sub(r"<table>.*?</table>"," ",s,flags=re.S)
              s="\n".join(line for line in s.splitlines() if not line.lstrip().startswith("|") and not line.startswith("#"))
              s=re.sub(r"<[^>]+>"," ",s)
              s=re.sub(r"!\[([^\]]*)\]\([^)]+\)",r"\1",s)
              s=re.sub(r"\[([^\]]+)\]\([^)]+\)",r"\1",s)
              s=s.replace("**","").replace("`","")
              return re.sub(r"\s+"," ",s).strip()

          full=prose(candidate)
          narrative=prose(candidate,drop_html_tables=True)
          if re.search(r"\b([A-Za-z]+)\s+\1\b",full,flags=re.I): raise SystemExit("doubled word detected")

          toks=re.findall(r"[A-Za-z0-9]+(?:[-+][A-Za-z0-9]+)*",full.lower())
          grams=Counter(tuple(toks[i:i+8]) for i in range(max(0,len(toks)-7)))
          rep=[(g,c) for g,c in grams.items() if c>1]
          if rep:
              for g,c in rep[:20]: print("REPEATED 8-GRAM",c," ".join(g))
              raise SystemExit("repeated 8-word phrase detected")

          fs=[s.strip() for s in re.split(r"(?<=[.!?])\s+",full) if len(s.split())>=8]
          for i,s in enumerate(fs,1):
              if len(s.split())>85: raise SystemExit(f"sentence {i} too long: {len(s.split())} words")
          overlaps=[]
          for i,sa in enumerate(fs):
              a=set(re.findall(r"[a-z0-9]+",sa.lower()))
              for j in range(i+1,len(fs)):
                  b=set(re.findall(r"[a-z0-9]+",fs[j].lower())); u=a|b
                  score=len(a&b)/len(u) if u else 0
                  if score>=0.35: overlaps.append((score,i,j,sa,fs[j]))
          if overlaps:
              for score,i,j,a,b in sorted(overlaps,reverse=True)[:20]: print(f"SEMANTIC-OVERLAP {score:.3f} S{i+1}/S{j+1}: {a} || {b}")
              raise SystemExit("sentence-level semantic repetition threshold exceeded")

          ns=[s.strip() for s in re.split(r"(?<=[.!?])\s+",narrative) if len(s.split())>=8]
          openings=Counter()
          for s in ns:
              w=re.findall(r"[A-Za-z0-9]+",s.lower())
              if len(w)>=3: openings[tuple(w[:3])]+=1
          bad=[(o,c) for o,c in openings.items() if c>1]
          if bad:
              for o,c in bad: print("REPEATED NARRATIVE OPENING",c," ".join(o))
              raise SystemExit("repeated three-word narrative sentence opening detected")

          print(f"PROSE QUALITY PASS: full sentences={len(fs)}, narrative sentences={len(ns)}, humor anchors=8, repeated8=0, semantic>=0.35=0, max<=85, repeated narrative openings=0")

          demos=["torus","sprites","plasma","spriteanim","raymaze","goblet","tunnel","city","terrain","ocean","mobius","morph3d","warp","galaxy","orrery","firework","kaleido","moire","mandel","julia","forest"]
          games=["advent","arith","bgammon","chess","cribbage","fish","fortune","hangman","maze","quiz","rogue","snake","trek","wump"]
          apps=["write48","sheet48","wire3d"]
          heads=["# ZX-UX C48 SDK — Portable C compiler and runtime for Sinclair ZX Spectrum 48K development","## Download and install","## ZX Spectrum 48K graphics showcase — 21 C48 demos","## Document Library","## C48 compiler and runtime features","## Games gallery — 14 C48 games","## Relationship to native ZX-UX","## Applications gallery — 3 C48 applications","## Runtime notes","## Source tree","## License and author"]

          def sop(data,n):
              lines=data.splitlines(keepends=True); walked=0
              for ln,line in enumerate(lines,1):
                  if b"\x00" in line: raise SystemExit(f"pass {n}: NUL line {ln}")
                  for _ in line: walked+=1
              if walked!=len(data): raise SystemExit(f"pass {n}: byte walk mismatch")
              d=data.decode("utf-8",errors="strict"); pos=[]
              for h in heads:
                  if d.count(h)!=1: raise SystemExit(f"pass {n}: heading {h}")
                  pos.append(d.index(h))
              if pos!=sorted(pos): raise SystemExit(f"pass {n}: section order")
              linked=f"for [**ZX-UX Unix on the Sinclair ZX Spectrum 48K**]({native})."
              if d.count(linked)!=1 or d.count("**ZX-UX Unix on the Sinclair ZX Spectrum 48K**")!=1: raise SystemExit(f"pass {n}: native link")
              for x in demos:
                  if d.count(f"usr/src/demos/{x}.c")!=1: raise SystemExit(f"pass {n}: demo {x}")
              for x in games:
                  if d.count(f"usr/src/games/{x}.c")!=1: raise SystemExit(f"pass {n}: game {x}")
              for x in apps:
                  if d.count(f"usr/src/apps/{x}.c")!=1: raise SystemExit(f"pass {n}: app {x}")
              g0=d.index("## Games gallery — 14 C48 games"); r0=d.index("## Relationship to native ZX-UX",g0); a0=d.index("## Applications gallery — 3 C48 applications",r0); rt0=d.index("## Runtime notes",a0)
              gs=d[g0:r0]; aps=d[a0:rt0]
              if not (gs.index("By then **Adventure**")<gs.index("| ![C48 Adventure]")<gs.index("The quieter side of that culture")): raise SystemExit(f"pass {n}: games interleave")
              if not (aps.index("The games above capture")<aps.index("| ![WRITE48]")<aps.index("**WRITE48** evokes")): raise SystemExit(f"pass {n}: apps interleave")
              if "Ubuntu 24.04/x64" in gs or "Ubuntu 24.04/x64" in aps: raise SystemExit(f"pass {n}: app/game arch")
              for arch in ("Ubuntu 24.04/x64","Windows Server 2025/x64","macOS 26/Arm64"):
                  if arch not in d[:g0]: raise SystemExit(f"pass {n}: demo arch {arch}")
              rendered_gs=re.sub(r"!\[[^\]]*\]\([^)]+\)","",gs)
              for game in ["Adventure","Hunt the Wumpus","Star Trek","Rogue","Chess","Backgammon","Cribbage","Go Fish","Hangman","Maze","Quiz","Arithmetic","Fortune","Snake"]:
                  plain=rendered_gs.find(game); bold=rendered_gs.find(f"**{game}**")
                  if plain<0 or bold<0 or plain!=bold+2: raise SystemExit(f"pass {n}: first rendered game name not bold {game}")
              if any(d.count(x)!=1 for x in anchors): raise SystemExit(f"pass {n}: humor anchor drift")
              print(f"README SOP PASS {n}: {len(data)} bytes, {len(lines)} lines, sha256={hashlib.sha256(data).hexdigest()}")

          for n in (1,2,3):
              root=Path(f"/tmp/readme-humor-v4-{n}"); shutil.rmtree(root,ignore_errors=True); root.mkdir()
              f=root/"README.md"; f.write_bytes(p.read_bytes()); sop(f.read_bytes(),n)
          PY
          git diff --check -- README.md

      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/readme-humor-quality.yml .github/workflows/readme-humor-quality-v2.yml .github/workflows/readme-humor-quality-v3.yml .github/workflows/readme-humor-quality-v4.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: add restrained dry humor"
          git push origin HEAD:main
