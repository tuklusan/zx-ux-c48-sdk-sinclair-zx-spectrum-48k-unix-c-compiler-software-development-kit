name: Clean Dizzy 4K release staging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-dizzy4k-release.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove staging prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "1.0.0-RC5"             --repo "${GITHUB_REPOSITORY}"             --cleanup-tag --yes
