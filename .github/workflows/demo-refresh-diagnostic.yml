name: Demo refresh diagnostic

on:
  push:
    paths:
      - ".github/workflows/demo-refresh-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Generate candidate demo artifacts
        shell: bash
        run: |
          python -B - <<'PY'
          import copy
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "compiler")
          import verify_graphics_demos as v

          expect = v.load_expect()
          old = copy.deepcopy(expect)
          report = {}
          for name, exp in expect["demos"].items():
              data = v.compile_bytes(name)
              binary = v.BIN / f"{name}.c48b"
              binary.write_bytes(data)
              first = v.run_demo(name, 1)
              screen = v.run_demo(name, int(exp["frames"]))
              png = v.png_bytes(screen.render_rgb())
              image = v.IMG / f"{name}.png"
              image.write_bytes(png)
              lit, attrs = v.screen_metrics(screen)
              exp["source_sha256"] = v.sha(v.SRC / f"{name}.c")
              exp["binary_sha256"] = v.sha_bytes(data)
              exp["first_screen_sha256"] = v.sha_bytes(first.bytes())
              exp["screen_sha256"] = v.sha_bytes(screen.bytes())
              exp["png_sha256"] = v.sha_bytes(png)
              exp["lit_pixels"] = lit
              exp["attribute_values"] = attrs
              report[name] = {
                  key: {"old": old["demos"][name].get(key), "new": exp.get(key)}
                  for key in (
                      "source_sha256", "binary_sha256", "first_screen_sha256",
                      "screen_sha256", "png_sha256", "lit_pixels", "attribute_values"
                  ) if old["demos"][name].get(key) != exp.get(key)
              }
          v.EXPECT_PATH.write_text(json.dumps(expect, indent=2) + "\n", encoding="ascii", newline="\n")
          out = Path("demo-refresh-candidate")
          out.mkdir()
          (out / "report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="ascii")
          (out / "graphics_demo_expectations.json").write_bytes(v.EXPECT_PATH.read_bytes())
          for name in expect["demos"]:
              (out / f"{name}.c48b").write_bytes((v.BIN / f"{name}.c48b").read_bytes())
              (out / f"{name}.png").write_bytes((v.IMG / f"{name}.png").read_bytes())
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Check persistent HUD rows
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import re
          from pathlib import Path
          import sys

          sys.path.insert(0, "compiler")
          import verify_graphics_demos as v

          expect = v.load_expect()
          report = {}
          failures = []
          for name in expect["demos"]:
              source = (v.SRC / f"{name}.c").read_text(encoding="ascii")
              rows = sorted({
                  int(value)
                  for value in re.findall(r"print_at\(\s*(\d+)\s*,", source)
              })
              one = v.run_demo(name, 1).render_rgb()
              two = v.run_demo(name, 2).render_rgb()
              changed = []
              for row in rows:
                  start = row * 8 * 256 * 3
                  end = (row + 1) * 8 * 256 * 3
                  if one[start:end] != two[start:end]:
                      changed.append(row)
              report[name] = {"hud_rows": rows, "changed_rows": changed}
              if changed:
                  failures.append(f"{name}:{','.join(map(str, changed))}")
          out = Path("demo-refresh-candidate")
          (out / "hud-stability.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="ascii",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit("HUD rows changed between frames: " + "; ".join(failures))
          PY
      - name: Verify regenerated static corpus
        run: python -B compiler/verify_graphics_demos.py --static
      - name: Upload candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-refresh-candidate
          path: demo-refresh-candidate
          retention-days: 7
