name: Finalize demo relocation release

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-demo-relocation.yml"

permissions:
  contents: write
  actions: write

env:
  SELF_PATH: .github/workflows/finalize-demo-relocation.yml
  RC_TAG: 1.0.0-RC5
  FINAL_TAG: 1.0.0

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Remove helper from main and capture target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${SELF_PATH}?ref=main" --jq .sha)"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "message": "Remove release finalizer",
              "sha": os.environ["BLOB_SHA"],
              "branch": "main",
              "author": {"name": "SANYALnet Labs", "email": "labs@sanyalnet.org"},
              "committer": {"name": "SANYALnet Labs", "email": "labs@sanyalnet.org"},
          }))
          PY
          )"
          BLOB_SHA="${blob}" python - <<'PY' > delete.json
          import json, os
          print(json.dumps({
              "message": "Remove release finalizer",
              "sha": os.environ["BLOB_SHA"],
              "branch": "main",
              "author": {"name": "SANYALnet Labs", "email": "labs@sanyalnet.org"},
              "committer": {"name": "SANYALnet Labs", "email": "labs@sanyalnet.org"},
          }))
          PY
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${SELF_PATH}" --input delete.json > deleted.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("deleted.json").read_text())
          sha=data["commit"]["sha"]
          Path("target-sha.txt").write_text(sha+"\n", encoding="ascii")
          print("target="+sha)
          PY

      - name: Dispatch exact-main recertification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(cat target-sha.txt)"
          for i in $(seq 1 30); do
            main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [ "${main}" = "${target}" ]; then break; fi
            sleep 2
          done
          test "${main}" = "${target}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release-recertify.yml/dispatches" -f ref=main >/dev/null

      - name: Wait for recertification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]
          target=Path("target-sha.txt").read_text(encoding="ascii").strip()
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/release-recertify.yml/runs?head_sha={target}&event=workflow_dispatch&per_page=20"
          headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","User-Agent":"zx-ux-c48-release-finalizer","X-GitHub-Api-Version":"2022-11-28"}
          deadline=time.monotonic()+5*60*60
          while time.monotonic()<deadline:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
              runs=[x for x in data.get("workflow_runs",[]) if x.get("head_sha")==target and x.get("event")=="workflow_dispatch"]
              runs.sort(key=lambda x:int(x.get("run_number",0)),reverse=True)
              if runs:
                  run=runs[0]
                  print(f"recertification run={run['id']} status={run.get('status')} conclusion={run.get('conclusion')}",flush=True)
                  if run.get("status")=="completed":
                      if run.get("conclusion")!="success":
                          raise SystemExit(f"recertification failed: {run.get('conclusion')}")
                      Path("recertify-run.txt").write_text(f"{run['id']}\n",encoding="ascii")
                      break
              time.sleep(20)
          else:
              raise SystemExit("timed out waiting for recertification")
          PY

      - name: Prepare final assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(cat target-sha.txt)"
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}" --jq .object.sha)"
          test "${resolved}" = "${target}"
          MAIN_RC="zx-ux-c48-sdk-${RC_TAG}-${target}.zip"
          GUI_RC="c48-${RC_TAG}-gui-evidence-${target}.zip"
          mkdir -p rc
          gh release download "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${MAIN_RC}" --pattern "${GUI_RC}" --dir rc
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${target}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${target}.zip"
          cp "rc/${MAIN_RC}" "${MAIN_FINAL}"
          cp "rc/${GUI_RC}" "${GUI_FINAL}"
          TARGET="${target}" MAIN_FINAL="${MAIN_FINAL}" GUI_FINAL="${GUI_FINAL}" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          data={
              "schema":4,
              "release":os.environ["FINAL_TAG"],
              "release_commit":os.environ["TARGET"],
              "recertification_run":int(Path("recertify-run.txt").read_text().strip()),
              "demo_count":24,
              "frame_demo_count":22,
              "recursive_demo_count":2,
              "change":"Relocate Hanoi and 8-Queens into the demos corpus.",
              "assets":{
                  os.environ["MAIN_FINAL"]:sha(os.environ["MAIN_FINAL"]),
                  os.environ["GUI_FINAL"]:sha(os.environ["GUI_FINAL"]),
              },
          }
          Path("RELEASE-METADATA-1.0.0.json").write_text(json.dumps(data,indent=2,sort_keys=True)+"\n",encoding="ascii",newline="\n")
          PY
          META="RELEASE-METADATA-1.0.0.json"
          SUMS="SHA256SUMS-1.0.0.txt"
          { sha256sum "${MAIN_FINAL}"; sha256sum "${GUI_FINAL}"; sha256sum "${META}"; } > "${SUMS}"
          cat > release-notes.md <<EOF
          # C48 SDK 1.0.0

          This refreshed full **1.0.0** release classifies Towers of Hanoi and
          8-Queens as demos and places their source, compiled programs, and
          screenshots in the demos corpus.

          The release was rebuilt and recertified from exact commit
          `${target}` through the complete verification, sound, desktop,
          graphics, recursive-demo, package, and virgin-package gates.

          **Main package:** `${MAIN_FINAL}`

          Requires Python 3.10 or newer.
          EOF

      - name: Publish final release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(cat target-sha.txt)"
          MAIN_FINAL="zx-ux-c48-sdk-${FINAL_TAG}-${target}.zip"
          GUI_FINAL="c48-${FINAL_TAG}-gui-evidence-${target}.zip"
          META="RELEASE-METADATA-1.0.0.json"
          SUMS="SHA256SUMS-1.0.0.txt"
          gh release upload "${FINAL_TAG}" "${MAIN_FINAL}" "${GUI_FINAL}" "${META}" "${SUMS}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${FINAL_TAG}" -f sha="${target}" -F force=true >/dev/null
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" --jq .id)"
          body="$(cat release-notes.md)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f tag_name="${FINAL_TAG}" -f target_commitish="${target}" -f name="C48 SDK 1.0.0" -f body="${body}" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --paginate --jq '.[] | [.id,.name] | @tsv' > assets.tsv
          while IFS=$'\t' read -r id name; do
            case "${name}" in
              "${MAIN_FINAL}"|"${GUI_FINAL}"|"${META}"|"${SUMS}") ;;
              *) gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" ;;
            esac
          done < assets.tsv
          gh release delete "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes

      - name: Verify publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(cat target-sha.txt)"
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FINAL_TAG}" --jq .object.sha)"
          test "${resolved}" = "${target}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" > published.json
          TARGET="${target}" python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("published.json").read_text(encoding="utf-8"))
          if r.get("draft") or r.get("prerelease"): raise SystemExit("release state mismatch")
          if r.get("target_commitish")!=os.environ["TARGET"]: raise SystemExit("release target mismatch")
          names={x["name"] for x in r.get("assets",[])}
          expected={
              f"zx-ux-c48-sdk-1.0.0-{os.environ['TARGET']}.zip",
              f"c48-1.0.0-gui-evidence-{os.environ['TARGET']}.zip",
              "RELEASE-METADATA-1.0.0.json",
              "SHA256SUMS-1.0.0.txt",
          }
          if names!=expected: raise SystemExit(f"asset set mismatch: {sorted(names)}")
          print("FINAL RELEASE VERIFY PASS")
          PY
