name: Chess one-off landing

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/chess-land.yml"

permissions:
  contents: write

concurrency:
  group: chess-one-off-landing-main
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore certified chess delta and screenshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object usr/src/games/chess.c)" =             "fb8e934768fe7d452fda009cf00cce0e3a813667"
          printf '%s' '' | base64 -d > /tmp/chess-delta.tar.xz
          printf '%s  %s\n'             59207eec2e1d0a4787bee3b957a1b775f4fd91c66ad21a41837e2fe557a8842b             /tmp/chess-delta.tar.xz | sha256sum -c -
          tar -xJf /tmp/chess-delta.tar.xz -C /tmp
          git apply --check /tmp/chess.patch
          git apply /tmp/chess.patch
          mkdir -p docs/images/games
          cp /tmp/chess.png docs/images/games/chess.png
          printf '%s  %s\n'             dbbb87a39a9c68427e40ffc64c3e24e7148fe19e4f72c7a337382a78f3d505d6             usr/src/games/chess.c | sha256sum -c -
          printf '%s  %s\n'             edd55c6372e3f3437588ddeb075a7788a8f8622ad62c2c30247bbb9e4b6ae8c8             docs/images/games/chess.png | sha256sum -c -
          test "$(wc -c < usr/src/games/chess.c)" -eq 32766
          test "$(wc -c < docs/images/games/chess.png)" -eq 2160

      - name: Rebuild exact C48B1
        shell: bash
        run: |
          set -euo pipefail
          ./c48 usr/src/games/chess.c -o usr/bin/games/chess.c48b
          printf '%s  %s\n'             8f5545b93bc4ad5499117bcd6a558484e8fc1ec9ba391e706000505f860d12af             usr/bin/games/chess.c48b | sha256sum -c -
          test "$(wc -c < usr/bin/games/chess.c48b)" -eq 683249

      - name: Commit exactly the chess artifacts and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/chess-land.yml
          git add usr/src/games/chess.c             usr/bin/games/chess.c48b             docs/images/games/chess.png             .github/workflows/chess-land.yml
          printf '%s\n'             '.github/workflows/chess-land.yml'             'docs/images/games/chess.png'             'usr/bin/games/chess.c48b'             'usr/src/games/chess.c' > /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/staged-paths
          diff -u /tmp/expected-paths /tmp/staged-paths
          git diff --cached --check
          git show :docs/images/games/chess.png > /tmp/chess-pointer
          grep -Fx 'version https://git-lfs.github.com/spec/v1' /tmp/chess-pointer
          grep -Fx 'oid sha256:edd55c6372e3f3437588ddeb075a7788a8f8622ad62c2c30247bbb9e4b6ae8c8' /tmp/chess-pointer
          grep -Fx 'size 2160' /tmp/chess-pointer
          git commit -m "Finalize ZX-UX Chess"
          git lfs fsck --pointers HEAD
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
