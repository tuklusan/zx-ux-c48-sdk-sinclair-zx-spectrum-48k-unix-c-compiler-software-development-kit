name: Chess one-off landing

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/chess-land.yml"

permissions:
  contents: write

concurrency:
  group: chess-one-off-landing-main
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore and verify certified chess payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object usr/src/games/chess.c)" = "fb8e934768fe7d452fda009cf00cce0e3a813667"
          test "$(git hash-object .github/chess-payload.b64)" = "cd96fa764cd25a3934576985368dc16722a348a1"
          rm -rf /tmp/chess-delta
          mkdir -p /tmp/chess-delta
          base64 -d .github/chess-payload.b64 > /tmp/chess-delta/payload.tar.xz
          printf '%s  %s\n' \
            59207eec2e1d0a4787bee3b957a1b775f4fd91c66ad21a41837e2fe557a8842b \
            /tmp/chess-delta/payload.tar.xz | sha256sum -c -
          tar -tJf /tmp/chess-delta/payload.tar.xz | sort > /tmp/chess-members
          printf '%s\n' chess.patch chess.png > /tmp/chess-expected-members
          diff -u /tmp/chess-expected-members /tmp/chess-members
          tar -xJf /tmp/chess-delta/payload.tar.xz -C /tmp/chess-delta
          printf '%s  %s\n' \
            090772271d567c3a0e891d22fe924b151e60858f24c53875508c9e5465dff637 \
            /tmp/chess-delta/chess.patch | sha256sum -c -
          printf '%s  %s\n' \
            edd55c6372e3f3437588ddeb075a7788a8f8622ad62c2c30247bbb9e4b6ae8c8 \
            /tmp/chess-delta/chess.png | sha256sum -c -
          git apply --check /tmp/chess-delta/chess.patch
          git apply /tmp/chess-delta/chess.patch
          mkdir -p docs/images/games
          cp /tmp/chess-delta/chess.png docs/images/games/chess.png
          printf '%s  %s\n' \
            dbbb87a39a9c68427e40ffc64c3e24e7148fe19e4f72c7a337382a78f3d505d6 \
            usr/src/games/chess.c | sha256sum -c -
          printf '%s  %s\n' \
            edd55c6372e3f3437588ddeb075a7788a8f8622ad62c2c30247bbb9e4b6ae8c8 \
            docs/images/games/chess.png | sha256sum -c -
          test "$(wc -c < usr/src/games/chess.c)" -eq 32766
          test "$(wc -c < docs/images/games/chess.png)" -eq 2160

      - name: Rebuild exact C48B1
        shell: bash
        run: |
          set -euo pipefail
          ./c48 usr/src/games/chess.c -o usr/bin/games/chess.c48b
          printf '%s  %s\n' \
            8f5545b93bc4ad5499117bcd6a558484e8fc1ec9ba391e706000505f860d12af \
            usr/bin/games/chess.c48b | sha256sum -c -
          test "$(wc -c < usr/bin/games/chess.c48b)" -eq 683249

      - name: Commit exactly the chess artifacts
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/chess-payload.b64
          git add \
            .github/chess-payload.b64 \
            docs/images/games/chess.png \
            usr/bin/games/chess.c48b \
            usr/src/games/chess.c
          printf '%s\n' \
            '.github/chess-payload.b64' \
            'docs/images/games/chess.png' \
            'usr/bin/games/chess.c48b' \
            'usr/src/games/chess.c' > /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/staged-paths
          diff -u /tmp/expected-paths /tmp/staged-paths
          git diff --cached --check
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git show :docs/images/games/chess.png > /tmp/chess-pointer
          grep -Fx 'version https://git-lfs.github.com/spec/v1' /tmp/chess-pointer
          grep -Fx 'oid sha256:edd55c6372e3f3437588ddeb075a7788a8f8622ad62c2c30247bbb9e4b6ae8c8' /tmp/chess-pointer
          grep -Fx 'size 2160' /tmp/chess-pointer
          git commit -m "Finalize ZX-UX Chess"
          git lfs fsck --pointers HEAD
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
