name: C48 SDK verification

"on":
  push:
    branches: [main, cleanup/deep-clean-2026-09-14]
    paths:
      # Exact-candidate inputs, including release-facing documentation, run the
      # full matrix so the release commit itself carries verification evidence.
      - "VERSION"
      - "README.md"
      - "docs/*.docx"
      - ".gitattributes"
      - "compiler/**/*.py"
      - "compiler/**/*.json"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/**/*.c"
      - "usr/src/**/*.h"
      - "usr/bin/**/*.c48b"
      - "usr/bin/**/*.src.tap"
      - "c48"
      - "c48.bat"
      - "c48run"
      - "c48run.bat"
      - "c48srctap"
      - "c48srctap.bat"
      - ".github/workflows/verify.yml"
      - ".github/workflows/multitask.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.13"]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run forensic review regressions
        run: python -B compiler/tests/forensic_review_regression.py

      - name: Run complete C48 SDK verifier
        run: python -B compiler/verify_release.py

      - name: Smoke-test Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          c48.bat --version
          c48run.bat --version
          c48srctap.bat --version

      - name: Smoke-test POSIX launchers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./c48 --version
          ./c48run --version
          ./c48srctap --version
