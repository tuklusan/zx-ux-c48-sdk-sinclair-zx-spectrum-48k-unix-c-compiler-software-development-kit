name: One-shot ailmzx48 UI correction

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-bootstrap-retry.yml"

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply exact corrections
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          Path(".github/ailmzx48_ui_patch.py").write_bytes(data)
          PY
          python -B .github/ailmzx48_ui_patch.py
          rm -f .github/ailmzx48_ui_patch.py

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check
          grep -q 'Revision: 0.13-draft' \
            usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md
          ! grep -q 'Copyright (c) 2006' \
            usr/src/ailmzx48/ailmzx48.c
          ! grep -q 'puts("Based on original work' \
            usr/src/ailmzx48/ailmzx48.c

      - name: Commit and push correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct ailmzx48 UI attribution policy"
          git push origin HEAD:main
