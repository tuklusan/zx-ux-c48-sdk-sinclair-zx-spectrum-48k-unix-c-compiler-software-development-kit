name: One-shot ailmzx48 topic-conditioned prep

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-bootstrap-retry.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply topic-conditioned bootstrap model
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          Path(".github/ailmzx48_topic_patch.py").write_bytes(data)
          PY
          python -B .github/ailmzx48_topic_patch.py
          rm -f .github/ailmzx48_topic_patch.py

      - name: Build iteration 3 candidate artifacts
        shell: bash
        run: |
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 3
          python -B compiler/c48.py \
            usr/src/ailmzx48/ailmzx48.c \
            -o usr/bin/ailmzx48/ailmzx48.c48b
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('usr/src/ailmzx48/model/current-model.json')
          m = json.loads(p.read_text())
          assert m['schema'] == 2
          assert m['topics'] == [
              'identity', 'spectrum', 'history',
              'memory', 'local', 'games'
          ]
          assert len(m['next_primary']) == len(m['vocab']) * 6
          assert len(m['next_secondary']) == len(m['vocab']) * 6
          PY

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete candidate
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check
          grep -q 'Revision: 0.15-draft' \
            usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md
          grep -q 'unsigned int ai_tcnt = 6;' \
            usr/src/ailmzx48/aimod.h

      - name: Commit and push iteration 3 preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m \
            "Prepare topic-conditioned ailmzx48 iteration 3"
          git push origin HEAD:main
