name: One-shot ailmzx48 iteration 2 prep

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-bootstrap-retry.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

