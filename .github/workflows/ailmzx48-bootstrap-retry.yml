name: One-shot ailmzx48 iteration 2 prep

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-bootstrap-retry.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply iteration 2 preparation
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          Path(".github/ailmzx48_iter2_prep.py").write_bytes(data)
          PY
          python -B .github/ailmzx48_iter2_prep.py
          rm -f .github/ailmzx48_iter2_prep.py

      - name: Prove generated model source compiles
        shell: bash
        run: |
          cp usr/src/ailmzx48/aimod.h /tmp/aimod.h
          trap 'cp /tmp/aimod.h usr/src/ailmzx48/aimod.h' EXIT
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json /tmp/iter-0002-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 2
          python -B compiler/c48.py \
            usr/src/ailmzx48/ailmzx48.c \
            -o /tmp/ailmzx48-iter2.c48b
          cp /tmp/aimod.h usr/src/ailmzx48/aimod.h
          trap - EXIT

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete preparation
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check
          test ! -e usr/src/ailmzx48/training/requests/iter-0002.json

      - name: Commit and push preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare ailmzx48 iteration 2"
          git push origin HEAD:main
