name: Finalize Batch-5A graphics fixes

"on":
  push:
    branches: [main]
    paths:
      - ".github/land_batch5a_final.py"
      - ".github/workflows/land-batch5a-final.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  certify-and-land:
    name: Reuse certified evidence, certify, and land
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out fresh main with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download certified Batch-5A matrix evidence
        uses: actions/download-artifact@v4
        with:
          pattern: batch5a-*-4b9213f385eb85a09faf9591923af91e89d9ef24
          path: batch5a-evidence
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: 35051898928
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate, clean, release-verify, SoP-certify, and land
        run: >-
          python -B .github/land_batch5a_final.py
          land batch5a-evidence
