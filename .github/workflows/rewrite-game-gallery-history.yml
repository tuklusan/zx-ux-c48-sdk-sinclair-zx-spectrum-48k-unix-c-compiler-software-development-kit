# Temporary one-shot README rewrite workflow. It removes itself after success.
name: Rewrite game gallery history

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-game-gallery-history.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace paragraph and run three fresh SoP scans
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          path = Path("README.md")
          old = """These snapshots are captured at each game's first interactive input boundary on an Ubuntu 24.04/x64 runner. Before capture, every checked-in C48B1 game is rebuilt from its C source and byte-compared; the complete gallery was then rendered three times with fixed runtime ticks and produced byte-identical images."""
          new = """These games are included as a small cultural time capsule of what “computer games” meant around 1982, not as replicas of any one historical software library. By then **Adventure** had turned caves, maps and magic words into mainframe folklore; **Hunt the Wumpus** had made pits, superbats and a monster lurking in a graph of rooms a shared BASIC-era legend; **Star Trek** had travelled through time-sharing systems, schools, magazines and books in endlessly rewritten listings; **Rogue** was carrying that tradition into Unix terminals with a different dungeon every run; and **chess** remained computing’s classic public test of whether a machine could appear to think. Backgammon, cribbage, Go Fish, Hangman, mazes, quizzes, arithmetic drills, fortune programs and the growing-line chase behind Snake represent the other, equally nostalgic side of early personal computing: compact games people typed in, copied, traded, ported, altered and understood by reading the code. Together they give the SDK a playable connection to the culture, folklore and home-computer, school-lab and terminal-room imagination surrounding machines like the ZX Spectrum when it arrived in 1982."""

          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")
          if text.count(old) != 1:
              raise SystemExit(f"expected old paragraph exactly once; found {text.count(old)}")
          if new in text:
              raise SystemExit("replacement paragraph unexpectedly already present")

          candidate_text = text.replace(old, new)
          candidate = candidate_text.encode("utf-8")
          path.write_bytes(candidate)

          expected_games = [
              "advent", "arith", "bgammon", "chess", "cribbage", "fish",
              "fortune", "hangman", "maze", "quiz", "rogue", "snake",
              "trek", "wump",
          ]

          def validate(data: bytes, pass_no: int) -> None:
              # Disk-byte scan: walk every byte within every physical line.
              walked = 0
              for line_no, line in enumerate(data.splitlines(keepends=True), 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(
                      f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}"
                  )
              decoded = data.decode("utf-8", errors="strict")
              if old in decoded:
                  raise SystemExit(f"pass {pass_no}: old paragraph remains")
              if decoded.count(new) != 1:
                  raise SystemExit(f"pass {pass_no}: replacement paragraph count mismatch")
              if decoded.count("## Document Library") != 1:
                  raise SystemExit(f"pass {pass_no}: Document Library heading mismatch")
              if decoded.count("## Games gallery — 14 C48 games") != 1:
                  raise SystemExit(f"pass {pass_no}: games heading mismatch")
              if decoded.index("## Document Library") > decoded.index("## Games gallery — 14 C48 games"):
                  raise SystemExit(f"pass {pass_no}: section ordering changed")
              if decoded.index("## Games gallery — 14 C48 games") > decoded.index("## Relationship to native ZX-UX"):
                  raise SystemExit(f"pass {pass_no}: gallery placement changed")
              for name in expected_games:
                  image = f"docs/images/games/{name}.png"
                  source = f'usr/src/games/{name}.c'
                  if decoded.count(image) != 1:
                      raise SystemExit(f"pass {pass_no}: image reference mismatch for {name}")
                  if decoded.count(source) != 1:
                      raise SystemExit(f"pass {pass_no}: source link mismatch for {name}")
              if decoded.count("docs/images/games/contact-sheet.png") != 1:
                  raise SystemExit(f"pass {pass_no}: contact sheet reference mismatch")
              if "These snapshots are captured" in decoded:
                  raise SystemExit(f"pass {pass_no}: stale dry wording remains")
              print(
                  f"SOP PASS {pass_no}: {len(data)} bytes, "
                  f"sha256={hashlib.sha256(data).hexdigest()}"
              )

          # Three successive scans from separately created fresh disk copies.
          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/readme-history-sop-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY

      - name: Commit README and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rewrite-game-gallery-history.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: explain historical game selection"
          git push origin HEAD:main
