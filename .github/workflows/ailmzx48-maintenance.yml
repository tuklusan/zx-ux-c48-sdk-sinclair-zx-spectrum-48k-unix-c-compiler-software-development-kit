name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Replace noun routing with bounded model evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("usr/src/ailmzx48/ailmzx48.c")
          s = p.read_text(encoding="utf-8")

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, got {n}")
              s = s.replace(old, new)

          once(
              "unsigned int ai_mtrusted;\nunsigned int ai_fs1;",
              "unsigned int ai_mtrusted;\nunsigned int ai_mtopic;\nunsigned int ai_fs1;",
              "model topic state",
          )

          old_pick = '''unsigned int ai_pick(void)
          {
              if (ai_has("memory") || ai_has("bitmap"))
                  return ai_t_mem;
              if (ai_has("48k")) return ai_t_mem;
              if (ai_has("game") || ai_has("miner"))
                  return ai_t_games;
              if (ai_has("lore")) return ai_t_games;
              if (ai_has("network")) return ai_t_local;
              if (ai_has("local")) return ai_t_local;
              if (ai_has("chat")) return ai_t_local;
              if (ai_has("1982") || ai_has("history"))
                  return ai_t_hist;
              if (ai_has("before")) return ai_t_hist;
              if (ai_has("spectrum")) return ai_t_spec;
              if (ai_has("computer")) return ai_t_spec;
              if (ai_hcount != 0 && ai_has("go back")) {
                  ai_ctxuse = 1;
                  ai_histuse = 1;
                  return ai_hist[ai_hcount - 1];
              }
              if (ai_havectx) {
                  if (ai_has("tell me more")) {
                      ai_ctxuse = 1;
                      return ai_lasttop;
                  }
                  if (ai_has("what about that")) {
                      ai_ctxuse = 1;
                      return ai_lasttop;
                  }
                  if (ai_has("same topic")) {
                      ai_ctxuse = 1;
                      return ai_lasttop;
                  }
              }
              return ai_t_id;
          }'''.replace("          ", "")
          new_pick = '''unsigned int ai_pick(void)
          {
              if (ai_hcount != 0 && ai_has("go back")) {
                  ai_ctxuse = 1;
                  ai_histuse = 1;
                  return ai_hist[ai_hcount - 1];
              }
              if (ai_havectx) {
                  if (ai_has("tell me more")) {
                      ai_ctxuse = 1;
                      return ai_lasttop;
                  }
                  if (ai_has("what about that")) {
                      ai_ctxuse = 1;
                      return ai_lasttop;
                  }
                  if (ai_has("same topic")) {
                      ai_ctxuse = 1;
                      return ai_lasttop;
                  }
              }
              return ai_tcnt;
          }'''.replace("          ", "")
          once(old_pick, new_pick, "ai_pick")

          once(
              "    ai_w2score = -1;\n    actual = ai_mstat();",
              "    ai_w2score = -1;\n    ai_mtopic = ai_t_id;\n    actual = ai_mstat();",
              "model scan topic init",
          )
          once(
              "        rtopic = ai_getu16(ai_mstage, 2);\n        if (ai_getu16(ai_mstage, 4) > 32767) return -1;",
              "        rtopic = ai_getu16(ai_mstage, 2);\n        if (rtopic >= ai_tcnt) return -1;\n        if (ai_getu16(ai_mstage, 4) > 32767) return -1;",
              "runtime topic bound",
          )
          once(
              '''        score = -1;
              if (rtopic == topic) {
                  score = (int)ai_mstage[8];
                  score = score + (int)(thits * 16);
              }'''.replace("              ", ""),
              '''        score = -1;
              if (topic == ai_tcnt) {
                  if (thits != 0) {
                      score = (int)(thits * 256);
                      score = score + (int)ai_mstage[8];
                  }
              } else if (rtopic == topic) {
                  score = (int)ai_mstage[8];
                  score = score + (int)(thits * 16);
              }'''.replace("              ", ""),
              "generic score",
          )
          once(
              '''        if (slot == 1) {
              ai_w1len = rlen;
              ai_w1score = score;
          }'''.replace("              ", ""),
              '''        if (slot == 1) {
              ai_w1len = rlen;
              ai_w1score = score;
              ai_mtopic = rtopic;
          }'''.replace("              ", ""),
              "winning topic capture",
          )
          once(
              "    ai_mtrusted = 0;\n    ai_l0head = 0;",
              "    ai_mtrusted = 0;\n    ai_mtopic = ai_t_id;\n    ai_l0head = 0;",
              "main topic init",
          )

          old_route = '''        alt = 0;
          if (ai_havectx && topic == ai_lasttop) {
              if (ai_altstate == 0) {
                  ai_altstate = 1;
                  alt = 1;
              } else {
                  ai_altstate = 0;
              }
          } else {
              ai_altstate = 0;
          }
          rc = ai_modelscan(topic);'''.replace("          ", "")
          new_route = '''        rc = ai_modelscan(topic);
          if (topic == ai_tcnt) {
              if (rc > 0) {
                  topic = ai_mtopic;
                  ai_semuse = 1;
              } else if (rc == 0) {
                  topic = ai_t_id;
                  rc = ai_modelscan(topic);
              } else {
                  topic = ai_t_id;
              }
          }
          alt = 0;
          if (ai_havectx && topic == ai_lasttop) {
              if (ai_altstate == 0) {
                  ai_altstate = 1;
                  alt = 1;
              } else {
                  ai_altstate = 0;
              }
          } else {
              ai_altstate = 0;
          }'''.replace("          ", "")
          once(old_route, new_route, "main generic route")

          forbidden = (
              'ai_has("memory")', 'ai_has("bitmap")', 'ai_has("48k")',
              'ai_has("game")', 'ai_has("miner")', 'ai_has("lore")',
              'ai_has("network")', 'ai_has("local")', 'ai_has("chat")',
              'ai_has("1982")', 'ai_has("history")', 'ai_has("before")',
              'ai_has("spectrum")', 'ai_has("computer")',
          )
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit("hand-written routing remains: " + repr(leftovers))
          if "score = (int)(thits * 256);" not in s:
              raise SystemExit("generic trigger-dominant score missing")
          p.write_text(s, encoding="utf-8")
          print({"source_bytes": p.stat().st_size,
                 "routing": "cold-model-trigger-evidence"})
          PY

      - name: Test ailmzx48 context reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test ailmzx48 A48M reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Compile ailmzx48 SDK artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Evaluate iterative exit criteria
        run: >-
          python -B usr/src/ailmzx48/evaluation/check_exit_criteria.py
          --write-status usr/src/ailmzx48/training/goal-status.json

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ailmzx48 maintenance checkpoint"
          git push origin HEAD:main
