name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Test ailmzx48 context reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ailmzx48 maintenance checkpoint"
          git push origin HEAD:main
