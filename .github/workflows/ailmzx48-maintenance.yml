name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Avoid repeated immutable-model checksum work
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("usr/src/ailmzx48/ailmzx48.c")
          s = p.read_text(encoding="utf-8")
          reps = [
              ("unsigned int ai_mreads;\nunsigned int ai_fs1;",
               "unsigned int ai_mreads;\nunsigned int ai_mtrusted;\nunsigned int ai_fs1;"),
              ("        ai_fdata(ai_mstage, hlen);",
               "        if (!ai_mtrusted) ai_fdata(ai_mstage, hlen);"),
              ("            ai_fdata(ai_mstage, take);",
               "            if (!ai_mtrusted) ai_fdata(ai_mstage, take);"),
              ("    calc = ai_fs1 + (ai_fs2 * 256);\n    if (calc != ai_getu16(ai_mhead, 32)) return -1;\n    if (ai_mbytes != logical) return -1;",
               "    if (!ai_mtrusted) {\n        calc = ai_fs1 + (ai_fs2 * 256);\n        if (calc != ai_getu16(ai_mhead, 32)) return -1;\n        if (ai_mbytes != logical) return -1;\n        ai_mtrusted = 1;\n    }"),
              ("    ai_mreads = 0;\n    ai_l0head = 0;",
               "    ai_mreads = 0;\n    ai_mtrusted = 0;\n    ai_l0head = 0;"),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit("patch anchor missing: " + old[:40])
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Test ailmzx48 context reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test ailmzx48 A48M reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Compile ailmzx48 SDK artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Evaluate iterative exit criteria
        run: >-
          python -B usr/src/ailmzx48/evaluation/check_exit_criteria.py
          --write-status usr/src/ailmzx48/training/goal-status.json

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ailmzx48 maintenance checkpoint"
          git push origin HEAD:main
