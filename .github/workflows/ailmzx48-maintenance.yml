name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Deepen Spectrum history and model chronology
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("usr/src/ailmzx48/training/seed_corpus.json")
          doc = json.loads(p.read_text(encoding="utf-8"))
          additions = [
              {
                  "kind": "fact-user", "split": "train", "topic": "history",
                  "text": "the zx spectrum launched in britain on 23 april 1982 at 125 pounds for the 16k model and 175 pounds for the 48k model",
                  "triggers": ["launch", "125", "175", "april"],
              },
              {
                  "kind": "fact-user", "split": "train", "topic": "history",
                  "text": "the spectrum plus arrived in 1984 with a ql style hard keyboard and a reset button while retaining 48k ram",
                  "triggers": ["1984", "reset", "ql"],
              },
              {
                  "kind": "fact-user", "split": "train", "topic": "history",
                  "text": "the spectrum 128 was developed with spanish distributor investronica and reached the united kingdom in january 1986 with 128k ram and three channel ay sound",
                  "triggers": ["128", "investronica", "january", "ay"],
              },
              {
                  "kind": "fact-user", "split": "train", "topic": "history",
                  "text": "amstrad acquired the rights to the spectrum computer range in april 1986 and continued the line with new models",
                  "triggers": ["amstrad", "acquired", "rights", "1986"],
              },
              {
                  "kind": "fact-user", "split": "train", "topic": "history",
                  "text": "the spectrum plus 2 appeared in 1986 as the first amstrad spectrum and included a built in cassette deck",
                  "triggers": ["cassette", "built", "amstrad", "1986"],
              },
              {
                  "kind": "fact-user", "split": "train", "topic": "history",
                  "text": "the spectrum plus 3 appeared in 1987 with a built in three inch floppy disk drive",
                  "triggers": ["1987", "floppy", "disk", "three"],
              },
          ]
          existing = {r["text"] for r in doc["records"]}
          for record in additions:
              if record["text"] not in existing:
                  doc["records"].append(record)
          p.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          PY
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 44

      - name: Test ailmzx48 context reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test ailmzx48 A48M reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Compile ailmzx48 SDK artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Evaluate iterative exit criteria
        run: >-
          python -B usr/src/ailmzx48/evaluation/check_exit_criteria.py
          --write-status usr/src/ailmzx48/training/goal-status.json

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ailmzx48 maintenance checkpoint"
          git push origin HEAD:main
