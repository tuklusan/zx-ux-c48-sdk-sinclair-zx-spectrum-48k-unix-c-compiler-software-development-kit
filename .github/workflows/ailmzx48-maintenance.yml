name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Migrate trigger IDs and deepen Spectrum history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path("usr/src/ailmzx48/tooling/build_starter_model.py")
          s = p.read_text(encoding="utf-8")
          old = '''    required = []\n    for word in seed_words + tuple(trigger_words):\n        if word not in required:\n            required.append(word)\n    if len(required) > MAX_VOCAB - 1:\n        raise ValueError(\n            "seed words and retrieval triggers exceed model vocabulary: "\n            + str(len(required))\n            + " required, "\n            + str(MAX_VOCAB - 1)\n            + " available"\n        )\n'''
          new = '''    required = list(seed_words)\n    if len(required) > MAX_VOCAB - 1:\n        raise ValueError("topic seed words exceed model vocabulary")\n'''
          if old not in s: raise SystemExit("starter vocabulary anchor missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("usr/src/ailmzx48/tooling/a48m_reference.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("VERSION = 1\n", "VERSION = 2\nTRIGGER_BASE = 224\nTRIGGER_SLOTS = 4096 - TRIGGER_BASE\n", 1)
          anchor = '''def encode_literal_payload(text: str) -> tuple[bytes, tuple[int, int]]:\n'''
          helper = '''def trigger_id(word: str, salt: int) -> int:\n    h = (216 + salt) & 0xFFFF\n    for value in word.encode("ascii"):\n        h = ((h * 33) ^ value) & 0xFFFF\n    return TRIGGER_BASE + (h % TRIGGER_SLOTS)\n\n\ndef choose_trigger_salt(words: list[str]) -> int:\n    clean = []\n    for raw in words:\n        word = str(raw).lower()\n        if TOKEN_RE.findall(word) != [word]:\n            raise A48MError("trigger must be one normalized token: " + repr(raw))\n        if word not in clean:\n            clean.append(word)\n    for salt in range(65536):\n        seen = {}\n        ok = True\n        for word in clean:\n            tid = trigger_id(word, salt)\n            if tid in seen and seen[tid] != word:\n                ok = False\n                break\n            seen[tid] = word\n        if ok:\n            return salt\n    raise A48MError("no collision-free trigger hash salt")\n\n\n'''
          if anchor not in s: raise SystemExit("a48m helper anchor missing")
          s = s.replace(anchor, helper + anchor, 1)
          s = s.replace('raise A48MError("record exceeds Candidate-A maximum")', 'raise A48MError("record exceeds Candidate-A maximum: " + str(len(raw)) + " bytes")', 1)
          old = '''def build_container(\n    records: list[bytes], vocab_id: bytes, interface_id: bytes\n) -> bytes:\n'''
          new = '''def build_container(\n    records: list[bytes], vocab_id: bytes, interface_id: bytes,\n    trigger_salt: int,\n) -> bytes:\n'''
          if old not in s: raise SystemExit("container signature anchor missing")
          s = s.replace(old, new, 1)
          s = s.replace('    header.extend(b"\\x00\\x00")\n    header.extend(b"\\x00" * 6)\n', '    header.extend(b"\\x00\\x00")\n    header.extend(u16(trigger_salt))\n    header.extend(b"\\x00" * 4)\n', 1)
          s = s.replace('    if any(header[34:40]):\n        raise A48MError("nonzero reserved header bytes")\n', '    if any(header[36:40]):\n        raise A48MError("nonzero reserved header bytes")\n    trigger_salt = get_u16(header, 34)\n', 1)
          s = s.replace('        "checksum": checksum,\n', '        "checksum": checksum,\n        "trigger_salt": trigger_salt,\n', 1)
          old = '''    vocab_map = {\n        word: index for index, word in enumerate(model["vocab"])\n    }\n    vocab_id = identity(model["vocab"])\n'''
          new = '''    vocab_id = identity(model["vocab"])\n    all_trigger_words = []\n    for item in corpus["records"]:\n        if item.get("kind") == "fact-user":\n            for word in item.get("triggers", []):\n                if word not in all_trigger_words:\n                    all_trigger_words.append(word)\n    trigger_salt = choose_trigger_salt(all_trigger_words)\n'''
          if old not in s: raise SystemExit("seed vocab-map anchor missing")
          s = s.replace(old, new, 1)
          s = s.replace('        "scoring": "topic-match-plus-importance-v1",\n', '        "scoring": "topic-match-plus-importance-v1",\n        "trigger_scheme": "salted-wordhash16-band-v1",\n', 1)
          old = '''        trigger_ids = []\n        for word in trigger_words:\n            if word not in vocab_map or vocab_map[word] == 0:\n                raise A48MError("seed trigger missing from vocab: " + word)\n            trigger_ids.append(vocab_map[word])\n'''
          new = '''        trigger_ids = []\n        for raw in trigger_words:\n            word = str(raw).lower()\n            if TOKEN_RE.findall(word) != [word]:\n                raise A48MError("invalid seed trigger: " + repr(raw))\n            trigger_ids.append(trigger_id(word, trigger_salt))\n'''
          if old not in s: raise SystemExit("seed trigger anchor missing")
          s = s.replace(old, new, 1)
          s = s.replace('    data = build_container(records, vocab_id, interface_id)\n', '    data = build_container(records, vocab_id, interface_id, trigger_salt)\n', 1)
          s = s.replace('        "format": "A48M Candidate-A prototype v1",\n', '        "format": "A48M Candidate-A prototype v2",\n', 1)
          s = s.replace('        "interface_id_hex": interface_id.hex(),\n', '        "interface_id_hex": interface_id.hex(),\n        "trigger_salt": trigger_salt,\n', 1)
          p.write_text(s, encoding="utf-8")

          p = Path("usr/src/ailmzx48/aimatch.h")
          s = p.read_text(encoding="utf-8")
          start = s.index("int ai_vhas(unsigned int id)\n{")
          end = s.index("\n}\n", start) + 3
          repl = '''unsigned int ai_mtsalt;\n\nint ai_vhas(unsigned int id)\n{\n    unsigned int i;\n    unsigned int h;\n    i = 0;\n    while (ai_in[i] != 0) {\n        while (ai_in[i] != 0 && !ai_wordchar(ai_in[i])) i = i + 1;\n        if (ai_in[i] == 0) break;\n        h = 216 + ai_mtsalt;\n        while (ai_in[i] != 0 && ai_wordchar(ai_in[i])) {\n            h = (h * 33) ^ ai_lower(ai_in[i]);\n            i = i + 1;\n        }\n        if (224 + (h % 3872) == id) return 1;\n    }\n    return 0;\n}\n'''
          p.write_text(s[:start] + repl + s[end:], encoding="utf-8")

          p = Path("usr/src/ailmzx48/ailmzx48.c")
          s = p.read_text(encoding="utf-8")
          old = '''    if (ai_mhead[0] != 'A') return -1;\n    if (ai_mhead[1] != '4') return -1;\n    if (ai_mhead[2] != '8') return -1;\n    if (ai_mhead[3] != 'M') return -1;\n    if (ai_mhead[4] != 1) return -1;\n    if (ai_mhead[5] != 0) return -1;\n    if (ai_mhead[6] != 40) return -1;\n    if (ai_mhead[7] != 1) return -1;\n    i = 34;\n    while (i < 40) {\n        if (ai_mhead[i] != 0) return -1;\n        i = i + 1;\n    }\n'''
          new = '''    if(ai_mhead[0]!='A'||ai_mhead[1]!='4'||ai_mhead[2]!='8'||ai_mhead[3]!='M')return -1;\n    if(ai_mhead[4]!=2||ai_mhead[5]!=0||ai_mhead[6]!=40||ai_mhead[7]!=1)return -1;\n    ai_mtsalt=ai_getu16(ai_mhead,34);\n    i=36;\n    while(i<40){if(ai_mhead[i]!=0)return -1;i=i+1;}\n'''
          if old not in s: raise SystemExit("runtime header anchor missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("usr/src/ailmzx48/evaluation/test_a48m_reference.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace('        "max_record_bytes": 192,\n', '        "max_record_bytes": 192,\n        "trigger_salt": parsed["trigger_salt"],\n', 1)
          s = s.replace('            "exact-record-count-and-section-end",\n', '            "exact-record-count-and-section-end",\n            "collision-free-salted-trigger-id-space",\n', 1)
          p.write_text(s, encoding="utf-8")

          p = Path("usr/src/ailmzx48/training/seed_corpus.json")
          doc = json.loads(p.read_text(encoding="utf-8"))
          additions = [
              {"kind":"fact-user","split":"train","topic":"history","text":"zx spectrum launched 23 april 1982 at 125 pounds for 16k and 175 pounds for 48k","triggers":["launch","125","175","april"]},
              {"kind":"fact-user","split":"train","topic":"history","text":"spectrum plus arrived in 1984 with ql style keyboard reset button and 48k ram","triggers":["1984","reset","ql"]},
              {"kind":"fact-user","split":"train","topic":"history","text":"spectrum 128 reached britain in january 1986 with 128k ram and three channel ay sound after spanish investronica development","triggers":["128","investronica","january","ay"]},
              {"kind":"fact-user","split":"train","topic":"history","text":"amstrad acquired spectrum computer rights in april 1986 and continued the line","triggers":["amstrad","acquired","rights","1986"]},
              {"kind":"fact-user","split":"train","topic":"history","text":"spectrum plus 2 was the first amstrad spectrum in 1986 with a built in cassette deck","triggers":["cassette","built","amstrad","1986"]},
              {"kind":"fact-user","split":"train","topic":"history","text":"spectrum plus 3 arrived in 1987 with a built in three inch floppy disk drive","triggers":["1987","floppy","disk","three"]},
          ]
          existing = {r["text"] for r in doc["records"]}
          for record in additions:
              if record["text"] not in existing: doc["records"].append(record)
          p.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          PY
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 44
          printf 'AILMZX48_SOURCE_BYTES main=%s match=%s limit=32768\n' \
            "$(wc -c < usr/src/ailmzx48/ailmzx48.c)" \
            "$(wc -c < usr/src/ailmzx48/aimatch.h)"

      - name: Test ailmzx48 context reference
        run: python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test ailmzx48 A48M reference
        run: python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Compile ailmzx48 SDK artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Evaluate iterative exit criteria
        run: >-
          python -B usr/src/ailmzx48/evaluation/check_exit_criteria.py
          --write-status usr/src/ailmzx48/training/goal-status.json

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ailmzx48 maintenance checkpoint"
          git push origin HEAD:main
