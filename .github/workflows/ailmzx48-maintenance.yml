name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Apply bounded topic routing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path("usr/src/ailmzx48/ailmzx48.c")
          text = src.read_text(encoding="utf-8")
          pairs = [
              ('    if (ai_has("memory")) return ai_t_mem;\n',
               '    if (ai_has("memory") || ai_has("bitmap"))\n'
               '        return ai_t_mem;\n'),
              ('    if (ai_has("game")) return ai_t_games;\n',
               '    if (ai_has("game") || ai_has("miner"))\n'
               '        return ai_t_games;\n'
               '    if (ai_has("lore")) return ai_t_games;\n'),
              ('    if (ai_has("1982")) return ai_t_hist;\n'
               '    if (ai_has("history")) return ai_t_hist;\n',
               '    if (ai_has("1982") || ai_has("history"))\n'
               '        return ai_t_hist;\n'
               '    if (ai_has("before")) return ai_t_hist;\n'),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit("routing patch preimage mismatch")
              text = text.replace(old, new)
          src.write_text(text, encoding="utf-8")

          hdr = Path("usr/src/ailmzx48/aimatch.h")
          text = hdr.read_text(encoding="utf-8")
          old = '''\nunsigned int ai_routepick(void)\n{\n    if (ai_has("bitmap")) return ai_t_mem;\n    if (ai_has("manic miner")) return ai_t_games;\n    if (ai_has("knight lore")) return ai_t_games;\n    if (ai_has("jet set willy")) return ai_t_games;\n    if (ai_has("came before")) return ai_t_hist;\n    return ai_pick();\n}\n\n#define ai_pick ai_routepick\n'''
          if text.count(old) != 1:
              raise SystemExit("routing shim preimage mismatch")
          hdr.write_text(text.replace(old, "\n"), encoding="utf-8")
          PY

      - name: Test ailmzx48 context reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test ailmzx48 A48M reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Compile ailmzx48 SDK artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Regenerate deterministic demo corpus
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import sys

          sys.path.insert(0, "compiler")
          import verify_graphics_demos as v

          expect = v.load_expect()
          for name, exp in expect["demos"].items():
              data = v.compile_bytes(name)
              (v.BIN / f"{name}.c48b").write_bytes(data)
              first = v.run_demo(name, 1)
              screen = v.run_demo(name, int(exp["frames"]))
              png = v.png_bytes(screen.render_rgb())
              (v.IMG / f"{name}.png").write_bytes(png)
              lit, attrs = v.screen_metrics(screen)
              exp["source_sha256"] = v.sha(v.SRC / f"{name}.c")
              exp["binary_sha256"] = v.sha_bytes(data)
              exp["first_screen_sha256"] = v.sha_bytes(first.bytes())
              exp["screen_sha256"] = v.sha_bytes(screen.bytes())
              exp["png_sha256"] = v.sha_bytes(png)
              exp["lit_pixels"] = lit
              exp["attribute_values"] = attrs
          v.EXPECT_PATH.write_text(
              json.dumps(expect, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY
          python -B compiler/verify_graphics_demos.py --static

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ailmzx48: improve bounded topic routing"
          git push origin HEAD:main
