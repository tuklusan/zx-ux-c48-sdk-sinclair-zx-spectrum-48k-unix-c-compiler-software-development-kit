name: ailmzx48 maintenance

"on":
  push:
    branches: [main]
    paths:
      - ".github/ailmzx48-maintenance-request.txt"

permissions:
  contents: write

concurrency:
  group: ailmzx48-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate maintenance marker
        shell: bash
        run: |
          test -f .github/ailmzx48-maintenance-request.txt
          git rm .github/ailmzx48-maintenance-request.txt

      - name: Refine BASIC retrieval triggers and rebuild model
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("usr/src/ailmzx48/training/seed_corpus.json")
          doc = json.loads(p.read_text(encoding="utf-8"))
          trigger_map = {
              "spectrum basic programs and their variables are held in ram while the basic interpreter is held in rom": ["held", "ram", "interpreter", "rom"],
              "spectrum basic peek reads the value of a byte at an address and poke writes a value to a byte at an address": ["peek", "poke", "byte", "address"],
              "spectrum basic randomize usr followed by an address calls a machine code routine at that address": ["randomize", "usr", "calls", "routine"],
              "spectrum basic clear with a numeric address can change ramtop so bytes above the new ramtop can be preserved for machine code": ["clear", "ramtop", "preserve", "bytes"],
              "spectrum basic new deletes the current basic program and variables before starting the basic system anew": ["new", "current", "deletes", "anew"],
              "spectrum basic save and load store and retrieve programs using cassette tape on the original machine": ["save", "load", "cassette", "retrieve"],
              "spectrum basic run clears variables and starts program execution from line zero or from a specified line": ["run", "execution", "clears", "line"],
              "spectrum basic program lines are listed in ascending line number order": ["lines", "list", "order", "ascending"],
          }
          seen = set()
          for record in doc["records"]:
              text = record.get("text")
              if text in trigger_map:
                  record["triggers"] = trigger_map[text]
                  seen.add(text)
          missing = set(trigger_map) - seen
          if missing:
              raise SystemExit("missing BASIC records: " + repr(sorted(missing)))
          p.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          PY
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 41

      - name: Test ailmzx48 context reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py

      - name: Test ailmzx48 A48M reference
        run: >-
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py

      - name: Compile ailmzx48 SDK artifact
        run: >-
          python -B compiler/c48.py
          usr/src/ailmzx48/ailmzx48.c
          -o usr/bin/ailmzx48/ailmzx48.c48b

      - name: Evaluate iterative exit criteria
        run: >-
          python -B usr/src/ailmzx48/evaluation/check_exit_criteria.py
          --write-status usr/src/ailmzx48/training/goal-status.json

      - name: Regenerate release manifest
        run: python -B usr/src/ailmzx48/tooling/update_manifest.py

      - name: Verify complete repository
        shell: bash
        run: |
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push maintenance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ailmzx48 maintenance checkpoint"
          git push origin HEAD:main
