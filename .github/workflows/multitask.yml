name: C48 cooperative multitask verification

"on":
  push:
    branches: [main]
    paths:
      - "compiler/c48run.py"
      - "compiler/c48/multitask.py"
      - "compiler/c48/gui.py"
      - "compiler/tests/test_multitask.py"
      - "compiler/verify_multitask.py"
      - "compiler/C48RUN-MULTITASK-CONTRACT.md"
      - "usr/bin/demos/hanoi.c48b"
      - "usr/bin/demos/queens8.c48b"
      - "c48run"
      - "c48run.bat"
      - ".github/workflows/multitask.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.13"]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run cooperative runtime regressions
        run: python -B compiler/tests/test_multitask.py

      - name: Run frozen recursive-pair proof
        run: python -B compiler/verify_multitask.py

      - name: Smoke-test Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: c48run.bat --version

      - name: Smoke-test POSIX launcher
        if: runner.os != 'Windows'
        shell: bash
        run: ./c48run --version
