name: Remove gallery architectures

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-gallery-architectures.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rewrite gallery metadata and certify README
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object README.md)" = "86c6dc8f810cc95f7906c8aaeb03b2e346117534"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          path = Path("README.md")
          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")
          token = "Ubuntu 24.04/x64 · "

          games_h = "## Games gallery — 14 C48 games"
          relation_h = "## Relationship to native ZX-UX"
          apps_h = "## Applications gallery — 3 C48 applications"
          runtime_h = "## Runtime notes"

          gs = text.index(games_h)
          ge = text.index(relation_h, gs)
          aps = text.index(apps_h, ge)
          ape = text.index(runtime_h, aps)

          games = text[gs:ge]
          between = text[ge:aps]
          apps = text[aps:ape]
          rest_before = text[:gs]
          rest_after = text[ape:]

          if games.count(token) != 14:
              raise SystemExit(f"expected 14 game architecture labels; found {games.count(token)}")
          if apps.count(token) != 3:
              raise SystemExit(f"expected 3 app architecture labels; found {apps.count(token)}")

          new_games = games.replace(token, "")
          new_apps = apps.replace(token, "")
          candidate = rest_before + new_games + between + new_apps + rest_after

          # Guard: only the two targeted sections may differ.
          if candidate[:gs] != text[:gs]:
              raise SystemExit("content changed before games section")
          c_ge = candidate.index(relation_h, gs)
          c_aps = candidate.index(apps_h, c_ge)
          c_ape = candidate.index(runtime_h, c_aps)
          if candidate[c_ge:c_aps] != text[ge:aps]:
              raise SystemExit("relationship section changed")
          if candidate[c_ape:] != text[ape:]:
              raise SystemExit("content changed after applications section")

          path.write_text(candidate, encoding="utf-8", newline="\n")

          game_names = [
              "advent", "arith", "bgammon", "chess", "cribbage", "fish", "fortune",
              "hangman", "maze", "quiz", "rogue", "snake", "trek", "wump",
          ]
          app_names = ["write48", "sheet48", "wire3d"]

          def validate(data: bytes, pass_no: int) -> None:
              walked = 0
              for line_no, line in enumerate(data.splitlines(keepends=True), 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at README line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")

              decoded = data.decode("utf-8", errors="strict")
              g0 = decoded.index(games_h)
              g1 = decoded.index(relation_h, g0)
              a0 = decoded.index(apps_h, g1)
              a1 = decoded.index(runtime_h, a0)
              gsec = decoded[g0:g1]
              asec = decoded[a0:a1]

              if token in gsec or token in asec:
                  raise SystemExit(f"pass {pass_no}: architecture label remains in games/apps")
              if "Ubuntu 24.04/x64" in gsec or "Ubuntu 24.04/x64" in asec:
                  raise SystemExit(f"pass {pass_no}: architecture text remains in games/apps")

              for name in game_names:
                  expected = f'<sub><a href="usr/src/games/{name}.c">{name}.c</a></sub>'
                  if gsec.count(expected) != 1:
                      raise SystemExit(f"pass {pass_no}: game source row mismatch for {name}")
              for name in app_names:
                  expected = f'<sub><a href="usr/src/apps/{name}.c">{name}.c</a></sub>'
                  if asec.count(expected) != 1:
                      raise SystemExit(f"pass {pass_no}: app source row mismatch for {name}")

              # The earlier demo gallery intentionally retains its architecture evidence.
              before_games = decoded[:g0]
              if "Ubuntu 24.04/x64" not in before_games or "Windows Server 2025/x64" not in before_games or "macOS 26/Arm64" not in before_games:
                  raise SystemExit(f"pass {pass_no}: demo architecture labels unexpectedly changed")

              print(
                  f"README SOP PASS {pass_no}: {len(data)} bytes, "
                  f"sha256={hashlib.sha256(data).hexdigest()}"
              )

          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/readme-gallery-arch-sop-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "README.md"
              fresh.write_bytes(path.read_bytes())
              validate(fresh.read_bytes(), pass_no)
          PY
          git diff --check -- README.md

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-gallery-architectures.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: simplify games and apps gallery metadata"
          git push origin HEAD:main
