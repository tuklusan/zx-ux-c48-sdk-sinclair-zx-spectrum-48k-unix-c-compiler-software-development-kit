name: C48 BEEP numerical proof

"on":
  push:
    branches: [main]
    paths:
      # BEEP proof inputs only: executable verifier/runtime code and binary data.
      # Documentation and images never consume this 8-row matrix.
      - "VERSION"
      - "compiler/**/*.py"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/c48host.h"
      - "usr/src/sound/**/*.c"
      - "usr/src/sound/**/*.h"
      - "usr/bin/sound/**/*.c48b"
      - ".github/workflows/beep.yml"
  pull_request:
    paths:
      - "VERSION"
      - "compiler/**/*.py"
      - "compiler/**/*.bin"
      - "compiler/**/*.rom"
      - "usr/src/c48host.h"
      - "usr/src/sound/**/*.c"
      - "usr/src/sound/**/*.h"
      - "usr/bin/sound/**/*.c48b"
      - ".github/workflows/beep.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  beep-proof:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.13"]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install optional POSIX proof adapter
        run: python -m pip install playsound3==3.3.2

      - name: Prove ROM-derived BEEP numerically
        run: python -B compiler/verify_beep.py --require-playsound3
