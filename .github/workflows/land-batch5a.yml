name: Land Batch-5A graphics fixes

"on":
  push:
    branches: [main]
    paths:
      - ".github/land_batch5a.py"
      - ".github/workflows/land-batch5a.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out fresh main with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply, verify, SoP-certify, and land Batch-5A
        run: python -B .github/land_batch5a.py land
