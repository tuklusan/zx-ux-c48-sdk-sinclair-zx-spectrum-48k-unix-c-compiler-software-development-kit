name: Fix Dizzy 4K source width

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-dizzy4k-width.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repair source contract and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("usr/src/demos/dizzy4k.c")
          text = p.read_text(encoding="utf-8")
          old_url = (
              " * https://www.planetemu.net/rom/"
              "sinclair-zx-spectrum-demos-tap/"
              "dizzy-4k-intro-1998-04-serzhsoft-ru-en-funtop\n"
          )
          new_url = (
              " * https://bbb.retroscene.org/prods.php?py=16&y=1998\n"
          )
          if old_url not in text:
              raise SystemExit("archive URL anchor missing")
          text = text.replace(old_url, new_url, 1)

          old_x = (
              "            x = 128 + d_sin(f * 9 + i * 28) * "
              "(35 + (i & 3) * 9) / 128;\n"
          )
          new_x = (
              "            x = 128 + d_sin(f * 9 + i * 28) *\n"
              "                (35 + (i & 3) * 9) / 128;\n"
          )
          old_y = (
              "            y = 96 + d_cos(f * 7 + i * 37) * "
              "(24 + (i & 1) * 18) / 128;\n"
          )
          new_y = (
              "            y = 96 + d_cos(f * 7 + i * 37) *\n"
              "                (24 + (i & 1) * 18) / 128;\n"
          )
          for old, new in ((old_x, new_x), (old_y, new_y)):
              if old not in text:
                  raise SystemExit("expression wrap anchor missing")
              text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8", newline="\n")

          bad = [
              (i, len(line))
              for i, line in enumerate(text.splitlines(), 1)
              if len(line) > 64
          ]
          if bad:
              raise SystemExit(f"remaining long lines: {bad}")
          PY

          python -B compiler/c48.py usr/src/demos/dizzy4k.c

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          p = Path("compiler/graphics_demo_expectations.json")
          data = json.loads(p.read_text(encoding="ascii"))
          item = data["demos"]["dizzy4k"]
          item["source_sha256"] = sha("usr/src/demos/dizzy4k.c")
          item["binary_sha256"] = sha("usr/bin/demos/dizzy4k.c48b")
          p.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY

          python -B compiler/verify_graphics_demos.py --static
          python -B compiler/check_license_headers.py

      - name: Stage and commit
        shell: bash
        run: |
          set -euo pipefail
          git add             usr/src/demos/dizzy4k.c             usr/bin/demos/dizzy4k.c48b             compiler/graphics_demo_expectations.json
          python -B compiler/check_project_banned_words.py
          git diff --cached --check
          git diff --cached --name-only
          git config user.name "SANYALnet Labs"
          git config user.email "sanyalnet-labs@users.noreply.github.com"
          git commit -m "fix: satisfy Dizzy 4K source width"
          git push origin HEAD:main
