name: Complete queued C48 work

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/queued-c48-work.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build queued work from disk
        run: python -B compiler/finalize_queued_work.py

      - name: Remove one-shot builder
        run: >-
          git rm .github/workflows/queued-c48-work.yml
          compiler/finalize_queued_work.py

      - name: Rebuild canonical manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path(".")
          rows = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if ".git" in rel.parts:
                  continue
              if rel.as_posix() == "MANIFEST.sha256":
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == ".bat":
                  data = data.replace(b"\r\n", b"\n")
              digest = hashlib.sha256(data).hexdigest()
              rows.append((rel.as_posix(), digest))
          rows.sort()
          Path("MANIFEST.sha256").write_text(
              "".join(f"{digest}  {rel}\n" for rel, digest in rows),
              encoding="ascii",
              newline="\n",
          )
          PY

      - name: Verify complete SDK from disk
        run: python -B compiler/verify_release.py

      - name: Commit verified result to main
        shell: bash
        run: |
          git config user.name "C48 queued-work builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add C48 applications and animated sprite demo"
          git push origin HEAD:main
