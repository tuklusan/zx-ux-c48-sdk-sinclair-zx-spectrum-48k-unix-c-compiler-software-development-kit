name: Recursive demo verification

"on":
  push:
    branches: [main]
    paths:
      - "compiler/verify_recursive_demos.py"
      - "compiler/c48/**/*.py"
      - "compiler/c48.py"
      - "compiler/c48run.py"
      - "compiler/assets/SANYALnet-Labs-4x8-font-FINAL.bin"
      - "usr/src/demos/recapi.h"
      - "usr/src/demos/hanoi.c"
      - "usr/src/demos/queens8.c"
      - "usr/bin/demos/hanoi.c48b"
      - "usr/bin/demos/queens8.c48b"
      - "docs/images/demos/hanoi.png"
      - "docs/images/demos/queens8.png"
      - ".github/workflows/recursive-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run recursive demo verifier
        run: python -B compiler/verify_recursive_demos.py
