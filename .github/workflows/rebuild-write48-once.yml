name: Rebuild write48 once

on:
  push:
    paths:
      - '.github/workflows/rebuild-write48-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild and validate write48
        shell: bash
        run: |
          set -euo pipefail
          python -B compiler/c48.py usr/src/apps/write48.c -o usr/bin/apps/write48.c48b
          echo 'bcc6b92e6512c1f756995fc9398b32ea20ccdce43e0a92bdf575d306b66ed52c  usr/bin/apps/write48.c48b' | sha256sum -c -
          python -B compiler/c48run.py --headless usr/bin/apps/write48.c48b verify
          printf 'iabc\033q' | python -B compiler/c48run.py --headless usr/bin/apps/write48.c48b
      - name: Commit only source and binary final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rebuild-write48-once.yml
          git add usr/bin/apps/write48.c48b
          git commit -m 'write48: rebuild binary without per-key yield'
          mapfile -t changed < <(git diff --name-only 19f1f4de7d4792788f9b0f99b14e306c4855e77d HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'usr/bin/apps/write48.c48b'
          test "${changed[1]}" = 'usr/src/apps/write48.c'
      - name: Verify clean final repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python -B compiler/verify_release.py
          git diff --check 19f1f4de7d4792788f9b0f99b14e306c4855e77d HEAD
      - name: Push final pair
        shell: bash
        run: git push origin HEAD:main
