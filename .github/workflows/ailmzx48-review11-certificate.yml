name: One-shot ailmzx48 revision 0.11 review certificate

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-review11-certificate.yml"

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Confirm exact reviewed ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2448a82767ebb547f14467c0dc43b77e58972a8b"
          test "$(git rev-parse HEAD^^)" = "d2876158bd194f72199872b69dd14c83dd0c1fcb"
          test "$(git hash-object usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md)" = "258ad19d6d5c3e4f7bc0f7ab1d15f1689d3f2cea"

      - name: Write durable review certificate
        shell: bash
        run: |
          set -euo pipefail
          python .github/ailmzx48-review11-cert.py

      - name: Remove temporary helpers and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/ailmzx48-review11-cert.py
          git rm .github/workflows/ailmzx48-review11-certificate.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.').resolve()
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {rel.as_posix()}\n')
          (root / 'MANIFEST.sha256').write_text(
              ''.join(lines), encoding='ascii', newline='\n'
          )
          PY

      - name: Verify certified repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object usr/src/ailmzx48/AILMZX48-DETAILED-DESIGN.md)" = "258ad19d6d5c3e4f7bc0f7ab1d15f1689d3f2cea"
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Certify ailmzx48 revision 0.11 zero-gap review"
          git push origin HEAD:main
