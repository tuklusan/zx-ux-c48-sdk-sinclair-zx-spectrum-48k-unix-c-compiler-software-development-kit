name: One-shot ailmzx48 repository repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-ailmzx48.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Repair headers and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-ailmzx48.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.').resolve()
          header = '''<!--
          ============================================================================
          Copyright (c) 2026 Supratim Sanyal of SANYALnet Labs.
          Proprietary rights reserved except as expressly licensed herein.

          ZX-UX C48 SDK
          This file is governed by the SANYALnet Labs Non-Commercial License in the
          root LICENSE file. Non-Commercial use is permitted; Commercial Use and use
          for AI/ML model training are prohibited unless separately authorized.

          Attribution is required: "Based on original work by Supratim Sanyal of
          SANYALnet Labs." See LICENSE for full terms, warranty disclaimer, termination,
          patent, trademark, and governing-law provisions.
          ============================================================================
          -->
          '''
          readmes = [
              Path('usr/src/ailmzx48/model/README.md'),
              Path('usr/src/ailmzx48/training/README.md'),
              Path('usr/src/ailmzx48/evaluation/README.md'),
              Path('usr/src/ailmzx48/conversations/README.md'),
              Path('usr/src/ailmzx48/tooling/README.md'),
          ]
          marker = 'Copyright (c) 2026 Supratim Sanyal of SANYALnet Labs.'
          for rel in readmes:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              if marker not in text[:3000]:
                  path.write_text(header + text, encoding='utf-8', newline='\n')

          manifest = root / 'MANIFEST.sha256'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or rel.as_posix() == 'MANIFEST.sha256':
                  continue
              data = path.read_bytes()
              if path.suffix.lower() == '.bat':
                  data = data.replace(b'\r\n', b'\n')
              digest = hashlib.sha256(data).hexdigest()
              lines.append(f'{digest}  {rel.as_posix()}\n')
          manifest.write_text(''.join(lines), encoding='ascii', newline='\n')
          PY

      - name: Run full SDK verifier on repaired tree
        run: python -B compiler/verify_release.py

      - name: Commit repaired verification state to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair ailmzx48 repository verification state"
          git push origin HEAD:main
