      - name: Enforce C48 source-column contract
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          bad = []
          for p in sorted(Path("usr/src").rglob("*")):
              if not p.is_file() or p.suffix not in {".c", ".h"}:
                  continue
              data = p.read_bytes()
              try:
                  text = data.decode("ascii")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"non-ASCII C48 source {p}: {exc}")
              for n, line in enumerate(text.splitlines(), 1):
                  if len(line) > 64:
                      bad.append(f"{p}:{n}:{len(line)}")
          if bad:
              raise SystemExit("64-column violations: " + ", ".join(bad))
          print("C48 SOURCE COLUMN SCAN PASS")
          PY

      - name: Rebuild all application binaries
        shell: bash
        run: |
          set -euo pipefail
          for name in sheet48 write48 wire3d; do
            python -B compiler/c48.py "usr/src/apps/${name}.c" -o "usr/bin/apps/${name}.c48b"
          done

      - name: Refresh application expectations from rebuilt bytes
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "compiler"))
          from c48.format import read
          from c48.screen import Font4x8, ZXScreen
          from c48.vm import C48VM

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          path = ROOT / "compiler/app_expectations.json"
          data = json.loads(path.read_text(encoding="ascii"))
          data["helper_sha256"] = sha(ROOT / "usr/src/apps/appapi.h")
          font = Font4x8.load(ROOT / "compiler/assets/font4x8-tasword.bin")
          for name in ("sheet48", "write48", "wire3d"):
              src = ROOT / f"usr/src/apps/{name}.c"
              binary = ROOT / f"usr/bin/apps/{name}.c48b"
              item = data["apps"][name]
              item["source_sha256"] = sha(src)
              item["binary_sha256"] = sha(binary)
              screen = ZXScreen(font)
              vm = C48VM(
                  read(binary), screen, argv=[name, "verify"],
                  max_steps=10000000,
              )
              status = vm.run()
              if status != 0:
                  raise SystemExit(f"{name}: startup status {status}")
              item["screen_sha256"] = hashlib.sha256(
                  screen.bytes()
              ).hexdigest()
          path.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="ascii",
              newline="\n",
          )
          print("APP EXPECTATIONS REFRESHED")
          PY

