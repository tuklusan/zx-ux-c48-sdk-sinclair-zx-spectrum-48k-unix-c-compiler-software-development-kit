name: Land Batch-1 app review fixes

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/land-app-batch1.yml"

permissions:
  contents: write
  actions: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact landing base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Guard parent and one-shot delta
        shell: bash
        run: |
          set -euo pipefail
          base=c86d9d1c8b0b121e55334bc342ad6f21e4b8fb59
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/land-app-batch1.yml"

      - name: Apply guarded source and verifier fixes
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="ascii")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, got {count}")
              p.write_text(text.replace(old, new), encoding="ascii", newline="\n")

          rep(
              "usr/src/apps/appapi.h",
              """    char buf[33];
    int i;
    i = 0;
""",
              """    char buf[33];
    int i;
    if (width < 0)
        width = 0;
    if (width > 32)
        width = 32;
    i = 0;
""",
              "app_field width clamp",
          )

          rep(
              "usr/src/apps/sheet48.c",
              """unsigned int sh_ref(char *s, int *used, int depth)
{
    int col;
    int row;
    int i;
    col = sh_colno(s[0]);
    if (col < 0) {
        *used = 0;
        return 0u;
    }
    i = 1;
    row = 0;
    while (s[i] >= '0' && s[i] <= '9') {
        row = row * 10 + s[i] - '0';
        i++;
    }
    *used = i;
    if (row < 1 || row > 8)
        return 0u;
    return sh_value(row - 1, col, depth + 1);
}
""",
              """unsigned int sh_ref(char *s, int *used, int depth)
{
    int col;
    int row;
    col = sh_colno(s[0]);
    if (col < 0 || s[1] < '1' || s[1] > '8') {
        *used = 0;
        return 0u;
    }
    if (s[2] >= '0' && s[2] <= '9') {
        *used = 0;
        return 0u;
    }
    row = s[1] - '1';
    *used = 2;
    return sh_value(row, col, depth + 1);
}
""",
              "sheet strict cell reference",
          )

          rep(
              "usr/src/apps/sheet48.c",
              """unsigned int sh_formula(char *s, int depth)
{
    unsigned int a;
    unsigned int b;
    unsigned int total;
    int used;
    int used2;
    int r1;
    int r2;
    int c;
    int i;
    if (depth > 6)
        return 0u;
    if (s[1] == 'S' && s[2] == 'U' && s[3] == 'M' &&
        s[4] == '(') {
        c = sh_colno(s[5]);
        r1 = s[6] - '0';
        r2 = s[9] - '0';
        if (c < 0 || s[7] != ':' || s[8] != s[5])
            return 0u;
        total = 0u;
        for (i = r1; i <= r2; i++)
            total = total + sh_value(i - 1, c, depth + 1);
        return total;
    }
    a = sh_ref(s + 1, &used, depth);
    if (used == 0)
        return 0u;
    i = 1 + used;
    b = sh_ref(s + i + 1, &used2, depth);
    if (used2 == 0)
        return 0u;
    if (s[i] == '+')
        return a + b;
    if (s[i] == '-')
        return a - b;
    if (s[i] == '*')
        return a * b;
    if (s[i] == '/' && b != 0u)
        return a / b;
    return 0u;
}
""",
              """unsigned int sh_formula(char *s, int depth)
{
    unsigned int a;
    unsigned int b;
    unsigned int total;
    int used;
    int used2;
    int r1;
    int r2;
    int c;
    int c2;
    int i;
    if (depth > 6)
        return 0u;
    if (s[1] == 'S' && s[2] == 'U' && s[3] == 'M' &&
        s[4] == '(') {
        c = sh_colno(s[5]);
        c2 = sh_colno(s[8]);
        if (c < 0 || c2 != c || s[6] < '1' || s[6] > '8')
            return 0u;
        if (s[7] != ':' || s[9] < '1' || s[9] > '8')
            return 0u;
        if (s[10] != ')' || s[11] != 0)
            return 0u;
        r1 = s[6] - '0';
        r2 = s[9] - '0';
        if (r1 > r2)
            return 0u;
        total = 0u;
        for (i = r1; i <= r2; i++)
            total = total + sh_value(i - 1, c, depth + 1);
        return total;
    }
    a = sh_ref(s + 1, &used, depth);
    if (used == 0)
        return 0u;
    i = 1 + used;
    if (s[i] != '+' && s[i] != '-' &&
        s[i] != '*' && s[i] != '/')
        return 0u;
    b = sh_ref(s + i + 1, &used2, depth);
    if (used2 == 0 || s[i + 1 + used2] != 0)
        return 0u;
    if (s[i] == '+')
        return a + b;
    if (s[i] == '-')
        return a - b;
    if (s[i] == '*')
        return a * b;
    if (b != 0u)
        return a / b;
    return 0u;
}
""",
              "sheet strict formula grammar",
          )

          rep(
              "usr/src/apps/sheet48.c",
              """unsigned int sh_value(int row, int col, int depth)
{
    char *p;
    p = sh_cell(row, col);
""",
              """unsigned int sh_value(int row, int col, int depth)
{
    char *p;
    if (row < 0 || row > 7 || col < 0 || col > 3)
        return 0u;
    p = sh_cell(row, col);
""",
              "sheet value bounds guard",
          )

          rep(
              "usr/src/apps/write48.c",
              """void wr_page(int down)
{
""",
              """int wr_prevrow(int pos)
{
