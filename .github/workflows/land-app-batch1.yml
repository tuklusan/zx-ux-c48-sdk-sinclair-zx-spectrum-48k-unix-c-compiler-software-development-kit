name: Land Batch-1 app review fixes

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/land-app-batch1.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact landing base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Replay guarded landing plan from staging commit
        shell: bash
        run: |
          set -euo pipefail
          parent=4a87f33c05ba7854707fb9b36db74ed52f22f56b
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = ".github/workflows/land-app-batch1.yml"
          python -B - <<'PY'
          import os
          import subprocess

          stage = "6bbdf6312e4e531f4b55bab23c5cb34121094ad9"
          path = ".github/workflows/land-app-batch1.yml"
          text = subprocess.check_output(
              ["git", "show", f"{stage}:{path}"], text=True
          )
          text = text.replace(
              "          verifier_insert = r'''def run_probe",
              '          verifier_insert = r"""def run_probe',
              1,
          )
          outer_end = (
              "\n'''\n          rep(\n"
              "              \"compiler/verify_apps.py\",\n"
              "              verifier_anchor,"
          )
          fixed_end = (
              '\n"""\n          rep(\n'
              "              \"compiler/verify_apps.py\",\n"
              "              verifier_anchor,"
          )
          if text.count(outer_end) != 1:
              raise SystemExit("verifier outer-string terminator anchor mismatch")
          text = text.replace(outer_end, fixed_end, 1)
          lines = text.splitlines()

          def bounds_for(name):
              marker = "      - name: " + name
              try:
                  i = lines.index(marker)
              except ValueError as exc:
                  raise SystemExit(f"historical step missing: {name}") from exc
              i += 1
              while i < len(lines) and lines[i] != "        run: |":
                  if lines[i].startswith("      - name: "):
                      raise SystemExit(f"run block missing for: {name}")
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f"run block missing for: {name}")
              start = i + 1
              end = start
              while end < len(lines) and not lines[end].startswith("      - name: "):
                  end += 1
              return start, end

          def script_for(name):
              start, end = bounds_for(name)
              raw = lines[start:end]
              if name != "Apply guarded source and verifier fixes":
                  return "\n".join(
                      line[10:] if line.startswith("          ") else line
                      for line in raw
                  ) + "\n"

              out = []
              quote = None
              for raw_line in raw:
                  if quote is None:
                      line = (
                          raw_line[10:]
                          if raw_line.startswith("          ")
                          else raw_line
                      )
                      out.append(line)
                      for delim in ('"""', "'''"):
                          if line.count(delim) % 2:
                              quote = delim
                              break
                  else:
                      out.append(raw_line)
                      if raw_line.count(quote) % 2:
                          quote = None
              if quote is not None:
                  raise SystemExit(f"unterminated reconstructed literal: {quote}")
              return "\n".join(out) + "\n"

          steps = [
              "Apply guarded source and verifier fixes",
              "Enforce C48 source-column contract",
              "Rebuild all application binaries",
              "Refresh application expectations from rebuilt bytes",
              "Run application verifier with permanent probes",
              "Remove one-shot harness before final verification",
              "Assert exact final delta",
              "Run complete release verifier on final tree bytes",
              "Three successive fresh-copy byte-line SoP scans",
              "Commit and push accepted Batch-1 fixes",
          ]
          env = os.environ.copy()
          for name in steps:
              print(f"=== {name} ===", flush=True)
              subprocess.run(
                  ["bash", "-c", script_for(name)],
                  check=True,
                  env=env,
              )
          PY
