int w_muldiv(int value, int scale, int div)
{
    int neg;
    int n;
    int chunk;
    int rem;
    int out;
    int prod;
    if (div <= 0 || scale < 0)
        return 0;
    neg = 0;
    if (value < 0) {
        neg = 1;
        n = -value;
    } else {
        n = value;
    }
    rem = 0;
    out = 0;
    while (n > 0) {
        chunk = n;
        if (chunk > 16)
            chunk = 16;
        prod = chunk * scale + rem;
        out = out + prod / div;
        rem = prod % div;
        n = n - chunk;
    }
    if (neg)
        return -out;
    return out;
}

void w_reset(void)
