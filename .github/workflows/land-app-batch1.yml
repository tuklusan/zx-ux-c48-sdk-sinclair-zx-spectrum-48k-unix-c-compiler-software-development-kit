int wr_command(int key)
{
    int old_cur;
    int old_view;
    if (key == 'q')
        return -1;
    if ((key == '8' || key == 'l') && wr_cur < wr_len) {
        if (wr_fmove(1))
            wr_fast = 1;
        else
            wr_cur++;
        return 1;
    }
    if ((key == '5' || key == 'h') && wr_cur > 0) {
        if (wr_fmove(-1)) {
            wr_fast = 1;
        } else {
            wr_cur--;
            if (wr_cur < wr_view)
                wr_view = wr_prevrow(wr_view);
        }
        return 1;
    }
    if (key == '6' || key == '7') {
        old_cur = wr_cur;
        old_view = wr_view;
        wr_page(key == '6');
        if (wr_cur != old_cur || wr_view != old_view)
            return 1;
        return 0;
    }
    if (key == 'i') {
        wr_insert = 1;
        return 1;
    }
    if (key == 'x' && wr_cur < wr_len) {
        wr_delete_at(wr_cur);
        return 1;
    }
    if (key == 'f') {
        wr_find();
        return 1;
    }
    if (key == 'g' && (wr_cur != 0 || wr_view != 0)) {
        wr_cur = 0;
        wr_view = 0;
        return 1;
    }
    return 0;
}

