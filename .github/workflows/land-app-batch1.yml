          old_insert = """void wr_insert_key(void)
{
    int c;
    int row;
    int first;
    wr_fast = 0;
    c = getchar();
    if (c == 7) {
        wr_insert = 0;
        return;
    }
    row = 0;
    if (wr_pcursor >= 0)
        row = wr_pcursor / 60;
    if (c == 8) {
        if (wr_cur > 0) {
