      - name: Three successive fresh-copy byte-line SoP scans
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import tempfile

          ROOT = Path.cwd().resolve()
          TEXT_SUFFIXES = {
              ".c", ".h", ".py", ".md", ".txt", ".json", ".yml",
              ".yaml", ".bat",
          }

          def tree_files(root):
              return sorted(
                  p for p in root.rglob("*")
                  if p.is_file() and ".git" not in p.relative_to(root).parts
              )

          def manifest(root):
              h = hashlib.sha256()
              for p in tree_files(root):
                  rel = p.relative_to(root).as_posix().encode("utf-8")
                  data = p.read_bytes()
                  h.update(rel + b"\0" + hashlib.sha256(data).digest())
              return h.hexdigest()

          expected_manifest = manifest(ROOT)
          for pass_no in range(1, 4):
              with tempfile.TemporaryDirectory(prefix=f"sop-pass-{pass_no}-") as td:
                  fresh = Path(td) / "repo"
                  shutil.copytree(
                      ROOT,
                      fresh,
                      ignore=shutil.ignore_patterns(
                          ".git", "__pycache__", "*.pyc", "*.pyo", ".coverage"
                      ),
                  )
                  if manifest(fresh) != expected_manifest:
                      raise SystemExit(f"SoP pass {pass_no}: fresh-copy manifest mismatch")
                  for p in tree_files(fresh):
                      rel = p.relative_to(fresh)
                      data = p.read_bytes()
                      rebuilt = b"".join(data.splitlines(keepends=True))
                      if rebuilt != data:
                          raise SystemExit(f"SoP pass {pass_no}: byte-line reconstruction failed: {rel}")
                      for line_no, line in enumerate(data.splitlines(keepends=True), 1):
                          if p.suffix.lower() in TEXT_SUFFIXES:
                              if b"<<<<<<<" in line or b">>>>>>>" in line:
                                  raise SystemExit(
                                      f"SoP pass {pass_no}: conflict marker {rel}:{line_no}"
                                  )
                          if p.suffix.lower() in {".c", ".h"}:
                              if b"\r" in line:
                                  raise SystemExit(
                                      f"SoP pass {pass_no}: CR in C48 source {rel}:{line_no}"
                                  )
                              body = line.rstrip(b"\n")
                              try:
                                  body.decode("ascii")
                              except UnicodeDecodeError:
                                  raise SystemExit(
                                      f"SoP pass {pass_no}: non-ASCII C48 source {rel}:{line_no}"
                                  )
                              if len(body) > 64:
                                  raise SystemExit(
                                      f"SoP pass {pass_no}: >64 cols {rel}:{line_no}"
                                  )
                  checks = {
                      "usr/src/apps/appapi.h": [
                          b"if (width > 32)", b"width = 32;"
                      ],
                      "usr/src/apps/sheet48.c": [
                          b"s[10] != ')' || s[11] != 0",
                          b"row < 0 || row > 7",
                      ],
                      "usr/src/apps/write48.c": [
                          b"int wr_prevrow(int pos)",
                          b"int wr_command(int key)",
                          b"int wr_insert_key(void)",
                      ],
                      "usr/src/apps/wire3d.c": [
                          b"int w_muldiv(int value, int scale, int div)",
                          b"w_muldiv(x, w_zoom, q)",
                          b"w_zoom = 360;",
                      ],
                      "compiler/verify_apps.py": [
                          b"APP REGRESSION PROBES PASS",
                          b"check_regressions()",
                      ],
                  }
                  for rel, needles in checks.items():
                      data = (fresh / rel).read_bytes()
                      for needle in needles:
                          if data.count(needle) < 1:
                              raise SystemExit(
                                  f"SoP pass {pass_no}: invariant missing {rel}: {needle!r}"
                              )
                  print(
                      f"SOP PASS {pass_no}: ZERO NEW DEFECTS manifest={expected_manifest}"
                  )
          PY

