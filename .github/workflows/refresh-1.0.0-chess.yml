name: Refresh final 1.0.0 with finalized chess

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-1.0.0-chess.yml"

concurrency:
  group: refresh-final-1.0.0-chess
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE_COMMIT: 41d130e489638dd07ba3305eea41517e0ec3b32f
  TARGET_COMMIT: 8283e5ae4dcf2833257884658ff8de6af238fdd2
  CHESS_SOURCE_COMMIT: 53ccbf76e891ed411193aa05ada12c35e3a04b75
  FINAL_TAG: 1.0.0
  TEMP_TAG: _release-refresh-1.0.0-chess
  OLD_MAIN_ASSET: zx-ux-c48-sdk-1.0.0-RC5-41d130e489638dd07ba3305eea41517e0ec3b32f.zip
  OLD_GUI_ASSET: c48-1.0.0-RC5-gui-evidence-41d130e489638dd07ba3305eea41517e0ec3b32f.zip
  OLD_METADATA_ASSET: RC5-RELEASE-METADATA.json
  OLD_SUMS_ASSET: SHA256SUMS-1.0.0-RC5.txt
  MAIN_ASSET: zx-ux-c48-sdk-1.0.0-8283e5ae4dcf2833257884658ff8de6af238fdd2.zip
  METADATA_ASSET: RELEASE-METADATA-1.0.0.json
  SUMS_ASSET: SHA256SUMS-1.0.0.txt

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Make exact release commit reachable and check it out
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FINAL_TAG}" --jq .object.sha)"
          test "${current}" = "${BASE_COMMIT}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}" >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"             -f ref="refs/tags/${TEMP_TAG}" -f sha="${TARGET_COMMIT}" >/dev/null
          git fetch --force origin "refs/tags/${TEMP_TAG}:refs/tags/${TEMP_TAG}"
          git checkout --detach "${TEMP_TAG}"
          git lfs pull
          test "$(git rev-parse HEAD)" = "${TARGET_COMMIT}"

      - name: Prove release-tree scope and chess reproducibility
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n'             usr/bin/games/chess.c48b             usr/src/games/chess.c > expected-files.txt
          git diff --name-only "${BASE_COMMIT}" "${TARGET_COMMIT}" | sort > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          cmp usr/src/games/chess.c <(git show "${CHESS_SOURCE_COMMIT}:usr/src/games/chess.c")
          cmp usr/bin/games/chess.c48b <(git show "${CHESS_SOURCE_COMMIT}:usr/bin/games/chess.c48b")
          python3 -B compiler/c48.py usr/src/games/chess.c -o rebuilt-chess.c48b
          cmp rebuilt-chess.c48b usr/bin/games/chess.c48b

      - name: Capture current published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}"             --pattern "${OLD_MAIN_ASSET}" --pattern "${OLD_GUI_ASSET}" --dir prior
          test -s "prior/${OLD_MAIN_ASSET}"
          test -s "prior/${OLD_GUI_ASSET}"

      - name: Build refreshed full release package
        shell: bash
        run: |
          set -euo pipefail
          python3 -B compiler/build_release_candidate.py             --archive "${MAIN_ASSET}"             --prefix "zx-ux-c48-sdk-1.0.0/"             --provenance-out C48-SPECIFICATION.json
          test -s "${MAIN_ASSET}"

      - name: Three independent byte scans against previous release
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            rm -rf "scan-old-${pass}" "scan-new-${pass}"
            mkdir "scan-old-${pass}" "scan-new-${pass}"
            unzip -q "prior/${OLD_MAIN_ASSET}" -d "scan-old-${pass}"
            unzip -q "${MAIN_ASSET}" -d "scan-new-${pass}"
            PASS="${pass}" python3 - <<'PY'
          import os
          from pathlib import Path

          p = os.environ["PASS"]
          old_top = [x for x in Path(f"scan-old-{p}").iterdir() if x.is_dir()]
          new_top = [x for x in Path(f"scan-new-{p}").iterdir() if x.is_dir()]
          if len(old_top) != 1 or len(new_top) != 1:
              raise SystemExit("archive root count mismatch")

          def payload(root: Path):
              out = {}
              for path in sorted(x for x in root.rglob("*") if x.is_file()):
                  out[path.relative_to(root).as_posix()] = path.read_bytes()
              return out

          old = payload(old_top[0])
          new = payload(new_top[0])
          if set(old) != set(new):
              missing = sorted(set(old) - set(new))
              added = sorted(set(new) - set(old))
              raise SystemExit(f"file-set mismatch missing={missing} added={added}")

          changed = sorted(k for k in old if old[k] != new[k])
          expected = ["usr/bin/games/chess.c48b", "usr/src/games/chess.c"]
          if changed != expected:
              raise SystemExit(f"unexpected payload changes: {changed}")
          print(f"byte scan {p}: exactly the two chess payload files differ")
          PY
          done

      - name: Verify virgin refreshed package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf virgin
          mkdir virgin
          unzip -q "${MAIN_ASSET}" -d virgin
          root="$(find virgin -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${root}"
          cd "${root}"
          C48_REQUIRE_PACKAGED_SPEC=1 python3 -B compiler/verify_release.py
          python3 -B compiler/c48.py usr/src/games/chess.c -o /tmp/chess-release-check.c48b
          cmp /tmp/chess-release-check.c48b usr/bin/games/chess.c48b

      - name: Prepare final metadata and checksums
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(sha256sum "${MAIN_ASSET}" | awk '{print $1}')"
          GUI_SHA="$(sha256sum "prior/${OLD_GUI_ASSET}" | awk '{print $1}')"
          export MAIN_SHA GUI_SHA
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          data = {
              "schema": 2,
              "release": "1.0.0",
              "release_commit": os.environ["TARGET_COMMIT"],
              "previous_release_commit": os.environ["BASE_COMMIT"],
              "release_tree": "7629dc0da0e9f63e84d24e7025b803652384da73",
              "change_scope": [
                  "usr/src/games/chess.c",
                  "usr/bin/games/chess.c48b",
              ],
              "chess_source_commit": os.environ["CHESS_SOURCE_COMMIT"],
              "verification": {
                  "workflow_run": int(os.environ["RUN_ID"]),
                  "package_byte_scans": 3,
                  "chess_recompiled_byte_identical": True,
                  "virgin_package_verify_release": True,
              },
              "assets": {
                  os.environ["MAIN_ASSET"]: os.environ["MAIN_SHA"],
                  os.environ["OLD_GUI_ASSET"]: os.environ["GUI_SHA"],
              },
          }
          raw = (json.dumps(data, indent=2, sort_keys=True) + "\n").encode("ascii")
          Path(os.environ["METADATA_ASSET"]).write_bytes(raw)
          PY
          META_SHA="$(sha256sum "${METADATA_ASSET}" | awk '{print $1}')"
          {
            printf '%s  %s\n' "${MAIN_SHA}" "${MAIN_ASSET}"
            printf '%s  %s\n' "${GUI_SHA}" "${OLD_GUI_ASSET}"
            printf '%s  %s\n' "${META_SHA}" "${METADATA_ASSET}"
          } > "${SUMS_ASSET}"

      - name: Publish refreshed 1.0.0 in place
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${FINAL_TAG}"             "${MAIN_ASSET}"             "${METADATA_ASSET}"             "${SUMS_ASSET}"             --repo "${GITHUB_REPOSITORY}"

          gh api --method PATCH             "repos/${GITHUB_REPOSITORY}/git/refs/tags/${FINAL_TAG}"             -f sha="${TARGET_COMMIT}" -F force=true >/dev/null

          cat > release-notes.md <<EOF
          # C48 SDK 1.0.0

          This refreshed **1.0.0** release contains the finalized ZX-UX Chess game while keeping the rest of the previous 1.0.0 release tree unchanged.

          Relative to the previous 1.0.0 release commit \`${BASE_COMMIT}\`, exactly two tracked payload files changed:

          - \`usr/src/games/chess.c\`
          - \`usr/bin/games/chess.c48b\`

          The C48B1 chess executable was rebuilt from the updated source with the 1.0.0 compiler and compared byte-for-byte with the committed executable. Three independent extracted-package byte scans confirmed that no other packaged file changed.

          **Release commit:** \`${TARGET_COMMIT}\`

          **Main package:** \`${MAIN_ASSET}\`

          The GUI evidence asset is retained byte-for-byte from the prior certified 1.0.0 publication because no GUI evidence payload changed. Updated release metadata and SHA-256 checksums are included.

          ## Install

          Requires Python 3.10 or newer. Extract the main package and use \`c48\` / \`c48run\` on Windows or \`./c48\` / \`./c48run\` on Linux/macOS.

          To use the exact GitHub release tree:

          \`\`\`sh
          git clone https://github.com/${GITHUB_REPOSITORY}.git
          cd zx-ux-c48-sdk-sinclair-zx-spectrum-48k-unix-c-compiler-software-development-kit
          git checkout 1.0.0
          \`\`\`
          EOF

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" --jq .id)"
          body="$(cat release-notes.md)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}"             -f tag_name="${FINAL_TAG}"             -f target_commitish="${TARGET_COMMIT}"             -f name="C48 SDK 1.0.0"             -f body="${body}"             -F draft=false             -F prerelease=false             -f make_latest=true >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100"             --paginate --jq '.[] | [.id,.name] | @tsv' > assets.tsv
          while IFS=$'\t' read -r id name; do
            case "${name}" in
              "${MAIN_ASSET}"|"${OLD_GUI_ASSET}"|"${METADATA_ASSET}"|"${SUMS_ASSET}")
                ;;
              *)
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
                ;;
            esac
          done < assets.tsv

      - name: Post-publish verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FINAL_TAG}" --jq .object.sha)"
          test "${resolved}" = "${TARGET_COMMIT}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FINAL_TAG}" > published.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          r = json.loads(Path("published.json").read_text())
          if r.get("draft") or r.get("prerelease"):
              raise SystemExit("1.0.0 is not a normal published release")
          if r.get("target_commitish") != os.environ["TARGET_COMMIT"]:
              raise SystemExit("release target mismatch")
          expected = {
              os.environ["MAIN_ASSET"],
              os.environ["OLD_GUI_ASSET"],
              os.environ["METADATA_ASSET"],
              os.environ["SUMS_ASSET"],
          }
          actual = {x["name"] for x in r.get("assets", [])}
          if actual != expected:
              raise SystemExit(f"release asset set mismatch: {sorted(actual)}")
          print("published 1.0.0 is exact and complete")
          PY

      - name: Remove temporary tag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TEMP_TAG}" >/dev/null 2>&1 || true
