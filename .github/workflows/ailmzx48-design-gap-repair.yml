name: ailmzx48 design gap repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-design-gap-repair.yml"
      - "usr/src/ailmzx48/tooling/design_gap_repair_compact.py"

permissions:
  contents: write

concurrency:
  group: ailmzx48-design-gap-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply and exercise compact runtime repair
        run: >-
          python -B
          usr/src/ailmzx48/tooling/design_gap_repair_compact.py

      - name: Remove temporary repair instrumentation
        run: |
          rm .github/workflows/ailmzx48-design-gap-repair.yml
          rm usr/src/ailmzx48/tooling/design_gap_repair.py
          rm usr/src/ailmzx48/tooling/design_gap_repair_compact.py

      - name: Regenerate manifest and verify complete repository
        run: |
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit repaired runtime and evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ailmzx48: close SDK runtime design gaps"
          git push origin HEAD:main
