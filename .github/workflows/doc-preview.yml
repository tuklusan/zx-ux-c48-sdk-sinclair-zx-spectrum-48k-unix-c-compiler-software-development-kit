name: Source-tape documentation preview

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/doc-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-docx
          command -v libreoffice >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y libreoffice-writer
          }
          command -v pdftoppm >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          }

      - name: Build edited document previews
        shell: python
        run: |
          from pathlib import Path
          from docx import Document
          from docx.shared import Pt
          from docx.oxml.ns import qn
          import json
          import shutil
          import subprocess

          root = Path(".")
          out = root / ".doc-preview"
          out.mkdir(exist_ok=True)
          docs = [
              (
                  root / "docs/ZX-UX C48 SDK User Manual.docx",
                  "Native ZX-UX source tapes",
                  [
                      (
                          "The SDK distribution includes 57 source-transfer .src.tap files "
                          "beside the matching compiled C48 programs under usr/bin. Each "
                          "tape contains the program C source plus the local header required "
                          "by that program. ailmzx48 is deliberately excluded because the "
                          "current native compiler cannot compile it as one translation unit."
                      ),
                      (
                          "Each source tape is a standard Spectrum TAP stream carrying RAW "
                          "M48O version-1 objects targeted at USERHOME. A .c file is stored as "
                          "C type 5; .h and .txt files are stored as TXT type 1. USERHOME "
                          "resolves to the current session /home/<user> directory when loaded."
                      ),
                      (
                          "Use c48srctap on Windows, Linux or macOS to build the same format. "
                          "It accepts only lowercase .c, .h and .txt inputs and refuses other "
                          "extensions before creating output."
                      ),
                  ],
                  [
                      "c48srctap usr/src/apps/appapi.h usr/src/apps/gp82.c -o usr/bin/apps/gp82.src.tap",
                      "load appapi.h",
                      "load gp82.c",
                      "cc gp82.c",
                      "ld gp82.obj -o gp82",
                      "gp82",
                  ],
                  (
                      "Tape access is sequential. Position the cassette at or before the "
                      "first required record before loading. The tracked source tapes are "
                      "development/source-transfer media; the official ZX-UX system "
                      "distribution remains TZX."
                  ),
              ),
              (
                  root / "docs/ZX-UX C48 SDK Technical Reference.docx",
                  "Native source-tape transport",
                  [
                      (
                          "The release contains a locked corpus of 57 .src.tap files generated "
                          "from the tracked C48 program corpus. The mapping is defined by "
                          "compiler/source_tape_manifest.json and verified byte-for-byte by "
                          "the release gate."
                      ),
                      (
                          "c48srctap emits Spectrum TAP data blocks using flag FF. Each logical "
                          "object begins with the exact 32-byte M48O version-1 header and is "
                          "followed by RAW payload blocks of at most 512 bytes. Header and "
                          "logical payload integrity use CRC-16/CCITT-FALSE. The target "
                          "directory is USERHOME."
                      ),
                      (
                          "Object typing is deterministic: lowercase .c becomes C type 5; "
                          "lowercase .h and .txt become TXT type 1. Input text must be ASCII, "
                          "LF-only and NUL-free, object payloads are limited to 32768 bytes, "
                          "and native base names must fit the M48O 1..10 byte name field. "
                          "--name SOURCE TAPE_NAME provides an explicit native basename when "
                          "a host source name is longer."
                      ),
                  ],
                  [
                      "c48srctap header.h program.c -o program.src.tap",
                      "load header.h",
                      "load program.c",
                      "cc program.c",
                      "ld program.obj -o program",
                      "program",
                  ],
                  (
                      "The builder validates its own output by parsing the completed image "
                      "back into M48O objects before atomically replacing the target file. "
                      "The tracked corpus is separately regenerated and compared against the "
                      "source tree during release verification."
                  ),
              ),
              (
                  root / "docs/ZX-UX C48 SDK Adversarial Security Review.docx",
                  "Source-tape generation controls",
                  [
                      (
                          "The source-tape path is deliberately narrow. c48srctap accepts only "
                          "lowercase .c, .h and .txt inputs; unsupported or mixed unsupported "
                          "input sets fail before output is written."
                      ),
                      (
                          "Accepted inputs must be regular ASCII text using LF line endings, "
                          "contain no NUL bytes, and fit the 32768-byte M48O logical object "
                          "bound. Native names are constrained to the portable M48O character "
                          "set and 1..10 bytes, duplicate tape names are rejected, output must "
                          "use lowercase .tap, and replacement requires explicit --force."
                      ),
                      (
                          "Generation is deterministic and fail-closed: M48O header and payload "
                          "CRCs are calculated from the exact source bytes, output is internally "
                          "round-tripped through the parser, and the final file is installed by "
                          "temporary-file replacement. The release gate regenerates all 57 "
                          "tracked source tapes and requires byte identity."
                      ),
                  ],
                  [
                      "load header.h",
                      "load program.c",
                      "cc program.c",
                      "ld program.obj -o program",
                  ],
                  (
                      "On ZX-UX, the cassette loader independently validates the M48O envelope "
                      "before publishing the object. Source records are not executable objects; "
                      "they become executable only after the native compiler and linker produce "
                      "validated OBJ1 and MEX1/BIN output."
                  ),
              ),
          ]

          def add_code(doc, line):
              p = doc.add_paragraph()
              r = p.add_run(line)
              r.font.name = "Courier New"
              r._element.get_or_add_rPr().rFonts.set(qn("w:ascii"), "Courier New")
              r._element.get_or_add_rPr().rFonts.set(qn("w:hAnsi"), "Courier New")
              r.font.size = Pt(9)

          report = {}
          for path, heading, paragraphs, commands, closing in docs:
              doc = Document(path)
              before_count = len(doc.paragraphs)
              doc.add_page_break()
              doc.add_heading(heading, level=1)
              for paragraph in paragraphs:
                  doc.add_paragraph(paragraph)
              for line in commands:
                  add_code(doc, line)
              doc.add_paragraph(closing)
              target = out / path.name
              doc.save(target)
              report[path.name] = {
                  "paragraphs_before": before_count,
                  "paragraphs_after": len(doc.paragraphs),
                  "heading": heading,
              }

          (out / "preview-report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="ascii",
          )

      - name: Render and compare pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .doc-preview/render
          for original in docs/*.docx; do
            base="$(basename "$original" .docx)"
            case "$base" in
              "ZX-UX C48 SDK User Manual"|"ZX-UX C48 SDK Technical Reference"|"ZX-UX C48 SDK Adversarial Security Review") ;;
              *) continue ;;
            esac
            mkdir -p ".doc-preview/render/$base/orig" ".doc-preview/render/$base/new"
            libreoffice --headless --convert-to pdf --outdir ".doc-preview/render/$base/orig" "$original" >/dev/null
            libreoffice --headless --convert-to pdf --outdir ".doc-preview/render/$base/new" ".doc-preview/$(basename "$original")" >/dev/null
            orig_pdf=".doc-preview/render/$base/orig/$base.pdf"
            new_pdf=".doc-preview/render/$base/new/$base.pdf"
            pdftoppm -png -r 120 "$orig_pdf" ".doc-preview/render/$base/orig/page" >/dev/null 2>&1
            pdftoppm -png -r 120 "$new_pdf" ".doc-preview/render/$base/new/page" >/dev/null 2>&1
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path(".doc-preview/render")
          result = {}
          for d in sorted(root.iterdir()):
              op = sorted((d / "orig").glob("page-*.png"))
              np = sorted((d / "new").glob("page-*.png"))
              same = 0
              for old, new in zip(op, np):
                  if hashlib.sha256(old.read_bytes()).digest() == hashlib.sha256(new.read_bytes()).digest():
                      same += 1
                  else:
                      break
              if same != len(op):
                  raise SystemExit(f"existing page changed in {d.name}: {same}/{len(op)} unchanged")
              added = np[len(op):]
              if not added:
                  raise SystemExit(f"no added rendered page for {d.name}")
              keep = d / "added-pages"
              keep.mkdir()
              for p in added:
                  (keep / p.name).write_bytes(p.read_bytes())
              result[d.name] = {
                  "original_pages": len(op),
                  "new_pages": len(np),
                  "unchanged_original_pages": same,
                  "added_pages": [p.name for p in added],
              }
          Path(".doc-preview/page-report.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="ascii",
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: source-tape-doc-preview
          path: |
            .doc-preview/*.docx
            .doc-preview/*report.json
            .doc-preview/render/*/added-pages/*.png
          if-no-files-found: error
          include-hidden-files: true
