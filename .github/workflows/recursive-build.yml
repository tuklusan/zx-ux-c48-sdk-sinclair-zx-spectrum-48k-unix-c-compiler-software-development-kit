name: Recursive display evidence

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/recursive-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run normal display proof
        run: >
          python -B compiler/verify_recursive_demos.py
          --normal-evidence recursive-evidence

      - name: List evidence hashes
        shell: bash
        run: |
          sha256sum recursive-evidence/*

      - name: Upload evidence frames
        uses: actions/upload-artifact@v4
        with:
          name: recursive-display-evidence
          path: recursive-evidence/
          if-no-files-found: error
