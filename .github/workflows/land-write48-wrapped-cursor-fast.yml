name: Land write48 wrapped cursor fast path

on:
  push:
    paths:
      - '.github/workflows/land-write48-wrapped-cursor-fast.yml'

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose current wrapped-row path
        run: |
          git lfs fsck
          python -B .github/patch_write48_wrapped.py before
      - name: Build wrapped-row cursor fix
        run: |
          python -B .github/patch_write48_wrapped.py patch
          python -B compiler/c48.py usr/src/apps/write48.c -o usr/bin/apps/write48.c48b
          python -B .github/patch_write48_wrapped.py hash
          python -B .github/patch_write48_wrapped.py after
          cp .github/patch_write48_wrapped.py /tmp/patch_write48_wrapped.py
      - name: Commit clean prospective tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/patch_write48_wrapped.py
          git rm -f .github/workflows/land-write48-wrapped-cursor-fast.yml
          git add usr/src/apps/write48.c usr/bin/apps/write48.c48b compiler/app_expectations.json
          git commit -m 'write48: make wrapped cursor movement incremental'
          mapfile -t changed < <(git diff --name-only 0c2cb0f9bf661c8b8c69b736906e201ac2f0c2ce HEAD | sort)
          printf 'FINAL_DIFF %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'compiler/app_expectations.json'
          test "${changed[1]}" = 'usr/bin/apps/write48.c48b'
          test "${changed[2]}" = 'usr/src/apps/write48.c'
          test -z "$(git status --porcelain)"
      - name: Full repository verifier
        run: |
          python -B compiler/verify_release.py
          git diff --check 0c2cb0f9bf661c8b8c69b736906e201ac2f0c2ce HEAD
      - name: SoP three fresh byte scans
        run: python -B /tmp/patch_write48_wrapped.py sop
      - name: Push verified final tree
        run: git push origin HEAD:main
