name: Build GP82 artifacts

on:
  push:
    branches: [main]
    paths:
      - "usr/src/apps/gp82.c"
      - ".github/workflows/build-gp82.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and render
        shell: bash
        run: |
          set -euo pipefail
          python3 -B compiler/c48.py \
            usr/src/apps/gp82.c -o /tmp/gp82.c48b
          python3 -B compiler/c48run.py \
            --headless --time-quota 45 \
            --dump-screen /tmp/gp82.scr \
            /tmp/gp82.c48b verify
          python3 -m pip install --quiet pillow
          python3 -B - <<'PY'
          import hashlib
          import sys
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          from PIL import Image

          sys.path.insert(0, "compiler")
          from c48.screen import Font4x8, ZXScreen
          from verify_graphics_demos import png_bytes

          expected = {
              "source": "2c085e262a916bc13f5737edc94fc00e9a8bc5518a6219e0b2f224f16a412128",
              "binary": "5bfa14205c2ccef4e804921a65c13b892a9496d6ecef653b44e4b53fff97a095",
              "screen": "116495a2872ad6151edc2a750bf6887866ca555b67a3d634151de492fac82c02",
              "png": "a768002b5f1469159fc4194d70aa3a38b76dfc5d3c79ce83cbe2429903d3e117",
          }

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          source = Path("usr/src/apps/gp82.c").read_bytes()
          binary = Path("/tmp/gp82.c48b").read_bytes()
          raw = Path("/tmp/gp82.scr").read_bytes()
          if sha(source) != expected["source"]:
              raise SystemExit("source digest mismatch")
          if sha(binary) != expected["binary"]:
              raise SystemExit("binary digest mismatch")
          if sha(raw) != expected["screen"]:
              raise SystemExit("screen digest mismatch")

          font = Font4x8.load(
              Path("compiler/assets/font4x8-tasword.bin")
          )
          screen = ZXScreen(font)
          screen.mem[:] = raw
          png = png_bytes(screen.render_rgb())
          if sha(png) != expected["png"]:
              raise SystemExit("image digest mismatch")
          out = Path("docs/images/apps/gp82.png")
          out.write_bytes(png)

          names = ["write48.png", "sheet48.png",
                   "wire3d.png", "gp82.png"]
          images = [
              Image.open(Path("docs/images/apps") / name).convert("RGB")
              for name in names
          ]
          w, h = images[0].size
          sheet = Image.new("RGB", (w * 2, h * 2))
          for index, img in enumerate(images):
              if img.size != (w, h):
                  raise SystemExit("application image size mismatch")
              sheet.paste(img, ((index % 2) * w,
                                (index // 2) * h))
          contact = Path("docs/images/apps/contact-sheet.png")
          sheet.save(contact, format="PNG")

          terms = (
              "WRITE48", "SHEET48", "WIRE3D",
              "three applications", "3 C48 applications",
          )
          ns = {"w": "http://schemas.openxmlformats.org/"
                     "wordprocessingml/2006/main"}
          for doc in sorted(Path("docs").glob("*.docx")):
              with zipfile.ZipFile(doc) as zf:
                  xml = zf.read("word/document.xml")
              root = ET.fromstring(xml)
              counts = {term: 0 for term in terms}
              for p in root.findall(".//w:p", ns):
                  text_value = "".join(
                      node.text or ""
                      for node in p.findall(".//w:t", ns)
                  )
                  for term in terms:
                      if term in text_value:
                          counts[term] += 1
              found = ",".join(
                  term + ":" + str(counts[term])
                  for term in terms if counts[term]
              )
              print("DOC_SWEEP " + doc.name + " " +
                    (found if found else "none"))

          print("GP_PNG_SHA=" + sha(png))
          print("GP_PNG_SIZE=" + str(len(png)))
          cdata = contact.read_bytes()
          print("CONTACT_SHA=" + sha(cdata))
          print("CONTACT_SIZE=" + str(len(cdata)))
          PY

      - name: Upload image objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git add docs/images/apps/gp82.png
          git add docs/images/apps/contact-sheet.png
          gp_oid="$(sha256sum docs/images/apps/gp82.png | cut -d' ' -f1)"
          ct_oid="$(sha256sum docs/images/apps/contact-sheet.png | cut -d' ' -f1)"
          git lfs push --object-id origin "${gp_oid}"
          git lfs push --object-id origin "${ct_oid}"
          git reset -- docs/images/apps/gp82.png
          git reset -- docs/images/apps/contact-sheet.png
