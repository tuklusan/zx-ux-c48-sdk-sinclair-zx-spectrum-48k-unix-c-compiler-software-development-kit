name: Rewrite game gallery cadence

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-game-gallery-cadence.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace passage and certify passage only
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          path = Path("README.md")
          old = """These games are included as a small cultural time capsule of what “computer games” meant around 1982, not as replicas of any one historical software library. By then **Adventure** had turned caves, maps and magic words into mainframe folklore; **Hunt the Wumpus** had made pits, superbats and a monster lurking in a graph of rooms a shared BASIC-era legend; **Star Trek** had travelled through time-sharing systems, schools, magazines and books in endlessly rewritten listings; **Rogue** was carrying that tradition into Unix terminals with a different dungeon every run; and **chess** remained computing’s classic public test of whether a machine could appear to think. Backgammon, cribbage, Go Fish, Hangman, mazes, quizzes, arithmetic drills, fortune programs and the growing-line chase behind Snake represent the other, equally nostalgic side of early personal computing: compact games people typed in, copied, traded, ported, altered and understood by reading the code. Together they give the SDK a playable connection to the culture, folklore and home-computer, school-lab and terminal-room imagination surrounding machines like the ZX Spectrum when it arrived in 1982."""

          new = """These games are included as a small cultural time capsule of what “computer games” meant around 1982—not as replicas of any one historical software library, but as a playable cross-section of the ideas and stories already circulating through terminals, schools, books, magazines, clubs and homes.

By then **Adventure** had turned caves, maps and magic words into mainframe folklore; **Hunt the Wumpus** had made pits, superbats and a monster lurking in a graph of rooms a shared BASIC-era legend; **Star Trek** had travelled through time-sharing systems, schools, magazines and books in endlessly rewritten listings; **Rogue** was carrying that tradition into Unix terminals with a different dungeon every run; and **Chess** remained computing’s classic public test of whether a machine could appear to think.

The quieter side of that culture mattered just as much. **Backgammon**, **Cribbage**, **Go Fish**, **Hangman**, **Maze**, **Quiz**, **Arithmetic**, **Fortune** and **Snake** evoke the compact programs people typed in, copied, traded, ported, altered and understood by reading the code—part game, part programming lesson, part social currency in a school lab or terminal room.

Together, they give the SDK a playable connection to the folklore and nostalgia surrounding early personal computing, and to the imagination that greeted machines like the ZX Spectrum when it arrived in 1982."""

          original = path.read_bytes()
          text = original.decode("utf-8", errors="strict")
          if text.count(old) != 1:
              raise SystemExit(f"expected old passage exactly once; found {text.count(old)}")
          if new in text:
              raise SystemExit("replacement passage unexpectedly already present")

          candidate_text = text.replace(old, new, 1)
          if candidate_text.replace(new, old, 1) != text:
              raise SystemExit("replacement guard failed: change is not confined to the passage")
          path.write_text(candidate_text, encoding="utf-8", newline="\n")

          games = [
              "Adventure", "Hunt the Wumpus", "Star Trek", "Rogue", "Chess",
              "Backgammon", "Cribbage", "Go Fish", "Hangman", "Maze", "Quiz",
              "Arithmetic", "Fortune", "Snake",
          ]
          passage = new.encode("utf-8")

          def validate(data: bytes, pass_no: int) -> None:
              walked = 0
              for line_no, line in enumerate(data.splitlines(keepends=True), 1):
                  if b"\x00" in line:
                      raise SystemExit(f"pass {pass_no}: NUL at passage line {line_no}")
                  for _byte in line:
                      walked += 1
              if walked != len(data):
                  raise SystemExit(f"pass {pass_no}: byte walk mismatch {walked} != {len(data)}")
              decoded = data.decode("utf-8", errors="strict")
              paras = decoded.split("\n\n")
              if len(paras) != 4 or any(not p.strip() for p in paras):
                  raise SystemExit(f"pass {pass_no}: expected exactly four non-empty paragraphs")
              for game in games:
                  token = f"**{game}**"
                  if decoded.count(token) != 1:
                      raise SystemExit(f"pass {pass_no}: bold first-occurrence token mismatch for {game}")
                  bare_pos = decoded.find(game)
                  bold_pos = decoded.find(token)
                  if bare_pos != bold_pos + 2:
                      raise SystemExit(f"pass {pass_no}: first occurrence is not bold for {game}")
              if "**chess**" in decoded:
                  raise SystemExit(f"pass {pass_no}: stale lowercase chess form remains")
              print(
                  f"PASSAGE SOP PASS {pass_no}: {len(data)} bytes, "
                  f"paragraphs={len(paras)}, sha256={hashlib.sha256(data).hexdigest()}"
              )

          for pass_no in (1, 2, 3):
              root = Path(f"/tmp/game-gallery-passage-sop-{pass_no}")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True)
              fresh = root / "passage.md"
              fresh.write_bytes(passage)
              validate(fresh.read_bytes(), pass_no)
          PY

          git diff --check -- README.md

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rewrite-game-gallery-cadence.yml
          git add README.md
          git diff --cached --check
          git commit -m "README: improve game-history cadence"
          git push origin HEAD:main
