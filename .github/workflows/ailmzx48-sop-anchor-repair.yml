name: ailmzx48 SoP factual anchor repair

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/ailmzx48-sop-anchor-repair.yml"

permissions:
  contents: write

concurrency:
  group: ailmzx48-sop-anchor-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Patch factual anchor invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          a = root / 'usr/src/ailmzx48'

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'anchor mismatch {path}: count={text.count(old)}'
                  )
              path.write_text(
                  text.replace(old, new, 1),
                  encoding='utf-8', newline='\n'
              )

          ref = a / 'tooling/a48m_reference.py'
          replace_once(
              ref,
              'TOKEN_RE = re.compile(r"[A-Za-z0-9]+")\n',
              'TOKEN_RE = re.compile(r"[A-Za-z0-9]+")\n'
              'ANCHOR_GAP_WORDS = (\n'
              '    "a", "an", "the", "and", "in", "on", "at",\n'
              '    "for", "with", "by", "of", "from", "to", "style",\n'
              ')\n'
          )
          old = '''    first = 2 if len(words) > 3 else max(0, len(words) - 2)
    anchors: list[tuple[int, int]] = []
    if words[0].lower() in set(anchor_words) and first > 0:
        anchors.append((starts[0], ends[0] - starts[0]))
    anchors.append((starts[first], ends[-1] - starts[first]))
    payload.append(0x02)
    if any(length < 1 or length > 255 for _, length in anchors):
        raise A48MError("predicate anchor outside u8 length")
    return bytes(payload), anchors
'''
          new = '''    gap = -1
    trigger_set = {word.lower() for word in anchor_words}
    for filler in ANCHOR_GAP_WORDS:
        for index, word in enumerate(words):
            if word.lower() != filler or word.lower() in trigger_set:
                continue
            if index == len(words) - 1:
                continue
            if index == 0 and filler not in ("a", "an", "the"):
                continue
            gap = index
            break
        if gap >= 0:
            break
    if gap < 0:
        raise A48MError("fact has no safe learned-word anchor gap")
    anchors: list[tuple[int, int]] = []
    if gap > 0:
        anchors.append((starts[0], ends[gap - 1] - starts[0]))
    if gap + 1 < len(words):
        anchors.append((starts[gap + 1], ends[-1] - starts[gap + 1]))
    payload.append(0x02)
    if not anchors or len(anchors) > 2:
        raise A48MError("fact anchor count outside Candidate-A bound")
    if any(length < 1 or length > 255 for _, length in anchors):
        raise A48MError("fact anchor outside u8 length")
    return bytes(payload), anchors
'''
          replace_once(ref, old, new)

          test = a / 'evaluation/test_a48m_reference.py'
          replace_once(
              test,
              'from a48m_reference import (\n    A48MError,\n',
              'from a48m_reference import (\n'
              '    A48MError,\n    ANCHOR_GAP_WORDS,\n'
          )
          replace_once(
              test,
              '    parse_container,\n    protected_bytes,\n    u16,\n)\n',
              '    parse_container,\n    protected_bytes,\n'
              '    token_spans,\n    u16,\n)\n'
          )
          needle = '''    assert all(sum(length for _, length in record["anchors"])
               < len(record["payload"]) - 2
               for record in parsed["records"])
    assert any(record["triggers"] for record in parsed["records"])
'''
          insertion = '''    assert all(sum(length for _, length in record["anchors"])
               < len(record["payload"]) - 2
               for record in parsed["records"])
    fact_rows = [
        row for row in json.loads(corpus.read_text(encoding="utf-8"))["records"]
        if row.get("kind") == "fact-user"
    ]
    assert len(fact_rows) == len(parsed["records"])
    for source, record in zip(fact_rows, parsed["records"]):
        payload = record["payload"]
        spans = [span for span in token_spans(payload) if not span[2]]
        uncovered = []
        for start, end, _ in spans:
            covered = any(
                off <= start and end <= off + length
                for off, length in record["anchors"]
            )
            if not covered:
                code = payload[start]
                assert code in (0xF1, 0xF2, 0xF3)
                size = payload[start + 1]
                word = bytes(
                    payload[start + 2:start + 2 + size]
                ).decode("ascii").lower()
                uncovered.append(word)
        assert len(uncovered) == 1, (source["text"], uncovered)
        assert uncovered[0] in ANCHOR_GAP_WORDS, (
            source["text"], uncovered
        )
        triggers = {
            str(value).lower() for value in source.get("triggers", [])
        }
        assert uncovered[0] not in triggers, (source["text"], uncovered)
    assert any(record["triggers"] for record in parsed["records"])
'''
          replace_once(test, needle, insertion)
          replace_once(
              test,
              '            "predicate-anchor-not-full-sentence",\n',
              '            "predicate-anchor-not-full-sentence",\n'
              '            "critical-anchor-coverage-one-safe-gap",\n'
          )

          design = a / 'AILMZX48-DETAILED-DESIGN.md'
          replace_once(design, 'Revision: 0.27-draft',
                       'Revision: 0.28-draft')
          marker = '### 6.1 No remote inference dependency\n'
          note = '''Implementation measurement note (Revision 0.28): a fresh SoP model scan found that the first predicate-anchor splitter could omit factual relation or multi-word subject tokens even though keyword regressions remained green.  The repaired A48M builder now anchors every factual lexical token except exactly one allowlisted low-information filler word (`a`, `an`, `the`, `and`, `in`, `on`, `at`, `for`, `with`, `by`, `of`, `from`, `to`, or `style`) that is not itself a retrieval trigger.  The host reference independently parses every emitted record and rejects any factual record with more than one uncovered lexical token, an uncovered token outside that allowlist, or an uncovered trigger.  This preserves names and relation verbs such as `amstrad acquired`, `the hobbit was`, `jet set willy followed`, `knight lore is known`, and `head over heels was` while still preventing a complete stored sentence from becoming one immutable anchor span.\n\n'''
          text = design.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('design Revision-0.28 insertion anchor mismatch')
          design.write_text(
              text.replace(marker, note + marker, 1),
              encoding='utf-8', newline='\n'
          )
          replace_once(
              design,
              'Revision 0.27 closes the SDK-side design questions',
              'Revision 0.28 closes the SDK-side design questions'
          )
          replace_once(
              design,
              '- A48M v2 is 8,458 logical bytes with 69 records, a 192-byte maximum record,\n'
              '  a 64-byte maximum read request, and cold-model SHA-256\n'
              '  `3dda3f6633cd8731e158970bf0658cd9126496e9d7c30ff14ab4cbcae25611ea`;',
              '- A48M v2 is 8,538 logical bytes with 69 records, a 192-byte maximum record,\n'
              '  a 64-byte maximum read request, and cold-model SHA-256\n'
              '  `aad821b22b10482cd598f58888fb257149c7847d88ec6bb5b6fdae9ea6f1f1e1`;'
          )
          replace_once(
              design,
              '- factual A48M anchors cover selected predicate spans rather than complete\n'
              '  stored sentences; normal cold answers generate learned lead wording before\n'
              '  copying the selected factual span unchanged;',
              '- factual A48M anchors preserve every critical lexical fact token while\n'
              '  leaving exactly one allowlisted non-trigger filler token outside the\n'
              '  immutable spans; normal cold answers generate learned lead wording before\n'
              '  copying those selected factual spans unchanged;'
          )

          checker = a / 'evaluation/check_design_compliance.py'
          ctext = checker.read_text(encoding='utf-8')
          ctext = ctext.replace(
              'Revision: 0.27-draft', 'Revision: 0.28-draft'
          ).replace(
              'a48m.get("logical_length") == 8458',
              'a48m.get("logical_length") == 8538'
          ).replace(
              '{"final-a": 9118, "final-b": 9119,\n'
              '                      "final-c": 9120}',
              '{"final-a": 9123, "final-b": 9124,\n'
              '                      "final-c": 9125}'
          ).replace(
              'run.get("iteration") == 9117',
              'run.get("iteration") == 9122'
          ).replace(
              'route_run.get("iteration") == 9121',
              'route_run.get("iteration") == 9126'
          )
          ctext = ctext.replace(
              '    require("predicate-anchor-not-full-sentence" in\n'
              '            a48m.get("tests", []),\n'
              '            "predicate-anchor reference test missing")\n',
              '    require("predicate-anchor-not-full-sentence" in\n'
              '            a48m.get("tests", []),\n'
              '            "predicate-anchor reference test missing")\n'
              '    require("critical-anchor-coverage-one-safe-gap" in\n'
              '            a48m.get("tests", []),\n'
              '            "critical factual-anchor coverage test missing")\n'
          )
          route_anchor = '''    require(second.get("ai_semuse") == 0 and
            second.get("ai_mhits") == 0 and
            second.get("ai_lasttop") == 0,
            "hash-collision unknown route was not rejected")
'''
          anchor_block = route_anchor + '''
    anchor_score = load(base / "anchor-fidelity" / "score.json")
    anchor_run = load(base / "anchor-fidelity" / "run.json")
    require(anchor_score.get("keyword_ratio") == 1.0 and
            anchor_score.get("turns") == 5,
            "anchor-fidelity: score mismatch")
    require(anchor_score.get("trigram_uses", 0) >= 5 and
            anchor_score.get("cooperative_yields", 0) >= 45,
            "anchor-fidelity: LM/yield evidence missing")
    require(anchor_run.get("iteration") == 9127,
            "anchor-fidelity: iteration mismatch")
    require(anchor_run.get("source_sha256") == source_hash and
            anchor_run.get("c48b_sha256") == binary_hash and
            anchor_run.get("cold_model_sha256") == cold_hash,
            "anchor-fidelity: identity mismatch")
'''
          if ctext.count(route_anchor) != 1:
              raise SystemExit('checker anchor-fidelity insertion mismatch')
          ctext = ctext.replace(route_anchor, anchor_block, 1)
          ctext = ctext.replace(
              'for name in ("literal-context", "final-a", "final-b",\n'
              '                 "final-c"):',
              'for name in ("literal-context", "final-a", "final-b",\n'
              '                 "final-c", "architecture-routing",\n'
              '                 "anchor-fidelity"):'
          )
          checker.write_text(ctext, encoding='utf-8', newline='\n')

          reqdir = a / 'evaluation/sdk-conformance/anchor-fidelity'
          reqdir.mkdir(parents=True, exist_ok=True)
          request = {
              'schema': 1,
              'iteration': 9127,
              'scenario': 'sdk-anchor-fidelity-v1',
              'purpose': (
                  'SoP factual-anchor coverage proof for preserved subjects, '
                  'multi-word names, and relation verbs.'
              ),
              'prompts': [
                  'who acquired spectrum computer rights in april 1986',
                  'tell me about the hobbit adventure and european sales',
                  'what did jet set willy follow',
                  'what is knight lore known for',
                  'tell me about head over heels by ritman',
              ],
              'expected_keywords': [
                  'amstrad acquired',
                  'the hobbit was',
                  'jet set willy followed',
                  'knight lore is known',
                  'head over heels was',
              ],
              'min_keyword_ratio': 1.0,
              'min_trigram_uses': 5,
              'min_cooperative_yields': 45,
              'max_seconds': 1200,
          }
          (reqdir / 'request.json').write_text(
              json.dumps(request, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )
          PY

      - name: Rebuild anchor-qualified model
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/build_starter_model.py \
            --corpus usr/src/ailmzx48/training/seed_corpus.json \
            --out-json usr/src/ailmzx48/model/current-model.json \
            --out-h usr/src/ailmzx48/aimod.h \
            --iteration 9127
          python -B usr/src/ailmzx48/evaluation/test_context_reference.py
          python -B usr/src/ailmzx48/evaluation/test_a48m_reference.py
          python -B compiler/c48.py usr/src/ailmzx48/ailmzx48.c \
            -o usr/bin/ailmzx48/ailmzx48.c48b
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py \
            --pass-id 1
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          a = Path('usr/src/ailmzx48')
          report = json.loads(
              (a / 'evaluation/a48m-reference-report.json').read_text()
          )
          assert report['logical_length'] == 8538, report
          assert report['record_count'] == 69, report
          assert 'critical-anchor-coverage-one-safe-gap' in report['tests']
          got = hashlib.sha256(
              (a / 'model/cold-seed.bin').read_bytes()
          ).hexdigest()
          assert got == (
              'aad821b22b10482cd598f58888fb257149c7847d8'
              '8ec6bb5b6fdae9ea6f1f1e1'
          ), got
          PY

      - name: Requalify anchor repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ailmzx48-sop-anchor
          mkdir -p /tmp/ailmzx48-sop-anchor
          rsync -a --exclude=.git ./ /tmp/ailmzx48-sop-anchor/
          python - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess, sys

          live = Path.cwd()
          temp = Path('/tmp/ailmzx48-sop-anchor')
          base = live / 'usr/src/ailmzx48/evaluation/sdk-conformance'
          scenarios = [
              ('literal-context', 9122),
              ('final-a', 9123),
              ('final-b', 9124),
              ('final-c', 9125),
              ('architecture-routing', 9126),
              ('anchor-fidelity', 9127),
          ]
          for name, iteration in scenarios:
              req = json.loads((base / name / 'request.json').read_text())
              req['iteration'] = iteration
              req['purpose'] = (
                  str(req.get('purpose', ''))
                  + ' SoP requalification after factual-anchor fidelity repair.'
              )
              request = temp / f'sop-{name}.json'
              request.write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/tooling/run_iteration.py'),
                   '--request', str(request), '--max-seconds', '1200'],
                  cwd=temp, check=True,
              )
              subprocess.run(
                  [sys.executable, '-B',
                   str(temp / 'usr/src/ailmzx48/evaluation/check_iteration_score.py'),
                   '--request', str(request)],
                  cwd=temp, check=True,
              )
              src = temp / 'usr/src/ailmzx48/conversations' / f'iter-{iteration:04d}'
              dst = base / name
              dst.mkdir(parents=True, exist_ok=True)
              for member in (
                  'conversation.md', 'run.json', 'score.json', 'transcript.json'
              ):
                  shutil.copy2(src / member, dst / member)
              (dst / 'request.json').write_text(
                  json.dumps(req, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8', newline='\n'
              )
          for rel in (
              'usr/bin/ailmzx48/ailmzx48.c48b',
              'usr/src/ailmzx48/model/cold-seed.bin',
              'usr/src/ailmzx48/model/current-model.json',
              'usr/src/ailmzx48/aimod.h',
              'usr/src/ailmzx48/aicold.h',
          ):
              if (live / rel).read_bytes() != (temp / rel).read_bytes():
                  raise SystemExit('isolated rebuild drift: ' + rel)
          PY

      - name: Finalize anchor evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          a = root / 'usr/src/ailmzx48'
          e = a / 'evaluation'
          base = e / 'sdk-conformance'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          parts_path = a / 'training/evaluation-partitions.json'
          parts = json.loads(parts_path.read_text())
          reg = parts['regression']['request_sha256']
          for name in (
              'literal-context', 'final-a', 'final-b', 'final-c',
              'architecture-routing', 'anchor-fidelity'
          ):
              reg[name] = sha(base / name / 'request.json')
          parts_path.write_text(
              json.dumps(parts, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )

          status_path = e / 'DESIGN-COMPLIANCE-STATUS.json'
          status = json.loads(status_path.read_text())
          status['design_revision'] = '0.28-draft'
          status['source_sha256'] = sha(a / 'ailmzx48.c')
          status['sdk_c48b_sha256'] = sha(
              root / 'usr/bin/ailmzx48/ailmzx48.c48b'
          )
          status['cold_model_sha256'] = sha(a / 'model/cold-seed.bin')
          sdk = status['sdk_profile']
          sdk['model_architecture']['factual_anchor_policy'] = (
              'critical-content-spans-one-safe-nontrigger-filler-gap'
          )
          for name in ('final-a', 'final-b', 'final-c'):
              score = json.loads((base / name / 'score.json').read_text())
              sdk['post_repair_final_regressions'][name] = {
                  'turns': score['turns'],
                  'keyword_ratio': score['keyword_ratio'],
                  'clean_exit': score['clean_exit'],
                  'literal_reference_losses': score['literal_reference_losses'],
                  'trigram_uses': score['trigram_uses'],
                  'cooperative_yields': score['cooperative_yields'],
              }
          score = json.loads((base / 'literal-context/score.json').read_text())
          sdk['literal_context'] = {
              key: score[key] for key in (
                  'turns', 'keyword_ratio', 'context_compactions',
                  'max_l2count', 'max_lmcount', 'semantic_retrieval_uses',
                  'literal_reference_losses', 'final_keyword_hit',
                  'trigram_uses', 'cooperative_yields'
              )
          }
          score = json.loads((base / 'architecture-routing/score.json').read_text())
          sdk['architecture_routing'] = {
              key: score[key] for key in (
                  'turns', 'keyword_ratio', 'semantic_retrieval_uses',
                  'trigram_uses', 'cooperative_yields'
              )
          }
          score = json.loads((base / 'anchor-fidelity/score.json').read_text())
          sdk['anchor_fidelity'] = {
              key: score[key] for key in (
                  'turns', 'keyword_ratio', 'semantic_retrieval_uses',
                  'trigram_uses', 'cooperative_yields'
              )
          }

          design = a / 'AILMZX48-DETAILED-DESIGN.md'
          data = design.read_bytes()
          dsha = hashlib.sha256(data).hexdigest()
          dblob = hashlib.sha1(
              b'blob ' + str(len(data)).encode() + b'\0' + data
          ).hexdigest()
          status['design_sha256'] = dsha
          status['design_git_blob_sha1'] = dblob
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n'
          )

          cert = e / 'DESIGN-REVIEW-CERTIFICATE.md'
          text = cert.read_text(encoding='utf-8')
          text = text.replace(
              'current Revision-0.27 SDK implementation profile',
              'current Revision-0.28 SDK implementation profile'
          ).replace(
              '- detailed-design revision: `0.27-draft`',
              '- detailed-design revision: `0.28-draft`'
          )
          lines = []
          for line in text.splitlines():
              if line.startswith('- detailed-design Git blob:'):
                  line = f'- detailed-design Git blob: `{dblob}`'
              elif line.startswith('- detailed-design SHA-256:'):
                  line = f'- detailed-design SHA-256: `{dsha}`'
              elif line.startswith('- repaired C48 source SHA-256:'):
                  line = f'- repaired C48 source SHA-256: `{status["source_sha256"]}`'
              elif line.startswith('- SDK C48B1 artifact SHA-256:'):
                  line = f'- SDK C48B1 artifact SHA-256: `{status["sdk_c48b_sha256"]}`'
              elif line.startswith('- cold A48M SHA-256:'):
                  line = f'- cold A48M SHA-256: `{status["cold_model_sha256"]}`'
              lines.append(line)
          text = '\n'.join(lines) + '\n'
          old = (
              'Cold retrieval requires exact trigger spelling after salted-ID lookup, '
              'factual answers combine learned lead wording with immutable subject/predicate anchors, '
          )
          new = (
              'Cold retrieval requires exact trigger spelling after salted-ID lookup, '
              'factual answers combine learned lead wording with immutable critical-content anchors '
              'that leave exactly one allowlisted non-trigger filler word unanchored, '
          )
          if old not in text:
              raise SystemExit('certificate anchor-policy text missing')
          cert.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary anchor workflow
        run: rm .github/workflows/ailmzx48-sop-anchor-repair.yml

      - name: Run hard release gates
        shell: bash
        run: |
          set -euo pipefail
          python -B usr/src/ailmzx48/tooling/update_manifest.py
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 1
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 2
          python -B usr/src/ailmzx48/evaluation/check_design_compliance.py --pass-id 3
          python -B compiler/verify_release.py
          git diff --check

      - name: Commit and push anchor repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "ailmzx48: preserve critical factual anchor content"
          git push origin HEAD:main
